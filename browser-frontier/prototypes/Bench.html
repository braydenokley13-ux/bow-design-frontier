<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script src="_shared/boston-fixture.js"></script>
<style>
:root{
  --desk:#d8cfba; --paper:#f3eee1; --sheet:#f8f4ea; --paper2:#ebe4d3; --paper3:#ddd4be;
  --ink:#23211d; --graphite:#48443d; --pencil:#5e584e; --rule:#b4ab95; --ghost:#b0a790;
  --verm:#b3311a; --vermSoft:#f0d5ca; --green:#1c6b52; --greenSoft:#d5e7dd;
  --mono:'Chivo Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --serif:'Newsreader','Iowan Old Style',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font:400 15px/1.4 var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--verm);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{display:grid;grid-template-columns:172px minmax(0,1fr) 272px;grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh;min-height:0}
/* ---------- top bar: a drawing's title strip */
#top{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:172px minmax(0,1fr) auto;border-bottom:1.5px solid var(--ink);background:var(--sheet)}
#top .cell{padding:4px 12px;border-right:1.5px solid var(--ink);display:flex;align-items:center;gap:10px;min-width:0}
#top .cell:last-child{border-right:0}
.brand{flex-direction:column;align-items:flex-start!important;gap:0!important;line-height:1.15}
.brand b{font:700 11px var(--mono);letter-spacing:.09em}
.brand span{font:500 10.5px var(--mono);color:var(--pencil);letter-spacing:.06em}
.lbl{font:500 10px var(--mono);letter-spacing:.09em;color:var(--pencil);text-transform:uppercase}
#addr{font:500 12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tog{gap:6px!important}
.tg{min-height:40px;padding:4px 10px;border:1.5px solid var(--ink);background:var(--sheet);font:500 11.5px var(--mono);letter-spacing:.02em}
.tg[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
#realstrip{grid-column:1/-1;grid-row:2;background:var(--vermSoft);border-bottom:1.5px solid var(--verm);padding:5px 14px;font:500 11.5px/1.35 var(--mono);color:#6b1d0d}
#realstrip[hidden]{display:none}
/* ---------- index */
#idx{grid-row:3;grid-column:1;border-right:1.5px solid var(--ink);background:var(--paper);padding:12px 0;display:flex;flex-direction:column;gap:2px;overflow:auto}
#idx h2{font:500 10px var(--mono);letter-spacing:.1em;color:var(--pencil);margin:0 12px 6px;text-transform:uppercase}
.ix{display:flex;gap:8px;align-items:baseline;text-align:left;width:100%;min-height:44px;padding:6px 12px;border:0;border-left:4px solid transparent;background:none;font:500 12px/1.25 var(--mono)}
.ix b{font-weight:700;width:14px;flex:none}
.ix.on{background:var(--sheet);border-left-color:var(--ink);font-weight:700}
.ix:disabled{color:var(--pencil);cursor:default;opacity:.85}
.ix:disabled span{border-bottom:1px dashed var(--pencil)}
#idx .note{margin:auto 12px 4px;font:400 10.5px/1.4 var(--mono);color:var(--pencil)}
/* ---------- main */
#main{grid-row:3;grid-column:2;overflow:auto;padding:10px 12px 8px;min-width:0}
#main:focus{outline:none}
.sheet{position:relative;background:var(--sheet);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--rule);padding:8px 16px 10px}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:5px;margin-bottom:7px}
.sh.hastabs .sub{display:none}
.sh .no{font:700 11px var(--mono);letter-spacing:.09em;border:1.5px solid var(--ink);padding:1px 6px}
.sh h1{font:600 24px/1.1 var(--serif);margin:0;letter-spacing:-.005em}
.sh h1:focus{outline:none}
.sh .sub{font:500 11.5px var(--mono);color:var(--pencil)}
.grow{flex:1}
.btn{min-height:44px;padding:6px 14px;border:1.5px solid var(--ink);background:var(--sheet);font:600 12.5px var(--mono);letter-spacing:.01em;text-align:left}
.btn:hover:not(:disabled){background:var(--paper2)}
.btn.pri{background:var(--ink);color:var(--sheet)}
.btn.pri:hover:not(:disabled){background:#000}
.btn.you{border-color:var(--green);color:var(--green)}
.btn.you:hover:not(:disabled){background:var(--greenSoft)}
.btn.warn{border-color:var(--verm);color:var(--verm)}
.btn:disabled{border-style:dashed;color:var(--pencil);cursor:default;background:transparent}
.btn.sm{min-height:40px;padding:3px 10px;font-size:11.5px}
h2{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:0 0 5px;color:var(--graphite)}
h2 small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--pencil);margin-left:6px}
.mono{font-family:var(--mono)}
.note{font:400 12px/1.4 var(--mono);color:var(--graphite);margin:0}
.serif-i{font-style:italic}
/* ---------- status */
#status{grid-column:1/-1;grid-row:4;border-top:1.5px solid var(--ink);background:var(--sheet);padding:5px 14px;font:500 11px var(--mono);color:var(--graphite);display:flex;gap:10px;justify-content:space-between}
/* ---------- side */
#side{grid-row:3;grid-column:3;border-left:1.5px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;min-height:0;min-width:0}
#side section{padding:9px 12px;min-height:0}
#side .know{border-bottom:1.5px solid var(--ink);max-height:62%;overflow:auto;background:var(--sheet)}
#side .rec{flex:1;overflow:auto}
.krow{display:grid;grid-template-columns:auto 1fr;gap:0 8px;padding:3px 0;border-bottom:1px solid var(--rule);font:400 11px/1.35 var(--mono)}
.krow b{font-weight:700}
.krow .ks{color:var(--graphite);grid-column:2}
.legend{font:400 10.5px/1.5 var(--mono);margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:1px 8px}
.ent{border-left:3px solid var(--rule);padding:3px 0 5px 8px;margin:0 0 5px;font:400 11px/1.35 var(--mono)}
.ent .h{font-weight:700;letter-spacing:.02em}
.ent .m{color:var(--pencil);font-size:10.5px}
.ent.you{border-left-color:var(--green)}
.ent.you .h{color:var(--green)}
.ent.refuse{border-left-color:var(--verm)}
.ent.refuse .h{color:var(--verm)}
.ent.probe .h{font-style:italic;font-weight:500}
.ent.dim .h{font-weight:500;color:var(--graphite)}
.ent.rev{border-left-color:var(--verm)}
.ent.rev .h{color:var(--verm)}
ol.recl{list-style:none;margin:0;padding:0}
/* ---------- kind swatches: seven textures */
.sw{display:inline-block;width:20px;height:12px;border:1.3px solid var(--ink);vertical-align:-1px;margin-right:6px;flex:none;background:var(--sheet)}
.k-OBSERVED,.k-REVIEWED,.k-SOURCED{background:var(--ink)}
.k-RECORDED{background:var(--ink);box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3px var(--ink)}
.k-AUTHORED,.k-ASSUMED,.k-ASSERTED,.k-FIXTURE{background:transparent}
.k-COMPUTED{background:#c6bda6}
.k-MODELED{background:repeating-linear-gradient(135deg,var(--ink) 0 1.3px,transparent 1.3px 4px)}
.k-GENERATED{background:radial-gradient(circle,var(--ink) 1px,transparent 1.3px) 0 0/4px 4px}
.k-UNKNOWN,.k-GAP,.k-EMPTY{border-style:dashed;background:transparent}
.k-LIVE{background:var(--ink)}
.k-FIXTURE{box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3px var(--ink)}
.kc{display:inline-flex;align-items:baseline;font:600 10.5px var(--mono);letter-spacing:.04em}
/* ---------- capability layer */
[data-cap]{position:relative}
.captag{position:absolute;z-index:20;font:600 9.5px/1.25 var(--mono);letter-spacing:.02em;padding:2px 6px;background:var(--sheet);border:1.5px solid var(--ink);color:var(--ink);max-width:70%;pointer-events:none;text-align:left}
.captag{top:-10px;right:8px}
.captag.c-SPEC{background:var(--verm);border-color:var(--verm);color:#fff8ee}
.captag.c-REAL{background:var(--ink);color:var(--sheet)}
/* ---------- ask */
.askline{display:flex;gap:10px;align-items:flex-end;margin:6px 0 10px}
.askline label{display:block}
.askline .fld{flex:1}
.askline input{width:100%;font:italic 400 28px/1.2 var(--serif);padding:4px 2px 3px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
.askline input::placeholder{color:var(--pencil)}
.askline input:focus-visible{outline:3px solid var(--verm);outline-offset:3px}
.exl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.exl .btn{font-weight:500;font-family:var(--serif);font-size:15px;font-style:italic}
.tblock{display:grid;grid-template-columns:1.1fr 1.3fr 1.2fr;border:1.5px solid var(--ink);margin:6px 0 10px}
.tblock>div{padding:8px 12px;border-right:1.5px solid var(--ink);min-width:0}
.tblock>div:last-child{border-right:0}
.tblock .big{font:600 19px/1.25 var(--serif);margin:3px 0 0}
.tblock .dyn{font:700 15px/1.3 var(--mono);letter-spacing:.02em;margin:5px 0 0}
.nbtabs{display:flex;gap:8px;flex-wrap:wrap;margin:5px 0}
.nb{min-height:44px;padding:5px 12px;border:1.5px dashed var(--ink);background:var(--sheet);font:600 12px var(--mono)}
.nb[aria-pressed=true]{border-style:solid;background:var(--paper2)}
.nbnote{border:1.5px dashed var(--ink);padding:7px 12px;margin:2px 0 10px;font:400 12.5px/1.45 var(--mono);max-width:820px}
.wide{max-width:none}
/* ---------- bench / loom */
.cap{font:500 12.5px/1.45 var(--mono);margin:0 0 7px;padding:5px 9px;border:1.5px solid var(--ink);background:var(--paper);display:flex;gap:8px;align-items:flex-start}
.cap b{font-weight:700}
.chartwrap{position:relative;width:100%;margin:0 auto;aspect-ratio:900/350;background:var(--paper)}
svg.chart{display:block;width:100%;height:100%}
.frame{border:1.5px solid var(--rule)}
.frame.f-pencil{border:2px dashed var(--graphite);outline:1.5px solid var(--graphite);outline-offset:-6px}
.frame.f-branch{border:3px solid var(--green)}
.fstrip{font:600 11.5px/1.4 var(--mono);padding:5px 10px;display:none}
.f-refuse .fstrip{background:var(--vermSoft)!important;border-bottom:2px solid var(--verm)!important}
.f-pencil .fstrip{display:block;background:var(--paper2);border-bottom:2px dashed var(--graphite)}
.f-branch .fstrip{display:block;background:var(--greenSoft);color:#0f3f30;border-bottom:2px solid var(--green)}
.sl{position:absolute;left:calc(42.111% - 11px);width:calc(20% + 22px);top:calc(80% - 20px);height:40px}
.sl input{width:100%;height:40px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:ew-resize}
.sl input::-webkit-slider-runnable-track{height:40px;background:transparent}
.sl input::-moz-range-track{height:40px;background:transparent}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:40px;background:var(--sheet);border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--sheet),inset 0 0 0 4px var(--ink)}
.sl input::-moz-range-thumb{width:18px;height:36px;background:var(--sheet);border:2px solid var(--ink);border-radius:0}
.sl input:focus-visible{outline:none}
.sl input:focus-visible::-webkit-slider-thumb{outline:3px solid var(--verm);outline-offset:2px}
.sl input:focus-visible::-moz-range-thumb{outline:3px solid var(--verm);outline-offset:2px}
.sl input:disabled{cursor:default}
.sl input:disabled::-webkit-slider-thumb{border-style:dashed;background:var(--paper2)}
.zone{display:grid;grid-template-columns:1.35fr 1.05fr 1fr;gap:14px;margin-top:8px;align-items:start}
.zone .col{min-width:0}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.part{display:block;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);padding:4px 8px;min-height:50px}
.part .pn{display:block;font:700 11.5px var(--mono)}
.part .pn i{font-weight:400;font-style:normal;color:var(--pencil)}
.part .pr{display:block;font:600 10.5px var(--mono);letter-spacing:.03em;color:var(--verm)}
.part .pd{display:block;font:400 10.5px/1.3 var(--mono);color:var(--graphite)}
.part[aria-pressed=true]{background:var(--paper2);border-style:dashed;border-width:2px}
.edge{border:1.5px solid var(--ink);padding:7px 10px;min-height:96px;background:var(--paper)}
.edge p{margin:0 0 5px}
.edge .hand{color:var(--verm);font:600 12px/1.35 var(--mono);display:flex;gap:8px;align-items:flex-start}
.edge .hand svg{flex:none;width:34px;height:20px;fill:var(--verm);margin-top:1px}
.edgeN{font:700 14px/1.3 var(--mono)}
.col .btn+.btn{margin-top:6px}
.brow{display:flex;gap:6px;flex-wrap:wrap}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.htab{min-height:40px;padding:3px 10px;border:1.5px solid var(--ink);background:var(--sheet);font:600 11.5px var(--mono)}
.htab[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.htab.br{border-color:var(--green);color:var(--green)}
.htab.br[aria-pressed=true]{background:var(--green);color:#fff}
.cmp{width:100%;border-collapse:collapse;font:400 11.5px/1.35 var(--mono)}
.cmp th,.cmp td{border:1px solid var(--rule);padding:3px 7px;text-align:left;vertical-align:top}
.cmp th{background:var(--paper2);font-weight:700}
.cmp td.g{color:var(--green);font-weight:700}
.cmp td.v{color:var(--verm);font-weight:700}
.rest{margin:4px 0}
.restbar{position:relative;height:18px;border:1.5px solid var(--ink);background:var(--sheet)}
.restbar i{position:absolute;left:0;top:0;bottom:0;background:#c6bda6;border-right:2px solid var(--ink)}
.restbar u{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--verm)}
.desk{display:grid;grid-template-columns:1.5fr 1.05fr 1fr;gap:14px;margin-top:8px;align-items:start}
.stand{font:400 12px/1.5 var(--mono);margin:0}
.stand b{font-weight:700}
.refuse-note{border:2px solid var(--verm);color:#6b1d0d;background:var(--vermSoft);padding:6px 9px;font:500 12px/1.4 var(--mono);margin-top:6px}
/* seat: the ground changes (ledger paper) */
.sheet.seat{background:var(--greenSoft);border-color:var(--green);background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(28,107,82,.28) 23px 24px);background-position:0 8px}
.sheet.seat .sh{border-bottom-color:var(--green)}
.sheet.seat .chartwrap{background:var(--sheet)}
.seatstamp{font:700 11.5px var(--mono);letter-spacing:.06em;color:var(--green);border:2px solid var(--green);padding:2px 8px;background:var(--sheet)}
.bigcount{font:700 17px/1.3 var(--mono);letter-spacing:.01em;margin:0}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-top:6px;font:400 11.5px/1.35 var(--mono)}
.ledger .r{display:flex;align-items:baseline;gap:0;padding:3px 0;border-bottom:1px solid var(--rule);min-width:0}
.ledger .r span{min-width:0}
.ledger .r>span:first-child{flex:none;width:126px}
.ledger .r b{font-weight:700}
.ledger .r.new{background:var(--paper2)}
.benchbar{display:flex;gap:16px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}

/* ---------- plate (the back of the sheet) */
.sheet.plate{background:#efe8d4}
.plwrap{display:flex;flex-direction:column;gap:0}
.ptop,.pbot{display:flex;gap:12px;align-items:flex-start}
.ptop{padding:0 0 0 22px}
.pbot{padding:0 0 0 22px;justify-content:flex-start}
.pmid{display:flex;align-items:flex-start}
.plbody{position:relative;flex:1;min-width:0;border:2px solid var(--ink);background:var(--paper);padding:10px 16px 12px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--ink)}
.showthru{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);opacity:.09;pointer-events:none}
.showthru .thr{stroke-width:5}
.plh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-bottom:6px;font:600 12.5px var(--mono);position:relative}
.prow{display:grid;grid-template-columns:190px 145px 1fr;gap:10px;align-items:center;padding:2px 2px;border-bottom:1px solid var(--rule);font:400 11.5px/1.3 var(--mono);position:relative}
.prow b{font-weight:700}.prow i{font-style:normal;color:var(--pencil)}
.sig{display:flex;height:13px;width:140px;border:1.3px solid var(--ink);background:var(--sheet)}
.seg{display:block;height:100%;border-right:1.3px solid var(--ink)}.seg:last-child{border-right:0}
.seg.k-UNKNOWN{border-style:solid;background:repeating-linear-gradient(90deg,transparent 0 3px,var(--ink) 3px 4px)}
.sigw{display:block;font-size:10px;color:var(--graphite);margin-top:2px}
.pm{color:var(--graphite);font-size:10.5px}
.knots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.knot{border:1.5px solid var(--ink);padding:6px 8px;background:var(--sheet);position:relative;min-width:0}
.knot.mark{border-color:var(--verm);outline:3px solid var(--verm);outline-offset:2px}
.kh{display:flex;justify-content:space-between;gap:6px;font:700 11.5px var(--mono);align-items:baseline}
.dtag{font:700 9.5px var(--mono);background:var(--verm);color:#fff8ee;padding:1px 5px;letter-spacing:.04em;white-space:nowrap}
.kl{display:flex;flex-wrap:wrap;gap:2px 8px;margin:3px 0}
.kt{margin:2px 0;font:400 12.5px/1.25 var(--serif)}
.ks2{margin:2px 0;font:400 10px/1.3 var(--mono);color:var(--graphite)}
.ks3{margin:2px 0 0;font:600 10.5px/1.35 var(--mono)}
.ptab{display:block;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);padding:4px 10px;min-height:46px;min-width:0;max-width:330px}
.pt-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ptab[aria-pressed=true]{background:var(--paper2);border-width:2.5px}
.ptab .pt-w{display:block;font:400 11px/1.3 var(--mono);color:var(--graphite)}
.ptab .pt-n{display:block;font:700 11.5px var(--mono)}.ptab .pt-n i{font-style:normal;font-weight:400;color:var(--verm)}

.ptop .ptab{border-bottom:0}
.brow2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prt{padding-top:60px}
.prt .ptab{border-left:0;max-width:190px}
.pbot .ptab{border-top:0}
.pact{display:flex;gap:12px;align-items:center;flex:1;padding-right:6px;padding-top:6px;min-width:0}
.pbot .note{flex:1}
.portnote{margin:8px 0 0;padding:6px 9px;border:1.5px dashed var(--ink);font:400 12px/1.4 var(--mono);position:relative;background:var(--sheet)}
.clouded{position:relative}
/* ---------- stub */
.sheet.stub{background:#f1efe9;border-color:var(--graphite)}
.sheet.stub .sh{border-bottom-style:double;border-bottom-width:4px}
.pin{border:1.5px solid var(--verm);padding:6px 10px;margin:4px 0 10px;background:var(--sheet)}
.statute{display:grid;grid-template-columns:1fr 1fr;gap:0;font:400 16px/1.5 var(--serif);column-rule:1px solid var(--ink)}
.statute>div{padding:0 18px 0 0}.statute>div+div{padding:0 0 0 18px;border-left:1px solid var(--ink)}
.statute h2{font-size:11px;margin-bottom:6px}
.statute p{margin:0 0 8px}


/* ---------- open world: standing-in banner, slips, shortage list */
.standin{border:2px solid var(--verm);background:var(--vermSoft);color:#5c180a;padding:4px 10px;font:500 11.5px/1.4 var(--mono)}
.shlist{border-top:1.5px solid var(--ink)}
.shrow{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:12px 8px;min-height:64px;font:400 17px/1.35 var(--serif)}
.shrow:hover:not(.off){background:var(--paper2)}
.shrow i{font:400 11.5px/1.5 var(--mono);font-style:normal;color:var(--graphite)}
.shrow em{font:600 11.5px var(--mono);font-style:normal;color:var(--pencil)}
.shrow b{font-weight:600;font-size:19px}
.shrow.off{border-bottom-style:dashed;color:var(--pencil)}
.shn{font:700 12px var(--mono);border:1.5px solid currentColor;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.openb{display:grid;grid-template-columns:minmax(300px,370px) 1fr;gap:14px;margin-top:5px;align-items:start}

<script>
(function(){'use strict';
/* =====================================================================
   THE BENCH · core: fixture reads, state, ONE act() function, render
   Everything on screen is painted from S. Every act appends to S.log.
   ===================================================================== */
const FX = window.BOW_FIXTURE, AIR = FX.domains.air;
const HOLD0 = parseInt(String(AIR.event.v).match(/\d+/)[0], 10);      // 40, read from the fixture, never pasted
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const dur = m => Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min';
const dp = o => 'data-p="' + esc(JSON.stringify(o)) + '"';
function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(str) { let h1 = 0x811c9dc5, h2 = 0x1b873593; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 + c, 2246822519) ^ (h2 >>> 13); } return ((h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0')); }

/* Facts the spec supplied that are not in the shared store: each carries kind, source, as-of and verify. */
const SPEC_FACTS = {
  cfr:  { k: 'OBSERVED', src: '14 CFR 117.19 (eCFR), via research note E', asOf: '29 Sep 2026', verify: true, maxExtMin: 120 },
  bts:  { k: 'OBSERVED', src: 'BTS delay-cause reporting (late-arriving aircraft is a standard cause), via research note E', asOf: '29 Sep 2026', verify: true },
  rfi:  { k: 'OBSERVED', src: 'US Commerce semiconductor RFI, Jan 2022, read from a search summary (page not opened)', asOf: 'Jan 2022', verify: true, d2019: 40, d2021: 5 }
};
const CAPTXT = { REAL: 'REAL CURRENT PRODUCT CAPABILITY', PROPOSED: 'PROPOSED PLATFORM CAPABILITY', SPEC: 'SPECULATIVE FRONTIER' };
const kc = (k, txt) => '<span class="kc"><i class="sw k-' + k + '"></i>' + (txt || k) + '</span>';

/* ---------------------------------------------------------------- state */
const REC = { hold: HOLD0, removed: null, ext: 0 };                 // the record: the typical day
const S = {
  view: 'ask', reached: { ask: 1 },
  know: false, real: false,
  q: '', qDraft: null, qk: null, nb: null,
  arrived: [], assembling: false, timer: null,
  work: { hold: HOLD0, removed: null, ext: 0 }, pushFrom: HOLD0,
  hist: 'record', branches: [], compare: false,
  edgeFound: false,
  seat: false, seat0: null, seatActed: false, refuse: null,
  plate: { distrust: false, port: null, rule: false, cloud: false },
  semi: { stage: 'ask' },
  model: null,                                                     // built by the compile act
  want: { filed: false },
  log: [], n: 0
};
const ACTS = {}, VIEWS = {}, PERSIST = {}, KNOW_MORE = {};
const histLabel = () => S.hist === 'record' ? 'record' : 'branch ' + S.hist;

function act(kind, p) {
  p = p || {};
  const fn = ACTS[kind];
  if (!fn) throw new Error('unknown act ' + kind);
  const res = fn(p) || {};
  const logs = res.log ? [].concat(res.log) : [];
  if (!p.live) for (const l of logs) { S.n++; S.log.unshift(Object.assign({ n: S.n, hist: histLabel() }, l)); }
  if (S.log.length > 220) S.log.length = 220;
  render();
  if (res.say) announce(res.say);
}
function announce(msg) { const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 30); }

/* ---------------------------------------------------------------- the run: a pure function of parts, parameters and the hold */
function sim(P, E) {

  const arr3 = dep3 + L[2].block;

  const dutyOn = E.duty && E.c2 && rem !== 'duty';

  const bankOn = E.bank && E.c3 && rem !== 'bank';
  const flights = SCHED.bank.map(f => ({ id: f.id, dep: f.dep, pax: f.pax, ok: arr3 + SCHED.mct <= f.dep }));
  const missed = bankOn ? flights.filter(f => !f.ok).reduce((s, f) => s + f.pax, 0) : 0;
  const missedFl = bankOn ? flights.filter(f => !f.ok).length : 0;

  return {
    P: P, carry: carry, slack: slack, hold: hold, H0: H0, H1: H1, cut: cut, dutyOn: dutyOn, bankOn: bankOn, limit: limit,
    legs: [
      { n: 1, from: L[0].from, to: L[0].to, dep: dep1, arr: arr1, run: true },
      { n: 2, from: L[1].from, to: L[1].to, dep: dep2, arr: arr2, run: true },
      { n: 3, from: L[2].from, to: L[2].to, dep: dep3, arr: arr3, run: true },
      { n: 4, from: L[3].from, to: L[3].to, dep: dep4, arr: arr4, run: !cut }

    turns: [
      { at: L[0].to, a: arr1, d: dep2, min: SCHED.minTurn[0] },
      { at: L[1].to, a: arr2, d: dep3, min: SCHED.minTurn[1] },
      { at: L[2].to, a: arr3, d: cut ? arr3 + SCHED.minTurn[2] : dep4, min: SCHED.minTurn[2] }

    dep3: dep3, arr2: arr2, arr3: arr3, dep4: dep4, arr4: arr4,
    d: { arr2: arr2 - (L[1].dep + L[1].block), dep3: dep3 - L[2].dep, arr3: arr3 - (L[2].dep + L[2].block), dep4: dep4 - L[3].dep, arr4: arr4 - (L[3].dep + L[3].block) },
    abs2: carry ? Math.max(0, (arr2 - 615) - (dep3 - L[2].dep)) : 0,
    abs3: carry ? Math.max(0, (arr3 - 790) - (dep4 - L[3].dep)) : 0,

}
function edgeOf(P, E) { for (let h = 0; h <= 300; h++) { if (sim({ hold: h, removed: P.removed, ext: P.ext }, E).cut) return h; } return null; }

  const ad = sim({ hold: P.hold, removed: 'duty', ext: P.ext }, E), ab = sim({ hold: P.hold, removed: 'bank', ext: P.ext }, E);
  const h = base.hold;

    turns: { l: 'ABSORBS', d: ab2 > 0 ? 'takes ' + ab2 + ' of ' + h + ' min' : 'nothing to absorb at ' + h + ' min' },
    duty: { l: 'CUTS', d: base.cut !== ad.cut ? 'the crew clock cuts leg 4' : 'does nothing at ' + h + ' min' },

VIEWS.review = () => {
  const M = S.model, ix = ladderIx(M), c = ledgerCounts(M), signed = Object.keys(M.signs).length, id = sketchId();
  const ladder = '<ol class="ladder" data-cap="SPEC" data-cost="NO AI REQUIRED">' + LADDER.map((n, i) => '<li class="' + (M.discarded && i === 0 ? 'was' : i === ix ? 'now' : i < ix ? 'past' : 'next') + '"><span>' + (i + 1) + '</span>' + n + (i === ix ? ' <b>you are here</b>' : '') + '</li>').join('') + '</ol>';
  const rows = LEVERS.map(l => { const s = M.signs[l.k];
    return '<div class="krv"><div><b>' + esc(l.name) + '</b> <span class="mono" style="font-size:10.5px;color:var(--graphite)">range ' + l.ev[0] + '–' + l.ev[1] + l.unit + '</span></div><div>' + (s ? kc(s.o === 'SOURCED' ? 'SOURCED' : s.o === 'AUTHORED' ? 'AUTHORED' : 'ASSUMED', s.o) : kc('ASSUMED', 'ASSUMED')) + '</div><div class="mono kn">' + (s ? '<span class="rvr">' + s.by + '</span> ' + esc(s.note) + (s.dissent ? '<br><span class="dis">DISSENT · ' + s.dissent.by + ' · ' + s.dissent.o + ': ' + esc(s.dissent.note) + '</span>' : '') : (M.status === 'ISSUED' ? 'waiting for a signature' : 'not issued')) + '</div><div>' + (M.status === 'ISSUED' && !s ? '<button type="button" class="btn sm warn" data-a="sign" ' + dp({ k: l.k }) + '>' + REVIEW[l.k].by + ' signs</button>' : '') + '</div></div>'; }).join('');
  let act;
  if (M.discarded) act = '';
  else if (M.status === 'SKETCH') act = '<button type="button" class="btn pri" data-a="issue">Issue for review</button>';
  else if (M.status === 'ISSUED') act = '<button type="button" class="btn warn" data-a="signRest"' + (signed === 7 ? ' disabled' : '') + '>Sign the rest</button><button type="button" class="btn pri" data-a="approve"' + (signed === 7 ? '' : ' disabled') + '>Approve as REVIEWED v1</button>';
  else act = '<button type="button" class="btn you" data-a="follow"' + (M.followed ? ' disabled' : '') + '>' + (M.followed ? 'Following REVIEWED v1' : 'Follow REVIEWED v1') + '</button>';
  const disc = M.discarded ? '' : '<button type="button" class="btn" data-a="discard">Discard the sketch</button>';
  let after = '';
  if (M.status === 'REVIEWED') after += '<div class="lineage" data-cap="SPEC" data-cost="NO AI REQUIRED"><b>LINEAGE</b> sketch #' + id + ' → REVIEWED v1 (a registry system) · <b>what review changed:</b> ' + c.sourced + ' sourced · ' + c.authored + ' reviewer-authored · ' + c.assumed + ' still assumed · dissent kept on “Orders twice”.<br>Holders of the old sketch see: <i>a reviewed version exists — compare.</i> Nothing they hold changed silently; the sketch itself still cannot be followed.</div>';
  if (M.discarded) after += '<div class="tomb" data-cap="SPEC" data-cost="NO AI REQUIRED"><b>TOMBSTONE</b> · sketch #' + id + ' · discarded by its author<br>kept: the list of ' + LEVERS.length + ' assumptions and a receipt <span class="mono">' + hash(id + 'receipt').slice(0, 12) + '</span>. ' + (M.approved ? 'REVIEWED v1 stays in the registry, with lineage to a discarded sketch.' : '') + '<br>A link someone already holds does not go dead.<div class="brow" style="margin-top:6px"><button type="button" class="btn sm" data-a="openLink" aria-pressed="' + M.link + '">' + (M.link ? 'Close the shared link' : 'Open the shared link') + '</button></div>' + '</div>';
  after = after ? '<div class="afterg">' + after + '</div>' : '';
  return '<section class="sheet" data-cap="SPEC" data-cost="NO AI REQUIRED"><header class="sh"><span class="no">SHEET G</span><h1 tabindex="-1">Promote or discard</h1><span class="sub">status, as on a drawing</span><span class="grow"></span><button type="button" class="btn sm" data-a="go" ' + dp({ view: 'model' }) + '>Back to the tracing paper</button></header>' +
    '<div class="standin" role="note"><b>STAND-IN.</b> Reviewers, signatures and outcomes are authored for this prototype. No review workflow exists.</div>' + ladder +
    '<div class="revhead"><p class="bigcount" style="font-size:15px">' + ledgerLine(M) + '</p><div class="brow">' + act + disc + '</div></div>' +
    (M.discarded && M.link ? frozenLink(M, id) : '<div class="krvh"><span>KNOT · what the model guessed</span><span>NOW</span><span>REVIEWER’S MARK</span><span></span></div>' + rows) + after + '</section>';
};

/* ---------------------------------------------------------------- THE WANT */
ACTS.want = () => {
  const pl = placeOf(S.q), name = pl ? pl.name + (pl.verify ? ' [verify: station]' : '') : 'no place named';
  S.want = { filed: true };
  return { log: { who: 'you', kind: 'WANT', text: 'left a want under ' + name + ': “' + S.q + '”. Identical wants merge; you are the only asker.', clock: 'Reality clock · ' + NOWTXT }, say: 'Want filed under ' + (pl ? pl.name : 'no place named') + '. It is an empty room until a system appears.' };
};
function wantSlots(q) {
  const rel = /runs? after|after the (game|match)|tonight/i.test(q);
  return { relation: rel ? 'runs after' : 'not named', window: rel ? 'after tonight’s game' : 'not named' };
}
VIEWS.want = () => {
  const arena = FX.neighbours.find(n => n.id === 'arena'), live = FX.reality.liveEvent, R = FX.reality;
  const q = S.q || 'Will the Green Line run after the game?';
  const pl = placeOf(q), ns = pl && pl.id === 'ns', bos = pl && pl.id === 'bos', slots = wantSlots(q);
  const placeName = pl ? pl.name + (pl.verify ? ' [verify: station]' : '') : 'no place named';
  const shortQ = q.length > 34 ? q.slice(0, 33) + '…' : q;
  const anchor = ns ? '<div class="anch"><p class="mono" style="margin:0 0 4px"><b>TD Garden · ' + esc(arena.name) + '</b> <span style="color:var(--pencil)">[verify: arena name]</span></p><p class="note">Holds ' + esc(arena.holds) + '.</p><p class="note" style="margin-top:6px">Tonight’s event: ' + kc('UNKNOWN', 'UNKNOWN') + ' <span>' + esc(live.note) + '</span></p><p class="note" style="margin-top:6px">The arena knows when the game ends. It does not run trains.</p></div>'
    : bos ? '<div class="anch"><p class="mono" style="margin:0 0 4px"><b>' + esc(R.name) + '</b></p><p class="note">BOW holds a dated reading of this club (29 Sep 2026): its payroll against the league’s lines. It holds nothing that answers what you asked.</p></div>'
    : '<div class="anch"><p class="mono" style="margin:0"><b>No place named, so no anchor found.</b></p><p class="note">BOW has no system near this question, so there is nothing true to stand on. It will not invent one, and it will not pick a place for you.</p></div>';
  const miss = ns ? [['LINE STATUS', 'would be a live feed; none exists'], ['POST-GAME TIMETABLE', 'would be a dated fixture'], ['WHO CAN HOLD A TRAIN', 'would be a seat: someone with that authority']].map(m => '<div class="msock">' + kc('UNKNOWN', '') + '<span><b>needs: ' + m[0] + '</b><br>' + m[1] + '</span></div>').join('')
    : '<div class="msock">' + kc('UNKNOWN', '') + '<span><b>needs: a system that can answer this</b><br>BOW cannot name its shape yet.</span></div>';
  const filed = S.want.filed;
  const room = '<div class="room"><svg viewBox="0 0 300 108" role="img" aria-label="An empty dashed room filed under ' + esc(placeName) + '" style="width:100%;display:block"><rect x="3" y="3" width="294" height="102" fill="none" stroke="#23211d" stroke-width="2" stroke-dasharray="8 6"/><text x="14" y="24" font-family="Chivo Mono,monospace" font-size="11" font-weight="700" fill="#23211d">' + esc(pl ? pl.name : 'no place named') + (ns ? ' · Green Line' : '') + '</text><text x="14" y="40" font-family="Chivo Mono,monospace" font-size="11" font-weight="700" fill="#23211d">' + (ns ? 'runs after · the game' : esc(shortQ)) + '</text><text x="14" y="57" font-family="Chivo Mono,monospace" font-size="11" fill="#5e584e">an empty room. 1 want: yours.</text><text x="14" y="72" font-family="Chivo Mono,monospace" font-size="10.5" fill="#5e584e">relation: ' + esc(slots.relation) + '</text><text x="14" y="86" font-family="Chivo Mono,monospace" font-size="10.5" fill="#5e584e">window: ' + esc(slots.window) + '</text><text x="14" y="99" font-family="Chivo Mono,monospace" font-size="10" fill="#5e584e">no chart of how many others asked</svg></div>';
  return '<section class="sheet" data-cap="PROPOSED" data-cost="SMALL / CHEAP MODEL (near-duplicate wants only)"><header class="sh"><span class="no">SHEET H</span><h1 tabindex="-1">Want</h1><span class="sub">“' + esc(q) + '”</span></header>' +
    '<p class="wanth">No system for this.</p><p class="note wide" style="margin-bottom:10px">BOW wrote no answer. A plausible paragraph is easy to generate, and nobody would have checked it. This is what BOW can say instead.</p>' +
    '<div class="wcols"><div data-cap="PROPOSED" data-cost="NO AI REQUIRED"><h2>The nearest true anchor</h2>' + anchor + '</div>' +
    '<div data-cap="PROPOSED" data-cost="NO AI REQUIRED"><h2>The shape of the missing thing</h2><div class="miss">' + miss + '</div></div>' +
    '<div data-cap="PROPOSED" data-cost="SMALL / CHEAP MODEL"><h2>Leave a want</h2>' + (filed ? room + '<p class="note" style="margin-top:6px">Filed under ' + (pl ? 'the place your question names (' + esc(pl.name) + ')' : 'no place: your question named none') + ', not in a global chart. Identical wants merge. When a system appears it fills this room, stamped with who built it and whether it is REVIEWED, UNREVIEWED or GENERATED, and you are addressed.</p>' + (pl ? '' : '<p class="note" style="margin-top:6px">With no place named, the want waits in the unplaced room. It cannot be matched to a system until someone says where it belongs.</p>') + '<p class="note" style="margin-top:6px"><b>Promise BOW cannot keep:</b> that one will appear. It only promises the room stays yours.</p>' :
      '<p class="note">Filed under the place it names (' + esc(placeName) + '), or under “no place named” when it names none. Never in a global chart. Identical wants merge; a small model is used only for near-duplicates.</p><button type="button" class="btn pri" data-a="want" style="margin-top:8px">Leave a want</button>') + '</div></div></section>';
};
KNOW_MORE.review = F => {
  F('AUTHORED', 'Reviewers, signatures and the outcome of each knot', 'authored stand-ins for a review workflow that does not exist', null);
  F('COMPUTED', 'The ledger line and the lineage counts', 'counted from the signatures on the knots', null);
  F('RECORDED', 'Tombstone and receipt hash', 'an illustrative hash of the sketch id', null);
};
KNOW_MORE.want = F => {
  const pl = placeOf(S.q || 'Will the Green Line run after the game?');
  if (pl && pl.id === 'ns') {
    F('UNKNOWN', 'Tonight’s event', FX.reality.liveEvent.note, null);
    F('OBSERVED', 'The arena business holds its own calendar and events', 'BOW fixture neighbours[arena]', '29 Sep 2026', true);
    F('UNKNOWN', 'Line status, the post-game timetable, who can hold a train', 'no system, no feed, no seat known', null);
  } else if (pl) F('OBSERVED', 'BOW holds a dated reading of ' + pl.name, 'BOW fixture reality (29 Sep 2026)', '29 Sep 2026', true);
  else F('UNKNOWN', 'A place for this question', 'the words name no place BOW knows; nothing is guessed', null);
  F('AUTHORED', 'The want’s slots: place, relation, window', 'authored; the place comes from a two-entry gazetteer, the rest from the words as typed; a small model would only merge near-duplicates', null);
};

/* ---------------------------------------------------------------- boot */
render();


})();
</script>
