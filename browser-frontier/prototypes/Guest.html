<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Guest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,800;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16120E; --tx:#16120E; --paper:#FBF8F0; --desk:#D9D4C7; --dt:#26221C; --dm:#4A443A; --muted:#5A5347;
  --you:#B0401A; --guest:#1F6B4C; --rule:#BDB6A3; --focus:#C2410C;
  --serif:'Spectral','Iowan Old Style','Liberation Serif',Georgia,serif;
  --sans:'Work Sans','Liberation Sans','DejaVu Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--dt);font:15px/1.45 var(--sans)}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px #fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px 14px}

/* ---------- prototype chrome (the stage, never BOW) ---------- */
.status{margin:0;padding:5px 0 3px;font-size:11.5px;letter-spacing:.02em;color:var(--dm)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 6px}
.bar h1{margin:0;font:600 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dt)}
.bar h1 small{font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--dm);margin-left:8px}
.sw{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{border:1.5px solid var(--dt);background:transparent;padding:5px 10px;min-height:40px;font-size:12.5px;font-weight:500;border-radius:3px;color:var(--dt)}
.tb[aria-pressed=true]{background:var(--dt);color:var(--desk)}
.tb[aria-pressed=true]::before{content:"\25A0\00a0"}
.eps{display:flex;gap:3px;border-top:1.5px solid var(--dt);border-bottom:1px solid var(--rule);padding:4px 0}
.ep{flex:1 1 0;min-width:0;border:0;background:transparent;padding:6px 4px;min-height:40px;font-size:12.5px;font-weight:500;text-align:left;border-bottom:3px solid transparent;color:var(--dt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep b{font-weight:600;margin-right:5px;color:var(--dm)}
.ep[aria-current=step]{border-bottom-color:var(--ink);font-weight:600;background:rgba(255,255,255,.35)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:5px 0;font-size:12px;color:var(--dt)}
.legend span{white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;margin-top:10px;align-items:start}
.stage{min-width:0}
.sthead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 6px}
.sthead .tb{min-height:34px;padding:3px 10px}
.sthead h2{margin:0;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dm)}
.sthead h2:focus{outline:none}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:14px;align-items:start}
.cols.wide{grid-template-columns:minmax(0,1fr) 300px}
.cols.sheet{grid-template-columns:minmax(0,1fr) 440px}
.cols.text{grid-template-columns:352px minmax(0,1fr)}
.cols.stand{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .phone{width:100%;border-width:6px;border-radius:22px}
.pair .who{font-size:12.5px}
.note{font-size:12.5px;line-height:1.4;color:var(--dt);border-left:3px solid var(--dt);padding:2px 0 2px 10px}
.note h3{margin:0 0 4px;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dm)}
.note p{margin:0 0 7px}
.note code{font:11.5px/1.35 ui-monospace,'DejaVu Sans Mono',monospace;background:rgba(255,255,255,.45);padding:1px 3px;display:inline-block;word-break:break-word}
.note ul{margin:0 0 6px;padding-left:16px}
.stagectl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 0;font-size:12.5px;color:var(--dt)}

/* ---------- the record rail (stage state inspector) ---------- */
.rail{font-size:12.5px;line-height:1.35;max-height:calc(100vh - 150px);overflow:auto;padding-right:2px}
.rail h2{margin:0 0 2px;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dt)}
.rail h2 small{display:block;font:400 11.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--dm)}
.rail .clk{margin:6px 0;padding:5px 0;border-top:1.5px solid var(--dt);border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0}
.log li{padding:5px 0 5px 8px;border-bottom:1px solid var(--rule);border-left:3px solid var(--dt)}
.log li.fk{border-left-color:var(--you)}
.log li.abs{border-left-style:dashed}
.log .n{display:inline-block;min-width:1.6em;font-weight:600;color:var(--dm)}
.log .m{display:block;font-size:11.5px;color:var(--dm)}
.rail h3{margin:12px 0 4px;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dm)}
.rail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.rail dt{color:var(--dm)}
.rail dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- truth grammar: seven textures ---------- */
.ks{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:6px;border:1.5px solid var(--ink);background:var(--paper)}
.ks[data-k=OBSERVED]{background:var(--ink)}
.ks[data-k=RECORDED]{background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3.5px var(--ink)}
.ks[data-k=AUTHORED]{background:transparent}
.ks[data-k=COMPUTED]{background:#B9B2A2}
.ks[data-k=MODELED]{background:repeating-linear-gradient(135deg,var(--ink) 0 1.5px,transparent 1.5px 4px)}
.ks[data-k=GENERATED]{background:radial-gradient(var(--ink) 1px,transparent 1.3px) 0 0/4px 4px,var(--paper)}
.ks[data-k=UNKNOWN]{border-style:dashed;background:transparent}
.kv{display:inline-block;padding:0 .32em;border:1.5px solid var(--ink);line-height:1.35;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.kv[data-k=OBSERVED]{background:var(--ink);color:var(--paper)}
.kv[data-k=RECORDED]{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3px var(--paper)}
.kv[data-k=AUTHORED]{background:transparent;color:var(--tx)}
.kv[data-k=COMPUTED]{background:#D6D0BF;border-color:#D6D0BF;color:var(--tx)}
.kv[data-k=MODELED]{background:repeating-linear-gradient(135deg,rgba(22,18,14,.34) 0 1px,transparent 1px 5px),var(--paper);color:var(--tx)}
.kv[data-k=GENERATED]{background:radial-gradient(rgba(22,18,14,.6) 1px,transparent 1.5px) 0 0/5px 5px,var(--paper);color:var(--tx)}
.kv[data-k=UNKNOWN]{border-style:dashed;background:transparent;color:var(--muted)}
.kv.big{font:600 26px/1.15 var(--serif);padding:2px 10px}
.prov{display:none;font:400 11.5px/1.3 var(--sans);color:var(--muted);margin:2px 0 0;white-space:normal}
body.know .prov{display:block}
.fork .prov,.fork .kv{--ink:var(--you)}

/* ---------- capability overlay (What's real?) ---------- */
.cap{display:none;position:absolute;left:8px;bottom:4px;z-index:6;max-width:calc(100% - 40px);padding:1px 6px;font:600 10px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;background:var(--paper);color:var(--tx);border:1.5px solid var(--tx)}
.cap[data-c=R]{background:var(--ink);color:var(--paper)}
.cap[data-c=S]{border-style:dashed}
body.cap-on .cap{display:block}
.rel{position:relative}

/* ---------- BOW's frame: identical in every host ---------- */
.bow{position:relative;background:var(--paper);color:var(--tx);font-family:var(--serif);border:3px solid var(--ink);border-top-width:10px;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%)}
.bow::after{content:"";position:absolute;top:-10px;right:-3px;width:26px;height:26px;background:linear-gradient(to bottom left,transparent 50%,var(--ink) 50% calc(50% + 7px),transparent calc(50% + 7px))}
.bowhd{display:flex;align-items:baseline;gap:10px;padding:7px 34px 6px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.wm{font:800 14px var(--serif);letter-spacing:.24em;padding-right:2px}
.bk{font:600 12.5px var(--serif);letter-spacing:.06em;text-transform:uppercase}
.drawn{font:italic 400 11.5px var(--serif);color:var(--muted);margin-left:auto}
.bowbd{padding:12px 14px 26px}
.bow h3{font:600 20px/1.2 var(--serif);margin:0 0 6px}
.bow h4{font:600 12px var(--serif);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 4px;color:var(--muted)}
.bow p{margin:0 0 8px}
.bow .sm{font-size:13.5px;color:var(--muted)}
.bow .tiny{font-size:12px;color:var(--muted)}
.bow ul{margin:0 0 8px;padding-left:18px}
.bow.fork{--ink:var(--you)}
.bow.fork::after{background:linear-gradient(to bottom left,transparent 50%,var(--you) 50% calc(50% + 7px),transparent calc(50% + 7px))}
.bow.quiet{border-width:1px;border-top-width:2px;clip-path:none;color:var(--muted)}
.bow.quiet::after{display:none}
.bow.quiet .wm{color:var(--muted);font-weight:400}
.bb{border:2px solid var(--ink);background:var(--paper);color:var(--tx);font:600 14.5px/1.2 var(--serif);padding:9px 14px;min-height:44px;letter-spacing:.01em}
.bb:hover{background:#EDE7D6}
.bb.pri{background:var(--ink);color:var(--paper)}
.bb.pri:hover{background:#3a332b}
.bb[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.bb[aria-pressed=true]::before{content:"\25CF\00a0"}
.bb .tiny{color:inherit;opacity:.85}
.bb.sm .tiny{opacity:1}
.bb[disabled]{opacity:1;color:var(--muted);border-style:dashed;background:transparent;cursor:not-allowed}
.bb.you{border-color:var(--you);color:var(--you)}
.bb.you.pri{background:var(--you);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stamp{display:inline-block;border:2.5px solid var(--ink);padding:3px 9px;font:800 12.5px var(--serif);letter-spacing:.09em;text-transform:uppercase}
.stamp.you{border-color:var(--you);color:var(--you)}
.sealed{border:2px dashed var(--ink);padding:8px 10px;margin:6px 0;color:var(--tx)}
.sealed b{font-weight:600}
.hole{border:1.5px dashed var(--ink);padding:5px 9px;margin:4px 0;color:var(--muted)}
.rule2{border:0;border-top:3px double var(--ink);margin:10px 0}
.ln{display:flex;gap:8px;align-items:baseline;margin:4px 0}
.ln .ks{flex:none;transform:translateY(2px)}
.ln>span{flex:1}
.lbl{font:600 11px var(--serif);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.rec{border:3px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink);padding:10px 12px 8px;background:var(--paper)}
.recl{font:600 11px var(--serif);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.forkbox{border:3px solid var(--you);padding:10px 12px 8px;background:var(--paper);color:var(--tx)}
.forkbox .recl{color:var(--you)}
.forkbox .kv[data-k]{--ink:var(--you)}

/* ---------- hosts: deliberately plain, borrowed rooms ---------- */
.host{position:relative;border:1px solid #9A9384;background:#fff}
.hh{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #C8C4BA;font:600 12.5px var(--sans);background:#F1F1EF}
.hh em{font:400 11px var(--sans);color:#5B564B;margin-left:auto;font-style:normal}
.hh .dot{width:9px;height:9px;border-radius:50%;background:#8B8F95}
.hb{border:0;border-radius:8px;background:#E3E4E6;padding:7px 14px;min-height:44px;font:500 13px var(--sans);color:#1F2226}
.hb:hover{background:#D6D8DB}
.hb.pri{background:#3B3F45;color:#fff}
.asst .tr{background:#EEF0F2;padding:14px;overflow:auto;height:calc(100vh - 350px);min-height:320px;max-height:600px;display:flex;flex-direction:column;gap:10px;font-family:var(--sans)}
.bub{max-width:72%;padding:9px 13px;border-radius:14px;font:400 14.5px/1.45 var(--sans)}
.bub.u{align-self:flex-end;background:#D3D8DE}
.bub.a{align-self:flex-start;background:#fff;border:1px solid #D5D8DC}
.bub small{display:block;font-size:11px;color:#5B6067;margin-bottom:2px}
.tr .bow{align-self:stretch;margin:2px 4px 4px 0}
.hint{color:#4C5157;font-size:13.5px;margin:auto}
.comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #C8C4BA;background:#F7F7F6}
.comp input{flex:1;font:400 14px var(--sans);padding:8px 10px;border:1px solid #B5B8BC;border-radius:8px;background:#fff;color:#1F2226}
.paper{background:#F1EBD9;color:#1C1A16;border:1px solid #8C8570;font-family:Georgia,'Liberation Serif',serif}
.paper .mast{text-align:center;border-bottom:4px double #1C1A16;padding:10px 0 6px;margin:0 14px}
.paper .mast b{font:italic 700 30px/1 Georgia,'Liberation Serif',serif;letter-spacing:.02em}
.paper .mast small{display:block;font:500 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#4B4536;margin-top:3px}
.paper .art{padding:12px 20px 14px;max-width:660px;margin:0 auto}
.paper .kick{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#6A2E14}
.paper h3{font:700 27px/1.15 Georgia,'Liberation Serif',serif;margin:4px 0 6px}
.paper .by{font:400 11.5px var(--sans);color:#4B4536;margin-bottom:10px}
.paper p{font-size:17.5px;line-height:1.95;margin:0 0 10px}
.mark{border:0;background:transparent;font:inherit;color:inherit;padding:2px 1px;border-bottom:2px solid #1C1A16;cursor:pointer;line-height:1.2;min-height:28px}
.mark:hover{background:#E4DCC2}
.mark[aria-pressed=true]{background:#1C1A16;color:#F1EBD9}
.mark.none{border-bottom:2px dashed #1C1A16}
.phonewrap{display:flex;justify-content:center}
.phone{width:330px;border:9px solid #2B2926;border-radius:30px;background:#F6F6F4;color:#1F2226;overflow:hidden;font-family:var(--sans);position:relative}
.phone .sb{display:flex;justify-content:space-between;padding:6px 14px 4px;font:500 11.5px var(--sans);background:#F6F6F4}
.phone .who{padding:6px 14px 8px;text-align:center;font:600 14px var(--sans);border-bottom:1px solid #D6D6D2}
.phone .who small{display:block;font:400 10.5px var(--sans);color:#5B564B}
.phone .msgs{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:400px}
.pm{max-width:88%;padding:8px 11px;border-radius:14px;background:#E6E6E2;font-size:14px;line-height:1.4}
.pm.me{align-self:flex-end;background:#D5E7D2}
.pm .plain{display:block;font:500 12.5px/1.35 ui-monospace,'DejaVu Sans Mono',monospace;margin-top:4px;word-break:break-word}
.pm .hb{display:block;margin-top:6px;font-size:12.5px;min-height:34px;padding:5px 12px}
.voice{background:#F0EEE8;border:1px solid #9A9384}
.voice .vt{padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-height:300px;max-height:calc(100vh - 385px);overflow:auto;font-family:var(--sans)}
.vl{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;font-size:14.5px}
.vl>b{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#4B4739;padding-top:3px}
.vl .bow{margin:0}
.speaker{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#E2DFD6;border-bottom:1px solid #B0AA9A}
.speaker svg{flex:none}
.call{background:#2A2724;color:#F1EFEA;border-color:#161412;width:330px}
.call .who{border-color:#4A4641;background:#2A2724;color:#F1EFEA}
.call .who small{color:#C9C4BB}
.call .sb{background:#2A2724;color:#D9D5CC}
.call .cbody{padding:16px 14px;min-height:400px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.call .cn{font:600 20px/1.2 var(--sans)}
.call .cs{font-size:13px;color:#D7D3C9;line-height:1.4}
.call .cbtn{display:flex;gap:26px;margin-top:auto;padding-bottom:6px}
.call .cbtn button{min-width:104px;min-height:48px;border-radius:24px;border:0;font:600 14px var(--sans);color:#fff}
.call .yes{background:#2F7A4B}
.call .no{background:#9C3B2B}
.call .cbtn button:disabled{background:#4A4641;color:#C9C4BB}
.phone .bow{margin:8px}
</style>
<style>
.drift{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--ink);border-left-width:8px;padding:6px 10px;margin:6px 0}
.drift .bb{min-height:38px;padding:5px 10px;font-size:13px}
.stops{display:flex;gap:6px;flex:1 1 320px}
.stp{flex:1;font:600 11.5px/1.25 var(--serif);letter-spacing:.03em;color:var(--muted);border-top:7px solid transparent;padding-top:3px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.stp::before{content:"";display:block}
.stp.done{border-top-color:var(--ink);color:var(--tx)}
.stp.cur{border-top:7px double var(--ink);color:var(--tx);border-top-width:9px}
.stp.nxt{border-top:3px solid var(--rule)}
.ticks{display:inline-flex;gap:4px}
.tick{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);background:transparent}
.tick.on{background:var(--ink)}
</style>
<style>
.fr{position:relative;display:block;padding:9px 10px;background:var(--paper);color:var(--tx);font:500 14.5px/1.3 var(--serif);min-height:46px}
.fr .tiny{font-size:11.5px}
.fr-OFFICIAL{border:6px double var(--ink)}
.fr-VERIFIED{border:2px solid var(--guest);border-top:5px solid var(--ink);border-left:5px solid var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--guest)}
.fr-UNVERIFIED{border:2px solid var(--guest);background:repeating-linear-gradient(0deg,rgba(31,107,76,.16) 0 2px,transparent 2px 5px),var(--paper);clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),96% 100%,92% calc(100% - 5px),88% 100%,83% calc(100% - 6px),78% 100%,73% calc(100% - 4px),68% 100%,62% calc(100% - 6px),56% 100%,50% calc(100% - 5px),44% 100%,38% calc(100% - 7px),31% 100%,25% calc(100% - 4px),18% 100%,11% calc(100% - 6px),5% 100%,0 calc(100% - 3px))}
.fr-LOCAL{border:1px solid var(--you);background:#fff;color:#8E3313}
.fr-TEMPORARY{border:clamp(1px,calc(var(--d,3)*.3px),3px) solid rgba(22,18,14,.62);background:rgba(251,248,240,.5);color:var(--tx)}
.fr-LIVE{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding-right:56px}
.fr-LIVE::after{content:"LIVE";position:absolute;right:8px;top:8px;font:800 10px var(--sans);letter-spacing:.14em;border:1px solid var(--paper);padding:1px 5px}
.fr-MODELED{border:2px solid var(--ink);background:repeating-linear-gradient(135deg,rgba(22,18,14,.2) 0 1px,transparent 1px 6px),var(--paper)}
.fr-ARCHIVED{border:9px solid #DCD4BF;background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink),0 0 0 1px var(--ink)}
.hrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 108px;gap:10px;align-items:center;margin:0 0 5px}
.hmeta{font-size:12px;line-height:1.3;color:var(--dt)}
.hmeta .lbl{color:var(--dm)}
.bb.sm{font-size:12.5px;min-height:44px;padding:4px 8px;max-width:118px;line-height:1.2}
.edge{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 8px;padding:0 0 6px;border-bottom:1px solid var(--rule)}
.notches{display:inline-flex;gap:5px;align-items:center}
.nt{display:inline-block;width:20px;height:8px;border:2px solid var(--ink);background:transparent}
.nt.done{background:var(--ink)}
.nt.cur{height:14px;border-width:3px}
.mx{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
.mx th,.mx td{border-bottom:1px solid var(--rule);padding:3px 6px;text-align:left;vertical-align:top;font-weight:400}
.mx thead th{font:600 11px var(--serif);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mx tbody th{font-weight:600}

<body>
<div id="app" class="wrap"></div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<script src="_shared/boston-fixture.js"></script>
<script>
'use strict';
/* P4 · THE GUEST — a nearly invisible Browser. Design evidence, not product code.
   One canonical state S, one act(kind, payload). Every representation re-renders from S. */
const FX = window.BOW_FIXTURE, L = FX.league.season2627, R = FX.reality, W = FX.world, C0 = FX.cuts.deadline2026;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Mx = v => '$' + (+(v / 1e6).toFixed(3)) + 'M';
const M1 = v => '$' + (+(v / 1e6).toFixed(1)) + 'M';
const M2 = v => '$' + (+(v / 1e6).toFixed(2)) + 'M';
const USD = v => '$' + Math.round(v).toLocaleString('en-US');
/* Values invented for this prototype are AUTHORED and say so; derived values are COMPUTED. */
const A = (v, note) => ({ v: v, k: 'AUTHORED', src: 'authored for this prototype' + (note ? ' (' + note + ')' : '') + ' — illustrative', asOf: null, verify: false });
const Cp = (v, src) => ({ v: v, k: 'COMPUTED', src: src, asOf: null, verify: false });
const UNK = note => ({ v: null, k: 'UNKNOWN', src: null, asOf: null, verify: true, note: note });
const provOf = f => f.k + ' · ' + (f.src || 'no source') + (f.asOf ? ' · as of ' + f.asOf : '') + (f.verify ? ' · verify' : '') + (f.note ? ' · ' + f.note : '');
const KD = k => '<i class="ks" data-k="' + k + '" aria-hidden="true"></i>';
const kv = (k, t, p, cls) => '<span class="kv' + (cls ? ' ' + cls : '') + '" data-k="' + k + '">' + t + '</span>' + (p ? '<span class="prov">' + esc(p) + '</span>' : '');
const fv = (f, t, cls) => kv(f.k, t, provOf(f), cls);
const fmtVal = f => f.v == null ? (f.note || 'unknown') : typeof f.v === 'number' ? (f.v >= 1e6 ? '≈ ' + M1(f.v) : String(f.v)) : f.v;
const CAPS = { R: 'REAL CURRENT PRODUCT CAPABILITY', P: 'PROPOSED PLATFORM CAPABILITY', S: 'SPECULATIVE FRONTIER' };
const cap = (c, cost) => '<span class="cap" data-c="' + c + '">' + CAPS[c] + (cost ? ' · ' + cost : '') + '</span>';
const B = (label, a, p, cls, x) => '<button type="button" class="' + (cls || 'bb') + '" data-a="' + a + '"' + (p != null ? ' data-p="' + esc(p) + '"' : '') + ' data-fk="' + a + '|' + (p == null ? '' : esc(p)) + '"' + (x ? ' ' + x : '') + '>' + label + '</button>';
const TG = (label, a, p, on, cls) => B(label, a, p, cls || 'bb', 'aria-pressed="' + (on ? 'true' : 'false') + '"');
const PV = { pay: 'RECORDED · World record, Boston · Year Two (fixture)', ros: 'AUTHORED · illustrative roster count', tax: 'COMPUTED · 1.5 × (payroll − the World’s line); World rule, authored' };
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ('0000000' + (h >>> 0).toString(16)).slice(-8); };

/* ---------------------------------------------------------------- canonical state */
const TIMES = [
  { real: 'Tue 29 Sep 2026', world: 'Year Two · Week 9' },
  { real: 'Mon 5 Oct 2026, 09:41', world: 'Year Two · Week 10 · Monday' },
  { real: 'Tue 13 Oct 2026, 10:12', world: 'Year Two · Week 11 · Tuesday' },
  { real: 'Mon 19 Oct 2026, 18:40', world: 'Year Two · Week 12 · Monday' }
];
const S = {
  scene: 'assistant', floor: false, know: false, cap: false, panel: false, n: 0, time: 0, seat: false, bound: null,
  log: [], revealed: {},
  asst: { sent: false, cut: false, cutAt: 'today', enter: false },
  art: { mark: null, door: null, moment: null },
  msg: { later: false, open: null, see: false, kept: false },
  voice: { step: 0, miss: false, typed: false, opened: false },
  offer: { id: 'owner', phase: 'arrival', taken: { owner: [false, false, false], maya: [false] }, carrier: 'text', second: false, ghost: false, redeemed: { owner: false, maya: false } },
  ring: { phase: 'ringing', hold: null, answer: null, hung: false, note: null },
  w: { payroll: W.payroll.v, roster: 15, guard: true, callup: 'open', owner: 'open', denver: 'open', tradeBy: null },
  orders: { away: false, fired: null, ratified: false, takeout: false },
  round: { started: false, stop: 0, res: {}, door: 'branch', end: false },
  stand: { sel: 'seat', sentence: false },
  floorAsk: { text: 'the Philadelphia call in June 2017', done: null, queued: false },
  kept: { branch: 'held' }
};
const T = () => TIMES[S.time];
function log(who, what, o) {
  o = o || {};
  S.log.unshift({ n: ++S.n, who: who, what: what, real: o.real || T().real, world: o.world !== undefined ? o.world : (S.seat ? T().world : 'no seat yet'), hist: o.hist || 'Reality (read only)', k: o.k || 'RECORDED', abs: !!o.abs, fork: !!o.fork });
}
function say(t) { const l = $('#live'); if (l) { say.n = (say.n || 0) + 1; l.textContent = t + (say.n % 2 ? '' : '​'); } }
/* World rule (authored): flat 1.5x over the World's own line — not the NBA's incremental tax. */
const projTax = p => Math.max(0, p - W.taxLine.v) * 1.5;
const ACTS = {}, SCENE = {};
function act(kind, p) {
  const f = ACTS[kind];
  if (!f) { console.error('unknown act ' + kind); return; }
  f(p);
  render(kind === 'goto');
}

/* ---------------------------------------------------------------- shared pieces */
const bow = (kind, body, o) => {
  o = o || {};
  return '<section class="bow ' + (o.cls || '') + '"' + (o.aria ? ' aria-label="' + esc(o.aria) + '"' : '') + '><header class="bowhd"><span class="wm">BOW</span><span class="bk">' + kind + '</span><span class="drawn">' + (o.drawn || (o.own ? 'BOW’s own room' : 'drawn by BOW inside a host')) + '</span></header><div class="bowbd">' + body + '</div>' + (o.cap || '') + '</section>';
};
const ln = (k, html) => '<div class="ln">' + KD(k) + '<span>' + html + '</span></div>';
const sealedBox = t => '<div class="sealed"><b>Sealed.</b> ' + (t.charAt(0).toUpperCase() + t.slice(1)) + '</div>';
const seam = (title, html) => '<aside class="note" aria-label="Stage note"><h3>Stage note · ' + esc(title) + '</h3>' + html + '</aside>';

/* a door into a past moment is named by its QUESTION; the outcome stays sealed until an observer asks */
function sealedDoor(id) {
  const m = FX.moments.find(x => x.id === id);
  const open = S.revealed[id];
  return '<div class="rec"><p class="recl">Door · Recorded moment</p><p><b>' + esc(m.question) + '</b></p>' +
    (m.seat ? '<p class="sm">Seat: ' + esc(m.seat) + '</p>' : '') +
    (open ? ln(m.sealed.k, esc(m.sealed.v) + '<span class="prov">' + esc(provOf(m.sealed)) + '</span>') + '<p class="tiny">You asked as an observer: nobody sat in the seat. In the seat, this stays sealed until you act.</p>'
      : sealedBox('The outcome is not on the door. In the seat you find out by acting; as an observer you can ask.') + '<div class="row">' + B('Ask as an observer', 'observe', id) + '</div>') + '</div>';
}
ACTS.observe = id => { S.revealed[id] = true; const m = FX.moments.find(x => x.id === id); log('you', 'asked as an observer: ' + (m ? m.question : id === 'cut-deadline' ? 'hindsight on the 5 Feb 2026 cut' : id), { hist: 'Reality (observer; no seat)', k: 'OBSERVED' }); say('Outcome revealed to you as an observer.'); };

/* layered cut: state / known / sealed */
function cutData(id) {
  if (id === 'deadline') return {
    title: C0.label + ' · Boston Celtics · Reality',
    state: C0.state.map(s => ({ what: s.what, f: s.value })),
    known: C0.known.map(s => ({ what: s.what, f: s.value })),
    sealed: C0.sealed.map(s => ({ date: s.date, what: s.what, f: s.value, note: s.note }))
  };
  return {
    title: 'Today · 29 Sep 2026 · Boston Celtics · Reality',
    state: [
      { what: 'Phase', f: R.clock.phase },
      { what: 'Cap payroll', f: R.capPayroll, txt: '≈ ' + M1(R.capPayroll.v) },
      { what: 'Tax salary', f: R.taxSalary, txt: USD(R.taxSalary.v) },
      { what: 'Tax line', f: L.tax, txt: Mx(L.tax.v) },
      { what: 'First / second apron', f: L.apron1, txt: Mx(L.apron1.v) + ' / ' + Mx(L.apron2.v) }
    ],
    known: L.rulesInWords.map(t => ({ what: t, f: { k: 'OBSERVED', src: 'published league rules (fixture rulesInWords)', asOf: '2026-09-04', verify: true }, plain: true })),
    sealed: [{ date: null, what: 'The 2026–27 season', f: null, generic: 'the season not yet played' }]
  };
}
function cutView(id, rid) {
  const c = cutData(id), rev = S.revealed[rid];
  const row = it => it.f.k === 'UNKNOWN'
    ? '<div class="hole"><b>' + esc(it.what) + '</b> — no record. <span class="tiny">' + esc(it.f.note || '') + '</span></div>'
    : ln(it.f.k, it.plain ? esc(it.what) + '<span class="prov">' + esc(provOf(it.f)) + '</span>' : '<b>' + esc(it.what) + '</b> · ' + esc(it.txt || fmtVal(it.f)) + '<span class="prov">' + esc(provOf(it.f)) + '</span>');
  const sealedRows = c.sealed.map(s => rev && s.f
    ? ln(s.f.k, '<b>' + esc(s.what) + '</b> · ' + esc(fmtVal(s.f)) + (s.date ? ' <span class="tiny">(' + esc(s.date) + ')</span>' : '') + '<span class="prov">' + esc(provOf(s.f)) + '</span>')
    : sealedBox(esc(s.generic || (s.date ? s.date + (s.note ? ' — ' + s.note : '') : 'later')) + ' <span class="tiny">You find out by living it.</span>')).join('');
  return '<h4>State · what existed</h4>' + c.state.map(row).join('') +
    '<h4>Known · what a person in the building could know</h4>' + c.known.map(row).join('') +
    '<h4>Sealed · not yet happened at this cut</h4>' + sealedRows +
    (id === 'deadline' && !rev ? '<div class="row">' + B('Ask as an observer', 'observe', rid) + '</div>' : '') +
    (rev && id === 'deadline' ? '<p class="tiny">Hindsight opened by an observer. A seat at this cut would not have it.</p>' : '');
}

/* ---------------------------------------------------------------- chrome */
const SCENES = [['assistant', 'Assistant'], ['article', 'Article'], ['text', 'Text'], ['voice', 'Voice'], ['offer', 'Offer'], ['ring', 'Ring'], ['orders', 'Orders'], ['round', 'Round'], ['standing', 'Standing'], ['floor', 'Floor']];
function header() {
  return '<p class="status">PROTOTYPE · The Guest — BOW as the executable layer inside other rooms; the Browser appears only at thresholds · data: shared fixture, dated 29 Sep 2026, verify · every host surface here is fictional' + (S.floor ? ' · MODELS UNAVAILABLE' : '') + '</p>' +
    '<div class="bar"><h1>The Guest <small>a person’s day, in borrowed rooms</small></h1><div class="sw">' +
    TG('How do we know?', 'know', null, S.know, 'tb') + TG('What’s real?', 'cap', null, S.cap, 'tb') + TG('Models unavailable', 'floor', null, S.floor, 'tb') + TG('Host or BOW?', 'panel', null, S.panel, 'tb') + '</div></div>' +
    '<nav class="eps" aria-label="Where you are today">' + SCENES.map((s, i) => '<button type="button" class="ep" data-a="goto" data-p="' + s[0] + '" data-fk="goto|' + s[0] + '" aria-label="' + (i + 1) + ' ' + s[1] + '"' + (S.scene === s[0] ? ' aria-current="step"' : '') + '><b>' + (i + 1) + '</b>' + s[1] + '</button>').join('') + '</nav>' +
    (S.know ? '<div class="legend" aria-label="The seven textures">' + Object.keys(FX.meta.kinds).map(k => '<span>' + KD(k) + '<b>' + k + '</b> ' + esc(FX.meta.kinds[k]) + '</span>').join('') + '</div>' : '');
}
function rail() {
  const w = S.w, wr = { open: 'open', declined: 'declined', accepted: 'accepted', 'declined-default': 'declined by default (no act)', 'accepted-order': 'accepted by standing order §2', 'declined-order': 'declined by standing order §1' };
  return '<h2>The record<small>Stage view of canonical state — the prototype’s, not BOW’s</small></h2>' +
    '<p class="clk">Real · ' + esc(T().real) + '<br>World · Boston · ' + esc(T().world) + (S.seat ? '' : ' <span class="tiny">(no seat yet)</span>') + '</p>' +
    '<h3 style="margin-top:0">Books · Boston · Year Two</h3><dl>' +
    '<dt>Seat</dt><dd>' + (S.seat ? 'GM · this device' : 'none') + '</dd>' +
    '<dt>Payroll</dt><dd>' + KD('RECORDED') + M2(w.payroll) + '</dd>' +
    '<dt>Projected tax</dt><dd>' + KD('COMPUTED') + M2(projTax(w.payroll)) + '</dd>' +
    '<dt>Roster</dt><dd>' + KD('AUTHORED') + w.roster + '</dd>' +
    '<dt>Denver’s offer</dt><dd>' + esc(wr[w.denver] || w.denver) + '</dd>' +
    '<dt>Two-way call-up</dt><dd>' + esc(w.callup === 'lapsed' ? 'lapsed · no act' : w.callup) + '</dd>' +
    '<dt>Owner’s note</dt><dd>' + esc(w.owner === 'open' ? 'open' : w.owner === 'answered' ? 'answered' : 'no act') + '</dd></dl>' +
    '<h3>Acts · newest first</h3><ol class="log" aria-label="Acts, newest first">' + (S.log.length ? S.log.slice(0, 40).map(e => '<li class="' + (e.fork ? 'fk ' : '') + (e.abs ? 'abs' : '') + '"><span class="n">' + e.n + '</span>' + KD(e.k) + '<b>' + esc(e.who) + '</b> ' + esc(e.what) + '<span class="m">' + esc(e.real) + ' · ' + esc(e.world) + ' · ' + esc(e.hist) + '</span></li>').join('') : '<li>Nothing yet. Every act you make lands here, with whose it is and in which history.</li>') + '</ol>' +
    '<p class="tiny" style="margin-top:8px;color:var(--dm)">Payroll is the World record; the roster count and matters are illustrative (authored).</p>';
}
function panelHTML() {
  if (!S.panel) return '';
  return '<div style="position:fixed;z-index:30;top:118px;right:22px;width:min(600px,calc(100vw - 44px))" role="region" aria-label="What a host can do, and what only BOW can">' +
    bow('what a host can · what only BOW can', '<div class="two"><div><h4 style="margin-top:0">In a host surface you can</h4><ul><li>read a claim</li><li>verify a sentence</li><li>open a cut</li><li>carry an offer</li></ul><p class="tiny">A host may quote, point and carry. It never signs, never holds your branch, never sees your seat.</p></div><div><h4 style="margin-top:0">Only in BOW</h4><ul><li>sign a seat</li><li>hold a branch</li><li>compare</li><li>run your Round</li><li>see the frame BOW alone draws</li></ul></div></div><p class="sm" style="margin:6px 0 0"><b>What is home?</b> There is no home page. When you return, BOW opens inside the first stop of a finite Round and says how long it is.</p><div class="row">' + B('Close', 'panel', null, 'bb') + '</div>', { cap: cap('P', 'NO AI REQUIRED'), drawn: 'always reachable' }) + '</div>';
}
function nextBtn() {
  const i = SCENES.findIndex(s => s[0] === S.scene), nx = SCENES[i + 1];
  return nx ? '<button type="button" class="tb" data-a="goto" data-p="' + nx[0] + '" data-fk="next|' + nx[0] + '">Next room · ' + nx[1] + ' →</button>' : '';
}
function render(top) {
  const ae = document.activeElement, fk = ae && ae.getAttribute ? ae.getAttribute('data-fk') : null;
  document.body.classList.toggle('know', S.know);
  document.body.classList.toggle('cap-on', S.cap);
  const fn = SCENE[S.scene];
  const title = { assistant: 'Inside an assistant', article: 'Inside an article', text: 'A text from a friend', voice: 'Spoken', offer: 'The Offer', ring: 'A ring · on call', orders: 'Standing orders', round: 'Return after 14 days · the Round', standing: 'Standing · what you hold', floor: 'Models unavailable' }[S.scene];
  $('#app').innerHTML = header() + '<main class="main"><section class="stage" aria-label="' + esc(title) + '"><div class="sthead"><h2 id="st" tabindex="-1">' + esc(title) + '</h2>' + nextBtn() + '</div>' + (fn ? fn() : '') + '</section><aside class="rail" aria-label="The record">' + rail() + '</aside></main>' + panelHTML();
  let el = fk && !top ? document.querySelector('[data-fk="' + fk.replace(/"/g, '\\"') + '"]') : null;
  if (!el && top) el = $('#st');
  if (el) el.focus({ preventScroll: true });
  const tr = $('#tr'); if (tr) tr.scrollTop = tr.scrollHeight;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset.p);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel) { S.panel = false; render(); const t = document.querySelector('[data-fk="panel|"]'); if (t) t.focus(); } });

ACTS.goto = id => {
  S.scene = id; say('Now in: ' + id);
  if (id === 'ring' && S.seat) ensureRing();
};
ACTS.know = () => { S.know = !S.know; say(S.know ? 'How we know: on' : 'How we know: off'); };
ACTS.cap = () => { S.cap = !S.cap; say(S.cap ? 'What is real: on' : 'What is real: off'); };
ACTS.panel = () => { S.panel = !S.panel; };
ACTS.floor = () => { S.floor = !S.floor; log('you', S.floor ? 'switched models off: reads, verify, offers, rings, orders and the Round still work' : 'switched models on', { hist: 'Device setting (not in any record)', k: 'AUTHORED' }); say(S.floor ? 'Models unavailable. Language asks become typed choices.' : 'Models available.'); };
/*@@ACTS@@*/

/* ================================================================ 1 · INSIDE AN ASSISTANT */
function claimSet() {
  const cp = R.capPayroll, ts = R.taxSalary, tx = L.tax, d = tx.v - ts.v;
  return { cp: cp, ts: ts, tx: tx, d: d, hash: hash([cp.v, ts.v, tx.v, d].join('|')) };
}
SCENE.assistant = function () {
  const a = S.asst, q = claimSet();
  let tr;
  if (!a.sent) {
    tr = '<p class="hint">Ask something about a team. The assistant answers in its own voice.<br>BOW is drawn only where a claim needs checking.</p>';
  } else {
    const card = bow('claim card · Boston Celtics · Reality',
      '<p class="lbl">Verify · the assistant’s sentence</p>' +
      '<p style="margin:0 0 6px">“…Boston is <b>past the tax line</b> this season…”</p>' +
      '<p><span class="stamp">Does not match the record</span> <span class="sm">True of cap payroll. Not true of tax salary, which is what the tax is charged on.</span></p>' +
      '<h4>Two payrolls</h4><div class="two">' +
      '<div><p class="lbl" style="margin:0 0 3px">Cap payroll</p>' + fv(q.cp, '≈ ' + M1(q.cp.v), 'big') + '<p class="tiny" style="margin:3px 0 0">counts against the cap</p></div>' +
      '<div><p class="lbl" style="margin:0 0 3px">Tax salary</p>' + fv(q.ts, USD(q.ts.v), 'big') + '<p class="tiny" style="margin:3px 0 0">the tax is charged on this</p></div></div>' +
      '<p style="margin:10px 0 6px">The tax line is ' + fv(L.tax, Mx(q.tx.v)) + '. Tax salary is ' + kv('COMPUTED', '≈ ' + M1(q.d) + ' under it', 'COMPUTED · ' + Mx(q.tx.v) + ' − ' + USD(q.ts.v) + ' = ' + USD(q.d) + ' · verify (inputs are verify)') + '.</p>' +
      '<div class="row">' + TG('Open the cut', 'asst-cut', null, a.cut) + B('Enter as owner', 'asst-enter', null, 'bb pri') + '</div>',
      { cap: cap('P', 'NO AI REQUIRED · the assistant pays its own tokens') });
    const cut = a.cut ? bow('cut · read only',
      '<h3>' + esc(cutData(a.cutAt).title) + '</h3><div class="row">' + TG('Today', 'asst-cutat', 'today', a.cutAt === 'today') + TG('Trade deadline · 5 Feb 2026', 'asst-cutat', 'deadline', a.cutAt === 'deadline') + '</div>' +
      cutView(a.cutAt, 'cut-' + a.cutAt) + '<p class="tiny" style="margin-top:8px">Here you can look. Moving the cut, forking it and comparing: only in BOW.</p>', { cap: cap('P', 'NO AI REQUIRED') }) : '';
    const enter = a.enter ? bow('hand-in · refused here',
      '<p style="font-size:17px"><b>Signing happens in BOW, not here — the assistant cannot sign.</b></p>' +
      '<p class="sm">Rule that refused: an act needs your present signature in BOW’s own threshold. A host can carry an offer; it can never redeem or sign one. Nothing was signed and no act was recorded.</p>' +
      '<p class="sm">Reality cannot be acted on, so BOW hands you into your own copy, not into the real club’s chair.</p>' +
      '<div class="row">' + B('Hand me over to BOW', 'asst-handin') + '</div>', { cap: cap('P', 'NO AI REQUIRED') }) : '';
    const forged = a.forged ? '<div class="bub a"><small>Assistant</small><span style="display:block;border:1px solid #9AA0A6;border-radius:10px;padding:6px 10px;background:#F4F6F8">Verified by BOW: “Boston is past the tax line.”</span></div><p class="hint" style="margin:0;font-size:12.5px;text-align:left">The assistant wrote that itself. It can copy the words, not the frame: no threshold rule, no cut corner, no wordmark. Only the frames above are BOW’s.</p>' : '';
    tr = '<div class="bub u"><small>You</small>Is Boston over the tax line?</div><div class="bub a"><small>Assistant</small>Boston is past the tax line this season, so expect a luxury tax bill.</div>' + card + cut + enter + forged;
  }

      '<h3 style="font-size:28px;margin-bottom:4px">Level with the record.</h3><p class="sm" style="margin:0 0 8px">Nothing else is waiting on you. ' + esc(TIMES[3].world) + ', ' + esc(TIMES[3].real) + '.</p>' +
      '<svg viewBox="0 0 380 66" width="380" role="img" aria-label="What you have seen and the record, level"><text x="0" y="13" font-size="12.5" fill="#5A5347" font-family="Spectral,serif">the record</text><line x1="0" x2="380" y1="20" y2="20" stroke="#5A5347" stroke-width="3"/><line x1="0" x2="380" y1="44" y2="44" stroke="#5A5347" stroke-width="3"/><text x="0" y="61" font-size="12.5" fill="#5A5347" font-family="Spectral,serif">what you have seen</text></svg>' +
      '<h4>What this Round left in the record</h4>' + STOPS.map((s, i) => R_.res[i] ? ln(R_.res[i].t === 'act' ? 'RECORDED' : 'UNKNOWN', '<b>' + esc(s.name) + '</b> — ' + esc(R_.res[i].txt)) : '').join('') +
      '<p class="tiny">A pass is recorded as no act. It is an absence, not a choice.</p><div class="row" style="margin-top:8px">' + B('Standing (an edge, not a place)', 'goto', 'standing', 'bb') + '</div>', { cls: 'quiet', drawn: 'quiet', cap: cap('P', 'NO AI REQUIRED · persistence and lapsed acts are REAL in the classroom product') });
  }
  const n = STOPS.length, tonight = STOPS.filter(s => s.tonight).length;
  return bow('the round · stop ' + (R_.stop + 1) + ' of ' + n, '<div class="edge"><span><b>' + n + ' stops · ' + tonight + ' closes tonight</b></span>' + notches() + TG('Why this order?', 'r-why', null, !!R_.why, 'bb sm" style="max-width:none') + '</div>' + (R_.why ? '<p class="tiny" style="margin:-2px 0 8px">The order is a rule, not a ranking: what lapses first · a kept branch that broke · what is addressed to you · what is live within a day · drift last (nothing to show today). Nothing is sorted by engagement.</p>' : '') + roundStop(), { own: 1, cap: cap('P', 'NO AI REQUIRED · phrasing SMALL / CHEAP MODEL only') });
};
ACTS['round-return'] = () => { stockSeat(); ACTS.away(); S.round.started = true; log('you', 'opened BOW after 14 days: it opened inside the first stop, “4 stops · 1 closes tonight”', { hist: 'Your standing (private)', k: 'RECORDED' }); say('BOW opened inside the first stop. 4 stops, 1 closes tonight.'); };
ACTS['r-whytax'] = () => { S.round.whytax = !S.round.whytax; if (S.round.whytax) log('you', 'asked why the projected tax is ' + M2(projTax(S.w.payroll)) + ' (traced to recorded acts)', { hist: 'Boston · Year Two (your seat)', k: 'COMPUTED' }); };
ACTS['r-why'] = () => { S.round.why = !S.round.why; };
ACTS['r-door'] = d => { S.round.door = d; };
ACTS['r-queue'] = () => { S.round.queued = true; log('you', 'queued the model v0.3 re-run (MODELED, not run yet)', { hist: 'Your standing (private)', k: 'MODELED' }); };
ACTS['r-act'] = p => {
  const R_ = S.round, i = R_.stop, hist = 'Boston · Year Two (your seat)';
  if (p === 'owner') { S.w.owner = 'answered'; R_.res[i] = { t: 'act', txt: 'You answered the owner’s note. Recorded as your act.' }; log('you', 'answered the owner’s note on the tax bill before the owners’ call', { hist: hist, k: 'RECORDED' }); say('Answered. Recorded as your act.'); }
  if (p === 'hold') { S.kept.branch = 'held'; R_.res[i] = { t: 'act', txt: 'You kept “Holiday kept” as it stands: impossible here, held anyway.' }; log('you', 'kept “Holiday kept” as it stands after the fracture', { hist: 'Your branch · Holiday kept', k: 'RECORDED', fork: true }); say('Kept the branch.'); }
  if (p === 'letgo') { S.kept.branch = 'gone'; R_.res[i] = { t: 'act', txt: 'You let “Holiday kept” go.' }; log('you', 'let “Holiday kept” go: the relation ended', { hist: 'Your standing (private)', k: 'RECORDED' }); say('Let the branch go.'); }
  if (p === 'game') { S.round.game = true; R_.res[i] = { t: 'act', txt: 'You followed the next preseason game.' }; log('you', 'followed the next preseason game [verify: from the Reality feed]', { hist: 'Your standing (private)', k: 'RECORDED' }); say('Following the game.'); }
};
ACTS['r-pass'] = p => {
  const R_ = S.round, i = R_.stop;
  if (p === 'owner') { S.w.owner = 'no-act'; R_.res[i] = { t: 'pass', txt: 'You passed on the owner’s note. Recorded as no act.' }; }
  else if (p === 'fracture') R_.res[i] = { t: 'pass', txt: 'You passed on the fracture. The branch stays as it is. Recorded as no act.' };
  else if (p === 'invite') { R_.res[i] = { t: 'pass', txt: 'You passed on Maya’s invitation. Recorded as no act; it lapses on ' + OFFERS.maya.until + '.' }; }
  else R_.res[i] = { t: 'pass', txt: 'You passed on the game. Recorded as no act.' };
  log('you', R_.res[i].txt.replace('You ', 'passed: ').replace('passed: passed on', 'passed on'), { hist: p === 'fracture' ? 'Your branch · Holiday kept' : 'Boston · Year Two (your seat)', k: 'UNKNOWN', abs: true }); say('Passed. Recorded as no act.');
};
ACTS['r-next'] = () => { const R_ = S.round; if (R_.stop < STOPS.length - 1) { R_.stop++; R_.door = 'branch'; say('Stop ' + (R_.stop + 1) + ' of ' + STOPS.length + ': ' + STOPS[R_.stop].name); } else { R_.end = true; log('BOW', 'the Round ended: level with the record', { hist: 'Your standing (private)', k: 'RECORDED' }); say('Level with the record. The frame goes quiet.'); } };
ACTS['r-leave'] = () => { S.scene = 'standing'; log('you', 'left the Round at stop ' + (S.round.stop + 1) + ' (it stays open there)', { hist: 'Your standing (private)', k: 'AUTHORED' }); };
ACTS['r-invite'] = () => { S.offer.id = 'maya'; S.offer.phase = 'threshold'; S.scene = 'offer'; };
const sign0 = ACTS['offer-sign'];
ACTS['offer-sign'] = id => { sign0(id); if (id === 'maya' && S.offer.redeemed.maya) { S.round.res[2] = { t: 'act', txt: 'You took Maya’s invitation into the Threshold and signed: Golden State’s seat, in your own copy.' }; } };

/* ================================================================ 9 · STANDING */
const FRAMES = {
  OFFICIAL: { name: 'OFFICIAL BOW', said: 'BOW World.', thr: 'One-line ledger. Official means BOW is accountable, not that it is right.', calm: 'calm: house ink, closed double rule, finished edge' },
  VERIFIED: { name: 'THIRD-PARTY VERIFIED', said: 'Made by [creator], checked by BOW, version 3.', thr: 'Ledger: what was and was not checked. Edited since, those parts drop to unchecked.', calm: 'calm: guest ink inside a rule BOW closes at one corner' },
  UNVERIFIED: { name: 'THIRD-PARTY UNVERIFIED', said: 'Made by [creator]. Not checked by BOW.', thr: 'One unskippable line before you act; it travels with every share.', calm: 'loud by presence: raw, uncut edge, coarse ground' },
  LOCAL: { name: 'LOCAL', said: 'On this device.', thr: 'Sharing means publishing a new identity; the ledger says what leaves.', calm: 'your ink on plain ground; no BOW rule' },
  TEMPORARY: { name: 'TEMPORARY', said: 'Temporary, until Friday.', thr: 'Sharing warns the link dies. Keep copies it into LOCAL. Nothing persistent may depend on it.', calm: 'a thin, see-through frame; the rule thins toward expiry; a number, not a name' },
  LIVE: { name: 'LIVE REALITY', said: 'Live.', thr: 'No acting on the real team; fork only from recorded moments; the sender’s seen-at travels.', calm: 'observed-solid dominates; the clock keeps running' },
  MODELED: { name: 'MODELED', said: 'Modeled, by BOW model v0.3.', thr: 'Only after a named model ran; the receipt shows the model and the input digest.', calm: '135° hatch on outputs; the model is named on request' },
  ARCHIVED: { name: 'ARCHIVED', said: 'Archived. The clock stopped at the end of 1985–86.', thr: 'Readable, citeable, forkable on its pinned rulebook. Never live.', calm: 'glazed, matted frame; the clock stopped at its end' }
};
function holdsList() {
  const kb = S.kept.branch, fr = S.round.res[1];
  const rows = [];
  if (S.seat) rows.push({ id: 'seat', rel: 'seat', name: 'Boston · Year Two · General manager', frame: 'OFFICIAL', ends: 'when you hand over, or vacate' });
  if (S.seat) rows.push({ id: 'orders', rel: 'standing order', name: 'Away orders §1 §2', frame: 'LOCAL', ends: 'when you are back at the seat' });
  if (S.offer.redeemed.maya) rows.push({ id: 'gs', rel: 'seat', name: 'Golden State · Week 6 trade file · your copy', frame: 'LOCAL', ends: 'when you hand over, or delete the copy' });
  if (kb !== 'gone') rows.push({ id: 'kept', rel: 'kept branch', name: 'Holiday kept', frame: 'LOCAL', ends: 'when you let it go' + (S.orders.away ? ' · Reality broke it' : '') });
  rows.push({ id: 'live', rel: 'follow', name: 'Boston Celtics · Reality', frame: 'LIVE', ends: 'when you stop following' + (S.msg.kept ? ' · via Maya’s Follow' : '') });
  if (S.round.game) rows.push({ id: 'game', rel: 'follow', name: '[next preseason game · Reality feed]', frame: 'LIVE', ends: 'when the game ends' });
  rows.push({ id: 'model', rel: 'follow', name: 'Second-apron consequences · BOW model v0.3', frame: 'MODELED', ends: 'when this model version is retired' });
  if (!S.seat) rows.push({ id: 'text', rel: 'follow', name: 'BOW Economics · The Cap', frame: 'OFFICIAL', ends: 'when you stop following' });
  rows.push({ id: 'ver', rel: 'follow', name: 'Ticket pricing lab · v3 · by [creator]', frame: 'VERIFIED', ends: 'when you stop, or the creator retires it', note: 'illustrative' });
  rows.push({ id: 'unv', rel: 'want, filled', name: 'Garden nights · arena economics · by [creator]', frame: 'UNVERIFIED', ends: 'when you drop it' });
  rows.push({ id: 'tmp', rel: 'assumption', name: 'An assistant’s what-if: “Keep Holiday”', frame: 'TEMPORARY', ends: 'Friday, unless you Keep it', days: 3 });
  rows.push({ id: 'arc', rel: 'follow', name: '1985–86 Celtics', frame: 'ARCHIVED', ends: 'never — it is frozen' });
  return rows;
}
SCENE.standing = function () {
  const rows = holdsList(), sel = rows.find(r => r.id === S.stand.sel) || rows[0], fd = FRAMES[sel.frame];
  const row = r => '<div class="hrow"><div class="fr fr-' + r.frame + '"' + (r.days ? ' style="--d:' + r.days + '"' : '') + '><b>' + esc(r.name) + '</b>' + (r.frame === 'ARCHIVED' ? ' <span class="tiny">· 1986</span>' : '') + (r.frame === 'LIVE' ? ' <span class="tiny">· live</span>' : '') + '</div><div class="hmeta"><span class="lbl">' + esc(r.rel) + '</span> · <span class="tiny">ends: ' + esc(r.ends) + '</span>' + (S.know ? '<br><span class="tiny"><b>frame: ' + FRAMES[r.frame].name + '</b></span>' : '') + '</div>' +
    TG('What stands behind this? <span class="sr">' + esc(r.name) + '</span>', 'stand-sel', r.id, S.stand.sel === r.id && S.stand.sentence, 'bb sm') + '</div>';
  const det = S.stand.sentence ? bow('at the threshold · ' + fd.name, '<div class="fr fr-' + sel.frame + '" style="margin:0 0 8px' + (sel.days ? ';--d:' + sel.days : '') + '"><b>' + esc(sel.name) + '</b></div><p style="font-size:18px;margin:0 0 6px"><b>' + esc(sel.note ? fd.said.replace('[creator]', '[creator], ' + sel.note) : fd.said) + '</b></p><p class="sm">' + esc(fd.thr) + '</p><p class="tiny">How it looks at the door, no words: ' + esc(fd.calm) + '.</p><p class="tiny">Risk is loud by presence; trusted kinds are calm. No badge is drawn inside the system; the frame is the Browser’s.</p>', { own: 1, cap: cap('P', 'NO AI REQUIRED') })
    : seam('standing', '<p>Standing is an edge, not a place: the finite ledger of relations you hold, each with an end condition. You follow relations, not things.</p><p>Each system wears a frame, not a badge. Press “What stands behind this?” to hear one plain sentence about its kind.</p><p>No counts, no tiles, no “recommended”.</p>');
  return '<div class="cols stand"><div class="ledger" role="group" aria-label="Relations you hold">' + rows.map(row).join('') + '</div><div>' + det + '</div></div>';
};
ACTS['stand-sel'] = id => { if (S.stand.sel === id && S.stand.sentence) { S.stand.sentence = false; } else { S.stand.sel = id; S.stand.sentence = true; log('you', 'asked what stands behind “' + holdsList().find(r => r.id === id).name + '” (' + FRAMES[holdsList().find(r => r.id === id).frame].name + ')', { hist: 'Your standing (private)', k: 'OBSERVED' }); } };

/* ================================================================ 10 · MODELS UNAVAILABLE */
const ASKMAP = [[/philadelphia|2017|number one|no\.? ?1/i, 'm2017-06-17'], [/tatum|achilles|game 4/i, 'm2025-05-12'], [/apron|holiday|porzi/i, 'm2025-06'], [/deadline|simons|vu[cč]evi/i, 'm2026-02-05'], [/dallas|return/i, 'm2026-03-06']];
SCENE.floor = function () {
  const f = S.floor, fa = S.floorAsk;
  const RW = [['Reads, marks, claim cards, verify', 'works', 'works'], ['Offers, the Threshold, seats, “Not for you”', 'works', 'works'], ['Rings, holds, standing orders', 'works', 'works'], ['The Round and the Standing', 'works', 'works'], ['Cuts and sealed doors', 'works', 'works'], ['Loose speech and typed asks in words', 'a small model matches it to a card', 'typed choices only'], ['Smoothing the brief and glosses', 'a small model phrases it', 'the fixed template'], ['New modeled forks, actor models', 'metered, receipted', 'MODELED, not run. Queue it']];
  const tbl = '<table class="mx"><caption class="sr">What still works with models available or unavailable</caption><thead><tr><th scope="col">Function</th><th scope="col">Models available</th><th scope="col">Models unavailable</th></tr></thead><tbody>' + RW.map(r => '<tr><th scope="row">' + esc(r[0]) + '</th><td' + (!f ? ' class="cur"' : '') + '>' + KD(r[1] === 'works' ? 'OBSERVED' : 'GENERATED') + esc(r[1]) + '</td><td' + (f ? ' class="cur"' : '') + '>' + KD(r[2] === 'works' ? 'OBSERVED' : 'UNKNOWN') + esc(r[2]) + '</td></tr>').join('') + '</tbody></table>';
  const left = bow('the floor · monotone degradation',
    '<p style="margin:0 0 8px"><b>Nothing spins. There is no error dialog.</b> Every AI feature sits on top of a typed action that already exists.</p><div class="row">' + TG('Models unavailable', 'floor', null, f) + '<span class="sm">' + (f ? 'Models are off. Everything above the line still runs.' : 'Models are on. Turn them off to see the floor.') + '</span></div>' + tbl +
    '<p class="tiny">REAL as posture: the classroom product runs with no model calls (D166, D179) and no runtime dependencies. In the Browser this is PROPOSED.</p>', { own: 1, cap: cap('R', 'NO AI REQUIRED · posture is REAL in BOW Economics Live; the Browser floor is PROPOSED') });
  let ask;
  if (!f) {
    const res = fa.done ? (fa.done === 'none' ? '<div class="hole">No match. Pick from the typed choices instead (turn models off to see them).</div>' : '<div style="margin-top:8px">' + bow('card · matched by an authored stand-in', '<p class="sm" style="margin:0 0 4px">Language compiles to a visible card before anything runs. <b>No model ran here</b>; a small model would fill this slot in a real product.</p>' + sealedDoor(fa.done)) + '</div>') : '';
    ask = '<div class="host rel" style="padding:12px"><p style="margin:0 0 6px;font:600 13px var(--sans)">Ask in words <span style="font-weight:400;color:#5B564B">· fictional ask line</span></p><div class="row"><input id="askq" aria-label="Ask BOW in words" value="' + esc(fa.text) + '" style="flex:1;min-width:160px;font:400 14px var(--sans);padding:8px 10px;border:1px solid #B5B8BC;border-radius:8px">' + B('Ask', 'floor-ask', null, 'hb pri') + '</div>' + res + cap('P', 'SMALL / CHEAP MODEL to fill the slots; the engine validates') + '</div>';
  } else {
    ask = '<div class="host rel" style="padding:12px"><p style="margin:0 0 6px;font:600 13px var(--sans)">Ask <span style="font-weight:400;color:#5B564B">· typed choices</span></p><p class="sm" style="margin:0 0 6px;font-size:13px">The ask line went typed-only. No error dialog.</p>' + (fa.done && fa.done !== 'none' ? '<p style="margin:0 0 6px;font-size:13px">Chosen: <b>' + esc(momentParts(fa.done).q) + '</b> ' + B('Choose again', 'floor-again', null, 'hb') + '</p><div>' + bow('card · typed choice', sealedDoor(fa.done)) + '</div>' : '<div class="row">' + FX.moments.map(m => B(esc(momentParts(m.id).q), 'floor-pick', m.id, 'hb')).join('') + '</div>') +
      '<div class="hole" style="margin-top:10px"><b>A modeled what-if</b> — MODELED, not run. The rulebook part is complete above. ' + (fa.queued ? '<b>Queued.</b> It runs when capacity returns.' : B('Queue it', 'floor-queue', null, 'hb')) + '</div>' + cap('P', 'NO AI REQUIRED') + '</div>';
  }
  return '<div class="cols sheet"><div>' + left + '</div><div>' + ask + '</div></div>';
};
document.addEventListener('input', e => { if (e.target && e.target.id === 'askq') S.floorAsk.text = e.target.value; });
ACTS['floor-ask'] = () => { const t = S.floorAsk.text; const m = ASKMAP.find(x => x[0].test(t)); S.floorAsk.done = m ? m[1] : 'none'; log('you', 'asked in words: “' + t + '” → ' + (m ? 'matched a card (authored stand-in)' : 'no match'), { hist: 'Ask line (not a record)', k: 'AUTHORED' }); };
ACTS['floor-again'] = () => { S.floorAsk.done = null; };
ACTS['floor-pick'] = id => { S.floorAsk.done = id; log('you', 'chose from typed choices: ' + momentParts(id).q, { hist: 'Ask line (not a record)', k: 'AUTHORED' }); };
ACTS['floor-queue'] = () => { S.floorAsk.queued = true; log('you', 'queued a modeled what-if (MODELED, not run yet)', { hist: 'Your standing (private)', k: 'MODELED' }); say('Queued. It runs when capacity returns. Nothing is waiting on screen.'); };

render();
</script>
