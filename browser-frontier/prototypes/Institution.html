<style>
:root{
  --plaster:#f2eee2; --paper:#faf6ea; --paper2:#efe8d6; --rule:#cdc3aa; --ink:#26221b; --soft:#564f42;
  --brass:#a17a1f; --brassText:#6b4f0e; --you:#1d4c99; --branch:#9c4f08; --branchFill:#c8701c; --focus:#0b57d0;
  --sans:Archivo,'Franklin Gothic Medium','Trebuchet MS',sans-serif; --serif:Newsreader,Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--plaster);color:var(--ink);font:15px/1.4 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100vh;min-height:560px}
#stage{position:relative;min-width:0;overflow:hidden;background:#e8e2d1}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#gl:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
#chips{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.hot{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;padding:0;border:0;border-radius:50%;background:transparent;pointer-events:auto;cursor:pointer}

.chip{position:absolute;transform:translate(-50%,-50%);background:var(--paper);border:2px solid var(--ink);min-width:24px;height:24px;padding:0 6px;font:700 12px/20px var(--sans);text-align:center;white-space:nowrap}
.chip.PROPOSED{border-style:dashed}.chip.SPECULATIVE{border-style:dotted}
#chiplegend{border-top:1px solid var(--ink);background:var(--paper2);max-height:34%;overflow:auto;padding:6px 16px 8px}

#loading{position:absolute;inset:0;display:grid;place-items:center;font:italic 400 20px var(--serif);color:var(--soft);z-index:2;background:var(--plaster)}
#sched{position:absolute;inset:0;overflow:auto;background:var(--paper);padding:20px 28px 60px;z-index:5}
#sched[hidden]{display:none}

#sched .prov{display:block;font:400 11.5px/1.35 var(--sans);color:var(--soft);margin-top:3px}

#sched .kw{font-weight:700;font-family:var(--sans);font-size:12.5px;letter-spacing:.03em}

#sched .ledger{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;max-width:760px}
.sw{display:inline-block;width:24px;height:9px;vertical-align:1px;margin-right:6px;border:1.5px solid var(--ink);background:transparent}
.sw.k-OBSERVED{background:var(--ink)}
.sw.k-RECORDED{background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
.sw.k-AUTHORED{background:transparent}
.sw.k-COMPUTED{background:#b7ae98}
.sw.k-MODELED{background:repeating-linear-gradient(135deg,var(--ink) 0 1.5px,transparent 1.5px 4px)}
.sw.k-GENERATED{background:radial-gradient(var(--ink) 1px,transparent 1.4px) 0 0/4px 4px}

/* side panel */
#panel{background:var(--paper);border-left:1px solid var(--ink);display:flex;flex-direction:column;min-height:0;min-width:0}
#ptop{padding:12px 16px 8px;border-bottom:1px solid var(--rule)}
#ptop .who{font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}

.kick{font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:0 0 6px}
h2.pt{font:600 22px/1.15 var(--sans);margin:0 0 6px;letter-spacing:-.005em}
.pl{font:400 16.5px/1.42 var(--serif);margin:0 0 8px}
.pl.sm{font-size:15px;color:var(--soft)}
.sheet{border:1px solid var(--ink);padding:10px 12px 10px;background:#fffdf5;margin:0 0 10px}
.sheet.k-RECORDED{border:1px solid var(--ink);box-shadow:inset 0 0 0 3px #fffdf5,inset 0 0 0 4px var(--ink)}
.sheet.k-AUTHORED{border:2px solid var(--ink)}
.sheet.k-COMPUTED{background:#e9e4d3}
.sheet.k-MODELED{background:repeating-linear-gradient(135deg,rgba(38,34,27,.10) 0 1.3px,transparent 1.3px 6px),#fffdf5}
.sheet.k-UNKNOWN,.sheet.k-SEALED{border:2px dashed var(--ink);background:var(--paper)}
.sheet.k-GENERATED{background:radial-gradient(rgba(38,34,27,.28) 1px,transparent 1.5px) 0 0/5px 5px,#fffdf5}
.btn{display:block;width:100%;text-align:left;min-height:44px;padding:8px 12px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;font:600 14.5px/1.25 var(--sans);margin:0 0 6px;border-radius:2px}
.btn:hover{background:#fff}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:#3b352a}
.btn small{display:block;font:400 11.5px/1.3 var(--sans);opacity:.85;margin-top:2px}
.btn kbd{float:right;font:600 11px var(--sans);border:1px solid currentColor;padding:1px 5px;margin-left:6px;opacity:.85}
.btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn.sm{min-height:36px;padding:5px 9px;font-size:13px;margin:0}
.tg .btn.sm{width:auto;flex:1 1 auto;text-align:center}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 8px}

.grid2 .btn,.grid4 .btn{margin:0}
.grid4 .btn{text-align:center;padding:4px 2px;font-size:12.5px;min-height:42px}
.grid4 .btn i{display:block;font:700 15px var(--sans);font-style:normal}
.refuse{border:2px dashed var(--ink);padding:8px 10px;margin:0 0 10px;font:400 14.5px/1.4 var(--serif);background:var(--paper)}
.refuse.sticky{position:sticky;top:-20px;z-index:3;margin:-20px -28px 14px;padding:12px 28px;border-width:0 0 3px;border-style:dashed;background:#fffdf5}
.refuse b{font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.rec{margin:0;padding:0;list-style:none;font:500 12.5px/1.35 var(--sans)}
.rec li{padding:3px 0;border-bottom:1px solid var(--rule);display:flex;gap:8px}
.rec .no{font-weight:700;min-width:30px}
.rec .mine{color:var(--you);font-weight:600}.rec .bch{color:var(--branch);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.clk{border:1px solid var(--ink);padding:6px 8px;font:500 12px/1.3 var(--sans);background:#fffdf5}
.clk b{display:block;font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.clk.you{border-color:var(--you);color:var(--you)}
.led{font:400 14.5px/1.4 var(--serif);margin:0 0 6px}
.led b{font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.know{font:400 12px/1.4 var(--sans);margin:6px 0 0;padding-top:6px;border-top:1px solid var(--rule)}
.know dt{font-weight:700;display:inline}.know dd{display:inline;margin:0}.know div{margin:0 0 2px}
.cap{font:700 10px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:2px 0 8px;padding:3px 6px;border:1.5px solid var(--ink);display:inline-block}
.cap.PROPOSED{border-style:dashed}.cap.SPECULATIVE{border-style:dotted}
details.leave{margin:8px 0 0;border-top:1px solid var(--rule);padding-top:6px}
details.leave summary{cursor:pointer;font:600 13px var(--sans);padding:6px 0}
details.leave input{width:100%;font:400 14px var(--serif);padding:6px 8px;border:1.5px solid var(--ink);background:#fffdf5;margin:4px 0 6px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sect{margin:12px 0 4px}
@media (min-width:701px) and (max-width:1300px){#app{grid-template-columns:minmax(0,1fr) 352px}}
/* a real phone: the building on top, the panel under it, the page itself never scrolls sideways */
@media (max-width:700px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(190px,38vh) minmax(0,1fr);height:100vh;min-height:0}
  #panel{border-left:0;border-top:1px solid var(--ink)}
  body.sched-open #app{grid-template-rows:minmax(0,1fr) auto}
  body.sched-open #panel{max-height:36vh}
  #ptop{padding:8px 12px 6px}#pscroll{padding:10px 12px 8px}#pfoot{padding:6px 12px 6px}
  #pfoot .tg .btn.sm{flex:1 1 28%;padding:5px 6px}
  #status{font-size:10px}
  h2.pt{font-size:19px}.pl{font-size:15.5px}
  #sched{padding:12px 12px 40px}#sched h1{font-size:21px}
  #sched table{display:block;overflow-x:auto}
  #sched .ledger{grid-template-columns:1fr}
  #sched td.ad{display:none}#sched th:nth-child(4){display:none}
  #chiplegend{max-height:30%;padding:5px 12px}
  .grid4 .btn{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app">
  <main id="stage" aria-label="The building">
    <canvas id="gl" tabindex="0" aria-label="The building, in 3D. The Schedule (key S) is the same building as text."></canvas>
    <div id="chips" aria-hidden="true"></div>
    <div id="hots" role="group" aria-label="Objects in the room, as buttons"></div>
    <div id="frame" aria-hidden="true"></div>
    <div id="stamp" aria-hidden="true"></div>
    <div id="loading">Opening the building…</div>
    <section id="sched" hidden aria-label="Room schedule"></section>
  </main>
  <aside id="panel" aria-label="Plate, acts and record">
    <div id="ptop"><div class="who">BOW Browser · the Institution</div><p id="addr"></p></div>
    <div id="pscroll"></div>
    <div id="chiplegend" hidden></div>
    <div id="pfoot">
      <div class="tg">
        <button type="button" class="btn sm" id="tgReal" aria-pressed="false">What’s real?</button>
        <button type="button" class="btn sm" id="tgKnow" aria-pressed="false">How do we know?</button>
        <button type="button" class="btn sm" id="tgSched" aria-pressed="false">Schedule <kbd>S</kbd></button>
      </div>
      <p id="status">PROTOTYPE · place-first Browser: an institution you are allowed into · data: shared fixture, dated, verify · the building is authored</p>
    </div>
  </aside>
</div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<script src="_shared/boston-fixture.js"></script>
<script type="module">
/* =====================================================================================
   THE INSTITUTION — one canonical state, one act(), two drawings (Room, Schedule).
   Every fixture line, number and act below is read from window.BOW_FIXTURE or is marked
   AUTHORED (illustrative). Nothing in the Room is drawn that the manifest does not hold.
   ===================================================================================== */
const FX = window.BOW_FIXTURE, WD = FX.world, LG = FX.league.season2627, RL = FX.reality;
const val = f => (f && typeof f === 'object' && 'v' in f) ? f.v : f;
const mm = n => '$' + (Math.abs(n) / 1e6).toFixed(1) + 'M';
const M1 = n => (n / 1e6).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 1. facts from the shared store ---------- */
const DEPT = Object.fromEntries(WD.departments.map(d => [d.id, d]));
const TF = WD.tradeFile;
const P_OUT = TF.send[0].player, P_IN = TF.get[0].player;
const TF_OUT = val(TF.send[0].salary), TF_IN = val(TF.get[0].salary), TF_DELTA = TF_IN - TF_OUT;
const LINE = val(WD.taxLine), PAY = val(WD.payroll), HARD = val(WD.hardLimit);
const MULT = parseFloat((/([0-9.]+)×/.exec(val(WD.taxRule)) || [0, 1.5])[1]);
const NIGHT = /([\d,]+) expected, of ([\d,]+)/.exec(val(WD.arena.nextNight)) || [0, '?', '?'];
const LOSS = WD.acts[2].what.split(';')[0];
const LOSS_DETAIL = WD.acts[2].what;
const REALTAX = val(LG.tax), REAL_TAXSAL = val(RL.taxSalary), REAL_CAPPAY = val(RL.capPayroll);
/* AUTHORED for this prototype (illustrative) — the fixture holds none of these */
const AUTH = {
  actsBefore: WD.nextActNumber - 1, cash0: val(WD.cash), clock0: 9 * 60 + 13, week: WD.clock.label, reportWeek: 'Week 11',
  lapsed: 'Week 8 · Review premium seat prices again?',
  q: { callup: 'Convert the two-way call-up?', denver: 'Answer Denver about a second-round pick?', owner: 'Answer the owner’s note on the tax bill?' }
};
const REC = WD.record.map(r => ({ ...r, no: r.n }));
const W6 = REC.find(r => r.id === 'w6-trade');
const LEDGER = {
  gave: [{ id: 'maquette', text: 'the outside view (the maquette)' }, { id: 'later', text: 'everything after Week 9 (sealed)' }],
  got: ['3 matters', 'the pen', 'your clock']
};
function books(hist) { const pay = hist === 'branch' ? PAY - TF_DELTA : PAY; const over = pay - LINE; return { pay, over, tax: Math.max(0, over) * MULT }; }
(function assertFacts() {
  const r = books('record'), b = books('branch');
  if (r.tax !== val(WD.projectedTax) || b.pay !== val(TF.payrollBefore)) console.error('fixture arithmetic disagrees with the World record');
})();

/* ---------- 2. canonical state ---------- */
const fresh = () => ({
  posture: 'maquette', pose: 'maquette', maq: 'world', signed: false, left: null, history: 'record', mode: 'room',
  funded: { analytics: false, scouting: false, ticketing: true, partnerships: true }, fundedBy: {}, fundedWeek: false,
  cash: AUTH.cash0, clock: AUTH.clock0, seatStart: null, lapsedExtra: 0, paper: null, held: false, why: 0,
  branch: null, arch: { y1: {}, w6: {}, w9: {}, w10: {} }, po: null, refusal: null, jump: null,
  log: [], seq: 0, actNo: AUTH.actsBefore, reads: {}, layers: { real: false, know: false }, ledgerCheck: null, handNote: 'Scouting funded; the owner’s note on the tax bill is still unanswered.'
});
let S = fresh();
const fmtClock = m => 'Tue ' + String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const hm = m => fmtClock(m).slice(4);
function log(kind, what, extra) {
  S.seq++;
  const e = Object.assign({ seq: S.seq, kind, what, clock: fmtClock(S.clock), hist: S.history }, extra || {});
  S.log.push(e); return e;
}
const REF = (rule, why) => ({ ok: false, rule, why });
const BASEPOSE = { maquette: 'maquette', door: 'door', rail: 'rail', desk: 'desk' };
const tick = () => { S.clock += 1; };
const touchable = fx => S.posture === 'rail' || S.posture === 'desk' || (S.posture === 'door' && fx.room === 'T');

const ACTS = {
  arrive() { S.posture = 'door'; S.pose = 'door'; S.paper = null; log('read', 'Arrived at the door'); return { say: 'At the door. Owed 3. Lapsed while you were away: ' + (1 + S.lapsedExtra) + '.' }; },
  outside() {
    if (S.signed) return REF('R-SEAT-1', 'You hold the seat. The outside view stays covered until you leave the seat: hand over or vacate.');
    S.posture = 'maquette'; S.pose = 'maquette'; S.paper = null; log('read', 'Stepped back to the maquette'); return { say: 'Outside again, looking at the maquette.' };
  },
  look() { S.posture = 'rail'; S.pose = 'rail'; S.paper = null; log('read', 'Entered: standing at the rail'); return { say: 'At the rail. Reading the record. Nothing here is yours.' }; },
  sit() { S.posture = 'desk'; S.pose = 'desk'; S.paper = null; log('read', 'Sat at the desk (free)'); return { say: S.signed ? 'Back at the desk.' : 'Seated at the desk. Sitting is free; nothing is signed.' }; },
  stand() { S.posture = 'rail'; S.pose = 'rail'; S.paper = null; log('read', S.signed ? 'Stood up; nothing restored' : 'Stood up'); return { say: S.signed ? 'Standing. You still hold the seat; the outside view is still covered.' : 'Standing at the rail.' }; },
  go({ id }) {
    if (S.posture === 'maquette') return REF('R-POSTURE-1', 'You are outside. The maquette is an object to look at; arrive at the door first.');
    S.posture = id === 'desk' ? 'desk' : 'rail'; S.pose = id; S.paper = null; S.why = 0; S.held = false;
    return { say: 'Hopped to ' + (STN.find(s => s.id === id) || { name: id }).name + '.' };
  },
  sign() {
    if (S.posture !== 'desk') return REF('R-SEAT-2', 'A seat is signed at the desk, with the pen. Sit first; sitting is free.');
    if (S.signed) return REF('R-SEAT-3', 'You already hold the seat.');
    S.signed = true; S.left = null; S.seatStart = S.clock; S.paper = null; S.held = false; S.why = 0; S.fromAddress = false;
    log('seat', 'Signed for 3 open matters', { by: 'you' });
    return { say: 'Signed. You hold the seat. The maquette is covered, later plates are shuttered, three folders are in your tray, other seats show doors, and your clock started at ' + hm(S.clock) + '.' };
  },
  fund({ dept }) {
    if (!S.signed) return REF('R-SEAT-4', 'Only the seat holder writes to the World’s books. You are reading the record.');
    if (S.history === 'branch') return REF('R-FORK-2', 'Acting inside a branch is not in this prototype. A branch is a cut you stand in to read and compare.');
    if (S.posture !== 'desk') return REF('R-SEAT-5', 'Orders are written at the desk. Sit first.');
    if (S.funded[dept]) return REF('R-BUDGET-0', DEPT[dept].name + ' is already funded.');
    if (S.fundedWeek) return REF('R-BUDGET-1', 'One funding decision per week (authored, illustrative). This week’s is already written.');
    const price = DEPT[dept].opensFor;
    if (S.cash < price) return REF('R-BUDGET-2', 'Cash ' + mm(S.cash) + ' does not cover ' + mm(price) + '.');
    tick(); S.funded[dept] = true; S.fundedWeek = true; S.cash -= price; S.actNo += 1;
    S.fundedBy[dept] = S.actNo; S.po = { no: S.actNo, dept, price, clock: S.clock };
    log('act', 'Fund ' + DEPT[dept].name + ' · ' + mm(price), { actNo: S.actNo, dept });
    return { say: 'Act ' + S.actNo + '. ' + DEPT[dept].name + ' is funded, ' + mm(price) + '. Cash ' + mm(S.cash) + '. First report due ' + AUTH.reportWeek + ', pending.' };
  },
  pick({ id }) {
    const fx = FIXTURES().find(f => f.id === id); if (!fx) return REF('R-0', 'No such fixture.');
    if (inReality()) return REF('R-REAL-1', 'You cannot act on the real team. Boston · Reality is observed from outside; its rooms are sheeted and nothing in it is touchable.');
    if (S.posture === 'maquette') return REF('R-POSTURE-1', 'From outside, nothing is touchable. The maquette is an object you observe. Arrive at the door.');

      if (ids === HOT_SIG) { /* same objects: move the buttons, never replace them */ items.forEach((i, k) => { const b = hotsEl.children[k]; if (b) { b.style.left = Math.round(i.x) + 'px'; b.style.top = Math.round(i.y) + 'px'; } }); return; }
      HOT_SIG = ids;
      hotsEl.innerHTML = items.map(i => '<button type="button" class="hot" data-id="' + i.id + '" aria-label="Object in the room: ' + esc(i.label) + '" style="left:' + Math.round(i.x) + 'px;top:' + Math.round(i.y) + 'px"></button>').join('');
    }
    hotsEl.addEventListener('click', e => { const b = e.target.closest('.hot'); if (!b) return; if (b.dataset.id === '__building') act('arrive'); else clickObject(b.dataset.id); });
    const legendEl = $('#chiplegend'); let LEG_SIG = '';
    function updateChips() {
      updateHotspots();
      if (!S.layers.real && !S.layers.know) { if (chipsEl.firstChild) chipsEl.textContent = ''; if (!legendEl.hidden) { legendEl.hidden = true; legendEl.innerHTML = ''; LEG_SIG = ''; } return; }
      const r = canvas.getBoundingClientRect(), items = [], maq = S.posture === 'maquette';
      for (const f of lastFXS) {
        if (maq && !/^(dept\.|board\.roster|board\.cap|win\.league|win\.arena|hall\.maquette)/.test(f.id)) continue;
        const a = ANCH[f.id]; if (!a) continue; const v = a.clone().project(camera);
        if (v.z > 1 || Math.abs(v.x) > .93 || Math.abs(v.y) > .9) continue;
        items.push({ f, x: (v.x * .5 + .5) * r.width, y: (-v.y * .5 + .5) * r.height, d: a.distanceTo(camera.position) });
      }
      items.sort((p, q) => p.d - q.d); const placed = [], out = [], rows = [];
      for (const it of items) { if (placed.length >= 15) break; if (placed.some(p => Math.abs(p.x - it.x) < 34 && Math.abs(p.y - it.y) < 30)) continue; placed.push(it); }
      placed.sort((a, b) => (Math.round(a.y / 60) - Math.round(b.y / 60)) || (a.x - b.x));
      for (const it of placed) {
        const n = placed.indexOf(it) + 1, cap = maq && !/^dept\.|board\./.test(it.f.id) ? 'PROPOSED' : it.f.cap;
        out.push('<div class="chip ' + (S.layers.real ? cap : '') + '" style="left:' + Math.round(it.x) + 'px;top:' + Math.round(it.y) + 'px">' + n + '</div>');
        rows.push('<li><span class="chn">' + n + '</span><span><b>' + esc(it.f.name) + '</b>' + (S.layers.real ? ' · ' + CAPTXT[cap] + ' · NO AI REQUIRED' : '') + (S.layers.know ? '<br><span class="sw k-' + it.f.k + '"></span>' + it.f.k + ' · ' + esc(String(it.f.src).split(' · ')[0].slice(0, 64)) : '') + '</span></li>');
      }
      chipsEl.innerHTML = out.join('');
      const sig = rows.join('');
      if (sig !== LEG_SIG) { LEG_SIG = sig; legendEl.hidden = false; legendEl.innerHTML = '<h3>' + (S.layers.real ? 'What’s real? · numbered in the room' : 'How do we know? · numbered in the room') + '</h3><ul>' + sig + '</ul>'; }
    }
    const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
    function pickAt(cx, cy) { const r = canvas.getBoundingClientRect(); ptr.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1); ray.setFromCamera(ptr, camera); for (const h of ray.intersectObjects(HITS, false)) { const id = h.object.userData.fixtureId; if (lastFXS.some(f => f.id === id)) return id; } return null; }
    canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, yaw: LOOK.yaw, pitch: LOOK.pitch, az: MQ.az, el: MQ.el, moved: false }; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
    canvas.addEventListener('pointermove', e => {
      if (down) { const dx = e.clientX - down.x, dy = e.clientY - down.y; if (Math.abs(dx) + Math.abs(dy) > 6) down.moved = true;
        if (down.moved && CAM.dur === 0) { if (CAM.name === 'maquette') { MQ.az = down.az - dx * .006; MQ.el = Math.max(.2, Math.min(1.1, down.el + dy * .004)); } else { LOOK.yaw = Math.max(-.5, Math.min(.5, down.yaw + dx * .0025)); LOOK.pitch = Math.max(-.25, Math.min(.25, down.pitch + dy * .0018)); } invalidate(); } }
      else { const id = pickAt(e.clientX, e.clientY); canvas.style.cursor = id ? 'pointer' : 'grab'; const f = id && lastFXS.find(x => x.id === id); canvas.title = f ? f.name : ''; }
    });
    canvas.addEventListener('pointerup', e => { if (down && !down.moved) { const id = pickAt(e.clientX, e.clientY); if (id) clickObject(id); } down = null; });
    function resize() { const r = stage.getBoundingClientRect(), w = Math.max(240, Math.floor(r.width)), h = Math.max(240, Math.floor(r.height)); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); invalidate(); }
    new ResizeObserver(resize).observe(stage); resize();
    ROOM = { BRD, PARTS, update, coveredIds, stats: () => ({ ...STATS }), pose: n => setPose(n, true), poses: POSES, MQ, camera, renderer, scene, invalidate, project: id => { const v = (ANCH[id] || V3()).clone().project(camera), r = canvas.getBoundingClientRect(); return [r.left + (v.x * .5 + .5) * r.width, r.top + (-v.y * .5 + .5) * r.height]; } };
    const ld = $('#loading'); if (ld) ld.remove(); renderer.shadowMap.needsUpdate = true; paint();
  } catch (e) { console.error('the Room failed to build', e); fail('The Room failed to build. The Schedule (key S) is the same building as text.'); }
})();

/*__ROOM_END__*/
/* ---------- the address lives in the URL; it names STATE (the record, the branch, where you stand), never the seat ---------- */
function hashOf() {
  const q = [], acts = S.log.filter(e => e.kind === 'act' && e.hist === 'record');
  if (acts.length) q.push('f=' + acts.map(e => e.dept + ':' + e.actNo).join(','));
  if (S.branch) q.push('br=1');
  if (S.history === 'branch') q.push('at=branch');
  if (S.maq === 'reality') q.push('maq=reality');
  if (S.mode === 'schedule') q.push('view=schedule');
  return '#/boston.world.year-two/' + S.posture + (q.length ? '?' + q.join('&') : '');
}
function syncHash() { try { const h = hashOf(); if (location.hash !== h) history.replaceState(null, '', h); } catch (e) { /* optional */ } }
function restoreHash() {
  const raw = (location.hash || '').replace(/^#\/?/, ''); if (!raw) return;
  const pq = raw.split('?'), path = pq[0].split('/'), q = {};
  (pq[1] || '').split('&').forEach(kv => { const i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  if (path[0] !== 'boston.world.year-two') return;
  S.fromAddress = true;
  if (q.maq === 'reality') S.maq = 'reality';
  (q.f || '').split(',').filter(Boolean).forEach(s => {
    const [dept, no] = s.split(':'), d = DEPT[dept]; if (!d || S.funded[dept] || d.funded) return;
    S.funded[dept] = true; S.fundedWeek = true; S.cash -= d.opensFor; S.actNo = Math.max(S.actNo, +no || S.actNo); S.fundedBy[dept] = +no; S.po = { no: +no, dept, price: d.opensFor, clock: S.clock };
    log('act', 'Fund ' + d.name + ' · ' + mm(d.opensFor), { actNo: +no, dept });
  });
  if (q.br === '1') {
    S.arch.w6.cover = true; S.arch.w6.out = true;
    S.branch = { id: 'fork.w6', at: W6.no, stamp: 'Your branch · Week 6 trade not made · diverged Week 6', hindsight: true, funded: { ...S.funded }, cash: S.cash, kept: S.log.filter(e => e.kind === 'act' && e.hist === 'record').map(e => ({ ...e })), at_clock: fmtClock(S.clock) };
    if (q.at === 'branch') { S.history = 'branch'; S.pose = 'arches'; }
    log('fork', 'Restored from the address: Week 6 trade not made · cut with hindsight', { hist: 'branch', actNo: null, no: '40′' });
  }
  const pos = path[1];
  if (pos === 'door' || pos === 'rail' || pos === 'desk') { S.posture = pos; S.pose = pos; }
  if (q.view === 'schedule') S.mode = 'schedule';
}
restoreHash();
paint();
