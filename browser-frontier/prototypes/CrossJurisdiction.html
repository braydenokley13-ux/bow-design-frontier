<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P3b · The Jurisdiction, elsewhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Courier+Prime:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<script src="_shared/boston-fixture.js"></script>
<style>
:root{
--ink:#1b2620;--mute:#4a544d;--hair:#c9c3ac;--branch:#ad3517;--bpaper:#fbede8;--tone:rgba(27,38,32,.16);
--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--mono:'Courier Prime','Courier New',Courier,monospace;--cond:'Barlow Condensed','Arial Narrow',sans-serif;
--sidew:208px;--framew:520px;--paper:#faf6ea;
--gc:#3a3a2f;--gp:#f5f1e2;--gb:#e2dcc7;--gp2:#efe9d5;--grid:transparent;
}
body[data-g=front]{--gc:#3a3a2f;--gp:#f5f1e2;--gb:#e2dcc7;--gp2:#efe9d5}
/* lab bench notebook: cool graph paper, blue-black ink, a red margin */
body[data-g=chem]{--gc:#24557f;--gp:#f7f8f3;--gb:#dfe7e6;--gp2:#eaf0ee;--grid:rgba(70,120,160,.17);--hair:#b9c8cf;--no2:150,72,18}
/* dispatch sheet: green-bar continuous paper with tractor-feed edges */
body[data-g=sup]{--gc:#4a5a1c;--gp:#f2f0e2;--gb:#d6d6c2;--gp2:#e8e8d2;--grid:rgba(96,140,84,.16);--hair:#bcbaa0;--amber:#e3b23c}
/* field survey notebook: ochre paper, graphite ruling, olive cover */
body[data-g=eco]{--gc:#6b5a17;--gp:#efe8cf;--gb:#cbc4a2;--gp2:#e5dcbc;--grid:rgba(120,105,50,.2);--hair:#b8ae86}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.4 var(--serif);color:var(--ink);background:var(--gb);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--branch);outline-offset:2px;box-shadow:0 0 0 2px #fff}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;overflow:clip;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:4px 12px;background:var(--gp);border-bottom:2px solid var(--gc);min-height:40px}
#top .ttl{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
#addr{font:12px var(--mono);color:var(--mute);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:flex;gap:6px}
.tb{min-height:34px;padding:3px 10px;border:1.5px solid var(--ink);background:var(--paper);font:700 12px var(--mono);cursor:pointer}
.tb[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.tb .sh{display:none}
#paper{padding-top:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) var(--sidew);min-height:0;overflow:clip;position:relative}
#col{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:clip}
#work{flex:1;min-height:0;display:flex;gap:10px;padding:8px 12px;align-items:stretch;overflow:clip}
#bot{display:flex;gap:14px;align-items:center;padding:3px 12px;background:var(--gp);border-top:1px solid var(--hair);font:11.5px var(--mono);color:var(--mute);min-height:26px}
#bot .lg{display:none;gap:8px;margin-left:auto}
body.know #bot .lg{display:flex}
/* ground textures */
body[data-g=chem] #paper,body[data-g=chem] #frame .fp{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px}
body[data-g=chem] #paper{border-left:3px double #c25a4a;padding-left:10px}
body[data-g=sup] #paper{padding-left:22px;border-left:1px dashed #8d8b74;background-image:radial-gradient(circle at 9px 13px,#85836c 0 3px,transparent 3.6px),repeating-linear-gradient(to bottom,transparent 0 30px,var(--grid) 30px 60px);background-size:22px 26px,auto;background-repeat:repeat-y,repeat;background-position:left top,0 0}
body[data-g=eco] #paper{background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--grid) 25px 26px);border-left:16px solid #6b7a2e;padding-left:8px}
/* standing line */
#standing{position:relative;padding:6px 14px 7px;background:var(--gp);border-left:10px solid var(--gc);border-bottom:1px solid var(--hair);display:flex;gap:14px;align-items:flex-start}
#standing .sb{flex:1;min-width:0}
#standing .s1{font:700 11px/1.1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gc);margin-bottom:2px}
#standing .vb{color:var(--mute);letter-spacing:.06em}
#standing .s2{font-size:17px;line-height:1.2;font-weight:600}
#standing .s3{font:12.5px/1.35 var(--mono);margin-top:1px}
#standing .s3 b{font-weight:700}
#standing .gt{flex:0 0 auto;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--gc);color:var(--gc);padding:3px 8px;white-space:nowrap;background:var(--gp)}
.rg{position:relative}
.cap{display:none;margin:6px 0 0;font:700 10.5px/1.25 var(--mono);letter-spacing:.02em;padding:3px 6px;border:1.5px solid var(--ink);background:var(--paper);text-align:left;text-transform:none}
#standing .cap{flex:0 0 240px;margin:0;align-self:flex-start}
.cap small{display:block;font-weight:400;color:var(--mute)}
body.real .cap{display:block}
.cap.c-REAL{background:var(--ink);color:var(--paper)}.cap.c-REAL small{color:#d8d3c0}
.cap.c-PROPOSED{background:var(--paper);border-style:solid}
.cap.c-SPECULATIVE{background:repeating-linear-gradient(135deg,#f4e5c8 0 3px,#faf3e2 3px 7px);border-style:dashed}
/* buttons */
.btn{min-height:44px;padding:6px 14px;border:2px solid var(--ink);background:var(--paper);font:700 12.5px/1.15 var(--mono);letter-spacing:.03em;text-transform:uppercase;cursor:pointer;text-align:center;border-radius:2px}
.btn:hover:not(:disabled){background:var(--gp2)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover:not(:disabled){background:#2e3d34}
.btn:disabled{border-style:dashed;color:var(--mute);cursor:not-allowed;background:transparent}
.btn[aria-pressed=true],.btn[aria-pressed=true]:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn[aria-pressed=true] .small{color:inherit}
.btn.sm{min-height:36px;padding:3px 10px;font-size:11.5px}
.btn.br{border-color:var(--branch);color:var(--branch)}.btn.br.pri{background:var(--branch);color:#fff}
.btn.br:hover:not(:disabled){background:var(--bpaper);color:var(--branch)}
.btn.br.pri:hover:not(:disabled){background:#8f2a10;color:#fff}
.lk{background:none;border:0;padding:0;font:inherit;color:var(--gc);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:24px}
/* truth grammar: texture is the kind */
.vw{display:inline-block;vertical-align:baseline;max-width:100%}
.v.wrap{white-space:normal;display:inline;padding:1px 6px;font-weight:400;line-height:1.5;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.vw:has(.wrap){display:inline}
.v{display:inline-block;padding:0 6px;font:700 .92em/1.35 var(--mono);white-space:nowrap;border:1.5px solid var(--ink)}
.k-OBSERVED{background:var(--ink);color:var(--paper)}
.k-RECORDED{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3.5px var(--paper)}
.k-AUTHORED{background:transparent}
.k-COMPUTED{background:var(--tone);border-color:transparent}
.k-MODELED{background:repeating-linear-gradient(135deg,rgba(27,38,32,.28) 0 1.5px,transparent 1.5px 5px);border-color:var(--ink)}
.k-GENERATED{background-color:var(--paper);background-image:radial-gradient(circle,rgba(27,38,32,.75) .8px,transparent 1.1px);background-size:4px 4px;border-color:var(--ink)}
.k-UNKNOWN{background:transparent;border-style:dashed;color:var(--mute)}
.kl li{display:grid;gap:1px;border-bottom:1px solid var(--hair);padding:3px 0 4px}
.kl .v{justify-self:start;max-width:100%;white-space:normal;overflow-wrap:anywhere;font-size:11.5px}
.kl small{font:10.5px/1.25 var(--mono);color:var(--mute)}
body.know .v{outline:1px dotted var(--branch);outline-offset:1px}
/* generic bits */
.read{padding:2px 2px 6px;font-size:14px}
.read h3,.h3{font:700 13px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.read p{margin:0 0 6px}
.small{font:12px/1.35 var(--mono);color:var(--mute)}
.ans{font-size:15px;margin-bottom:6px}
table.gaps,table.tr{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0}
table.gaps th,table.tr th{font:700 11px var(--mono);text-align:left;padding:2px 4px;border-bottom:1.5px solid var(--ink);letter-spacing:.03em}
table.gaps td,table.tr td{padding:3px 4px;border-bottom:1px solid var(--hair);vertical-align:top}
table.tr td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.matter{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:1.5px solid var(--ink);background:var(--gp);padding:7px 10px;margin-bottom:6px}
.matter.inert{border-style:dashed;background:transparent;color:var(--mute)}
.matter b{font-weight:600}
.due{font:12px var(--mono);color:var(--mute)}
.dh{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sealed{border:2px dashed var(--mute);padding:6px 8px;color:var(--mute);font-size:13px;margin-top:4px}
.door{border:1.5px solid var(--ink);padding:5px 8px;margin:4px 0;font-size:13.5px;background:var(--gp)}
.refuse{border:2px solid var(--ink);padding:6px 10px;background:var(--paper);font-size:14px;margin-bottom:8px}
.notice{border:2px double var(--ink);padding:6px 10px;background:var(--paper);font-size:13.5px;margin:0 0 8px}
/* front */
.front{display:flex;gap:26px;width:100%;padding:10px 8px;overflow:auto}
.front .ask{flex:1.1;min-width:0}
.front h1{font-size:32px;line-height:1.1;font-weight:700;margin-bottom:8px}
.front .lead{font-size:15.5px;margin-bottom:12px;max-width:520px}
.askl{display:flex;gap:8px;margin-bottom:10px}
.askl input{flex:1;min-width:0;min-height:48px;padding:6px 10px;border:2px solid var(--ink);background:#fff;font:16px var(--serif)}
.doors{display:flex;flex-direction:column;gap:6px}
.doors .btn{text-align:left;text-transform:none;font:600 15px/1.25 var(--serif);letter-spacing:0;padding:8px 12px;min-height:46px;display:flex;gap:10px;align-items:center}
.doors .btn i{flex:0 0 10px;align-self:stretch;background:var(--c)}
.front .reg{flex:.95;min-width:0;border:1.5px solid var(--ink);background:var(--paper);padding:8px 12px}
.front .reg h2{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.reg li{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--hair);font-size:13.5px;line-height:1.3}
.reg li i{display:block;width:8px;background:var(--c,var(--ink))}
.reg li small{display:block;font:12px var(--mono);color:var(--mute)}
.stamp{display:inline-block;border:3px double var(--gc);color:var(--gc);padding:4px 10px;transform:rotate(-3deg);font:700 12.5px/1.25 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.5)}
.stamp small{display:block;font:400 11px var(--mono);text-transform:none;letter-spacing:0}
/* the form */
.form{border:2px solid var(--ink);background:var(--gp);position:relative}
.form .fh{padding:6px 10px 5px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.form .fh h2{font:700 13px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.form .fs{padding:5px 10px;font-size:14px;line-height:1.3;border-bottom:1px solid var(--hair)}
.stt{font:700 11px var(--mono);letter-spacing:.05em;border:1.5px solid var(--ink);padding:2px 6px;white-space:nowrap;text-transform:uppercase}
.lns{padding:5px 8px 1px}
.ln{display:grid;grid-template-columns:8px 92px 1fr auto;gap:0 8px;align-items:center;border:1.5px solid var(--ink);background:var(--gp);margin:0 0 4px;min-height:48px}
.ln .sl{align-self:stretch;background:var(--lc,var(--ink))}
.ln.p-other .sl{background:var(--gc)}
.ln.p-rule .sl{background:#454c55}
.ln.p-none .sl{background:repeating-linear-gradient(135deg,var(--mute) 0 2px,transparent 2px 5px)}
.ln .who{font:700 12px/1.15 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 0}
.ln .who small{display:block;font:400 11px/1.2 var(--serif);text-transform:none;letter-spacing:0;color:var(--mute)}
.ln .what{font-size:13px;line-height:1.28;padding:2px 0;min-width:0}
.ln .yk{display:flex;gap:6px;align-items:center;font:700 10.5px var(--mono);letter-spacing:.04em;margin-bottom:1px;flex-wrap:wrap}
.ln .yk .cr{font-weight:400;color:var(--mute)}
.ln .stt2{padding:3px 8px 3px 0;text-align:right;font:700 11px/1.2 var(--mono);min-width:88px}
.ln.struck{border-color:var(--mute);background:transparent}
.ln.struck .who,.ln.struck .yk{text-decoration:line-through;text-decoration-thickness:2px}
.ln.struck .who small{text-decoration:none}
.ln.struck .mk{opacity:.55}
.ln.none{border-style:dashed;background:transparent}
.ln.nature{border-style:dashed;border-width:2px;background:repeating-linear-gradient(135deg,rgba(27,38,32,.08) 0 2px,transparent 2px 7px)}
.mk{width:25px;height:25px;flex:0 0 25px;--mf:none;--mi:currentColor}
.mk.on{--mf:currentColor;--mi:var(--paper)}
.cm{width:34px;height:18px}
.kstrip{display:flex;gap:10px;align-items:center;padding:5px 10px;border-top:1px solid var(--hair);font:12px var(--mono);flex-wrap:wrap}
.kstrip .kd{display:inline-flex;gap:4px;align-items:center}
.kbar{width:18px;height:0;border:0;border-bottom:3px dashed var(--ink);display:inline-block;vertical-align:middle;margin-right:3px}
.kbar.on{height:6px;border-bottom:0;background:var(--ink)}
.legend{display:flex;gap:9px 12px;flex-wrap:wrap;align-items:center;padding:4px 10px;border-top:1px solid var(--hair);font:11px var(--mono);color:var(--mute)}
.legend span{display:inline-flex;gap:3px;align-items:center}.legend .mk{width:19px;height:19px;flex:0 0 19px}.legend .cm{width:30px;height:16px}.legend .sep{width:1px;height:16px;background:var(--hair)}
.blk{border:2px solid var(--ink);padding:6px 10px;margin:6px 10px 0;font-size:14px;background:var(--paper)}
.blk b{font-weight:700}
.verdict{display:inline-block;font:700 12px var(--mono);padding:1px 8px;border:2px solid var(--ink);letter-spacing:.05em}
.verdict.YES{background:var(--ink);color:var(--paper)}
.verdict.NO{border-color:var(--branch);color:var(--branch);text-decoration:line-through;text-decoration-thickness:2px}
.verdict.CT{border-style:dashed}
.chk{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:3px 0;font-size:13px;align-items:baseline}
.stip{background-color:var(--paper);background-image:radial-gradient(circle,rgba(27,38,32,.55) .8px,transparent 1.1px);background-size:5px 5px;border:1.5px solid var(--ink);padding:6px 8px;font-size:13.5px;margin:4px 0}
.stip small{font:11px var(--mono);background:var(--paper);display:inline-block;padding:0 4px;margin-top:2px}
.opt{display:flex;gap:0;margin:2px 10px 3px;flex-wrap:wrap;align-items:stretch}
.opt .lab{flex:0 0 96px;align-self:center;font:700 11px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.opt .btn{border-radius:0;flex:1 1 auto;min-height:34px;text-transform:none;font:600 13px/1.2 var(--serif);letter-spacing:0;padding:2px 8px}
.opt .btn+.btn{border-left:0}
.actbar{position:sticky;bottom:0;z-index:3;background:var(--gp);border-top:2px solid var(--ink);margin:6px 0 0;padding:6px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin:0 10px}
.optgrid .opt{margin:2px 0}
.optgrid .opt .lab{flex:0 0 62px}
@media (max-width:700px){.optgrid{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:2px 10px 4px}
.slots .btn{border-radius:0;min-height:40px;font-size:11.5px;padding:2px 4px}
.slots .btn+.btn{border-left:0}
.slots .btn.busy{background:repeating-linear-gradient(135deg,rgba(27,38,32,.22) 0 2px,transparent 2px 6px);color:var(--ink)}
.dk{display:inline-block;font:700 10px var(--mono);letter-spacing:.05em;padding:1px 6px;border:1.5px solid var(--ink);text-transform:uppercase;white-space:nowrap;margin-left:6px;vertical-align:1px}
.dk.d-content{background:var(--ink);color:var(--paper)}
.dk.d-shape{background:transparent}
.dk.d-count{background:var(--tone);border-color:transparent}
.dk.d-none{border-style:dashed;color:var(--mute)}
/* visits */
.visit{border:2px solid var(--ink);background:var(--gp);position:relative}
.visit .vh{padding:6px 12px;border-bottom:2px solid var(--vc,var(--gc));font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.art{display:grid;grid-template-columns:50px 1fr;gap:0 10px;padding:5px 12px;border-bottom:1px solid var(--hair);font-size:14px}
.art .an{font:700 12px var(--mono);color:var(--vc,var(--gc))}
.unk{border:2px dashed var(--mute);color:var(--mute);padding:5px 8px;font-size:13px;margin:4px 0;display:flex;justify-content:space-between;gap:8px}
.clk{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0}
.bar{height:16px;border:2px solid var(--ink);position:relative;min-width:120px;flex:1;max-width:260px}
.bar.dash{border-style:dashed;border-color:var(--mute)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
/* records, branch */
.recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rc{border:1.5px solid var(--ink);background:var(--gp);font-size:13.5px;line-height:1.32;min-width:0}
.rc .v{white-space:normal}
.rc .rh{padding:4px 8px;font:700 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid var(--c,var(--ink));display:flex;justify-content:space-between;gap:4px}
.rc .rb{padding:5px 8px}
.rc li{margin:0 0 5px}
.rc.r0{--c:var(--gc);border-top:6px solid var(--gc)}.rc.r1{--c:#454c55;background:var(--gp2)}.rc.r2{--c:#7a6a3a;background:var(--gp2)}
.rc .cannot{border-top:1px dashed var(--mute);margin-top:4px;padding-top:3px;color:var(--mute);font-size:12px}
.hide{border:2px dashed var(--mute);color:var(--mute);padding:3px 6px;margin:3px 0;font-size:12.5px}
.hide.h2{background:repeating-linear-gradient(135deg,rgba(27,38,32,.15) 0 2px,transparent 2px 6px)}
.pp{border:3px double var(--ink);background:var(--gp);padding:16px 10px 8px;position:relative;font-size:13.5px;line-height:1.3;margin-top:8px}
.pp.br{border:3px solid var(--branch);background:var(--bpaper)}
.pp .bs{position:absolute;top:-12px;left:10px;background:var(--branch);color:#fff;font:700 10.5px/1.2 var(--mono);padding:2px 7px;white-space:normal;max-width:94%}
.pp .rs{position:absolute;top:-12px;left:10px;background:var(--ink);color:var(--paper);font:700 11px/1.2 var(--mono);padding:2px 8px;box-shadow:inset 0 0 0 1px var(--ink),inset 0 0 0 2.5px var(--paper);white-space:normal;max-width:94%}
.pp h4{font:700 12.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 3px}
.diff{color:var(--branch);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
ul.as{list-style:square;padding-left:18px;font-size:13px}
.seg{display:flex;flex-wrap:wrap}.seg .btn{border-radius:0;flex:1;text-align:left;text-transform:none;font:600 14px/1.25 var(--serif);letter-spacing:0}
.seg .btn+.btn{border-left:0}

<script>

function askText(q){

function navTo(d,v){
  v=String(v);
  if(v.indexOf('visit:')===0)return DM[d].sys[v.slice(6)]?v:'read';
  if((v==='desk'||v==='form'||v==='redline')&&!(S.seat[d]||S.chair[d]))return 'read';
  if(v==='form'&&!S.P[d]&&d!=='eco')return S.seat[d]?'desk':'read';
  if(v==='compare'||v==='branch'){if(!S.red[d])return 'read';}

function waitAct(d,P){
  var D0=DM[d],b=blockedOn(P),sy=D0.sys[b.k],msg='';
  D0.tick(b);
  var dec=D0.decide(b.k,P);
  if(dec.v==='NO'){
    REC(d,sy.n+' ('+sy.who+')','returned the file'+(dec.rule?', naming the rule: '+dec.rule:', naming no rule (a will, not a rule)')+'. '+dec.t+' '+D0.nothing,{hist:sy.n+'’s record',clock:sy.clockName+' · '+D0.clock()});
    P.st='draft';P.ln=D0.emptyLn(P);P.returned={who:sy.n,t:dec.t};P.att++;P.last=null;S.vw[d]='form';
    return sy.n+' returned the file'+(dec.rule?', naming the rule.':', naming no rule.');
  }
  P.ln[b.k]=1;S.vw[d]='visit:'+b.k;
  REC(d,sy.n+' ('+sy.who+')',D0.yesText(b.k,P,dec),{hist:sy.n+'’s record',clock:sy.clockName+' · '+D0.clock()});
  if(D0.order(P).every(function(x){return P.ln[x];})){D0.land(P);P.st='done';msg=sy.n+' approved. The paper landed; every drawing changed.';}
  else msg=sy.n+' answered, on its own clock.';

}
function act(kind,p,silent){

    case 'leave':if(!S.seat[d]&&!S.chair[d])return;var wasSeat=S.seat[d];S.seat[d]=0;S.chair[d]=0;S.vw[d]='read';S.P[d]&&S.P[d].st==='draft'&&(S.P[d]=null);if(wasSeat)REC(d,'you','handed the seat back in your own words and returned to the reading copy. The World keeps its own clock.',{hist:DM[d].hist});else TR('left the fork chair.');leaseSet();msg='Back to observer.';break;

    case 'set':{if(!P||P.st!=='draft')return;var i=String(p).indexOf('.'),k=String(p).slice(0,i),v=String(p).slice(i+1);if(d!=='sup'||['part','qty','ship','rush'].indexOf(k)<0)return;P[k]=(k==='qty'||k==='rush')?+v:v;P.last=null;TR('changed the paper: '+k+' '+v+'.','rh');msg='Changed '+k+' to '+v+'.';break;}
    case 'slot':{if(!P||P.st!=='draft')return;var sl=p.slice(0,2)+':'+p.slice(2),bz=DM.chem.busyWhy(S.W.chem,sl);if(bz){P.refusal={slot:sl,why:bz};P.slot=null;TR('asked for the '+sl+' slot; the booking desk refused: held on its own calendar.','rh');msg='Refused: '+sl+' is held on the booking desk’s calendar.';}else{P.slot=sl;P.refusal=null;P.last=null;TR('asked for the '+sl+' slot, free on the booking desk’s calendar.','rh');msg='Asked for the '+sl+' slot.';}break;}

    case 'send':{if(!P||P.st!=='draft'||!DM[d].can(P))return;P.st='sent';P.returned=null;P.last=null;if(d==='chem')P.t=Math.max(S.cur,w.segs[w.segs.length-1].t0+(w.segs.length>1?1:0));else P.sd=w.day;
      var e=REC(d,'you ('+DM[d].seatName+')','sent the '+(d==='chem'?'reaction request':'purchase order')+'. Copies of the paper went to the desks it touches and cannot be recalled.',{hist:DM[d].hist+' · in flight',vis:'seat'});P.nSend=e.n;S.sc='#moves';S.vw[d]='visit:'+DM[d].order(P)[0];msg='Sent. You are now visiting '+DM[d].sys[DM[d].order(P)[0]].n+'; you cannot answer for it.';break;}
    case 'wait':if(!P||P.st!=='sent')return;msg=waitAct(d,P);S.sc=P.st==='sent'?'#moves':'';break;
    case 'go':if(!P||P.st!=='sent')return;var gt=goTarget(P);S.vw[d]='visit:'+gt.k;TR('went to '+gt.n+' to look. It shows only what it discloses.');msg='Now visiting '+gt.n+'.';break;

      if(d==='chem'){var w0=S.W.chem,pre0={segs:w0.segs.slice(0,ld.k)};alt='none';['heat','halve','add'].some(function(x){if(x!==ld.act&&DM.chem._safety(pre0,ld.t,x).v!=='NO'){alt=x;return true;}return false;});}else if(d==='sup')alt={part:ld.P.part==='A'?'B':'A',qty:ld.P.qty,ship:ld.P.ship,rush:0};else alt='0';
      S.red[d]={alt:alt,base:ld,kept:false};S.vw[d]='redline';TR('opened a redline of the paper. A redline is a draft: nothing forks until you keep it.','rh');msg='Redline opened.';break;}
