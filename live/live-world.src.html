<title>Live World</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&display=swap');
:root{
  --bg:#F7F7F4; --fg:#111111; --muted:#5C5C56; --faint:#8C8C85; --rule:#D8D8D0; --wash:#EFEFEA;
  --computed:#2B3FD6; --branch:#C2410C; --yours:#007A33; --clock:#E8A317; --clock-ink:#111111; --bad:#B3261E;
  --sans:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --fg:#EDEDED; --muted:#A5A59E; --faint:#787872; --rule:#34342F; --wash:#1C1C1A;
    --computed:#8E9BFF; --branch:#FB923C; --yours:#3ED07E; --clock:#E8A317; --clock-ink:#111111; --bad:#FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#EDEDED; --muted:#A5A59E; --faint:#787872; --rule:#34342F; --wash:#1C1C1A;
  --computed:#8E9BFF; --branch:#FB923C; --yours:#3ED07E; --clock:#E8A317; --clock-ink:#111111; --bad:#FF8A80;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-bottom:72px}
.banner{background:var(--fg);color:var(--bg);font:500 12px/1.4 var(--mono);padding:6px 16px;text-align:center}
.banner.warn{background:var(--bad);color:#fff}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.comp{color:var(--computed)}
.mine{color:var(--yours)}
.bad{color:var(--bad)}
h1{font:700 clamp(26px,5.2vw,40px)/1.08 var(--sans);letter-spacing:-.02em;margin:26px 0 8px}
h2{margin:0 0 12px;font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
p{margin:0 0 10px}
.clk{font:500 clamp(16px,3.6vw,22px)/1.3 var(--mono);margin:0 0 4px}
.sub{font:400 13px/1.5 var(--mono);color:var(--muted);margin:0}
.sec{border-top:1px solid var(--rule);padding:20px 0 22px}
.agree{border-top:1px solid var(--fg);border-bottom:1px solid var(--rule);margin-top:18px;padding:14px 0}
.agree .line{font:500 15px/1.45 var(--sans);margin:0}
.agree .line b{font-family:var(--mono);font-weight:600}
.peers{list-style:none;margin:10px 0 0;padding:0;font:400 13px/1.4 var(--mono)}
.peers li{display:flex;flex-wrap:wrap;gap:2px 14px;padding:4px 0;border-top:1px dotted var(--rule)}
.peers .who{min-width:9ch;font-family:var(--sans);font-weight:600;font-size:14px}
.hashfull{display:block;font:400 12px/1.4 var(--mono);word-break:break-all;color:var(--computed);margin-top:8px}
.linkbtn{background:none;border:0;padding:0;font:500 13px var(--mono);color:var(--muted);text-decoration:underline;cursor:pointer;text-underline-offset:3px}
.cols{display:flex;flex-direction:column}
.colA,.colB{display:contents}
#place{order:1}#now{order:2}#act{order:3}#board{order:4}#record{order:5}
@media (min-width:940px){
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);column-gap:56px;align-items:start}
  .colA,.colB{display:block}
}
.btn{display:block;width:100%;text-align:left;font:600 15px/1.3 var(--sans);padding:11px 14px;min-height:44px;background:transparent;border:1px solid var(--fg);cursor:pointer;margin:0 0 8px}
.btn small{display:block;font:400 12px/1.3 var(--mono);color:var(--muted);margin-top:3px}
.btn:hover:not(:disabled){background:var(--wash)}
.btn.go{background:var(--fg);color:var(--bg)}
.btn.go small{color:inherit;opacity:.8}
.btn.go:hover:not(:disabled){background:var(--fg);opacity:.9}
.btn.own{border-color:var(--yours);color:var(--yours)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.own:disabled{opacity:1;cursor:default}
.btn.slim{display:inline-block;width:auto;font-size:14px;padding:8px 12px;min-height:38px;margin-right:8px}
:focus-visible{outline:2px solid var(--computed);outline-offset:2px}
input[type=text],textarea{width:100%;background:transparent;border:1px solid var(--fg);padding:9px 10px;border-radius:0;font:400 15px/1.4 var(--sans)}
textarea{min-height:120px;resize:vertical;font-family:var(--sans)}
label.f{display:block;font:500 12px/1.3 var(--mono);color:var(--muted);margin:10px 0 5px}
.bar{position:relative;height:16px;border:1px solid var(--fg);margin:26px 2px 8px;background:var(--wash)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--computed)}
.bar>b{position:absolute;top:-7px;bottom:-7px;width:0;border-left:1px solid var(--fg)}
.bar>b>u{position:absolute;top:-17px;left:-6px;font:600 10px/1 var(--mono);text-decoration:none}
.lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;font:400 12px/1.5 var(--mono);color:var(--muted);margin:0 0 12px}
.kv{display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline;margin:0 0 8px}
.kv .k{font:500 12px var(--mono);color:var(--muted);min-width:8.5ch}
.kv .v{font:600 20px var(--mono)}
.aut{outline:1px solid var(--faint);outline-offset:1px;padding:0 5px;font-size:13px;color:var(--muted)}
.gen{background-image:radial-gradient(circle at 1px 1px,var(--faint) .8px,transparent 1.1px);background-size:5px 5px;padding:1px 5px}
.matter{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:9px 0;border-top:1px dotted var(--rule);align-items:start}
.chip{font:600 13px/1 var(--mono);padding:6px 8px;min-width:8ch;text-align:center;background:var(--rule);color:var(--muted)}
.chip.amber{background:var(--clock);color:var(--clock-ink)}
.chip.closed{background:transparent;border:1px solid var(--rule)}
.matter .t{font-weight:600;font-size:15px}
.matter .d{grid-column:2;font-size:13px;color:var(--muted)}
.sinceb{border-left:2px solid var(--computed);padding:4px 0 4px 12px;margin:14px 0 0}
.sinceb p{margin:0 0 4px;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.ruleline{font:400 12px/1.5 var(--mono);color:var(--muted);margin:2px 0 8px}
.confirm{border:1px solid var(--fg);padding:10px 12px;margin:0 0 8px}
.confirm p{font-size:14px;margin:0 0 8px}
ol.rec{list-style:none;margin:0;padding:0}
.rec>li{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px dotted var(--rule);align-items:baseline}
.rec .tm{font:400 12px/1.4 var(--mono);color:var(--muted)}
.rec .what{font-size:15px}
.rec .who{font-weight:600}
.rec .seal{font:500 12px var(--mono);color:var(--computed);text-align:right}
.rec .st{grid-column:2 / 4;font:400 12px/1.4 var(--mono);color:var(--muted)}
.rec .st.no{color:var(--bad)}
.rec .st.ok{color:var(--computed)}
.rec li.nc .what{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.rec li.noact{border:1px dashed var(--faint);padding:9px 10px;margin:6px 0;background:transparent}
.tag{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.08em;padding:3px 5px;border:1px solid var(--fg);margin-right:6px;vertical-align:1px}
details.how{border-top:1px solid var(--rule);padding:16px 0}
details.how summary{cursor:pointer;font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0}
details.how h3{font:600 14px var(--sans);margin:16px 0 6px}
details.how ul{margin:0 0 8px;padding-left:20px}
details.how li{margin:0 0 4px;font-size:14px}
table.rl{border-collapse:collapse;font:400 12px/1.5 var(--mono);width:100%}
table.rl td{border-top:1px dotted var(--rule);padding:3px 8px 3px 0;vertical-align:top}
table.rl td:first-child{white-space:nowrap;font-weight:600}
.tests{list-style:none;padding:0;margin:8px 0 0;font:400 12px/1.5 var(--mono)}
.tests li{padding:1px 0}
.foot{border-top:1px solid var(--rule);padding:16px 0 0;font:400 12px/1.5 var(--mono);color:var(--muted)}
.dev{margin-top:28px;border:1px dashed var(--branch);padding:14px}
.dev h2{color:var(--branch)}
.devrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.devgrid{display:grid;grid-template-columns:1fr;gap:0 32px}
@media (min-width:940px){.devgrid{grid-template-columns:1fr 1fr}}
.dev .btn.slim{margin:0}
.dev input[type=number]{width:72px;background:transparent;border:1px solid var(--fg);padding:6px;font:400 13px var(--mono)}
.empty{padding:26px 0;color:var(--muted)}
.live{position:absolute;left:-9999px}
@media (max-width:520px){
  .rec>li{grid-template-columns:minmax(0,1fr) auto}
  .rec .tm{grid-column:1 / 3}
  .rec .st{grid-column:1 / 3}
  .lines{grid-template-columns:1fr}
}
</style>

<div id="banner" class="banner" hidden></div>
<div class="wrap" id="app">
  <div id="hdr"><h1>Live World</h1><p class="sub">Connecting to the World…</p></div>
  <section id="agree" class="agree" aria-live="polite"></section>
  <div id="gate"></div>
  <div class="cols" id="cols" hidden>
    <div class="colA">
      <section id="place" class="sec"></section>
      <section id="act" class="sec"></section>
      <section id="board" class="sec"></section>
    </div>
    <div class="colB">
      <section id="now" class="sec"></section>
      <section id="record" class="sec"></section>
    </div>
  </div>
  <details class="how" id="how"></details>
  <div class="foot">A persistent BOW World · prototype · World facts authored, not NBA history · figures: league lines 2026–27 (verify)</div>
  <section id="dev" class="dev" hidden></section>
  <div id="live" class="live" aria-live="polite"></div>
</div>

        el('span', { class: 'what' }, el('span', { class: 'tag hollow', text: 'NO ACT' }), S.matters[l.matter].title + ' — closed with no counted move · ' + SEAT_LABEL[l.seat] + ' seat · ', el('b', { text: l.holder ? nameOf(l.holder) : 'vacant' })),
        el('span', { class: 'seal muted', text: 'computed' }), el('span', { class: 'st', text: l.effect || 'recorded once, at the deadline' })));
    } else {
      ol.append(el('li', {}, el('span', { class: 'tm' }, dayOf(x.t), el('br'), localHMS(x.t)),
        el('span', { class: 'what' }, el('span', { class: 'tag', text: 'CHECK' }), 'Owner’s note: under the second apron by the deadline — ', el('b', { class: 'comp', text: x.e.status === 'met' ? 'MET' : 'NOT MET' }), ' at payroll ' + fmtM(x.e.payrollK)),
        el('span', { class: 'seal muted', text: 'computed' })));
    }
  });
  kids.push(ol);
  box.replaceChildren(...kids);
}

function renderHow(C) {
  const d = $('#how'); if (!d || d.dataset.built) { renderEngine(); return; }
  d.dataset.built = '1';
  d.append(el('summary', { text: 'How do we know?' }),
    el('h3', { text: 'What is real here' }),
    el('ul', {}, el('li', { text: 'The shared store: every act is one document in a database all viewers read and write. Reload and it is still there.' }),
      el('li', { text: 'Platform-enforced privacy: your private board lives where the platform lets only you read it — not the other GM, not the page’s owner.' }),
      el('li', { text: 'Seat leases: taking a seat first takes a short lease on the seat, so two people cannot both win the same one.' }),
      el('li', { text: 'An identical fold in every browser: the same code turns (founding record, acts, time) into the same state — payroll, seats, matters, lapses, games.' }),
      el('li', { text: 'SHA-256 over canonical state: each viewer hashes their own state and publishes 12 characters. You are told “same World” only when your own copy, folded at their moment, hashes to the same thing.' })),
    el('h3', { text: 'What is not' }),
    el('ul', {}, el('li', { text: 'No cryptographic signature by BOW. The founding record’s authority is the platform’s access rule: only the page’s owner can write it.' }),
      el('li', { text: 'Act times come from each actor’s own clock. A new act is stamped after any act its author has seen, and the fold allows 10 seconds of skew; anything beyond is not yet counted.' }),
      el('li', { text: 'The games are a toy model (seeded, “toy model · seed 2026”), not basketball.' }),
      el('li', { text: 'World facts are authored, not NBA history. League lines are 2026–27 figures to verify. The World tax is a flat 1.5× rule, authored; the NBA’s real tax is incremental.' })),
    el('h3', {}, 'Engine self-tests · ', el('span', { id: 'howCount' })),
    el('ul', { class: 'tests', id: 'howTests' }),
    el('h3', { text: 'The rulebook (a refused act stays on the record, marked with its rule)' }),
    el('table', { class: 'rl' }, Object.keys(RULES).map((k) => el('tr', {}, el('td', { text: k }), el('td', { text: RULES[k] })))));
  renderEngine();
}

/* ---- local mode only: the second person, and “pretend it is later” ---- */
function renderDev() {
  const box = $('#dev'); if (!APP.local || !APP.sim) { box.hidden = true; return; }
  box.hidden = false;
  const P = APP.primary, Q = APP.sim, off = DEBUG.offsetMs / 3600000;
  const jump = (h) => () => { DEBUG.offsetMs += h * 3600000; APP.primary.bump(); APP.sim.bump(); };
  const sub = el('div', { class: 'devgrid' }, el('div', { id: 'simPlace' }), el('div', { id: 'simAct' }));
  keepFocus(box, () => {
    box.replaceChildren(el('h2', { text: 'Dev · local mode only · Simulate a second person' }),
      el('p', { class: 'note', text: 'Person 2 is “local-2”. It has its own copy of the data, its own fold and its own hash, and publishes its own presence. It is not the owner and cannot read your private board.' }),
      el('div', { class: 'devrow' }, el('span', { class: 'mono', style: 'font-size:12px', text: 'Pretend it is later:' }),
        [0.25, 1, 2, 6, 24].map((h) => el('button', { class: 'btn slim', onclick: jump(h) }, '+' + (h < 1 ? h * 60 + ' min' : h + ' h'))),
        el('button', { class: 'btn slim', onclick: () => { DEBUG.offsetMs = 0; P.bump(); Q.bump(); } }, 'Back to now'),
        el('span', { class: 'mono', style: 'font-size:12px', id: 'devOff', text: 'offset ' + off.toFixed(2) + ' h = ' + off.toFixed(2) + ' World days' })),
      el('div', { class: 'devrow' }, el('label', { class: 'mono', style: 'font-size:12px', for: 'skewIn' }, 'Person 2 clock skew (s):'),
        el('input', { id: 'skewIn', type: 'number', value: String((Q.skewMs || 0) / 1000), onchange: (e) => { Q.skewMs = (+e.target.value || 0) * 1000; Q.bump(); } }),
        el('button', { class: 'btn slim', onclick: () => { APP.hub.clear(); DEBUG.offsetMs = 0; [P, Q].forEach((c) => { c.ui.drafts = {}; c.ui.arming = null; c.ui.leaving = false; c.ui.msg = ''; }); } }, 'Reset the local World')),
      el('p', { class: 'mono', style: 'font-size:12px', id: 'simHash' }), sub);
  });
  const sp = $('#simPlace'), sa = $('#simAct');
  if (Q.state) {
    renderPlace(Q, sp); renderAct(Q, sa);
    const v = P.state ? (Q.hash12 === P.hash12 ? 'same hash as you at this tick' : 'hash differs from yours at this tick (ticks may differ by skew)') : '';
    $('#simHash').textContent = 'Person 2 sees World day ' + Q.state.day.toFixed(2) + ' · ' + Q.hash12 + ' · ' + plural(Q.state.record.length, 'act') + ' · ' + v;
  } else sp.append(el('p', { class: 'note', text: 'Waiting for the World to start.' }));
}

function tickClocks() {
  const C = APP.primary; if (!C) return;
  document.querySelectorAll('[data-dl]').forEach((n) => { const ms = +n.dataset.dl - C.now(); n.textContent = ms > 0 ? hms(ms) : 'closing'; });
  const o = $('#devOff'); if (o) { const h = DEBUG.offsetMs / 3600000; o.textContent = 'offset ' + h.toFixed(2) + ' h = ' + h.toFixed(2) + ' World days'; }
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
window.__world = { renderEngine, TESTS, testResults, fold, makeCanon, APP, DEBUG, sha256js, canonJSON, makeHub, sinceLines };
async function boot() {
  runTests();
  renderHeader({ state: null, canon: null, canonLoaded: false });
  const [db, room, user] = await Promise.all([cap('db'), cap('room'), cap('user')]);
  if (!db) {
    APP.local = true; APP.hub = makeHub();
    const mk = (label, uid, owner, pid, extra) => new Client(Object.assign({ label, uid, db: APP.hub.dbFor(uid), room: APP.hub.roomFor(pid), user: APP.hub.userFor(uid), isOwner: owner, local: true }, extra));
    APP.primary = mk('you', 'local-1', true, 'p1', { myName: LOCAL_NAMES['local-1'] });
    APP.sim = mk('p2', 'local-2', false, 'p2', { noConfirm: true, skewMs: 0 });
    APP.names['local-1'] = LOCAL_NAMES['local-1']; APP.names['local-2'] = LOCAL_NAMES['local-2'];
  } else {
    let uid = null, me = null, owner = false;
    if (user) { try { uid = await user.id(); me = await user.me(); owner = await user.isOwner(); } catch (e) { /* no identity */ } }
    APP.primary = new Client({ label: 'you', uid, db, room, user, isOwner: owner, myName: (me && me.name) || '' });
  }
  const P = APP.primary;
  P.onChange = (force) => { if (force) renderAll(); };
  P.onPeers = () => renderAgreement();
  if (APP.sim) { APP.sim.onChange = (force) => { if (force) { renderDev(); renderAgreement(); } }; APP.sim.onPeers = () => renderAgreement(); }
  P.start(); if (APP.sim) APP.sim.start();
  renderAll();
  setInterval(() => { P.pulse(); if (APP.sim) APP.sim.pulse(); tickClocks(); }, 1000);
  setInterval(() => { renderAgreement(); if (P.uid && P.privLoaded && !document.hidden) P.savePriv({ lastSeen: new Date(P.now()).toISOString() }).catch(() => {}); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.hidden && P.uid) P.savePriv({ lastSeen: new Date(P.now()).toISOString() }).catch(() => {}); });
}
boot();
})();
