<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P3 · The Jurisdiction</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<script src="_shared/boston-fixture.js"></script>
<style>
:root{
--ink:#1b2620;--paper:#faf6ea;--paper2:#f0e9d5;--mute:#454f48;--hair:#cdc6ae;
--boston:#1e6a3e;--league:#454c55;--lpaper:#eceeec;--lrule:#b6bbc0;
--denver:#2a6796;--dgold:#b98a22;--arena:#2b706a;--apaper:#f4f2e9;
--news:#ece6d2;--nink:#26231b;--branch:#ad3517;--bpaper:#fbede8;
--tone:rgba(27,38,32,.16);
--serif:'Source Serif 4',Georgia,'Times New Roman',serif;
--mono:'Courier Prime','Courier New',Courier,monospace;
--sidew:208px;--framew:504px;
--gc:#3a3a2f;--gp:#f5f1e2;--gb:#e2dcc7;--gp2:#efe9d5;
}
body[data-g=front]{--gc:#3a3a2f;--gp:#f5f1e2;--gb:#e2dcc7;--gp2:#efe9d5}
body[data-g=reality]{--gc:var(--boston);--gp:#fbfaf3;--gb:#e3e8e1;--gp2:#f1f4ec}
body[data-g=desk]{--gc:var(--boston);--gp:#f6eed4;--gb:#d5ccab;--gp2:#eee4c2}
body[data-g=league]{--gc:var(--league);--gp:var(--lpaper);--gb:#cbcfcf;--gp2:#dfe2e1}
body[data-g=denver]{--gc:var(--denver);--gp:#f3f8fc;--gb:#c9d8e5;--gp2:#e0ebf5}
body[data-g=arena]{--gc:var(--arena);--gp:var(--apaper);--gb:#d6d2c1;--gp2:#eae7d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.4 var(--serif);color:var(--ink);background:var(--gb);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--branch);outline-offset:2px;box-shadow:0 0 0 2px #fff}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;overflow:clip}
#top{display:flex;align-items:center;gap:12px;padding:4px 12px;background:var(--gp);border-bottom:2px solid var(--gc);min-height:38px}
#top .ttl{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
#addr{font:12px var(--mono);color:var(--mute);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:flex;gap:6px}
.tb{min-height:34px;padding:3px 10px;border:1.5px solid var(--ink);background:var(--paper);font:700 12px var(--mono);cursor:pointer}
.tb[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{display:grid;grid-template-columns:minmax(0,1fr) var(--sidew);min-height:0;overflow:clip}
#col{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:clip}
#work{flex:1;min-height:0;display:flex;gap:10px;padding:8px 12px 8px 12px;align-items:flex-start;overflow:clip}
#bot{display:flex;gap:14px;align-items:center;padding:3px 12px;background:var(--gp);border-top:1px solid var(--hair);font:11.5px var(--mono);color:var(--mute);min-height:26px}
#bot .lg{display:none;gap:8px;margin-left:auto}
body.know #bot .lg{display:flex}
/* standing line */
#standing{position:relative;padding:6px 14px 7px;background:var(--gp);border-left:10px solid var(--gc);border-bottom:1px solid var(--hair);display:flex;gap:14px;align-items:flex-start}
#standing .sb{flex:1;min-width:0}
#standing .s1{font:700 11px/1.1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gc);margin-bottom:2px}
#standing .vb{color:var(--mute);letter-spacing:.06em}
#standing .s2{font-size:17px;line-height:1.2;font-weight:600}
#standing .s3{font:12.5px/1.35 var(--mono);margin-top:1px}
#standing .s3 b{font-weight:700}
#standing .gt{position:absolute;right:14px;top:6px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--gc);color:var(--gc);padding:3px 8px;white-space:nowrap;background:var(--gp)}
body.real #standing .gt{position:static;align-self:flex-start}
.rg{position:relative}
.cap{display:none;margin:6px 0 0;font:700 10.5px/1.25 var(--mono);letter-spacing:.02em;padding:3px 6px;border:1.5px solid var(--ink);background:var(--paper);text-align:left;text-transform:none}
#standing .cap{flex:0 0 250px;margin:0;align-self:flex-start}
.cap small{display:block;font-weight:400;color:var(--mute)}
body.real .cap{display:block}
.cap.c-REAL{background:var(--ink);color:var(--paper)}.cap.c-REAL small{color:#d8d3c0}
.cap.c-PROPOSED{background:var(--paper);border-style:solid}
.cap.c-SPECULATIVE{background:repeating-linear-gradient(135deg,#f4e5c8 0 3px,#faf3e2 3px 7px);border-style:dashed}
/* buttons */
.btn{min-height:44px;padding:6px 14px;border:2px solid var(--ink);background:var(--paper);font:700 12.5px/1.15 var(--mono);letter-spacing:.03em;text-transform:uppercase;cursor:pointer;text-align:center;border-radius:2px}
.btn:hover:not(:disabled){background:var(--paper2)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover:not(:disabled){background:#2e3d34}
.btn.gc{background:var(--gc);color:#fff;border-color:var(--gc)}
.btn.gc:hover:not(:disabled){background:var(--gc);color:#fff}
.btn:disabled{border-style:dashed;color:var(--mute);cursor:not-allowed;background:transparent}
.btn[aria-pressed=true],.btn[aria-pressed=true]:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn[aria-pressed=true] .small{color:inherit}
.btn.sm{min-height:36px;padding:3px 10px;font-size:11.5px}
.btn.br{border-color:var(--branch);color:var(--branch)}.btn.br.pri{background:var(--branch);color:#fff}
.btn.br.pri:hover:not(:disabled){background:var(--branch);color:#fff}
.lk{background:none;border:0;padding:0;font:inherit;color:var(--gc);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:24px}
/* truth grammar */
.vw{display:inline-block;vertical-align:baseline;max-width:100%}
.v.wrap{white-space:normal;display:inline;padding:1px 6px;font-weight:400;line-height:1.5;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.vw:has(.wrap){display:inline}
.v{display:inline-block;padding:0 6px;font:700 .92em/1.35 var(--mono);white-space:nowrap;border:1.5px solid var(--ink)}
.k-OBSERVED{background:var(--ink);color:var(--paper)}
.k-RECORDED{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3.5px var(--paper)}
.k-AUTHORED{background:transparent}
.k-COMPUTED{background:var(--tone);border-color:transparent}
.k-MODELED{background:repeating-linear-gradient(135deg,rgba(27,38,32,.28) 0 1.5px,transparent 1.5px 5px);border-color:var(--ink)}
.k-GENERATED{background-color:var(--paper);background-image:radial-gradient(circle,rgba(27,38,32,.75) .8px,transparent 1.1px);background-size:4px 4px;border-color:var(--ink)}
.k-UNKNOWN{background:transparent;border-style:dashed;color:var(--mute)}
.kl li{display:grid;grid-template-columns:auto;gap:1px;border-bottom:1px solid var(--hair);padding:3px 0 4px}
.kl .v{justify-self:start;max-width:100%;white-space:normal;overflow-wrap:anywhere;font-size:11.5px}
.kl small{font:10.5px/1.25 var(--mono);color:var(--mute)}
body.know .v{outline:1px dotted var(--branch);outline-offset:1px}
/* stage / sheets */
.stage{display:flex;align-items:stretch;min-width:0;flex:1}
.sheet{background:var(--gp);border:1.5px solid var(--ink);border-left:6px solid var(--gc);display:flex;flex-direction:column;min-width:0;flex:1}
.sh-h{height:46px;flex:0 0 46px;padding:0 10px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-h h2{font:700 12.5px/1.15 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.sh-h .rel{font:11.5px var(--mono);color:var(--mute);text-align:right}
.sh-b{display:flex;min-height:0;flex:none;overflow:hidden}
.draw{flex:0 0 auto;display:block;border-right:1px solid var(--hair)}
.read{flex:1;min-width:0;padding:8px 12px;overflow:auto;font-size:14px}
.read h3{font:700 13px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.read p{margin:0 0 6px}
.read .ans{font-size:15px}
.read .small,.small{font:12px/1.35 var(--mono);color:var(--mute)}
.edge{flex:0 0 42px;width:42px;position:relative;border:1.5px solid var(--ink);border-left:6px solid var(--gc);border-right-width:0;background:var(--gp2);padding:0;cursor:pointer;overflow:hidden}
.edge:hover{background:var(--gp)}
.edge .et,.edge .er{position:absolute;left:4px;right:0;writing-mode:vertical-rl;transform:rotate(180deg);font:700 11.5px/1.15 var(--mono);text-transform:uppercase;letter-spacing:.05em;text-align:left;overflow:hidden}
.edge .er{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink)}
.edge .pt{position:absolute;left:0;right:0;height:3px;background:var(--ink)}
.hinges{display:flex;flex-direction:column;gap:4px;flex:0 0 118px;padding-top:6px}
.hg{min-height:52px;text-align:left;border:1.5px solid var(--ink);border-left-width:1.5px;background:var(--gp2);padding:5px 8px;cursor:pointer;font:700 12px/1.15 var(--mono);letter-spacing:.05em;border-radius:0 3px 3px 0}
.hg small{display:block;font:400 11.5px/1.2 var(--serif);letter-spacing:0;color:var(--mute);margin-top:1px}
.hg[aria-current=true]{background:var(--gp);border-left:6px solid var(--gc)}
.hg:hover{background:var(--gp)}
.hg .ok{float:right;font-size:11px}
.enterb{margin-top:8px}
svg.draw text{font-family:var(--mono);fill:var(--ink)}
.tk{font-size:10.5px;fill:var(--mute)!important}
.rl{stroke:#8c8670;stroke-width:1;stroke-dasharray:1 3}
.rn{font-size:11px;font-weight:700}
.axis{stroke:var(--mute);stroke-width:1}.tkl{stroke:var(--mute)}
.pinl{stroke:var(--ink);stroke-width:3}.pinl.c{stroke-width:2}
.pinl.g{stroke:#6d6a5a;stroke-width:2;stroke-dasharray:6 4}
.pl{font-size:11.5px;font-weight:700}
table.gaps{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0}
.lr{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--hair);padding:3px 0;font-size:13px;min-height:29px}
.lr .l{font:700 11px var(--mono);letter-spacing:.03em}.lr .r{text-align:right}
.lr s{color:var(--mute);font:11px var(--mono)}
table.gaps th{font:700 11px var(--mono);text-align:left;padding:2px 4px;border-bottom:1.5px solid var(--ink);letter-spacing:.03em}
table.gaps td{padding:3px 4px;border-bottom:1px solid var(--hair);vertical-align:middle}
table.gaps .v{font-size:.8em;padding:0 4px}table.gaps td{padding:3px 2px}
.tight{border:2px solid var(--ink);padding:3px 8px;font:700 12.5px var(--mono);margin:4px 0;display:flex;gap:8px;align-items:center;background:var(--tone);flex-wrap:wrap}
.mkc{display:inline-block;vertical-align:-3px}
.verb{display:flex;gap:8px;align-items:flex-start;padding:2px 0;font-size:13.5px}
.verb.st{color:var(--mute)}.verb.st>span:last-child{text-decoration:line-through;text-decoration-thickness:2px}
.verb .vs{flex:0 0 58px;font:700 10.5px var(--mono);letter-spacing:.04em;padding-top:3px}
.vgrp{font:700 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border-bottom:1.5px solid var(--ink);margin:7px 0 2px;display:flex;justify-content:space-between}
input[type=range]{width:100%;height:36px;accent-color:var(--ink)}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.paper{border:1.5px solid var(--ink);padding:4px 8px;margin:3px 0;display:flex;gap:8px;align-items:center;background:var(--gp2)}
.paper .pb{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.door{border:1.5px solid var(--ink);padding:5px 8px;margin:4px 0;font-size:13.5px}
.sealed{border:2px dashed var(--mute);padding:6px 8px;color:var(--mute);font-size:13px;margin-top:4px}
/* trace */
table.tr{border-collapse:collapse;width:100%;font-size:13px}
table.tr td,table.tr th{padding:3px 5px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
table.tr th{font:700 11px var(--mono);border-bottom:1.5px solid var(--ink)}
table.tr td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
/* front */
.front{display:flex;gap:28px;width:100%;padding:12px 8px}
.front .ask{flex:1.1;min-width:0}
.front h1{font-size:34px;line-height:1.1;font-weight:700;margin-bottom:8px}
.front .lead{font-size:16px;margin-bottom:14px;max-width:520px}
.askl{display:flex;gap:8px;margin-bottom:12px}
.askl input{flex:1;min-width:0;min-height:48px;padding:6px 10px;border:2px solid var(--ink);background:#fff;font:16px var(--serif)}
.doors{display:flex;flex-direction:column;gap:6px}
.doors .btn{text-align:left;text-transform:none;font:600 15px/1.25 var(--serif);letter-spacing:0;padding:8px 12px;min-height:46px}
.front .reg{flex:.9;min-width:0;border:1.5px solid var(--ink);background:var(--paper);padding:8px 12px}
.front .reg h2{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.reg li{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--hair);font-size:13.5px;line-height:1.3}
.reg li i{display:block;width:8px;background:var(--c,var(--ink))}
.reg li small{display:block;font:12px var(--mono);color:var(--mute)}
.refuse{border:2px solid var(--ink);padding:6px 10px;background:var(--paper);font-size:14px;margin-bottom:8px}
/* desk / center */
.center{flex:1;min-width:0;min-height:0;max-height:100%;overflow:auto;padding-right:2px}
.wframe{flex:0 0 var(--framew);display:flex;align-self:flex-start;min-width:0}
.ledgerbg{background-image:repeating-linear-gradient(to bottom,transparent 0 23px,rgba(30,106,62,.16) 23px 24px)}
.dh{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.matter{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:1.5px solid var(--ink);background:var(--gp);padding:7px 10px;margin-bottom:6px}
.matter.inert{border-style:dashed;background:transparent;color:var(--mute)}
.matter b{font-weight:600}
.matter .due{font:12px var(--mono);color:var(--mute)}
/* form */
.form{border:2px solid var(--ink);background:var(--gp);position:relative}
.form .fh{padding:6px 10px 5px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.form .fh h2{font:700 13px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.form .fs{padding:5px 10px;font-size:14px;line-height:1.3;border-bottom:1px solid var(--hair)}
.stt{font:700 11px var(--mono);letter-spacing:.05em;border:1.5px solid var(--ink);padding:2px 6px;white-space:nowrap;text-transform:uppercase}
.lns{padding:5px 8px 1px}
.ln{display:grid;grid-template-columns:8px 80px 1fr auto;gap:0 8px;align-items:center;border:1.5px solid var(--ink);background:var(--gp);margin:0 0 4px;min-height:48px}
.ln .sl{align-self:stretch;background:var(--lc,var(--ink))}
.ln.p-denver .sl{background:linear-gradient(to bottom,var(--denver) 78%,var(--dgold) 78%)}
.ln.p-league .sl{background:var(--league)}
.ln.p-player .sl,.ln.p-media .sl{background:repeating-linear-gradient(135deg,var(--mute) 0 2px,transparent 2px 5px)}
.ln.p-arena .sl{background:var(--arena)}
.ln .who{font:700 12px/1.15 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 0}
.ln .who small{display:block;font:400 11px/1.2 var(--serif);text-transform:none;letter-spacing:0;color:var(--mute)}
.ln .what{font-size:13px;line-height:1.28;padding:2px 0;min-width:0}
.ln .yk{display:flex;gap:6px;align-items:center;font:700 10.5px var(--mono);letter-spacing:.04em;margin-bottom:1px}
.ln .yk .cr{font-weight:400;color:var(--mute)}
.ln .stt2{padding:3px 8px 3px 0;text-align:right;font:700 11px/1.2 var(--mono);min-width:92px}
.ln.struck{border-color:var(--mute);background:transparent}
.ln.struck .who,.ln.struck .yk{text-decoration:line-through;text-decoration-thickness:2px}
.ln.struck .who small{text-decoration:none}
.ln.struck .mk{opacity:.55}
.dk{display:inline-block;font:700 10px var(--mono);letter-spacing:.05em;padding:1px 6px;border:1.5px solid var(--ink);text-transform:uppercase;white-space:nowrap;margin-left:6px;vertical-align:1px}
.dk.d-content{background:var(--ink);color:var(--paper)}
.dk.d-shape{background:transparent}
.dk.d-count{background:var(--tone);border-color:transparent}
.dk.d-none{border-style:dashed;color:var(--mute)}
.ln.none{border-style:dashed;background:transparent}
.ln.refused{border-color:var(--branch)}
.mk{width:25px;height:25px;flex:0 0 25px;--mf:none;--mi:currentColor}
.mk.on{--mf:currentColor;--mi:var(--paper)}
.cm{width:34px;height:18px}
.kstrip{display:flex;gap:10px;align-items:center;padding:5px 10px;border-top:1px solid var(--hair);font:12px var(--mono);flex-wrap:wrap}
.kstrip .kd{display:inline-flex;gap:4px;align-items:center}
.kdot{width:18px;height:0;border:0;border-bottom:3px dashed var(--ink);display:inline-block;vertical-align:middle;margin-right:3px}
.kdot.on{height:6px;border-bottom:0;background:var(--ink)}
.legend{display:flex;gap:9px 12px;flex-wrap:wrap;align-items:center;padding:4px 10px;border-top:1px solid var(--hair);font:11px var(--mono);color:var(--mute)}
.legend span{display:inline-flex;gap:3px;align-items:center}.legend .mk{width:19px;height:19px;flex:0 0 19px}.legend .cm{width:30px;height:16px}.legend .sep{width:1px;height:16px;background:var(--hair)}
.fact{padding:6px 10px;border-top:1.5px solid var(--ink);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--gp2)}
.blk{border:2px solid var(--ink);padding:6px 10px;margin:6px 10px 0;font-size:14px;background:var(--paper)}
.blk b{font-weight:700}
.verdict{display:inline-block;font:700 12px var(--mono);padding:1px 8px;border:2px solid var(--ink);letter-spacing:.05em}
.verdict.YES{background:var(--ink);color:var(--paper)}
.verdict.NO{border-color:var(--branch);color:var(--branch);text-decoration:line-through;text-decoration-thickness:2px}
.verdict.CT{border-style:dashed}
.chk{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:3px 0;font-size:13px;align-items:baseline}
.stip{background-color:var(--paper);background-image:radial-gradient(circle,rgba(27,38,32,.55) .8px,transparent 1.1px);background-size:5px 5px;border:1.5px solid var(--ink);padding:6px 8px;font-size:13.5px;margin:4px 0}
.stip small{display:block;font:11px var(--mono);background:var(--paper);display:inline-block;padding:0 4px;margin-top:2px}
.clip{background:var(--news);color:var(--nink);border:1px solid #b3a98c;padding:6px 9px;margin:4px 0;font-size:13.5px;line-height:1.3}
.clip .ol{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--nink);margin-bottom:3px;display:flex;justify-content:space-between}
.clip.if{border-style:dashed;opacity:.9}
.clip h4{font:700 15px/1.15 var(--serif)}
/* visits */
.visit{border:2px solid var(--ink);background:var(--gp);position:relative}
.visit .vh{padding:6px 12px;border-bottom:2px solid var(--gc);font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.art{display:grid;grid-template-columns:50px 1fr;gap:0 10px;padding:5px 12px;border-bottom:1px solid var(--lrule);font-size:14px}
.art .an{font:700 12px var(--mono);color:var(--league)}
.art .ab{min-width:0}
body[data-g=league] .visit{background-image:linear-gradient(var(--lrule) 1px,transparent 1px);background-size:100% 26px;background-color:var(--lpaper);font-family:var(--serif)}
body[data-g=league] .art{background:rgba(236,238,236,.86)}

  s+='<line class="axis" x1="52" x2="52" y1="0" y2="'+D+'"/><text class="tk" x="6" y="12">$M</text>';
  lines.forEach(function(l){var y=yy(dom,l.v);s+='<line class="rl" x1="52" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="rn" x="'+(left?58:W-6)+'" y="'+(l.dy!=null?y+l.dy:(l.pos==='below'?y+13:y-5))+'" text-anchor="'+(left?'start':'end')+'">'+l.n+'</text>';});

   league:first?{v:'CT',t:'CAN’T TELL. A first-round pick is bound by a rule that reads the seller’s whole pick ledger [verify: future-firsts rule]. That ledger sits on Denver’s desk.'}:{v:'YES',t:'YES. Nothing in the file crosses a line: a pick carries no salary.'}};
}

  if(S.wants.length)h+='<h2>Wants filed <span class="wt">'+S.wants.length+'</span></h2><ul class="fol">'+S.wants.map(function(w){return '<li><b>“'+esc(w.q)+'”</b><div class="clock">under '+esc(w.place)+'</div></li>';}).join('')+'</ul>';
  var recs=S.log.filter(function(e){return e.act;}),trail=S.log.filter(function(e){return !e.act;});

  h+='<ol reversed style="margin-bottom:10px">'+recs.slice().reverse().map(function(e){return '<li class="ev k-record"><span class="n">act '+e.act+'</span> <b>'+esc(e.who)+'</b> '+esc(e.what)+'<span class="h">'+esc(e.clock)+' · '+esc(e.hist)+'</span></li>';}).join('')+'</ol>';

  h+='<ol reversed>'+trail.slice().reverse().slice(0,40).map(function(e){return '<li class="ev k-'+e.kind+'"><span class="n">·</span> <b>'+esc(e.who)+'</b> '+esc(e.what)+'<span class="h">'+esc(e.clock)+' · '+esc(e.hist)+'</span></li>';}).join('')+'</ol>'+CB('PROPOSED',NOAI,'An in-page event log; the real thing would be signed messages in each system’s own log.');
  return h;
}

  }

var GUARD={draft:1,sign:1,send:1,sweet:1,rehearse:1,cell:1,redline:1,rlpick:1,keep:1,wait:1,go:1,reform:1,compare:1,fold:1};
function act(kind,p){
  var msg='';
  if(S.vp&&GUARD[kind]){ann('You opened an address: you are reading as an observer. Take the seat to act.');return;}
  switch(kind){
    case 'ask':S.g='reality';S.refusal=null;openSheet(p);LOG('you (visitor)','asked “'+Q[p]+'”; placed at the '+SHN[p]+' sheet, where the answer binds. The question is now the pin.');msg='Placed at the '+SHN[p]+' sheet. Boston’s payroll is the pin.';break;
    case 'open':openSheet(p);var hn=HING.filter(function(x){return x.id===p;})[0];LOG('you (observer)',p==='neck'?'came back to the payroll sheet; the pin is where you left it.':'followed the relation '+hn.n+'; the '+SHN[p]+' sheet opened beside, the last one folded to an edge that still reads the pin.');msg='Opened the '+SHN[p]+' sheet. The pin is at the same height.';break;
    case 'release':if(S.pen){var k=verbsStruck(TS+S.peak).length;LOG('you (observer)','pushed the pin to '+d0(TS+S.peak)+' in pencil: '+k+' verb'+(k===1?'':'s')+' struck. Released; the pencil erased and nothing forked.',{kind:'pencil',hist:'pencil · nothing forked'});S.pen=0;S.peak=0;msg='Released. The pencil erased; nothing forked.';}break;
    case 'pushT':if(S.pen===5e6){S.pen=0;S.peak=0;LOG('you (observer)','let go of Tatum’s +$5M push; the pencil erased.',{kind:'pencil',hist:'pencil · nothing forked'});msg='Pencil erased.';}else{S.pen=5e6;S.peak=5e6;LOG('you (observer)','pushed Tatum’s number +$5M in pencil: every open sheet redrew; the tightest line moved to '+tightest().n.toLowerCase()+' '+m3(tightest().g)+'.',{kind:'pencil',hist:'pencil · nothing forked'});msg='Pushed Tatum’s number in pencil. Every open sheet redrew.';}break;
    case 'door':var mo=FX.moments.filter(function(m){return m.id===p;})[0];S.door[p]=true;LOG('you (observer)','asked what happened at “'+mo.question+'”. Sealed hindsight opened for an observer.');msg='Outcome revealed to you as an observer.';break;
    case 'why':if(p==='neck'){S.why='neck';msg='Showing the causes behind the gap.';}else if(p===''){S.why=null;msg='Back to the sheet.';}else{S.g='desk';S.view='why';LOG('you (GM seat)','asked why payroll is '+fmtP(wpay())+'; the trace is every act and rule behind it.');msg='Showing why payroll is '+fmtP(wpay())+'.';}break;
    case 'hold':S.held[p]=S.held[p]?null:{at:S.n};LOG('you',(S.held[p]?'began holding':'stopped holding')+' “'+HELD[p].name+'”, a paper you have no side in; its clock now paces you.',{kind:'hold'});msg=(S.held[p]?'Holding ':'Stopped holding ')+HELD[p].name;break;
    case 'enter':S.vp=false;S.g='desk';S.seat=true;S.view='home';S.why=null;S.pen=0;S.peak=0;LOG('you','took the GM seat in Boston · Year Two, a World diverged from Reality at Year 0. Your word now counts for signing, trading, payroll.',{kind:'record',hist:'World record',clock:WD.clock.label});msg='You are in Boston, Year Two, as general manager.';break;
    case 'leave':S.vp=false;S.g='reality';S.seat=false;if(!S.sheets.length)openSheet('neck');S.why=null;LOG('you','handed the seat back and returned to the reading copy of Reality. The World keeps its own calendar.');msg='Back in Reality, as an observer.';break;
    case 'openW':S.ws=p==='ledger'?'ledger':'rule';msg='Opened the '+(S.ws==='rule'?'rule':'ledger')+' sheet.';break;
    case 'draft':S.g='desk';S.view=p==='f1'?'form1':'form2';if(S.f[p].st!=='draft'){msg='Opened the paper in flight.';break;}LOG('you (GM seat)','opened a draft of the '+(p==='f1'?'Denver trade paper':'partner-night date request')+'. Nothing crosses until you send.',{kind:'rehearsal',hist:'draft · crosses nothing'});msg='Draft opened. Lines are derived from the rulebooks it touches.';break;
    case 'sweet':var f1=S.f.f1;f1.sw=!f1.sw;f1.last=null;LOG('you (GM seat)',(f1.sw?'added':'removed')+' $0.5M of cash in the Denver draft.',{kind:'rehearsal',hist:'draft · crosses nothing'});msg=f1.sw?'Added cash to the draft.':'Removed the cash.';break;
    case 'dnote':S.dnote=!S.dnote;msg=S.dnote?'Showing a stand-in for Denver’s side.':'Hidden.';break;
    case 'leak':S.leak=!S.leak;msg=S.leak?'Showing what a leak would do.':'Hidden.';break;
    case 'rehearse':var fr=S.f[p];fr.last=rulebook(p,true);LOG('you (GM seat)','ran the trade call (dry run): '+({YES:'YES',NO:'NO',CT:'CAN’T TELL'}[fr.last.v])+'. Recorded as a rehearsal; it crossed nothing.',{kind:'rehearsal',hist:'rehearsal · crosses nothing'});msg='Dry run: '+({YES:'yes',NO:'no',CT:'can’t tell'}[fr.last.v])+'.';break;
    case 'sign':var fs=S.f[p];fs.ln.boston=1;fs.returned=null;LOG('you (GM seat)','signed line 1 of the '+(p==='f1'?'Denver trade paper':'date request')+' (WILL-yes, your warrant). It is the only line you can fill.',{kind:'record',hist:'World record · paper not yet joined'});msg='Line 1 signed. The other lines are held elsewhere.';break;
    case 'cell':var f2=S.f.f2,b=CAL.busy[p];if(b){f2.refusal={cell:p,holder:b[0],why:b[1]};LOG('arena calendar','refused '+cellName(p)+': held on '+({arena:'the arena’s own calendar',league:'the League’s schedule'}[b[0]])+'.',{kind:'obs',hist:'refusal · nothing changed',clock:'Arena · its own clock'});msg='Refused: '+cellName(p)+' is held on '+({arena:'the arena’s calendar',league:'the League’s schedule'}[b[0]])+'.';}else{f2.cell=p;f2.refusal=null;f2.last=null;LOG('you (GM seat)','asked for '+cellName(p)+', free on the arena’s calendar.',{kind:'rehearsal',hist:'draft · crosses nothing'});msg='Asked for '+cellName(p)+'.';}break;
    case 'send':var fd=S.f[p];if(S.flight||!fd.ln.boston||(p==='f2'&&!fd.cell))return;fd.st='sent';S.flight=p;fd.turn=0;fd.last=null;fd.returned=null;
      if(p==='f1'){fd.tell.league=1;S.g='league';}else{fd.ln.money=1;fd.tell.arena=1;fd.tell.league=1;S.g='arena';}
      flyEnv();LOG('you (GM seat)','sent the '+(p==='f1'?'Denver trade paper':'date request')+'. Notice copies went out and cannot be recalled. The page took '+(p==='f1'?'the League’s':'the arena’s')+' register.',{kind:'record',hist:'World record · in flight'});msg='Sent. You are now visiting '+(p==='f1'?'the League Office':'the arena’s calendar')+'; you cannot approve.';break;
    case 'wait':var fi=S.flight;if(!fi)return;var ff=S.f[fi],bl=blockedOn(fi);if(!bl)return;ff.turn++;
      if(bl.k==='denver'){ff.ln.denver=1;LOG('Denver’s desk (stand-in)','signed line 2 on Denver’s own clock. The League now holds a complete file.',{clock:'Denver desk · their clock',hist:'Denver’s record',kind:'result',sys:'denver'});msg='Denver’s line arrived, on Denver’s clock.';}
      else if(bl.k==='arena'){ff.ln.arena=1;LOG('Arena (its calendar)','held '+cellName(ff.cell)+' for Boston, on the arena’s own clock.',{clock:'Arena · its own clock',hist:'Arena’s record',kind:'result',sys:'arena'});msg='The arena held the slot, on its own clock.';}
      else{var rb=rulebook(fi,false);if(rb.v==='NO'){ff.st='draft';ff.ln={boston:0,denver:0,league:0};ff.returned=rb;S.flight=null;S.g='desk';S.view='form1';LOG('League Office (rulebook)','returned the file, naming the rule. Nothing changed on Boston’s books.',{clock:'League desk · turn '+ff.turn,hist:'League’s record',kind:'result',sys:'league'});msg='The League returned the file, naming the rule.';}
        else{finish(fi);msg='The League approved. Boston’s ledger moved: payroll '+fmtP(wpay())+'.';}}
      break;
    case 'go':var gt=goTarget(S.flight);S.g=gt.k;LOG('you (GM seat)','went to '+gt.n+' to look. It shows you only what it discloses.',{kind:'obs',hist:'visit · read only'});msg='Now visiting '+gt.n+'.';break;
    case 'reform':var fx=S.flight;if(!fx)return;var fq=S.f[fx];fq.st='draft';fq.ln=fx==='f1'?{boston:0,denver:0,league:0}:{boston:0,arena:0,league:0,money:0};fq.att++;fq.last=null;S.flight=null;S.g='desk';S.view=fx==='f1'?'form1':'form2';LOG('you (GM seat)','withdrew the paper to re-form it. Copies already delivered stay delivered; the join dissolved, so every line must be filled again.',{kind:'record',hist:'World record · withdrawn'});msg='Paper withdrawn. Copies already delivered cannot be recalled.';break;
    case 'back':S.stampNew=false;S.g='desk';if(S.flight)S.view=S.flight==='f1'?'form1':'form2';else S.view='records';msg='Back at your desk.';break;
    case 'records':S.g='desk';S.rec=p;S.view='records';S.stampNew=false;msg='Showing the three records.';break;
    case 'home':S.view='home';S.why=null;S.g='desk';msg='Back at your desk.';break;
    case 'redline':S.red={pick:'2nd',kept:false};S.view='redline';LOG('you (GM seat)','opened a redline of the signed Denver paper. A redline is a draft: nothing forks until you keep it.',{kind:'rehearsal',hist:'redline · draft'});msg='Redline opened.';break;
    case 'rlpick':S.red.pick=p;LOG('you (GM seat)','redlined the paper: Boston gets a future '+(p==='1st'?'first':'second')+'-round pick. Both faces re-executed.',{kind:'rehearsal',hist:'redline · draft'});msg='Both faces re-executed with a '+(p==='1st'?'first':'second')+'-round pick.';break;
    case 'keep':S.branches.push({name:'Denver paper · first-round ask',stamp:'Your branch · diverged Year Two · Week 9'});S.red.kept=true;S.view='branch';LOG('you (GM seat)','kept the redline as a branch: “Your branch · diverged Year Two · Week 9”. The record is untouched.',{kind:'branch',hist:'your branch · diverged Wk 9'});msg='Branch kept, in its own ink, beside the record.';break;

    case 'fold':S.red=null;S.view='records';S.rec='f1';S.g='desk';LOG('you (GM seat)','folded the redline away and returned to the record. The branch stays listed.',{kind:'obs',hist:'World record'});msg='Back on the record.';break;
    case 'openBranch':S.g='desk';S.red={pick:'1st',kept:true};S.view='branch';msg='Opened your branch.';break;

  [/arena|concert|venue|garden/i,'The arena business'],
  [/agent|contract extension|free agent/i,'A player and his representative'],
  [/media|reporter|rumou?r|leak/i,'Media']
];
var NOT_NAMES={Will:1,Who:1,What:1,Why:1,How:1,When:1,Where:1,Which:1,Is:1,Are:1,Can:1,Could:1,Does:1,Did:1,Do:1,Should:1,Was:1,Were:1,Has:1,Have:1,The:1,If:1,Would:1};
function wantFor(q){
  var place=null;PLACE_LEX.some(function(x){if(x[0].test(q)){place=x[1];return true;}return false;});
  var names=(String(q).match(/\b[A-Z][a-z]+(?:\s[A-Z][a-z]+)*/g)||[]).map(function(w){var t=w.split(' ');while(t.length&&NOT_NAMES[t[0]])t.shift();return t.join(' ');}).filter(function(w){return w;});
  if(!place&&names.length)place=names[0]+' (a place this counter does not hold)';
  return {q:q,place:place||'no place named',names:names.filter(function(n){return !/^(Boston|Celtics|Denver|Nuggets|League|NBA)$/.test(n);})};
}
function askText(q){
  var s=String(q).toLowerCase(),id=/apron|can.?t|cannot/.test(s)?'boundby':/peer|else|other|clubs/.test(s)?'peers':/tax|close|payroll|\bline\b/.test(s)?'neck':null;
  S.ask=q;
  if(id){act('ask',id);return;}
  /* never silently replace what the person typed: say there is no system, and file the question as a Want under the place it names */
  var w=wantFor(q);
  if(!S.wants.some(function(x){return x.q===w.q;})){S.wants.push(w);LOG('you (visitor)','asked “'+q+'” at the counter: no reviewed system holds it. A Want was filed under '+w.place+'.',{kind:'obs',hist:'counter · a Want, not an act'});}
  S.refusal={q:q,place:w.place,names:w.names,count:S.wants.filter(function(x){return x.place===w.place;}).length};
  render();ann('No system here holds that. A Want was filed under '+w.place+'.');
}

/* ---------------- the address lives in the URL; it names STATE, never authority ---------------- */
function hashOf(){
  if(S.g==='front')return '#/front';
  if(S.g==='reality')return '#/boston.reality/'+(S.active||'neck')+'?sheets='+S.sheets.join(',');
  var done=['f1','f2'].filter(function(k){return S.f[k].st==='done';}),view=S.g==='desk'?S.view:'home',q=[];
  if(['form1','form2','redline'].indexOf(view)>=0)view='home';
  if(view==='records'&&!done.length)view='home';
  if(done.length)q.push('done='+done.join(','));
  if(S.f.f2.st==='done'&&S.f.f2.cell)q.push('cell='+S.f.f2.cell);
  if(view==='records')q.push('rec='+S.rec);
  if(view==='branch'||view==='compare')q.push('branch=1');
  q.push('as=gm');
  return '#/boston.world.year-two/'+view+'?'+q.join('&');
}
function syncHash(){try{var h=hashOf();if(location.hash!==h)history.replaceState(null,'',h);}catch(e){}}
function restoreDone(k,cell){
  var f=S.f[k];if(!f||f.st==='done')return;
  if(k==='f1')f.ln={boston:1,denver:1,league:0};else{f.cell=cell||'Thu-eve';f.ln={boston:1,arena:1,league:0,money:1};}
  finish(k);S.stampNew=false;
}
function restoreHash(){
  var raw=(location.hash||'').replace(/^#\/?/,'');if(!raw||raw==='front')return;
  var pq=raw.split('?'),path=pq[0].split('/'),q={};(pq[1]||'').split('&').forEach(function(kv){var a=kv.split('=');if(a[0])q[a[0]]=decodeURIComponent(a[1]||'');});
  if(path[0]==='boston.reality'){
    var ss=(q.sheets||'neck').split(',').filter(function(x){return x==='neck'||!!SHN[x];});
    S.g='reality';S.sheets=ss.length?ss.slice(-4):['neck'];
    S.active=(path[1]&&(path[1]==='neck'||SHN[path[1]]))?path[1]:S.sheets[S.sheets.length-1];
    if(S.sheets.indexOf(S.active)<0)S.sheets.push(S.active);
    LOG('you (observer)','opened an address that names Boston’s Reality at the '+SHN[S.active]+' sheet. It names a place, not a seat.',{kind:'obs',hist:'from the address'});
  }else if(path[0]==='boston.world.year-two'){
    S.g='desk';S.seat=false;S.vp=true;S.view='home';
    var dn=(q.done||'').split(',');
    ['f1','f2'].forEach(function(k){if(dn.indexOf(k)>=0)restoreDone(k,q.cell);});
    var v=path[1]||'home';
    if(v==='records'&&dn.length){S.view='records';S.rec=(q.rec==='f2'&&dn.indexOf('f2')>=0)?'f2':(dn.indexOf('f1')>=0?'f1':'f2');}
    else if((v==='branch'||v==='compare'||q.branch)&&dn.indexOf('f1')>=0){S.branches.push({name:'Denver paper · first-round ask',stamp:'Your branch · diverged Year Two · Week 9'});S.red={pick:'1st',kept:true};S.view=v==='compare'?'compare':'branch';}
    else if(v==='why'&&dn.indexOf('f1')>=0)S.view='why';
    LOG('you (observer)','opened an address that names Boston · Year Two as the GM would see it. You see what an observer may see; the seat is not in the address.',{kind:'obs',hist:'from the address · viewpoint'});
  }
}

/* ---------------- render: every representation redraws from S ---------------- */
function workHTML(){
  if(S.g==='front')return frontHTML();
  if(S.g==='reality')return stageR();
  return '<div class="center rg">'+centerHTML()+'</div><div class="wframe rg">'+stageW()+'</div>';
}
function makeRange(){var r=document.createElement('input');r.type='range';r.id='push';r.min=String(TS-8e6);r.max='232000000';r.step='100000';r.value=String(ts());r.setAttribute('aria-label','Push Boston’s tax salary');r.setAttribute('aria-valuetext',d0(ts())+' (pencil)');return r;}
var lastG='';
function render(){
  var ae=document.activeElement,fk=ae&&ae.dataset?ae.dataset.f:null,aid=ae&&ae.id,keep=null,pu=$('#push');
  if(pu&&S.dragging){pu.remove();keep=pu;}
  document.body.dataset.g=S.g;document.body.classList.toggle('know',S.know);document.body.classList.toggle('real',S.real);
  $('#bKnow').setAttribute('aria-pressed',S.know);$('#bReal').setAttribute('aria-pressed',S.real);
  PROV.length=0;$('#addr').textContent=address();$('#standing').innerHTML=standingHTML();$('#work').innerHTML=workHTML();$('#side').innerHTML=sideHTML();
  var slot=$('#pushSlot');if(slot){var r=keep||makeRange();if(keep){keep.value=String(ts());keep.setAttribute('aria-valuetext',d0(ts())+' (pencil)');}slot.replaceWith(r);}
  var pv=$('#pushv');if(pv)pv.textContent=d0(ts());
  var t=null;
  if(fk)t=document.querySelector('[data-f="'+fk+'"]');
  if(!t&&aid==='push')t=$('#push');
  if(!t&&aid==='askq')t=$('#askq');
  if(!t&&lastG!==S.g&&S.g!=='front'){t=$('#standing');t.setAttribute('tabindex','-1');}
  if(!t&&ae&&ae!==document.body&&!document.body.contains(ae)){t=$('#work .btn.pri:not(:disabled)')||$('#work .btn:not(:disabled)');}
  if(t&&t.disabled)t=$('#push')||$('#work .btn.pri:not(:disabled)')||$('#work .btn:not(:disabled)');
  if(t&&t!==ae){try{t.focus({preventScroll:true});}catch(e){}}
  lastG=S.g;syncHash();
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.p);});
document.addEventListener('submit',function(e){if(e.target.dataset&&e.target.dataset.form==='ask'){e.preventDefault();askText($('#askq').value);}});
document.addEventListener('input',function(e){if(e.target.id==='push'){S.pen=+e.target.value-TS;S.peak=Math.max(S.peak,S.pen);render();}});
document.addEventListener('pointerdown',function(e){if(e.target.id==='push')S.dragging=true;});
document.addEventListener('pointerup',function(){if(S.dragging){S.dragging=false;if(S.pen)setTimeout(function(){act('release');},1100);}});
$('#bKnow').addEventListener('click',function(){S.know=!S.know;render();ann(S.know?'How do we know: showing kind, source and date on each value.':'Provenance hidden.');});
$('#bReal').addEventListener('click',function(){S.real=!S.real;render();ann(S.real?'What’s real: labelling each region real, proposed or speculative.':'Capability labels hidden.');});
var rz=0;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(render,120);});
restoreHash();render();
})();
</script>
