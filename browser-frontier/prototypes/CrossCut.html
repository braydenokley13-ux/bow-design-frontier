<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrossCut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="_shared/boston-fixture.js"></script>
<style>
:root{--serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--cond:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;--red:#b3271c;--red2:#7a1a13}
body,body[data-g="chem"]{--kc:var(--ink);--paper:#f1f3ef;--paper2:#e2e8e6;--tone:#ccd6d3;--ink:#1d2326;--ink2:#38424a;--ink3:#56616a;--line:rgba(29,35,38,.2);--rule:rgba(52,104,148,.16);--br:#1b4b9b;--brpaper:#e1e9f6;--brtone:#c2d3ee}
body[data-g="supply"]{--paper:#ecebe2;--paper2:#dddccf;--tone:#cfcdb9;--ink:#17181a;--ink2:#34363a;--ink3:#575a5f;--line:rgba(23,24,26,.24);--rule:rgba(50,70,55,.09);--br:#9c4308;--brpaper:#f7e8d8;--brtone:#ebcba9}
body[data-g="eco"]{--paper:#f0e7c6;--paper2:#e5daaf;--tone:#d5c88f;--ink:#25261f;--ink2:#3c3d30;--ink3:#5a593f;--line:rgba(37,38,31,.22);--rule:rgba(60,100,130,.2);--br:#2b5a2a;--brpaper:#e0eaca;--brtone:#c5d8a4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.38 var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--paper)}
.branch button:focus-visible{outline-color:var(--br)}
h1,h2,h3,p{margin:0}
.lbl{font:500 10.5px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}

/* ---------- ground: one shell, three grounds ---------- */
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto auto;height:100vh;min-height:0;padding-left:26px;background-color:var(--paper)}
body[data-g="chem"] #app{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:18px 18px}
body[data-g="supply"] #app{background-image:repeating-linear-gradient(180deg,transparent 0 32px,var(--rule) 32px 64px)}
body[data-g="eco"] #app{background-image:repeating-linear-gradient(180deg,transparent 0 25px,var(--rule) 25px 26px)}
body::before{content:"";position:fixed;left:0;top:0;bottom:0;width:26px;z-index:2;pointer-events:none;background:var(--paper2);border-right:2px solid var(--ink)}
body[data-g="chem"]::before{background:var(--paper) linear-gradient(90deg,transparent 18px,#b8443a 18px 19px,transparent 19px 21px,#b8443a 21px 22px,transparent 22px);border-right:0}
body[data-g="supply"]::before{background:radial-gradient(circle at 13px 13px,var(--ink) 0 3.6px,var(--paper) 3.8px 6px,transparent 6.2px) 0 0/26px 34px repeat-y,var(--paper2);border-right:1.5px dashed var(--ink)}
body[data-g="eco"]::before{background:radial-gradient(circle at 13px 18px,var(--ink3) 0 3px,var(--paper) 3.2px 6px,transparent 6.2px) 0 0/26px 56px repeat-y,#e7dcb2;border-right:1px solid var(--ink3)}
.mast,.plane,.frame,.rep,.since,.doorbox,.taxwrap,.assump,.seatblk,.folded,.mark,.folio,.cmpbox{background:var(--paper)}
.mast{border-bottom:3px double var(--ink);padding:5px 20px 5px}
.r1{display:flex;align-items:center;gap:12px;min-height:40px}
.brand{font:700 24px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font:500 10px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.tb{border:1.5px solid var(--ink);min-height:38px;padding:5px 10px;font:500 12px/1.2 var(--mono);letter-spacing:.02em;background:var(--paper);white-space:nowrap}
.tb:hover{background:var(--tone)}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tb.crb{border-style:double;border-width:3px}
.chip{border:1.5px solid var(--ink);padding:5px 9px;font:500 11.5px/1.2 var(--mono);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
.r2{display:flex;gap:14px;align-items:center;padding-top:3px}
.addr{display:flex;gap:10px;align-items:baseline;font:500 12.5px/1.35 var(--mono);white-space:nowrap;overflow:hidden;min-width:0;flex:1}
.addr .lbl{flex:none}
.addr .seg{overflow:hidden;text-overflow:ellipsis;min-width:0}
.addr .seg i{font-style:normal;color:var(--ink3);padding:0 5px}
.addr b{font-weight:600}
.addr b.br{color:var(--br)}
.systabs{display:flex;gap:0;flex:none;border:1.5px solid var(--ink)}
.systab{min-height:34px;padding:4px 11px;font:500 12px/1.2 var(--mono);border-right:1.5px solid var(--ink);background:var(--paper);white-space:nowrap}
.systab:last-child{border-right:0}
.systab:hover{background:var(--tone)}
.systab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#stage{position:relative;overflow:auto;padding:10px 20px 10px;min-height:0}
.legend{display:none;gap:11px;align-items:center;padding:3px 16px;border-top:1px solid var(--ink);background:var(--paper2);font:500 10.5px/1.2 var(--mono);flex-wrap:wrap}
body.showhow .legend{display:flex}
.legend span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.status{border-top:1.5px solid var(--ink);padding:5px 20px;font:500 11px/1.3 var(--mono);color:var(--ink2);background:var(--paper);display:flex;gap:16px;white-space:nowrap;overflow:hidden}
.status b{color:var(--ink);font-weight:600}
.status .hash{margin-left:auto;flex:none}

/* ---------- truth grammar: textures are bars, never squares ---------- */
.sw{display:block;width:9px;min-height:16px;border:1.5px solid var(--kc);align-self:stretch;flex:none}
.sw.lg{display:inline-block;width:9px;height:17px;vertical-align:-4px;align-self:auto}
.k-OBSERVED{background:var(--kc)}
.k-RECORDED{background:var(--kc);box-shadow:inset 0 0 0 1.5px var(--paper)}
.k-AUTHORED{background:transparent}
.k-COMPUTED{background:var(--tone)}
.k-MODELED{background:repeating-linear-gradient(135deg,var(--kc) 0 1.3px,transparent 1.3px 4px)}
.k-GENERATED{background:radial-gradient(circle,var(--kc) 0.9px,transparent 1.2px) 0 0/4px 4px}
.k-UNKNOWN{border-color:transparent;background:linear-gradient(180deg,var(--kc) 0 3px,transparent 3px 6px) left top/1.5px 6px repeat-y,linear-gradient(180deg,var(--kc) 0 3px,transparent 3px 6px) right top/1.5px 6px repeat-y,linear-gradient(90deg,var(--kc) 0 3px,transparent 3px 6px) left top/6px 1.5px repeat-x,linear-gradient(90deg,var(--kc) 0 3px,transparent 3px 6px) left bottom/6px 1.5px repeat-x;background-origin:border-box}
.branch{--kc:var(--br)}
.branch .k-COMPUTED{background:var(--brtone)}
.fact{display:grid;grid-template-columns:9px minmax(0,1fr);gap:9px;padding:4px 0;border-bottom:1px solid var(--line);align-items:stretch}
.fl{font:500 10.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-right:6px}
.fv{font-size:14px}
.fv.tone{background:var(--tone);padding:0 4px}
.branch .fv.tone{background:var(--brtone)}
.fv.mod{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px);padding:0 4px}
.fact.hero .fl{display:block}
.fact.hero .fv{font:700 28px/1.1 var(--serif);display:inline-block;margin:1px 0}
.fact.hero .btn{vertical-align:middle;margin-left:10px}
.how{display:none;font:400 10.5px/1.3 var(--mono);color:var(--ink3);margin-top:2px}
body.showhow .how{display:block}
.hole{display:inline-block;border:1.5px dashed var(--ink);padding:0 6px;font:400 12px/1.5 var(--mono);color:var(--ink2)}
.branch .hole{border-color:var(--br)}
.rt{font:400 10.5px/1.35 var(--mono);color:var(--ink2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--paper);min-height:44px;padding:8px 14px;font:500 12.5px/1.25 var(--mono);letter-spacing:.02em}
.btn:hover{background:var(--tone)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--ink2)}
.btn[aria-disabled="true"]{border-style:dashed;color:var(--ink2);background:transparent}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.branch .btn{border-color:var(--br);background:var(--brpaper)}
.branch .btn:hover{background:var(--brtone)}
.branch .btn.pri{background:var(--br);color:var(--brpaper)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:11.5px}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;transform:rotate(-2deg);background:var(--paper)}
.stamp.ink{border-color:var(--ink);color:var(--ink)}
.h2{font:600 11.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--ink);padding-bottom:3px;margin:10px 0 5px}
.dock{position:sticky;bottom:-10px;z-index:8;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 0 6px;margin-top:8px;background:var(--paper);border-top:1.5px solid var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}

/* ---------- capability overlay ---------- */
[data-cap]{position:relative}
.captag{position:absolute;top:2px;right:2px;z-index:30;max-width:min(300px,64%);background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:2px 6px;font:500 9.5px/1.3 var(--mono);letter-spacing:.03em;text-transform:uppercase;pointer-events:none;box-shadow:2px 2px 0 var(--ink);text-align:left}
.rail .captag{top:auto;bottom:2px}
.captag.prop{border-style:dotted;border-width:2px}
.captag.spec{border-style:dashed}
.captag.real{border-width:2.5px}
.captag em{font-style:normal;display:block;color:var(--ink2)}

/* ---------- rail ---------- */
.rail{display:grid;grid-template-columns:288px 1fr 322px;height:132px;background:var(--paper2);border-top:3px double var(--ink);position:relative}
.rail>div{position:relative;padding:6px 14px 5px;min-width:0}
.zA{border-right:1.5px solid var(--ink)}
.zC{border-left:1.5px solid var(--ink);padding:6px 10px 6px !important}
.zA .who{font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zA .lbl{white-space:nowrap;font-size:10px;overflow:hidden;text-overflow:ellipsis}
.slab{display:inline-block;background:var(--ink);color:var(--paper);font:600 22px/1 var(--mono);padding:5px 10px;letter-spacing:.03em;margin:4px 0 3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slab.br{background:var(--br);color:var(--brpaper);font-size:19px}
.slab.dash{background:transparent;color:var(--ink);border:1.5px dashed var(--ink);font-size:15px}
.slab.frozen{background:transparent;color:var(--ink);border:2px solid var(--ink);font-size:18px}
.zA .rt{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zB{overflow:hidden}
.ruler{position:absolute;left:16px;right:16px;top:6px;bottom:4px}
.rline{position:absolute;left:0;height:0;border-top:2px solid var(--ink);top:60px}
.rline.dbl{border-top:3px double var(--ink)}
.rline.dsh{border-top:2px dashed var(--ink)}
.rline.brl{border-top:5px solid var(--br)}
.rtick{position:absolute;top:52px;width:0;height:17px;border-left:2px solid var(--ink)}
.rtick.br{border-color:var(--br)}
.rtl{position:absolute;font:500 10px/1.2 var(--mono);color:var(--ink2);white-space:nowrap;transform:translateX(-4px)}
.rtl.r0{top:68px}.rtl.r1{top:78px}.rtl.r2{top:88px}.rtl.r3{top:98px}.rtl.rc{top:108px}.rtl.rn{top:84px}.rtl.rs{top:66px;background:var(--paper2);padding:0 4px}
.rnow{position:absolute;top:44px;width:0;height:32px;border-left:5px solid var(--ink)}
.door{position:absolute;top:0;min-height:44px;border:1.5px solid var(--ink);background:var(--paper);padding:3px 7px;font:500 10.5px/1.25 var(--mono);text-align:left;overflow:hidden}
.door:hover{background:var(--tone)}
.door small{display:block;font-weight:400;color:var(--ink2)}
.doorstatic{position:absolute;top:0;border:1.5px solid var(--ink);background:var(--paper);padding:3px 7px;font:500 10.5px/1.3 var(--mono);overflow:hidden}
.doorstatic small{display:block;font-weight:400;color:var(--ink2)}
.outc{position:absolute;top:47px;height:14px;border:1.5px dashed var(--ink);font:400 9.5px/11px var(--mono);color:var(--ink2);padding:0 4px;white-space:nowrap;overflow:hidden;background:var(--paper2)}
.win{display:block;width:100%;height:100%;border:2px solid var(--ink);background:var(--paper);position:relative;overflow:hidden;padding:0}
.win .top{display:flex;justify-content:space-between;align-items:center;height:28px;padding:0 8px;font:500 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.win .top b{background:var(--ink);color:var(--paper);font:600 14px/1 var(--mono);padding:4px 7px;letter-spacing:.03em;text-transform:none}
.win .top b.dash{background:transparent;color:var(--ink);border:1.5px dashed var(--ink);font-size:11px}
.win .slats{display:flex;height:32px;background:repeating-linear-gradient(180deg,var(--red) 0 8px,var(--red2) 8px 10px);align-items:center;justify-content:center}
.win .slats span{background:var(--paper);color:var(--red);border:1.5px solid var(--red);padding:1px 8px;font:600 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.win .bot{display:block;padding:3px 8px 0;font:500 10.5px/1.3 var(--mono)}
.win:hover .top{background:var(--tone)}
.open-win{border:2px solid var(--ink);height:100%;padding:7px 10px;background:var(--paper);display:flex;flex-direction:column;justify-content:space-between;gap:4px}

/* ---------- NOW / ARRIVE ---------- */
.now,.arrive{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:26px}
.now h1,.arrive h1{font:700 30px/1.05 var(--serif)}
.dateline{display:flex;gap:14px;align-items:center;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:3px 0;margin-bottom:8px;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--paper)}
.sub{color:var(--ink2);margin:5px 0 6px;max-width:62ch;font-size:14.5px}
.doorbox{border:1.5px solid var(--ink);padding:8px 12px;margin-bottom:8px}
.doorbox.big{border-width:2px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:12px 16px}
.doorbox .q{font:italic 400 17px/1.3 var(--serif);margin:3px 0 8px}
.refuse{border:2px solid var(--red);background:var(--paper);padding:6px 10px;margin:6px 0;color:var(--ink);font-size:14px}
.refuse .stamp{margin-right:8px}
.slip{flex:1 1 100%;order:-1;background:var(--paper);border:2px solid var(--red);box-shadow:4px 4px 0 var(--red);padding:7px 12px;margin:0 4px 6px 0}
.slip p{margin-top:3px;font-size:13.5px}
.slip .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.walltiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.walltile{display:grid;grid-template-columns:auto 1fr;gap:0 12px;border:2px solid var(--br);border-left-width:10px;background:var(--brpaper);padding:5px 10px 6px;color:var(--ink);box-shadow:4px 4px 0 var(--brtone);align-content:start}
.walltile:hover{background:var(--brtone)}
.walltile .t{grid-column:1 / -1;font:600 10.5px/1.3 var(--mono);color:var(--br);letter-spacing:.05em;text-transform:uppercase}
.walltile .wd{font:600 17px/1.2 var(--mono);color:var(--br)}
.walltile .wa{font-size:13.5px;line-height:1.25}
.walltile .rt{grid-column:1 / -1;margin-top:2px}
.walltile.ret{border-style:dashed;border-left-style:solid;border-left-color:var(--ink3);background:transparent;color:var(--ink2);box-shadow:none}
.walltile.ret .t,.walltile.ret .wd{color:var(--ink2)}
.cutopt{display:block;width:100%;border:1.5px solid var(--ink);padding:10px 14px;margin:0 0 8px;min-height:60px;background:var(--paper)}
.cutopt b{font:600 14px/1.3 var(--mono);display:block}
.cutopt small{display:block;font:400 14px/1.35 var(--serif);color:var(--ink2);margin-top:2px}
.cutopt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cutopt[aria-pressed="true"] small{color:var(--paper)}
.cutopt:hover{background:var(--tone)}.cutopt[aria-pressed="true"]:hover{background:var(--ink2)}
.arrive .q{font:italic 400 20px/1.3 var(--serif);margin:6px 0 12px}

/* ---------- CUT ---------- */
.cutview{position:relative}
.cuthead{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.cuthead h1{font:700 24px/1.05 var(--serif)}
.cuthead h1 small{font:italic 400 15px/1 var(--serif);color:var(--ink2);margin-left:8px}
.knower{display:inline-block;border:1.5px solid var(--ink);padding:1px 8px;margin-left:8px;font:500 10.5px/1.5 var(--mono);text-transform:none;letter-spacing:0;vertical-align:1px;background:var(--paper)}
.floor{font:400 11px/1.35 var(--mono);color:var(--ink2);max-width:44ch;text-align:right}
.planes{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.9fr);gap:12px}
.planes.wide{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) minmax(0,.85fr)}
.plane{border:2px solid var(--ink);padding:6px 11px 8px;min-height:0}
.plane h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.plane h2 small{display:block;font:italic 400 13px/1.3 var(--serif);text-transform:none;letter-spacing:0;color:var(--ink2)}
.plane.books{box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:10px 15px 8px}
.plane.notyet{border-style:dashed;position:relative}
.cds{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.cd{display:inline-block;width:30px;height:14px;border:1.5px dashed var(--ink);background:repeating-linear-gradient(90deg,transparent 0 4px,var(--line) 4px 5px)}
.slot{border:1.5px dashed var(--ink);padding:4px 8px;margin:5px 0;font-size:13.5px;line-height:1.3}
.slot .fl{display:block;margin:0 0 1px}
.noline{font:500 12px/1.35 var(--mono);margin-top:7px;padding-top:5px;border-top:1.5px dashed var(--ink)}
.since{margin-top:8px;border:2px solid var(--ink);background:var(--paper2);padding:4px 12px;display:flex;gap:14px;align-items:center}
.since h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.since p{font-size:13.5px;color:var(--ink2);flex:1;line-height:1.3}
.edge{position:absolute;top:-2px;bottom:-2px;right:-15px;width:26px;border:0;cursor:ew-resize;background:transparent;z-index:5}
.edge span{position:absolute;left:11px;top:0;bottom:0;border-left:2px dashed var(--ink)}
.edge:hover span,.edge:focus-visible span{border-left:4px dashed var(--red)}
.edge b{position:absolute;top:50%;left:0;transform:translateY(-50%);width:26px;height:44px;background:var(--paper);border:1.5px solid var(--ink);font:600 12px/44px var(--mono);text-align:center}
.tagline{font:italic 400 14px/1.3 var(--serif);color:var(--ink2)}
.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.rep{border:1.5px solid var(--ink);padding:3px 7px 4px;min-width:0;display:grid;grid-template-columns:8px minmax(0,1fr);gap:7px}
.rep.wide svg{max-height:none}
.rep .rb{min-width:0}
.rep h3{font:600 10.5px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.rep svg{display:block;width:100%;height:auto;max-height:118px}
.rep .cap{font:400 10.5px/1.3 var(--mono);color:var(--ink2)}
.eqn{font:500 12.5px/1.55 var(--mono)}
.eqn b{font-weight:600}
.gauge{position:relative;height:26px;margin:6px 4px 2px;border-top:2px solid var(--ink)}
.gauge i{position:absolute;top:-2px;width:0;height:12px;border-left:2px solid var(--ink)}
.gauge .q{position:absolute;top:-8px;width:14px;height:22px;margin-left:-7px;background:var(--ink)}
.gauge .ml{position:absolute;top:12px;font:500 9.5px/1.2 var(--mono);white-space:nowrap;transform:translateX(-50%)}
.dial{position:relative;height:22px;border:1.5px solid var(--ink);background:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px);margin:5px 0}
.dial i{position:absolute;left:0;top:0;bottom:0;background:var(--tone);border-right:3px solid var(--ink)}
.dial.mod i{background:repeating-linear-gradient(135deg,var(--ink) 0 1.3px,transparent 1.3px 4px)}
.cmpbox{border:1.5px dashed var(--ink);padding:5px 9px;margin:6px 0;font-size:13px}
.cmpbox .btn{margin-top:4px}
.derived{border:1.5px solid var(--ink);padding:6px 9px;margin:6px 0;font-size:13px;background:var(--paper)}
.dt{width:100%;border-collapse:collapse;font:400 12px/1.3 var(--mono);margin:4px 0}
.dt th,.dt td{border:1.5px solid var(--ink);padding:2px 6px;text-align:left;vertical-align:top;font-weight:400}
.dt th{font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:10.5px;background:var(--paper2)}
.dt td.hl{background:var(--tone)}
.dt td.na{border-style:dashed;color:var(--ink2)}
.branch .dt th,.branch .dt td{border-color:var(--br)}
.branch .dt th{background:var(--brtone)}
.dt .late{font-weight:600}
.dt .miss{text-decoration:line-through;text-decoration-thickness:1.5px}


/* ---------- system-specific figures ---------- */
.rwy{position:relative;height:46px;margin:14px 4px 6px}
.rwy .a{position:absolute;top:8px;height:16px;background:var(--tone);border:1.5px solid var(--ink)}
.rwy .b{position:absolute;top:8px;height:16px;border:1.5px dashed var(--ink);border-left:0}
.rwy .tk{position:absolute;top:2px;height:28px;border-left:2px solid var(--ink)}
.rwy .tl{position:absolute;top:32px;font:500 9px/1.1 var(--mono);transform:translateX(-50%);white-space:nowrap}
.svy{position:relative;border:1.5px solid var(--ink);padding:4px 8px 30px;margin:4px 0 6px;background:var(--paper)}
.svy .tr{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.svy .nm{font:500 10.5px/1.2 var(--mono)}
.svy .ln{position:relative;height:14px;border-bottom:1.5px dashed var(--ink)}
.svy .cutm{position:absolute;top:0;bottom:-2px;border-left:2px solid var(--ink)}
.svy .rl{position:absolute;top:0;bottom:-2px;border-left:2px dotted var(--ink)}
.svy .ax{position:absolute;left:148px;right:8px;bottom:12px;height:12px}
.svy .ax span{position:absolute;font:500 9px/1 var(--mono);transform:translateX(-50%);white-space:nowrap}
.svy .key{position:absolute;left:8px;bottom:1px;font:400 9.5px/1.2 var(--mono);color:var(--ink2)}

/* ---------- SEAT ---------- */
.seat h1{font:700 24px/1.1 var(--serif)}
.folded{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink);padding:7px 14px;margin:6px 0 4px;font-size:13.5px}
.folded .fi{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.folded .fi .sw{min-height:18px;height:18px;width:7px;align-self:auto}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px}
.actbtn{display:block;width:100%;border:1.5px solid var(--ink);padding:8px 12px;margin:0 0 8px;background:var(--paper);min-height:60px}
.actbtn b{display:block;font:700 14.5px/1.3 var(--serif)}
.actbtn small{display:block;font:400 11.5px/1.35 var(--mono);color:var(--ink2);margin-top:2px}
.actbtn:hover{background:var(--tone)}
.actbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.actbtn[aria-pressed="true"] small{color:var(--paper)}
.seatblk{border:2px solid var(--ink);padding:6px 12px;margin-bottom:7px}
.seatblk.set{box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:9px 15px}
.seatblk.unset{border-style:dashed}
.seatblk h3{font:600 12px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.seatblk .why{font-size:12.5px;color:var(--ink2);margin:1px 0 5px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .btn{min-height:38px;padding:4px 10px}
.decl{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.assump{border:1.5px solid var(--ink);padding:6px 10px;margin:8px 0;font-size:13px}
.assump li{margin:2px 0;display:flex;gap:8px;align-items:stretch}
.assump li .sw{min-height:16px;width:8px}
ul.plain{margin:0;padding-left:18px}
.assump ul{list-style:none;padding:0;margin:0}

/* ---------- BRANCH ---------- */
.bview{display:grid;gap:8px}
.frames{display:grid;grid-template-columns:minmax(0,.94fr) minmax(0,1.06fr);gap:16px}
.frame{padding:7px 14px 8px;position:relative;min-width:0}
.frame.rec{border:2px solid var(--ink);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:10px 18px 8px}
.frame.branch{border:2px solid var(--br);border-left:12px solid var(--br);background:var(--brpaper);color:var(--ink);box-shadow:5px 5px 0 var(--brtone)}
.frame h2{font:600 12px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.frame.branch h2{color:var(--br)}
.clk{display:flex;align-items:baseline;gap:10px;margin:2px 0 3px;flex-wrap:wrap}
.clk .d{font:600 18px/1.1 var(--mono)}
.frame.branch .clk .d{color:var(--br)}
.bstamp{border:2px solid var(--br);background:var(--brpaper);padding:4px 9px;margin:3px 0 4px;font:500 11.5px/1.4 var(--mono);color:var(--ink)}
.bstamp b{color:var(--br);font-weight:600}
.asm{margin:2px 0 3px;font-size:12.5px}
.asm summary{cursor:pointer;font:500 10.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;min-height:22px;padding:2px 0}
.asm ul{list-style:none;padding:0;margin:2px 0 4px}
.asm li{display:flex;gap:8px;align-items:stretch;margin:2px 0}
.asm li .sw{min-height:15px}
.pin{display:inline-block;border:1.5px solid var(--br);padding:0 6px;font-weight:600;background:var(--paper)}
.shut{margin-top:5px;height:20px;background:repeating-linear-gradient(180deg,var(--red) 0 6px,var(--red2) 6px 8px);display:flex;align-items:center;justify-content:center}
.shut span{background:var(--paper);color:var(--red);border:1.5px solid var(--red);padding:0 8px;font:600 10px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.mini{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}
.mini .fl{flex:none;width:76px}
.mini.dsh{border:1.5px dashed var(--ink);padding:3px 7px;margin:4px 0}
.paceb{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:4px 0}
.pair .rep{grid-template-columns:8px minmax(0,1fr)}
.pair .rep svg{max-height:100px}
.lower{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:14px;align-items:start}
.lower .marks{grid-template-columns:minmax(0,1fr)}
.seambar{border-top:3px double var(--ink);padding-top:5px;position:relative}
.seambar>.stitch{position:absolute;left:0;right:0;top:-6px;border-top:2px dashed var(--ink)}
.seambar h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.seambar h2 small{font:italic 400 13px var(--serif);text-transform:none;letter-spacing:0;color:var(--ink2)}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark{display:grid;grid-template-columns:1fr 100px 1fr;border:1.5px solid var(--ink);min-height:78px}
.mark .side{padding:5px 9px;font-size:12.5px;line-height:1.3;min-width:0}
.mark .side.r{border-right:1.5px solid var(--ink)}
.mark .side.b{background:var(--brpaper);border-left:2px solid var(--br);color:var(--ink)}
.mark .side .lbl{display:block;margin-bottom:1px}
.mark .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center;background:var(--paper2)}
.verd{font:600 10.5px/1.15 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 3px;border:2px solid var(--ink);background:var(--paper);width:100%;text-align:center}
.verd small{display:block;font-weight:400;letter-spacing:0;text-transform:none;font-size:10px}
.verd.held{border-style:solid;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
.verd.diverged{background:repeating-linear-gradient(135deg,var(--paper) 0 4px,var(--tone) 4px 6px)}
.verd.impossible{border-style:dashed;clip-path:polygon(0 8%,8% 0,16% 10%,26% 0,36% 8%,46% 0,58% 10%,70% 0,82% 8%,92% 0,100% 10%,100% 100%,92% 92%,82% 100%,70% 90%,58% 100%,46% 92%,36% 100%,26% 90%,16% 100%,8% 92%,0 100%);padding-top:7px;padding-bottom:7px}
.verd.redeclare{border-style:dashed;background:transparent}
.verd.unknown{border-style:dashed;background:transparent;color:var(--ink2);border-width:1.5px}
.mid .mn{font:400 9.5px/1.2 var(--mono);color:var(--ink2)}
.marks.empty{display:block;font:italic 400 14px/1.35 var(--serif);color:var(--ink2);border:1.5px dashed var(--ink);padding:10px 14px;background:var(--paper)}

/* ---------- SHEETS ---------- */
.scrim{position:absolute;inset:0;background:rgba(240,238,228,.62);z-index:50}
.sheet{position:absolute;top:0;right:0;bottom:0;z-index:60;width:min(660px,96%);background:var(--paper);border-left:4px double var(--ink);box-shadow:-8px 0 0 var(--line);padding:8px 18px 10px;overflow:auto}
.sheet.wide{width:min(1040px,98%)}
.sheet h1{font:700 21px/1.1 var(--serif)}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.since-i{padding:3px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:104px 1fr;gap:10px}
.since-i .dt2{font:500 11px/1.35 var(--mono);color:var(--ink2)}
.since-i .hand{display:flex;gap:5px;align-items:center;font:600 9.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.since-i .hand .sw{min-height:14px;height:14px;align-self:auto;width:7px}
.since-i.fact .tx{font:400 12.5px/1.4 var(--mono)}
.since-i.corr .tx{font:italic 400 14px/1.35 var(--serif);border-left:3px double var(--ink);padding-left:8px}
.since-i.arg .tx{font:italic 400 14px/1.4 var(--serif);border-left:5px solid var(--ink);padding-left:8px;background:linear-gradient(90deg,var(--paper2),transparent)}
.since-i .src{font:400 10.5px/1.3 var(--mono);color:var(--ink3);margin-top:1px}
.backs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.backcol{padding:8px 12px 10px;min-height:250px}
.backcol h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.backcol .k{font:italic 400 13px/1.3 var(--serif);color:var(--ink2);margin:1px 0 6px}
.bc-trail{border:1.5px dashed var(--ink3)}
.bc-trail li{font-family:var(--mono);font-size:11.5px;padding:2px 0;border-bottom:1px dashed var(--ink3);list-style:none}
.bc-trail ul,.bc-rec ul,.bc-acts ul{margin:4px 0 8px;padding:0}
.bc-trail li.cur{font-weight:600;background:var(--tone)}
.bc-rec{border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink)}
.bc-rec li{font:400 12px/1.35 var(--serif);padding:2px 0;list-style:none;border-bottom:1px solid var(--line)}
.bc-rec li.cur{font-weight:700;background:var(--tone)}
.bc-rec li.hid{color:var(--ink3);font-family:var(--mono);font-size:11px}
.bc-acts{border:2px solid var(--br);background:var(--brpaper);--kc:var(--br)}
.bc-acts li{list-style:none;padding:3px 0;border-bottom:1px solid var(--br);font-size:13px}
.bc-acts li em{font:italic 400 15px/1.2 var(--serif);color:var(--br)}
.whyl{position:relative;padding:5px 0 5px 22px;border-left:2px solid var(--ink);margin-left:8px}
.whyl::before{content:"";position:absolute;left:-2px;top:14px;width:16px;border-top:2px solid var(--ink)}
.whyl.dash{border-left-style:dashed}
.whyl.dash::before{border-top-style:dashed}
.whyl .t{font-size:14px;display:flex;gap:8px;align-items:stretch}
.whyl .t .sw{min-height:16px}
.whyl .m{font:400 11px/1.3 var(--mono);color:var(--ink2);margin-top:1px}
.whyl .id{font:600 10.5px/1 var(--mono);border:1.5px solid var(--ink);padding:1px 5px;margin-right:6px;display:inline-block;align-self:flex-start}

/* ---------- COLLAPSE REPORT ---------- */
.rtab{display:flex;gap:0;border:1.5px solid var(--ink);margin:6px 0;flex-wrap:wrap}
.rtab .btn{border:0;border-right:1.5px solid var(--ink);min-height:40px;flex:1}
.rtab .btn:last-child{border-right:0}
.tally{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.tally span{font:600 12px/1.2 var(--mono);border:2px solid var(--ink);padding:3px 9px;background:var(--paper)}
.cr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 12px;padding:5px 0;border-bottom:1px solid var(--line)}
.cr .el{font:600 12px/1.3 var(--mono)}
.cr .el small{display:block;font:400 10.5px/1.3 var(--mono);color:var(--ink2)}
.cr .tx{font-size:13.5px;line-height:1.35}
.cr .ev{font:400 10.5px/1.3 var(--mono);color:var(--ink3);margin-top:2px}
.vd{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.1em;padding:3px 7px;margin-right:6px;border:2px solid var(--ink);background:var(--paper);vertical-align:1px}
.vd.HELD{box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
.vd.BENT{border-style:dashed;background:repeating-linear-gradient(135deg,var(--paper) 0 4px,var(--tone) 4px 6px)}
.vd.BROKE{border-style:dotted;border-width:3px;background:var(--ink);color:var(--paper)}
.mx{width:100%;border-collapse:collapse;font:400 11px/1.3 var(--mono);margin:6px 0}
.mx th,.mx td{border:1.5px solid var(--ink);padding:3px 6px;text-align:left;font-weight:400}
.mx th{background:var(--paper2);font-weight:600}
.mx td.HELD{box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
.mx td.BENT{background:repeating-linear-gradient(135deg,var(--paper) 0 4px,var(--tone) 4px 6px)}
.mx td.BROKE{background:var(--ink);color:var(--paper);font-weight:600}

@media (prefers-reduced-motion:no-preference){
  .flash{animation:fl .7s ease-out 1}
  @keyframes fl{0%{background:var(--ink);color:var(--paper)}100%{background:var(--brtone);color:var(--ink)}}
  .frame.born{animation:bornin .6s cubic-bezier(.2,.8,.2,1) 1}
  @keyframes bornin{0%{transform:translateX(34px);opacity:0}100%{transform:none;opacity:1}}
  .mark.new{animation:stampin .55s cubic-bezier(.2,.9,.3,1.2) 1}
  @keyframes stampin{0%{transform:translateY(-10px) scale(1.04);opacity:0}100%{transform:none;opacity:1}}
}
.xs{display:none}
@media (max-width:1300px){
  .status span:nth-of-type(2){display:none}
  .rail{grid-template-columns:250px 1fr 290px}
  .now h1,.arrive h1{font-size:26px}
  #stage{padding:8px 16px}
  .mast{padding:4px 16px 4px}
  .tb{padding:5px 8px;font-size:11.5px}
  .brand small{display:none}
  .fact.hero .fv{font-size:24px}
}
@media (max-width:1100px){
  .xl{display:none}.xs{display:inline}
  .lower{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1100px),(max-height:860px){
  .rail{height:104px;grid-template-columns:210px 1fr 240px}
  .rail .lbl{display:none}
  .slab{font-size:16px;padding:3px 8px}
  .win .slats{height:20px}

  .win .bot{font-size:9.5px;padding-top:1px}

  .rline{top:48px}.rtick{top:41px}.rnow{top:34px}.outc{top:37px}

  .door,.doorstatic{font-size:9.5px;min-height:38px;padding:2px 5px}
  .status{padding:3px 14px;font-size:10px}
  .tb{min-height:34px;font-size:11px;padding:4px 7px}
  .systab{min-height:30px;padding:3px 8px;font-size:11px}
  .btn{min-height:40px;padding:6px 10px}
  .btn.sm{min-height:34px}
}
@media (min-width:761px) and (max-width:1100px),(min-width:761px) and (max-height:700px){
  .mast{display:flex;align-items:center;gap:10px;padding:4px 14px}
  .r1,.r2{display:contents}
  .brand{font-size:20px;order:1}.brand small{display:none}
  .addr{order:2;flex:1;font-size:11.5px}.addr .lbl{display:none}
  .systabs{order:3}.tools{order:4;margin-left:0;gap:4px}
  .chip{max-width:150px;overflow:hidden;text-overflow:ellipsis;padding:3px 6px;font-size:10.5px}
  .tb{min-height:32px}
  .cuthead h1{font-size:20px}
  .floor{display:none}
}
@media (min-width:761px) and (max-height:700px){
  .pair{display:none}
  .frame.rec,.frame.branch{padding-top:5px;padding-bottom:5px}
}
@media (max-width:760px){
  .xs{display:inline}.xl{display:none}
  body::before{display:none}
  #app{padding-left:0}
  .mast{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;padding:4px 10px}
  .r1,.r2{display:contents}
  .brand{font-size:19px;grid-area:1/1}.brand small{display:none}
  .systabs{grid-area:1/2;justify-self:end}
  .systab{min-height:30px;padding:2px 7px;font-size:11px}
  .tools{grid-area:2/1/3/3;margin-left:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}
  .tools .tb,.tools .chip{min-width:0;min-height:32px;padding:2px 3px;font-size:10.5px;text-align:center;white-space:normal;line-height:1.1;justify-content:center}
  .tools .chip{grid-column:1/-1;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .tb .mono{display:none}
  .addr{grid-area:3/1/4/3;font-size:10px;gap:5px}.addr .lbl{display:none}
  #stage{padding:8px 10px}
  .now,.arrive,.planes,.planes.wide,.cols2,.frames,.marks,.backs,.pair,.walltiles,.lower{grid-template-columns:minmax(0,1fr)}
  .repgrid{grid-template-columns:1fr 1fr;gap:5px}
  .rep{padding:2px 4px;gap:4px}
  .rep h3{font-size:9.5px}
  .eqn{font-size:10.5px}.gauge .ml{font-size:8px}
  .pair{grid-template-columns:1fr 1fr}
  .now h1,.arrive h1{font-size:23px}
  .cuthead{flex-direction:column;align-items:flex-start;gap:4px}
  .cuthead h1{font-size:20px}
  .floor{display:none}
  .since{flex-direction:column;align-items:flex-start;gap:4px}
  .mark{grid-template-columns:1fr}
  .mark .mid{flex-direction:row;padding:4px 8px}
  .mark .side.r{border-right:0;border-bottom:1.5px solid var(--ink)}
  .cr{grid-template-columns:1fr}
  .sheet,.sheet.wide{width:100%}
  .edge{right:-4px}
  .fact.hero .fv{font-size:22px}
  .bview{display:flex;flex-direction:column;gap:8px}
  .frames{display:contents}
  .frame.branch{order:1}.lower{order:2;display:flex;flex-direction:column}.lower .seambar{order:-1}.frame.rec{order:3}
  .dock{gap:6px}
  .dock .btn{flex:1 1 44%;min-height:38px;padding:4px 6px;font-size:11px;justify-content:center}
  .dock .btn.pri{flex:1 1 100%;margin-left:0 !important}
  .rail{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:30px auto;height:auto;padding:0}
  .rail>div{padding:3px 8px !important;border:0 !important}
  .rail .zB{grid-column:1/-1;grid-row:1;height:30px;border-bottom:1.5px solid var(--ink) !important;padding:0 !important}
  .rail .zA{grid-column:1;grid-row:2;border-right:1.5px solid var(--ink) !important}
  .rail .zC{grid-column:2;grid-row:2;padding:3px 6px !important}

  .slab{font-size:15px;padding:3px 7px;margin:2px 0}

  .rline{top:16px}.rtick{top:9px;height:14px}.rnow{top:5px;height:22px}.rtl,.door,.doorstatic,.outc{display:none}
  .win{height:84px}.win .bot{font-size:9px;line-height:1.2}
  .open-win{padding:3px 6px;gap:2px}.open-win div div:last-child{display:none}

}

<body data-g="chem">
<div id="app">
  <header class="mast" id="mast"></header>
  <main id="stage" tabindex="-1" aria-label="Stage"></main>
  <div class="legend" id="legend" aria-label="Texture legend"></div>

    <div class="rail" id="rail" aria-label="Horizon rail"></div>
    <div class="status" id="status"></div>
  </footer>
</div>
<div class="sr" aria-live="polite" id="live"></div>
<script>
(function () {
'use strict';
var FX = window.BOW_FIXTURE, DOM = {}, ORDER = ['chem', 'supply', 'eco'];

/* ================= helpers ================= */
function p2(n){ return (n < 10 ? '0' : '') + n; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fx(n, d){ return Number(n).toFixed(d == null ? 3 : d); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var RANK = { OBSERVED: 6, RECORDED: 5, COMPUTED: 4, MODELED: 3, AUTHORED: 2, GENERATED: 1, UNKNOWN: 0 };
function weakest(ks){ var w = 'OBSERVED'; ks.forEach(function (k) { if (RANK[k] < RANK[w]) w = k; }); return w; }
/* authored fact (prototype-illustrative) */
function AF(v, k, src, note, inputs){ return { v: v, k: k || 'AUTHORED', src: src || 'this prototype · illustrative', asOf: null, verify: false, note: note || null, inputs: inputs || null }; }
/* derived fact: wears the kind of its weakest input (canon: kind propagation) */
function DV(v, inputs, src, note, force){
  var ks = inputs.map(function (i) { return i.k; }), wk = weakest(ks);
  if (RANK[wk] > RANK.COMPUTED) wk = 'COMPUTED';
  return { v: v, k: force || wk, src: src || 'derived here', asOf: null, verify: inputs.some(function (i) { return i.verify; }), note: note || null,
    inputs: inputs.map(function (i) { return { n: i.n || i.label || 'input', k: i.k }; }) };
}
function hole(f, txt){ return { v: null, k: 'UNKNOWN', src: null, asOf: null, verify: true, note: txt || '[verify]' }; }
function howOf(f){
  return f.k + ' · ' + (f.src || 'no source') + (f.asOf ? ' · as of ' + f.asOf : ' · undated') + (f.verify ? ' · verify' : '') +
    (f.inputs ? ' · weakest input wins: ' + f.inputs.map(function (i) { return i.n + ' ' + i.k; }).join(', ') : '') + (f.note ? ' — ' + f.note : '');
}
function fact(f, label, val, cls, note, after){
  var isHole = (f.v == null && val == null);
  var v = isHole ? '<span class="hole">' + esc(f.note || '[verify]') + '</span>' : (val != null ? val : esc(f.v));
  var fl = /flash/.test(cls || ''), fc = (cls || '').replace('flash', '').trim();
  var vc = f.k === 'COMPUTED' ? ' tone' : f.k === 'MODELED' ? ' mod' : '';
  return '<div class="fact ' + fc + '"><i class="sw k-' + f.k + '" aria-hidden="true"></i><div class="fb"><span class="fl">' + label + '</span><span class="fv' + vc + (fl ? ' flash' : '') + '">' + v + '</span>' + (after || '') +
    (note ? '<span class="rt" style="display:block">' + note + '</span>' : '') + '<span class="how">' + esc(howOf(f)) + '</span></div></div>';
}
function bar(k){ return '<i class="sw k-' + k + '" aria-hidden="true"></i>'; }

/* ================= state (per-system fields are stashed on switch) ================= */
var PS = ['view', 'cutId', 'refusal', 'observer', 'hindsight', 'seat', 'branches', 'activeId', 'nextN', 'acts', 'trail', 'fwd', 'doorOpen', 'following', 'derived', 'recPtr', 'leftAt', 'stats'];
var S = { dom: 'chem', overlay: null, whyOf: 'cut', tog: { how: false, real: false }, tick: 0, flash: false, newMarks: [], born: null, holder: true, crTab: 'chem', hash: '…' };
var STASH = {};
function DM(){ return DOM[S.dom]; }
function zeroStats(){ return { recRef: 0, recOk: 0, modRef: 0, modOk: 0, decl: 0, unk: 0 }; }
function fresh(id){
  return { stats: zeroStats(), view: 'now', cutId: DOM[id].defaultCut, refusal: null, observer: { asked: false, through: null }, hindsight: { declared: false },
    seat: { act: null, council: {} }, branches: [], activeId: null, nextN: 1, acts: [], trail: [], fwd: [], doorOpen: null, following: false, derived: false, recPtr: -1, leftAt: null };
}
function pick(o){ var r = {}; PS.forEach(function (k) { r[k] = o[k]; }); return r; }
function loadSys(id, st){ PS.forEach(function (k) { S[k] = st[k]; }); if (!S.stats) S.stats = zeroStats(); S.dom = id; document.body.setAttribute('data-g', id); }
function cut(){ return DM().cuts[S.cutId]; }
function actBranch(){ for (var i = 0; i < S.branches.length; i++) if (S.branches[i].id === S.activeId) return S.branches[i]; return null; }
var FL = false;
var TT0 = 14 * 3600 + 3 * 60 + 20;
function clockStr(){ var t = TT0 + S.tick; return p2(Math.floor(t / 3600) % 24) + ':' + p2(Math.floor(t / 60) % 60) + ':' + p2(t % 60); }

/* ================= the two logs: TRAIL (private, unhashed) and RECORD (signed acts, SHA-256) ================= */
function ctx(){
  var b = actBranch(), D = DM();
  if (S.view === 'branch' && b) return { clock: 'branch ' + b.n + ' · ' + D.fmt(b.t), hist: 'branch ' + b.n, who: 'you · seat ' + D.seatName };
  if (S.view === 'cut') return { clock: 'cut ' + D.fmt(cut().t) + ' (stopped)', hist: 'record', who: 'you · observer' };
  if (S.view === 'seat') return { clock: 'cut ' + D.fmt(cut().t) + ' (stopped)', hist: 'record', who: 'you · seat ' + D.seatName };
  return { clock: 'Reality NOW', hist: 'record', who: 'you · observer' };
}
function sign(kind, text, label){
  var c = ctx();
  S.acts.push({ n: S.acts.length + 1, kind: kind, text: text, clock: c.clock, hist: c.hist, who: c.who, label: label || null });
  paintHash();
}
function paintHash(){
  try {
    var data = new TextEncoder().encode(JSON.stringify(S.acts.map(function (e) { return [e.n, e.kind, e.text, e.clock, e.hist, e.who]; })));
    var dom = S.dom, n = S.acts.length;
    crypto.subtle.digest('SHA-256', data).then(function (buf) {
      var h = Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      if (dom !== S.dom) return;
      S.hash = n ? h : 'empty record';
      S.hashFull = h;
      var el = document.querySelectorAll('.js-hash'); for (var i = 0; i < el.length; i++) el[i].textContent = n ? h.slice(0, 16) + '…' : 'empty';
    });
  } catch (e) { S.hash = 'not available here'; }
}
function trailPush(label){
  var last = S.trail[S.trail.length - 1];
  var e = { view: S.view, label: label, sig: S.acts.length, cutId: S.cutId, branchId: S.activeId };
  if (last && last.label === label && last.branchId === e.branchId) return;
  S.trail.push(e); S.fwd = [];
}
function go(view, label){
  if (S.view === 'now' && view !== 'now') S.leftAt = S.tick;
  S.view = view; S.overlay = null; if (view !== 'now') S.doorOpen = null;
  trailPush(label);
}
function announce(msg){ var el = document.getElementById('live'); el.textContent = ''; setTimeout(function () { el.textContent = msg; }, 40); }
function refuse(rule, text, extra){ S.refusal = { rule: rule, text: text, view: S.view }; if (extra) for (var k in extra) S.refusal[k] = extra[k]; announce('Refused. ' + rule + ' ' + text); }

/* ================= address in the URL ================= */
function bcode(b){
  return b.act + ';' + Object.keys(b.council).sort().map(function (s) { var c = b.council[s]; return s + ':' + c.mode + (c.v ? ':' + c.v : ''); }).join(',');
}
function addrString(){
  var b = actBranch(), q = ['s=' + S.dom];
  var v = S.view === 'seat' ? 'cut' : S.view;
  if (v === 'branch' && !b) v = 'now';
  q.push('v=' + v);
  if (v === 'cut' || v === 'arrive' || v === 'branch') q.push('c=' + (v === 'branch' ? b.cutId : S.cutId));
  if (v === 'branch') { q.push('b=' + encodeURIComponent(bcode(b))); q.push('t=' + b.t); q.push('h=' + encodeURIComponent(b.hind)); if (b.extra) q.push('x=' + b.extra.t); var rs = Object.keys(b.redecl || {}); if (rs.length) q.push('r=' + rs.join(',')); }
  return q.join('&');
}
function writeHash(){ try { history.replaceState(null, '', '#' + addrString()); } catch (e) {} persist(); }
function persist(){
  try {
    STASH[S.dom] = pick(S);
    var all = {}; ORDER.forEach(function (k) { if (STASH[k]) all[k] = STASH[k]; });
    sessionStorage.setItem('crosscut.v1', JSON.stringify({ addr: addrString(), dom: S.dom, all: all }));
  } catch (e) {}
}
function parseQ(h){ var q = {}; h.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); }); return q; }
function restore(){
  var h = location.hash || ''; if (!h || h.length < 3) return false;
  var q = parseQ(h); if (!q.s || !DOM[q.s]) return false;
  var stored = null;
  try { stored = JSON.parse(sessionStorage.getItem('crosscut.v1') || 'null'); } catch (e) {}
  if (stored && stored.all) { ORDER.forEach(function (k) { if (stored.all[k]) STASH[k] = stored.all[k]; }); }
  if (stored && stored.addr === h.replace(/^#/, '') && stored.all && stored.all[q.s]) {     /* same viewpoint, same tab: your own state comes back */
    loadSys(q.s, stored.all[q.s]); S.holder = true; return true;
  }
  /* someone else's address: a viewpoint only. Rebuild what it names; the seat is not granted. */
  loadSys(q.s, fresh(q.s)); var D = DM();
  if (q.c && D.cuts[q.c]) S.cutId = q.c;
  S.holder = true;
  if (q.v === 'branch' && q.b) {
    var parts = q.b.split(';'), actId = parts[0], council = {};
    if (D.acts[actId]) {
      (parts[1] || '').split(',').forEach(function (kv) { if (!kv) return; var a = kv.split(':'); council[a[0]] = a[1] === 'declare' ? { mode: 'declare', v: a[2] } : { mode: a[1] }; });
      var nb = { id: 'b1', n: 'b1', cutId: S.cutId, t: cut().t, act: actId, council: council, hind: q.h || 'none', status: 'walking', extra: (q.x != null && q.x !== '') ? { t: parseFloat(q.x) } : null, redecl: {} };
      (q.r || '').split(',').forEach(function (s) { if (s) nb.redecl[s] = true; });
      S.branches.push(nb); S.activeId = 'b1'; S.nextN = 2; S.view = 'branch'; S.holder = false;
      sign('keep', 'Kept (rebuilt from an address): your branch b1 — “' + D.acts[actId].label + '” · diverged ' + D.fmt(cut().t) + ' · hindsight: ' + nb.hind + ' · coupling: PINNED', D.acts[actId].label);
      var t = parseFloat(q.t); if (!isNaN(t) && t > nb.t) { nb.t = Math.min(t, D.limit(cut())); sign('advance', 'Advanced branch b1 to ' + D.fmt(nb.t) + ' (rebuilt from an address)'); }
      trailPush('Address · branch b1 (viewpoint)');
      return true;
    }
  }
  S.view = (q.v === 'cut') ? 'cut' : (q.v === 'arrive' ? 'arrive' : 'now');
  trailPush('Address · ' + S.view);
  return true;
}

/* ================= branch + seam (generic; the domain supplies the meaning) ================= */
function hindStamp(){ return S.observer.asked ? 'through ' + DM().nowLabel : S.hindsight.declared ? 'self-declared' : 'none'; }
function seamOf(b, DD){
  var D = DD || DM(), c = D.cuts[b.cutId], out = [];
  D.events.forEach(function (ev) { if (ev.grade && ev.t > c.t && ev.t <= b.t && (!ev.applies || ev.applies(b))) out.push(ev.grade(b)); });
  return out;
}
function arrivedEv(b){ var D = DM(), c = D.cuts[b.cutId]; return D.events.filter(function (ev) { return ev.t > c.t && ev.t <= b.t; }); }
function needSeats(actId, council){
  var D = DM(); return D.need(actId, council).filter(function (s) { var v = council[s]; return !v || (v.mode === 'declare' && !v.v); });
}

/* generic line plot for the other two domains: record in ink, branch in its own ink, the sealed span drawn empty */
function plotXY(o){
  var w = o.w || 330, h = o.h || 110, ml = o.ml || 34, mr = 8, mt = 8, mb = 18, x0 = o.x0, x1 = o.x1, ym = o.ymax;
  function X(v){ return ml + (v - x0) / (x1 - x0) * (w - ml - mr); }
  function Y(v){ return h - mb - Math.max(0, Math.min(v, ym)) / ym * (h - mt - mb); }
  var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(o.aria) + '"><line x1="' + ml + '" y1="' + (h - mb) + '" x2="' + (w - mr) + '" y2="' + (h - mb) + '" stroke="currentColor" stroke-width="1.5"/><line x1="' + ml + '" y1="' + mt + '" x2="' + ml + '" y2="' + (h - mb) + '" stroke="currentColor" stroke-width="1.5"/>';
  (o.xticks || []).forEach(function (t) { s += '<line x1="' + X(t.x) + '" y1="' + (h - mb) + '" x2="' + X(t.x) + '" y2="' + (h - mb + 3) + '" stroke="currentColor"/><text x="' + X(t.x) + '" y="' + (h - 5) + '" text-anchor="middle" style="font:8.5px var(--mono)" fill="currentColor">' + esc(t.l) + '</text>'; });
  s += '<text x="' + (ml - 3) + '" y="' + (mt + 4) + '" text-anchor="end" style="font:8.5px var(--mono)" fill="currentColor">' + esc(o.ylab || ym) + '</text><text x="' + (ml - 3) + '" y="' + (h - mb + 3) + '" text-anchor="end" style="font:8.5px var(--mono)" fill="currentColor">0</text>';
  if (o.sealed != null) s += '<rect x="' + X(o.sealed) + '" y="' + mt + '" width="' + Math.max(0, w - mr - X(o.sealed)) + '" height="' + (h - mb - mt) + '" fill="none" stroke="currentColor" stroke-dasharray="4 3" stroke-width="1.5"/><text x="' + ((X(o.sealed) + w - mr) / 2) + '" y="' + (h / 2) + '" text-anchor="middle" style="font:9.5px var(--mono)" fill="currentColor">not yet · sealed</text>';
  (o.vlines || []).forEach(function (v) { s += '<line x1="' + X(v.x) + '" y1="' + mt + '" x2="' + X(v.x) + '" y2="' + (h - mb) + '" stroke="' + (v.col || 'currentColor') + '" stroke-dasharray="' + (v.dash || '2 3') + '"/><text x="' + (X(v.x) + 2) + '" y="' + (mt + 8 + (v.dy || 0)) + '" style="font:8.5px var(--mono)" fill="' + (v.col || 'currentColor') + '">' + esc(v.label) + '</text>'; });
  o.series.forEach(function (q) {
    var d = ''; q.pts.forEach(function (p, i) { d += (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); });
    if (!d) return;
    s += '<path d="' + d + '" fill="none" stroke="' + q.col + '" stroke-width="' + q.w + '"' + (q.dash ? ' stroke-dasharray="' + q.dash + '"' : '') + '/>';
    if (q.label) { var lp = q.pts[q.pts.length - 1]; s += '<text x="' + Math.min(w - mr - 2, X(lp[0]) + 3) + '" y="' + (Y(lp[1]) + (q.ly || 0)) + '" text-anchor="' + (X(lp[0]) > w - 60 ? 'end' : 'start') + '" style="font:9px var(--mono)" fill="' + q.col + '">' + esc(q.label) + '</text>'; }
  });
  return s + '</svg>';
}
function repBox(name, kind, body, cap, capc, how, cls){
  return '<div class="rep' + (cls ? ' ' + cls : '') + '" data-cap="PROPOSED" data-capc="' + esc(capc || 'one representation of the one state') + '" data-cost="NO AI REQUIRED"><i class="sw k-' + kind + '" aria-hidden="true"></i><div class="rb"><h3>' + name + '</h3>' + body + (cap ? '<div class="cap">' + cap + '</div>' : '') + '<span class="how">' + esc(how || kind) + '</span></div></div>';
}

/* ================= ACT: the one mutator ================= */
function needHolder(what){
  if (S.holder) return true;
  refuse('An address is a viewpoint, not a seat.', 'You opened branch ' + (actBranch() || { n: '' }).n + ' from an address. You see what an observer may see. ' + what + ' needs the seat, and authority only arrives as an Offer redeemed by a present person.', { backs: true, adv: true });
  return false;
}
function act(kind, p){
  p = p || {}; S.refusal = null;
  var b = actBranch(), D = DM();
  switch (kind) {
  case 'toggle':
    S.tog[p.t] = !S.tog[p.t];
    if (p.t === 'how') document.body.classList.toggle('showhow', S.tog.how);
    trailPush((S.tog[p.t] ? 'On · ' : 'Off · ') + ({ how: 'How do we know?', real: 'What’s real?' })[p.t]);
    announce((S.tog[p.t] ? 'On: ' : 'Off: ') + ({ how: 'How do we know', real: 'What is real' })[p.t]); break;
  case 'switch-sys':
    if (p.d === S.dom) break;
    STASH[S.dom] = pick(S);
    loadSys(p.d, STASH[p.d] || fresh(p.d)); S.overlay = null;
    trailPush('System · ' + DM().tab);
    announce('Now in ' + DM().tab + '. Same grammar, different nouns.'); break;
  case 'open-door': S.doorOpen = p.door; refuse('You cannot enter a scheduled moment.', 'Acts close here. Nothing has happened at this door, and no model ran, so its outcome stays empty.'); break;
  case 'close-door': S.doorOpen = null; break;
  case 'follow': S.following = true; sign('follow', 'Followed ' + D.sysName + ': keep an arrival for the scheduled door'); announce('Following. You will be told when Reality arrives at this door.'); break;
  case 'arrive': go('arrive', 'Door · ' + D.door.title); announce('At the door. Choose a cut.'); break;
  case 'pick-cut': S.cutId = p.a; announce('Cut chosen: ' + D.cuts[p.a].short); break;
  case 'stand': S.derived = false; go('cut', 'Cut · ' + D.fmt(cut().t)); announce('Standing at ' + D.fmt(cut().t) + '. Four planes: books, desk, not yet, since. Clocks stopped. Reality is shuttered at the edge.'); break;
  case 'later':
    trailPush('Seal test · Later refused');
    refuse('Nobody at this desk could know what comes next.', D.laterText(cut()), { observerOffer: true }); break;
  case 'ask-observer':
    if (!S.observer.asked) { S.observer = { asked: true, through: D.nowLabel }; trailPush('Ledger · Since opened'); announce('Ledger mark added: seen through ' + D.nowLabel + '. Since is open.'); }
    S.overlay = 'since'; break;
  case 'derive': S.derived = !S.derived; trailPush('Desk · worked it out'); break;
  case 'close-overlay': S.overlay = null; break;
  case 'declare-hind': S.hindsight.declared = !S.hindsight.declared; trailPush(S.hindsight.declared ? 'Mark · “I already know how this goes”' : 'Mark removed'); break;
  case 'take-seat': S.seat = { act: null, council: {} }; go('seat', 'Seat · ' + D.seatName); announce('You hold the seat at the cut. Choose from what the rules allow.'); break;
  case 'back-cut': go('cut', 'Cut · ' + D.fmt(cut().t)); break;
  case 'pick-act': S.seat.act = p.a; S.seat.council = {}; announce('Act chosen. The Council convenes the seats it touches.'); break;
  case 'seat-set':
    if (p.mode === 'recorded' || p.mode === 'model') {
      var rr = D.modeRule(p.seat, p.mode, cut(), S.seat.act);
      if (rr) { S.stats[p.mode === 'recorded' ? 'recRef' : 'modRef']++; refuse(rr.rule, rr.text, { seat: p.seat }); break; }
      S.stats[p.mode === 'recorded' ? 'recOk' : 'modOk']++;
    } else S.stats[p.mode === 'declare' ? 'decl' : 'unk']++;
    S.seat.council[p.seat] = p.mode === 'declare' ? { mode: 'declare', v: p.v || null } : { mode: p.mode };
    announce(D.seats[p.seat].name + ' set to ' + p.mode + (p.v ? ', ' + p.v : '') + '.'); break;
  case 'keep':
    if (!S.seat.act) { refuse('Keep needs an act.', 'Choose from the legal action space first.', { keep: true }); break; }
    var need = needSeats(S.seat.act, S.seat.council);
    if (need.length) { refuse('Keep is blocked while a seat the act touches is unset.', 'Still unset: ' + need.map(function (s) { return D.seats[s].name; }).join(' and ') + '. Each must be Recorded, Declared, Modeled, or left Unknown on purpose.', { keep: true }); break; }
    var nb = { id: 'b' + S.nextN, n: 'b' + S.nextN, cutId: S.cutId, t: cut().t, act: S.seat.act, council: clone(S.seat.council), hind: hindStamp(), status: 'walking', redecl: {} };
    S.nextN++; S.branches.push(nb); S.activeId = nb.id; S.holder = true;
    S.view = 'branch'; S.overlay = null; S.newMarks = []; S.born = nb.id;
    sign('keep', 'Kept: your branch ' + nb.n + ' — “' + D.acts[nb.act].label + '” · diverged ' + D.fmt(nb.t) + ' · hindsight: ' + nb.hind + ' · coupling: PINNED', D.acts[nb.act].label);
    trailPush('Branch ' + nb.n + ' · diverged ' + D.fmt(nb.t));
    announce('Branch kept. The cut is now the left frame in record ink. Your branch opens in its own ink. Reality is shuttered at the edge.'); break;
  case 'advance':
    if (!b || b.status !== 'walking') break;
    if (!needHolder('Advancing the branch clock')) break;
    var nd = null, lim = D.limit(D.cuts[b.cutId]);
    if (p.unit === 'next') { D.events.forEach(function (ev) { if (ev.t > b.t && (nd == null || ev.t < nd)) nd = ev.t; }); }
    else { nd = b.t + D.steps[+p.unit].dt; }
    if (nd == null || nd > lim + 1e-9) { refuse('This prototype authors a branch only to ' + D.fmt(lim) + '.', 'Rules and consequences past that are not written, so the clock will not run there. Reality’s later record stays sealed from this branch.', { adv: true }); break; }
