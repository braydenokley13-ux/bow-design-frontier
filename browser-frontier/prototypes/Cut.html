  --paper:#ebe8dd; --paper2:#e2dfd2; --tone:#cdc9b9;
  --ink:#161615; --ink2:#3b3a36; --ink3:#5a5852;

  --serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;

  --kc:var(--ink);
  --grain:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAABICAYAAABV7bNHAAAKcElEQVR42o2czW4k2QqEWSAkJBZsxu//qHfuqF1Kh78ge1Fqt12VefIcfoIgqPj6+qf/fcW/r/nz7/fr+/f5+N083pfwOf3d87Ml7y35XMv9//+7/fOZ/vPz/vm5HtfOx/X28d6SdT+faWUt/Xh93+e/vz0vHHKjeiwuHjePx/+/F1iPn783ceW983jfyPVHNvO5SSn3K3j4hrWNvHRjUg5CDeOzQfSHfFyoZHefi3i+CixQN18tpeQe35/Lx7/5WE8+HqjNoeZjrQ2e8P355z3WGMHoDo643ILrBVjRgouEnHKKO6Q8UIHZ0/33ZS0Bh5li6QGH3Y/3fB96Phe74q8jD55ingXWV48bplxHY5S6V4sVBcSEeWxmmDhXYKEjB7Cw5hCv+RGDNNg9d7glftCiQjau5DTUjcoEZD2oZ+xKcQu1+DgSQsh1CqyI1tohNyyIEy07X+Iu7hRGTjUhsO7x+TCBu8Eyn5tcxhVXYl5KTFt4ztBFNJjpwg2eiykJ1mFOqeBaA5vtrK3Nw2jS0GzZYmktqX3Agz73V2yj7kT+nJKiU240YC20SZqSn4dTsoF1JAx1z4Z0nmCBLQlC4+N8B+mRE1v5v7rfQHwI2JA1v0vjPmseXuHAgLWlxBhK/y2bmRKbCKCG3kBxQRswV3B6JT6d4q5LCziQ95iNb4hJBCbH4LcA1x3J1B/YoSf4BFkJNxhJ92OyQYqfa0yhWBfyoCvpec29AtbqoMkA9glTAuUzBq3BKgvBq+AhE9zHZcaBTEhxKQGvpClDGhKJWldDtaAQRwN6uZOjdB0AukriQj1uMrLIETel68/hElR0BgDHgAOuv7CcZznzMRbCLm1OiTBIiUUMVN+UilP+voZN0GLZYaI4MhxBFN3YBqD4q9Sgwo4sI8CMKTgW4I+GUiTAdSmLDRzgHmCywII1Zu2xoT+q+YJ015CancnncXoD7ACVNGOCcZoY1JD+CbUHxLyGzI3wJCRFX5U78iUv7yMCLc2GljnREtRbBvU3kGUDsWsNxsJCXD+k9AXVLmsAXkuMosUlBPYxpBURdSv1YAgsSYAPFD4agjdBgQoItIRQF2jXNGzkALuoVrNAXZArjsmsrmBVKrYBNmgdtmDpTRtE6VwfIqVGGhOjFBe1ZD4iqYizCSkTSmLjAB81pu4KU5RSgO5nmh84gTUgrgTLaKpec2IU+J8k+5gHCwCCa1yiIRYlcN8FVbta9KfkClPZhulkzEF2OS5nj+ynp18QNPsoa8aEAMJW+1LrBYSBIMo1DCG+BrEqwi4TvNdYlLKHa+q1NpY8EuvWZDrXcipIBJ+4qWlOofnIg4aALs0gxDQ6YmqBe6bYcdGzdcQtBzWcy1O4aULNKxdPw/Rd+KUlqCt80C5GA+WZh3tQkRqmWicKRzcvAOp86I4xsL9hA5yrpOF821Tv82L2Cw9P/M0ceIZiSsHfy8SmD2lfhv0jbidMW4aC/UBJsX/xIHFwRXXgGiLDXOwc07lVZmFw16RXNfLADfWMS80Dm0CZ5+pphWEz62VjHETReq0eGz5SyBbtsrZ9BzYhofYpY+4BrOQa5qAhfoWpr1xKH0gymhkb2IEFMFtUPoQEtzaFbMnmjFhHH23gAMtMSPdtFBiUqtWt06z7oll/NQUuUulvKvs1UpIwwJPo0DXMnlIexAI09NlKPjcCTagVTk3SjwUpqTXwRuVNEtopA9kmID0XsItqtVQQK5tQUs+NCfZjevUBIUW5pnRNQe2XjWkTN7SmE5i/gqw4EITLiAjSaJbi0Aw0NAv0Pi3urJYXAZ2LODACoeIynHMC8HSqsgEqJMEiHVWbBrSSMs2FCV3jfqf5lcX2IToIw1XHETAbTrPNtQeai/tiKVSUrqhBrLzlpTEwYfiZNSXAgJ+SUqMluK7pViS }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper) var(--grain);color:var(--ink);font:15px/1.38 var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--paper)}
.branch button:focus-visible,.branch input:focus-visible{outline-color:var(--br)}
h1,h2,h3,p{margin:0}
.mono,.lbl{font-family:var(--mono)}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto auto auto;height:100vh;min-height:0}
.mast{border-bottom:3px double var(--ink);padding:5px 20px 4px;background:var(--paper) var(--grain)}
.r1{display:flex;align-items:center;gap:12px;min-height:42px}
.brand{font:700 25px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font:500 10px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.tools{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.tb{border:1.5px solid var(--ink);min-height:38px;padding:5px 10px;font:500 12px/1.2 var(--mono);letter-spacing:.02em;background:var(--paper);white-space:nowrap}
.tb:hover{background:var(--tone)}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip{border:1.5px solid var(--ink);padding:5px 9px;font:500 11.5px/1.2 var(--mono);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.led{background:var(--paper);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
.addr{display:flex;gap:10px;align-items:baseline;padding-top:2px;font:500 12.5px/1.35 var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden}
.addr .lbl{flex:none}
.addr .seg{overflow:hidden;text-overflow:ellipsis}
.addr .seg i{font-style:normal;color:var(--ink3);padding:0 5px}
.addr b{font-weight:600}
.addr b.br{color:var(--br)}

#stage{position:relative;overflow:auto;padding:10px 20px 10px;min-height:0}
.legend{display:none;gap:11px;align-items:center;padding:3px 16px;border-top:1px solid var(--ink);background:var(--paper2);font:500 10.5px/1.2 var(--mono);flex-wrap:wrap}
body.showhow .legend{display:flex}
.legend span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.status{border-top:1.5px solid var(--ink);padding:5px 20px;font:500 11px/1.3 var(--mono);color:var(--ink2);background:var(--paper);display:flex;gap:16px;white-space:nowrap;overflow:hidden}
.status b{color:var(--ink);font-weight:600}

/* ---------- truth grammar ---------- */
.sw{display:inline-block;width:24px;height:10px;flex:none;border:1.5px solid var(--kc);box-sizing:border-box;vertical-align:1px}
.sw.unv{outline:1.5px dashed var(--kc);outline-offset:2px;margin-left:2px;margin-right:2px}
.unvchip{display:inline-block;margin-left:8px;border:1.5px dashed var(--ink);padding:0 5px;font:500 10px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.05em;vertical-align:1px;background:var(--paper);white-space:nowrap}
.k-OBSERVED{background:var(--kc)}
.k-RECORDED{background:var(--kc);box-shadow:inset 0 0 0 1.5px var(--paper),inset 0 0 0 2.5px var(--kc)}
.k-AUTHORED{background:transparent}
.k-COMPUTED{background:var(--tone)}
.branch .k-COMPUTED{background:var(--brtone)}
.k-MODELED{background:repeating-linear-gradient(135deg,var(--kc) 0 1.3px,transparent 1.3px 4px)}
.k-GENERATED{background:radial-gradient(circle,var(--kc) 0.9px,transparent 1.2px) 0 0/4px 4px}
.k-UNKNOWN{border-style:dashed;background:transparent}
.fact{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:4px 0;border-bottom:1px solid rgba(22,22,21,.18);align-items:start}
.fact .sw{margin-top:6px}
.fl{font:500 10.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-right:6px}
.fv{font-size:14px}
.fv.tone{background:var(--tone);padding:0 4px}
.branch .fv.tone{background:var(--brtone)}
.fact.hero .fl{display:block}
.fact.hero .fv{font:700 30px/1.1 var(--serif);display:inline-block;margin:1px 0 1px}
.fact.hero .btn{vertical-align:middle;margin-left:10px;font-weight:500}
.how{display:none;font:400 10.5px/1.3 var(--mono);color:var(--ink3);margin-top:2px}
body.showhow .how{display:block}
.hole{display:inline-block;border:1.5px dashed var(--ink);padding:0 6px;font:400 12px/1.5 var(--mono);color:var(--ink2)}
.branch .hole{border-color:var(--br)}
.rt{font:400 10.5px/1.3 var(--mono);color:var(--ink2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--paper);min-height:44px;padding:8px 14px;font:500 12.5px/1.25 var(--mono);letter-spacing:.02em}
.btn:hover{background:var(--tone)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--ink2)}
.btn[aria-disabled="true"]{border-style:dashed;color:var(--ink2);background:transparent}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.branch .btn{border-color:var(--br);background:var(--brpaper)}
.branch .btn:hover{background:var(--brtone)}
.branch .btn.pri{background:var(--br);color:var(--brpaper)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:11.5px}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;transform:rotate(-2deg);background:var(--paper)}
.stamp.ink{border-color:var(--ink);color:var(--ink)}
.h2{font:600 11.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--ink);padding-bottom:3px;margin:10px 0 5px}
.dock{position:sticky;bottom:-10px;z-index:8;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 0 4px;margin-top:8px;background:var(--paper) var(--grain);border-top:1.5px solid var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}

/* ---------- capability overlay ---------- */
[data-cap]{position:relative}
.capn{position:absolute;top:-9px;left:-7px;z-index:30;min-width:18px;height:18px;padding:0 3px;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);font:600 10.5px/15px var(--mono);text-align:center;pointer-events:none;box-shadow:1.5px 1.5px 0 var(--ink)}
.capn.in,.sheet .capn{top:2px;left:2px}
.zA .capn{left:auto;right:8px}
.capn.st{position:static;display:inline-block;flex:none;box-shadow:none}
#realsheet{border-top:2px solid var(--ink);background:var(--paper2);padding:5px 16px 6px;max-height:27vh;overflow:auto}
#realsheet h3{margin:0 0 3px;font:600 10.5px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase}
#realsheet ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1px 18px}
#realsheet li{display:flex;gap:7px;align-items:baseline;border-bottom:1px dotted var(--ink3);padding:1px 0;font:400 11.5px/1.3 var(--mono)}
#realsheet .capw{font-weight:600}

/* ---------- rail ---------- */
.rail{display:grid;grid-template-columns:288px 1fr 322px;height:132px;background:var(--paper2) var(--grain);border-top:3px double var(--ink);position:relative}
.rail>div{position:relative;padding:6px 14px 5px;min-width:0}
.zA{border-right:1.5px solid var(--ink)}
.zC{border-left:1.5px solid var(--ink);padding:6px 10px 6px !important}
.zA .who{font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.zA .lbl{white-space:nowrap;font-size:10px}
.slab{display:inline-block;background:var(--ink);color:var(--paper);font:600 24px/1 var(--mono);padding:5px 10px;letter-spacing:.03em;margin:4px 0 3px}
.slab.br{background:var(--br);color:var(--brpaper);font-size:20px}
.slab.dash{background:transparent;color:var(--ink);border:1.5px dashed var(--ink);font-size:16px}
.slab.frozen{background:transparent;color:var(--ink);border:2px solid var(--ink);font-size:19px}
.recbar{display:flex;align-items:center;height:10px;margin:2px 0 2px;width:100%}
.recbar i{display:block;height:7px}
.recbar .a{flex:1;background:var(--ink);box-shadow:0 3px 0 -2px var(--paper2),0 4px 0 -1px var(--ink)}
.recbar .g{flex:0 0 26%;border-top:2px dashed var(--ink);border-bottom:2px dashed var(--ink);height:7px}
.zA .rt{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zB{overflow:hidden}
.ruler{position:absolute;left:16px;right:16px;top:6px;bottom:4px}
.rline{position:absolute;left:0;height:0;border-top:2px solid var(--ink);top:60px}
.rline.dbl{border-top:3px double var(--ink)}
.rline.dsh{border-top:2px dashed var(--ink)}
.rline.brl{border-top:5px solid var(--br)}
.rtick{position:absolute;top:52px;width:0;height:17px;border-left:2px solid var(--ink)}
.rtick.br{border-color:var(--br)}
.rtl{position:absolute;font:500 10px/1.2 var(--mono);color:var(--ink2);white-space:nowrap;transform:translateX(-4px)}
.rnow{position:absolute;top:44px;width:0;height:32px;border-left:5px solid var(--ink)}
.door{position:absolute;top:0;min-height:44px;border:1.5px solid var(--ink);background:var(--paper);padding:3px 7px;font:500 10.5px/1.25 var(--mono);text-align:left}
.door:hover{background:var(--tone)}
.door small{display:block;font-weight:400;color:var(--ink2)}
.doorstatic{position:absolute;top:0;border:1.5px solid var(--ink);background:var(--paper);padding:3px 7px;font:500 10.5px/1.3 var(--mono)}
.doorstatic small{display:block;font-weight:400;color:var(--ink2)}
.outc{position:absolute;top:45px;height:13px;border:1.5px dashed var(--ink);font:400 9.5px/10px var(--mono);color:var(--ink2);padding:0 4px;white-space:nowrap;overflow:hidden}
.win{display:block;width:100%;height:100%;border:2px solid var(--ink);background:var(--paper);position:relative;overflow:hidden;padding:0}
.win .top{display:flex;justify-content:space-between;align-items:center;height:28px;padding:0 8px;font:500 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.win .top b{background:var(--ink);color:var(--paper);font:600 15px/1 var(--mono);padding:4px 7px;letter-spacing:.03em;text-transform:none}
.win .slats{display:flex;height:34px;background:repeating-linear-gradient(180deg,var(--red) 0 8px,var(--red2) 8px 10px);align-items:center;justify-content:center}
.win .slats span{background:var(--paper);color:var(--red);border:1.5px solid var(--red);padding:1px 8px;font:600 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.win .bot{display:block;padding:3px 8px 0;font:500 10.5px/1.3 var(--mono)}
.win:hover .top{background:var(--tone)}
.open-win{border:2px solid var(--ink);height:100%;padding:7px 10px;background:var(--paper);display:flex;flex-direction:column;justify-content:space-between;gap:4px}

/* ---------- NOW ---------- */
.now{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
.now h1{font:700 32px/1.05 var(--serif)}
.dateline{display:flex;gap:14px;align-items:center;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:3px 0;margin-bottom:8px;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.now .sub{color:var(--ink2);margin:5px 0 6px;max-width:60ch;font-size:14.5px}
.taxwrap{border:1.5px solid var(--ink);padding:7px 12px 6px;margin:8px 0}
.taxrow{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.taxrow>div{min-width:140px}
.taxrow .n{font:600 19px/1.1 var(--mono)}
.tscale{position:relative;height:50px;margin:6px 4px 0}
.tscale .ln{position:absolute;left:0;right:0;top:12px;border-top:2px solid var(--ink)}
.tscale .mk{position:absolute;top:6px;width:0;height:14px;border-left:2px solid var(--ink)}
.tscale .mk.big{border-left-width:5px;top:3px;height:20px}
.tscale .ml{position:absolute;font:500 10px/1.2 var(--mono);white-space:nowrap;transform:translateX(-4px)}
.river{grid-column:1 / -1;margin-top:-4px}
.rivertiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mtile{display:block;border:1.5px dashed var(--ink);padding:6px 10px;min-height:64px}
.mtile:hover{background:var(--tone);border-style:solid}
.mtile.unlit{background:var(--paper2);border-color:var(--ink3);color:var(--ink2)}
.mtile.unlit:hover{background:var(--paper2);border-style:dashed}
.mtile .ul{display:block;margin-top:4px;font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.mtile .un{display:block;margin-top:4px;font:400 12px/1.35 var(--mono);color:var(--ink);border-top:1px dashed var(--ink3);padding-top:3px}
.vpnote{border:2px dashed var(--ink);background:var(--paper);padding:5px 12px;margin:0 0 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.mtile .dt{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.mtile .qq{display:block;font:italic 400 14px/1.3 var(--serif)}
.doorbox{border:1.5px solid var(--ink);padding:8px 12px;margin-bottom:8px;background:var(--paper)}
.doorbox.big{border-width:2px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:12px 16px}
.doorbox.big.small{padding:9px 14px}
.doorbox .q{font:italic 400 17px/1.3 var(--serif);margin:3px 0 8px}
.refuse{border:2px solid var(--red);background:var(--paper);padding:6px 10px;margin:6px 0;color:var(--ink);font-size:14px}
.refuse .stamp{margin-right:8px}
.slip{position:absolute;z-index:40;right:22px;bottom:64px;width:min(540px,calc(100% - 44px));background:var(--paper);border:2px solid var(--red);box-shadow:5px 5px 0 var(--red);padding:9px 12px}
.slip p{margin-top:5px;font-size:14px}
.slip .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.wall{margin-top:6px}
.walltiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.walltile{display:grid;grid-template-columns:auto 1fr;gap:0 12px;border:2px solid var(--br);border-left-width:10px;background:var(--brpaper);padding:5px 10px 6px;color:var(--ink);box-shadow:4px 4px 0 rgba(11,90,79,.28);align-content:start}
.walltile:hover{background:var(--brtone)}
.walltile .t{grid-column:1 / -1;font:600 10.5px/1.3 var(--mono);color:var(--br);letter-spacing:.05em;text-transform:uppercase}
.walltile .wd{font:600 19px/1.2 var(--mono);color:var(--br)}
.walltile .wa{font-size:13.5px;line-height:1.25}
.walltile .rt{grid-column:1 / -1;margin-top:2px}
.walltile.ret{border-style:dashed;border-left-style:solid;border-left-color:var(--ink3);background:transparent;color:var(--ink2);box-shadow:none}
.walltile.ret .t,.walltile.ret .wd{color:var(--ink2)}
.wallitem{display:block;width:100%;border:2px solid var(--br);border-left-width:10px;background:var(--brpaper);padding:5px 10px;margin-bottom:6px;color:var(--ink);font-size:14px}
.wallitem:hover{background:var(--brtone)}
.wallitem.ret{border-style:dashed;background:transparent;color:var(--ink2)}
.wallitem .t{font:600 11px/1.3 var(--mono);color:var(--br)}
.wallitem.ret .t{color:var(--ink2)}

/* ---------- ARRIVE ---------- */
.arrive{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
.arrive h1{font:700 34px/1.05 var(--serif)}
.arrive .q{font:italic 400 21px/1.3 var(--serif);margin:6px 0 12px}
.cutopt{display:block;width:100%;border:1.5px solid var(--ink);padding:10px 14px;margin:0 0 8px;min-height:60px;background:var(--paper)}
.cutopt b{font:600 14px/1.3 var(--mono);display:block}
.cutopt small{display:block;font:400 14px/1.35 var(--serif);color:var(--ink2);margin-top:2px}
.cutopt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cutopt[aria-pressed="true"] small{color:var(--paper)}
.cutopt:hover{background:var(--tone)}.cutopt[aria-pressed="true"]:hover{background:var(--ink2)}

/* ---------- CUT ---------- */
.cutview{position:relative}
.cuthead{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.cuthead h1{font:700 26px/1.05 var(--serif)}
.cuthead h1 small{font:italic 400 16px/1 var(--serif);color:var(--ink2);margin-left:8px}
.knower{display:inline-block;border:1.5px solid var(--ink);padding:1px 8px;margin-left:8px;font:500 10.5px/1.5 var(--mono);text-transform:none;letter-spacing:0;vertical-align:1px}
.floor{font:400 11px/1.35 var(--mono);color:var(--ink2);max-width:44ch;text-align:right}
.planes{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr) minmax(0,.95fr);gap:12px}
.plane{border:2px solid var(--ink);padding:6px 11px 8px;min-height:0}
.plane h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.plane h2 small{display:block;font:italic 400 13px/1.3 var(--serif);text-transform:none;letter-spacing:0;color:var(--ink2)}
.plane.books{box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:10px 15px 8px}
.plane.notyet{border-style:dashed;position:relative}
.cds{display:flex;align-items:center;gap:6px;margin-top:6px}
.cd{display:inline-block;width:34px;height:14px;border:1.5px dashed var(--ink);background:repeating-linear-gradient(90deg,transparent 0 4px,rgba(22,22,21,.28) 4px 5px)}
.plane.notyet .slot{border:1.5px dashed var(--ink);padding:4px 8px;margin:5px 0;font-size:13.5px;line-height:1.3}
.plane.notyet .slot .fl{display:block;margin:0 0 1px}
.plane.notyet .noline{font:500 12px/1.35 var(--mono);margin-top:7px;padding-top:5px;border-top:1.5px dashed var(--ink)}
.since{margin-top:8px;border:2px solid var(--ink);background:var(--paper2);padding:4px 12px;display:flex;gap:14px;align-items:center}
.since h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.since p{font-size:13.5px;color:var(--ink2);flex:1;line-height:1.3}
.edge{position:absolute;top:-2px;bottom:-2px;right:-15px;width:26px;border:0;cursor:ew-resize;background:transparent;z-index:5}
.edge span{position:absolute;left:11px;top:0;bottom:0;border-left:2px dashed var(--ink)}
.edge:hover span,.edge:focus-visible span{border-left:4px dashed var(--red)}
.edge b{position:absolute;top:50%;left:0;transform:translateY(-50%);width:26px;height:44px;background:var(--paper);border:1.5px solid var(--ink);font:600 12px/44px var(--mono);text-align:center}
.tagline{font:italic 400 14px/1.3 var(--serif);color:var(--ink2)}

/* ---------- SEAT ---------- */
.seat h1{font:700 26px/1.1 var(--serif)}
.folded{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink);padding:7px 14px;margin:6px 0 4px;font-size:13.5px}
.folded .fi{white-space:nowrap}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px}
.actbtn{display:block;width:100%;border:1.5px solid var(--ink);padding:8px 12px;margin:0 0 8px;background:var(--paper);min-height:64px}
.actbtn b{display:block;font:700 14.5px/1.3 var(--serif)}
.actbtn small{display:block;font:400 11.5px/1.35 var(--mono);color:var(--ink2);margin-top:2px}
.actbtn:hover{background:var(--tone)}
.actbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.actbtn[aria-pressed="true"] small{color:var(--paper)}
.seatblk{border:2px solid var(--ink);padding:6px 12px;margin-bottom:7px}
.seatblk.set{box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:9px 15px}
.seatblk.unset{border-style:dashed}
.seatblk h3{font:600 12px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.seatblk .why{font-size:12.5px;color:var(--ink2);margin:1px 0 5px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .btn{min-height:38px;padding:4px 10px}
.decl{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.assump{border:1.5px solid var(--ink);padding:6px 10px;margin:8px 0;font-size:13px}
.assump li{margin:1px 0}
.assump ul{columns:2;column-gap:22px}
.assump li{break-inside:avoid}
ul.plain{margin:0;padding-left:18px}

/* ---------- BRANCH ---------- */
.bview{display:grid;gap:8px}
.frames{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px}
.frame{padding:7px 14px 8px;position:relative}
.frame.rec{border:2px solid var(--ink);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:10px 18px 8px}
.frame.branch{--kc:var(--br);border:2px solid var(--br);border-left:12px solid var(--br);background:var(--brpaper);color:var(--ink);box-shadow:5px 5px 0 rgba(11,90,79,.28)}
.frame h2{font:600 12px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.frame.branch h2{color:var(--br)}
.clk{display:flex;align-items:baseline;gap:10px;margin:2px 0 3px;flex-wrap:wrap}
.clk .d{font:600 19px/1.1 var(--mono)}
.frame.branch .clk .d{color:var(--br)}
.bstamp{border:2px solid var(--br);background:var(--brpaper);padding:4px 9px;margin:3px 0 4px;font:500 11.5px/1.4 var(--mono);color:var(--ink)}
.bstamp b{color:var(--br);font-weight:600}
.pin{display:inline-block;border:1.5px solid var(--br);padding:0 6px;font-weight:600;background:var(--paper)}
.shut{margin-top:5px;height:20px;background:repeating-linear-gradient(180deg,var(--red) 0 6px,var(--red2) 6px 8px);display:flex;align-items:center;justify-content:center}
.shut span{background:var(--paper);color:var(--red);border:1.5px solid var(--red);padding:0 8px;font:600 10px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.mini{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid rgba(22,22,21,.18);font-size:13px}
.mini .fl{flex:none;width:76px}
.mini.dsh{border:1.5px dashed var(--ink);padding:3px 7px;margin:4px 0}
.paceb{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.seambar{border-top:3px double var(--ink);padding-top:5px;position:relative}
.seambar>.stitch{position:absolute;left:0;right:0;top:-6px;border-top:2px dashed var(--ink)}
.seambar h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;display:flex;gap:12px;align-items:baseline}
.seambar h2 small{font:italic 400 13px var(--serif);text-transform:none;letter-spacing:0;color:var(--ink2)}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark{display:grid;grid-template-columns:1fr 96px 1fr;border:1.5px solid var(--ink);background:var(--paper);min-height:78px}
.mark .side{padding:5px 9px;font-size:12.5px;line-height:1.3}
.mark .side.r{border-right:1.5px solid var(--ink)}
.mark .side.b{background:var(--brpaper);border-left:2px solid var(--br);color:var(--ink)}
.mark .side .lbl{display:block;margin-bottom:1px}
.mark .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center;background:var(--paper2)}
.verd{font:600 11px/1.15 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 4px;border:2px solid var(--ink);background:var(--paper);width:100%;text-align:center}
.verd small{display:block;font-weight:400;letter-spacing:0;text-transform:none;font-size:10.5px}
.verd.held{background:repeating-linear-gradient(90deg,var(--paper) 0 5px,var(--tone) 5px 8px)}
.verd.diverged{background:repeating-linear-gradient(135deg,var(--paper) 0 4px,var(--tone) 4px 6px)}
.verd.impossible{border-style:dashed;clip-path:polygon(0 8%,8% 0,16% 10%,26% 0,36% 8%,46% 0,58% 10%,70% 0,82% 8%,92% 0,100% 10%,100% 100%,92% 92%,82% 100%,70% 90%,58% 100%,46% 92%,36% 100%,26% 90%,16% 100%,8% 92%,0 100%);padding-top:7px;padding-bottom:7px}
.verd.re-declare{border-style:dashed;background:transparent}
.mid .mn{font:400 9.5px/1.2 var(--mono);color:var(--ink2)}
.marks.empty{display:block;font:italic 400 14px/1.35 var(--serif);color:var(--ink2);border:1.5px dashed var(--ink);padding:10px 14px}

/* ---------- SHEETS ---------- */
.scrim{position:absolute;inset:0;background:rgba(235,232,221,.6);z-index:50}
.sheet{position:absolute;top:0;right:0;bottom:0;z-index:60;width:min(640px,96%);background:var(--paper) var(--grain);border-left:4px double var(--ink);box-shadow:-8px 0 0 rgba(22,22,21,.14);padding:8px 18px 10px;overflow:auto}
.sheet.wide{width:min(1000px,98%)}
.sheet h1{font:700 21px/1.1 var(--serif)}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.since-i{padding:3px 0;border-bottom:1px solid rgba(22,22,21,.25);display:grid;grid-template-columns:104px 1fr;gap:10px}
.since-i .dt{font:500 11px/1.35 var(--mono);color:var(--ink2)}
.since-i .hand{display:block;font:600 9.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.since-i.fact .tx{font:400 12.5px/1.4 var(--mono)}
.since-i.corr .tx{font:italic 400 14px/1.35 var(--serif);border-left:3px double var(--ink);padding-left:8px}
.since-i.arg .tx{font:italic 400 14px/1.4 var(--serif);border-left:5px solid var(--ink);padding-left:8px;background:linear-gradient(90deg,var(--paper2),transparent)}
.since-i .src{font:400 10.5px/1.3 var(--mono);color:var(--ink3);margin-top:1px}
.backs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.backcol{padding:8px 12px 10px;min-height:270px}
.backcol h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.backcol .k{font:italic 400 13px/1.3 var(--serif);color:var(--ink2);margin:1px 0 6px}
.bc-trail{border:1.5px dashed var(--ink3)}
.bc-trail li{font-family:var(--mono);font-size:11.5px;padding:2px 0;border-bottom:1px dashed var(--ink3);list-style:none}
.bc-trail ul,.bc-rec ul,.bc-acts ul{margin:4px 0 8px;padding:0}
.bc-trail li.cur{font-weight:600;background:var(--tone)}
.bc-rec{border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink)}
.bc-rec li{font:400 12px/1.35 var(--serif);padding:2px 0;list-style:none;border-bottom:1px solid rgba(22,22,21,.25)}
.bc-rec li.cur{font-weight:700;background:var(--tone)}
.bc-rec li.hid{color:var(--ink3);font-family:var(--mono);font-size:11px}
.bc-acts{border:2px solid var(--br);background:var(--brpaper);--kc:var(--br)}
.bc-acts li{list-style:none;padding:3px 0;border-bottom:1px solid var(--br);font-size:13px}
.bc-acts li em{font:italic 400 15px/1.2 var(--serif);color:var(--br)}
.whyl{position:relative;padding:5px 0 5px 22px;border-left:2px solid var(--ink);margin-left:8px}
.whyl::before{content:"";position:absolute;left:-2px;top:14px;width:16px;border-top:2px solid var(--ink)}
.whyl.dash{border-left-style:dashed}
.whyl.dash::before{border-top-style:dashed}
.whyl .t{font-size:14px}
.whyl .m{font:400 11px/1.3 var(--mono);color:var(--ink2)}
.whyl .id{font:600 10.5px/1 var(--mono);border:1.5px solid var(--ink);padding:1px 5px;margin-right:6px;display:inline-block}

/* ---------- scrubber baseline ---------- */
.scrub{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px}
.scrub h1{font:700 26px/1.1 var(--serif)}
.scrub input[type=range]{width:100%;height:44px;margin:4px 0 0;accent-color:var(--ink)}
.strack{position:relative;height:84px;border-top:2px solid var(--ink);margin-top:8px}
.strack .n{position:absolute;font:500 10px/1.25 var(--mono);width:180px;transform:translateX(-4px);border-left:2px solid var(--ink);padding-left:4px;background:var(--paper)}
.leak{border:3px solid var(--red);padding:8px 12px;margin-top:6px;background:var(--paper)}
.leak .num{font:700 34px/1 var(--mono);color:var(--red)}
.leak.ok{border-color:var(--ink)}
.leak.ok .num{color:var(--ink)}
.cmp{border:2px solid var(--ink);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:10px 16px}

/* ---------- HIST ---------- */
.hist{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
.hist h1{font:700 34px/1.05 var(--serif)}
.hist .frozen{border:2px solid var(--ink);padding:8px 14px;margin-top:8px}

@media (prefers-reduced-motion:no-preference){
  .flash{animation:fl .7s ease-out 1}
  @keyframes fl{0%{background:var(--ink);color:var(--paper)}100%{background:var(--brtone);color:var(--ink)}}
  .frame.born{animation:bornin .6s cubic-bezier(.2,.8,.2,1) 1}
  @keyframes bornin{0%{transform:translateX(34px);opacity:0}100%{transform:none;opacity:1}}
  .frame.rec.settle{animation:settle .6s cubic-bezier(.2,.8,.2,1) 1}
  @keyframes settle{0%{transform:translateX(14px)}100%{transform:none}}
  .mark.new{animation:stampin .55s cubic-bezier(.2,.9,.3,1.2) 1}
  @keyframes stampin{0%{transform:translateY(-10px) scale(1.04);opacity:0}100%{transform:none;opacity:1}}
}
@media (max-width:700px){
  html,body{height:auto}
  body{overflow:auto}
  #app{display:block;height:auto}
  .mast{padding:6px 12px 5px}
  .r1{flex-wrap:wrap;gap:6px 10px;min-height:0}
  .tools{margin-left:0;flex-wrap:wrap;width:100%}
  .tb{min-height:40px}
  .brand{font-size:22px}
  .addr{white-space:normal;flex-wrap:wrap;font-size:11.5px;gap:0 6px}
  .addr .seg{overflow:visible;text-overflow:clip;white-space:normal}
  #stage{overflow:visible;padding:10px 12px}
  .now,.arrive,.hist,.scrub,.cols2,.frames,.planes,.marks,.backs,.walltiles{grid-template-columns:minmax(0,1fr)}
  .now h1,.arrive h1,.hist h1{font-size:26px}
  .rivertiles{grid-template-columns:1fr 1fr}
  .mark{grid-template-columns:minmax(0,1fr)}
  .mark .side.r{border-right:0;border-bottom:1.5px solid var(--ink)}
  .cuthead{flex-direction:column;align-items:flex-start;gap:4px}
  .floor{text-align:left;max-width:none}
  .assump ul{columns:1}
  .taxrow>div{min-width:0}
  .fact.hero .fv{font-size:24px}
  .dock{position:static;flex-wrap:wrap}
  .dock .btn{flex:1 1 auto;justify-content:center}
  .sheet,.sheet.wide{position:fixed;width:100%;border-left:0;padding:8px 12px 10px}
  .since{flex-direction:column;align-items:flex-start;gap:4px}
  .slip{position:static;width:auto;margin-top:10px;box-shadow:3px 3px 0 var(--red)}
  .edge{right:-6px}
  .rail{grid-template-columns:minmax(0,1fr);height:auto}
  .rail>div{padding:6px 12px}
  .zA{border-right:0;border-bottom:1.5px solid var(--ink)}
  .zB{height:140px;overflow-x:auto;overflow-y:hidden}
  .zB .ruler{width:640px;right:auto;left:12px}
  .zC{border-left:0;border-top:1.5px solid var(--ink);height:132px}
  .zA .who,.zA .lbl,.zA .rt{white-space:normal}
  .status{flex-wrap:wrap;gap:2px 12px;white-space:normal}
  .legend{padding:4px 12px}
  #realsheet{max-height:none}
  #realsheet ul{grid-template-columns:1fr}
  .strack .n{width:130px}
}
@media (min-width:701px) and (max-width:1300px){
  .r1{flex-wrap:wrap;row-gap:4px}
  .tools{flex-wrap:wrap;justify-content:flex-end}
  .rail{grid-template-columns:270px 1fr 300px}
  .now h1{font-size:28px}
  #stage{padding:8px 16px}
  .mast{padding:4px 16px 3px}
  .tb{padding:5px 8px;font-size:11.5px}
  .tools{gap:5px}
  .brand small{display:none}
  .fact.hero .fv{font-size:26px}
}
</style>
</head>
<body>
<div id="app">
  <header class="mast" id="mast"></header>
  <main id="stage" tabindex="-1" aria-label="Stage"></main>
  <div id="realsheet" hidden></div>
  <div class="legend" id="legend" aria-label="Texture legend"></div>
  <footer>
    <div class="rail" id="rail" aria-label="Horizon rail"></div>
    <div class="status" id="status"></div>
  </footer>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(function () {
'use strict';
var FX = window.BOW_FIXTURE, DL = FX.cuts.deadline2026, NOW = FX.meta.now;

/* ================= helpers ================= */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOWN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOWF = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function p2(n){ return (n < 10 ? '0' : '') + n; }

    if (f[7] !== '-') nb.extra = f[7]; if (f[8] === '1') nb.redecl = true;
    S.branches.push(nb);
    L('keep', 'Restored from the address: your branch ' + nb.n + ' — “' + ACTS[nb.act].label + '” · diverged ' + fd(CUTS[nb.cutId].date) + ' · hindsight: ' + nb.hind, true, ACTS[nb.act].label);
    if (nb.status === 'retired') L('retake', 'Restored from the address: branch ' + nb.n + ' retired (kept, not deleted)', true, ACTS[nb.act].label);
    if (nb.extra) L('amend', 'Restored from the address: amended on ' + nb.n + ' (also shed a bench salary)', true);
    if (nb.redecl) L('amend', 'Restored from the address: re-declared on ' + nb.n, true);
  });
  S.nextN = S.branches.length + 1;
  if (v === 'branch' && S.branches.length) { S.activeId = (q.at && S.branches.some(function (x) { return x.id === q.at; })) ? q.at : S.branches[S.branches.length - 1].id; S.view = 'branch'; S.vp = true; }
  else if (v === 'cut' || v === 'seat') { S.view = 'cut'; S.seatAddr = (v === 'seat'); }
  else if (v === 'arrive') S.view = 'arrive';
  else if (v === 'hist' && q.hist) { S.histId = q.hist; S.view = 'hist'; }
  else S.view = 'now';
  if (S.view !== 'now') S.leftAt = S.tick;
  trailPush('Opened from an address');
}
function vpBanner(){
  var b = actBranch();
  if (S.vp && b) return '<div class="vpnote" role="note"><span><b>Viewpoint: seat Boston, read only.</b> You opened an address, and an address names state, never authority. You see branch ' + esc(b.n) + ' as an observer may see it; nothing can be advanced or amended from here.</span><button type="button" class="btn sm" data-act="unvp" data-fk="unvp">Take the Boston seat</button><span class="rt">(stands in for redeeming an Offer)</span></div>';
  if (S.seatAddr) return '<div class="vpnote" role="note"><span><b>The address you opened names the seat at this cut.</b> An address names state, never authority: you stand here as an observer. The seat is yours only by taking it.</span></div>';
  return '';
}

/* ================= render ================= */
function render(){
  var ae = document.activeElement, fk = ae && ae.getAttribute && ae.getAttribute('data-fk');
  var st = document.getElementById('stage'), sTop = st.scrollTop;
  FL = S.flash; S.flash = false;
  document.getElementById('mast').innerHTML = mastHTML();
  var body = '';
  if (S.tog.scrub && S.view !== 'hist') body = vScrub();
  else if (S.view === 'now') body = vNow();
  else if (S.view === 'arrive') body = vArrive();
  else if (S.view === 'cut') body = vCut();
  else if (S.view === 'seat') body = vSeat();
  else if (S.view === 'branch') body = vBranch();
  else if (S.view === 'hist') body = vHist();
  var ov = S.overlay === 'since' ? ovSince() : S.overlay === 'why' ? ovWhy() : S.overlay === 'backs' ? ovBacks() : '';
  st.innerHTML = body + ov;
  st.scrollTop = sTop;
  document.getElementById('rail').innerHTML = railHTML();
  document.getElementById('legend').innerHTML = legendHTML();
  document.getElementById('status').innerHTML = statusHTML();
  syncHash();
  if (S.tog.real) tagCaps(); else { var rsh = document.getElementById('realsheet'); rsh.hidden = true; rsh.innerHTML = ''; }
  if (S.overlay === 'backs') logHash();
  var target = null;
  if (S.overlay) target = st.querySelector('.sheet [data-fk="close"]');
  if (!target && fk) target = document.querySelector('[data-fk="' + fk + '"]');
  if (target) target.focus({ preventScroll: true });
}
function logHash(){
  try {
    /* SHA-256 over the signed acts only: the canonical record. Navigation, toggles and reveals are the trail and are never hashed. */
    var data = new TextEncoder().encode(JSON.stringify(S.log.filter(function (e) { return e.signed; }).map(function (e) { return [e.kind, e.text, e.clock, e.hist, e.who]; })));
    crypto.subtle.digest('SHA-256', data).then(function (buf) {
      var h = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      var el = document.getElementById('loghash'); if (el) el.textContent = h.slice(0, 24) + '…';
    });
  } catch (e) { var el = document.getElementById('loghash'); if (el) el.textContent = 'not available here'; }
}
function tagCaps(){
  var els = document.querySelectorAll('[data-cap]'), rows = [], sh = document.getElementById('realsheet');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], k = el.getAttribute('data-cap'), full = FX.meta.capability[k] || k;
    var n = document.createElement('span'); n.className = 'capn' + (/(^|\s)(ruler|zA|zC|open-win)(\s|$)/.test(el.className) ? ' in' : ''); n.textContent = String(i + 1); n.setAttribute('aria-hidden', 'true');
    el.appendChild(n);
    rows.push('<li><span class="capn st" aria-hidden="true">' + (i + 1) + '</span><span>' + esc(el.getAttribute('data-capc') || '') + ' <span class="capw">' + esc(full.split(' — ')[0]) + '</span> · ' + esc(el.getAttribute('data-cost') || '') + '</span></li>');
  }
  sh.hidden = false; sh.innerHTML = '<h3>What’s real? · each numbered region: its capability status, then what a real product would need</h3><ul>' + rows.join('') + '</ul>';
}

/* ================= events ================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  if (t.getAttribute('aria-disabled') === 'true' && t.getAttribute('data-act') !== 'keep') return;
  if (t.hasAttribute('data-drag-done')) { t.removeAttribute('data-drag-done'); return; }
  var d = t.dataset;
  act(d.act, { t: d.t, door: d.door, a: d.a, seat: d.seat, mode: d.mode, v: d.v, unit: d.unit, id: d.id, of: d.of, kind: d.kind });
});
document.addEventListener('keydown', function (e) {
  if (!S.overlay) return;
  if (e.key === 'Escape') { S.overlay = null; render(); return; }
  if (e.key === 'Tab') {
    var sh = document.querySelector('.sheet'); if (!sh) return;
    var f = sh.querySelectorAll('button:not([aria-disabled="true"]),[href],input'); if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!sh.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'scr') { S.scrub.pos = addd('2026-01-05', +e.target.value); render(); var el = document.getElementById('scr'); if (el) el.focus(); }
});
(function () {
  var sx = null, edge = null;
  document.addEventListener('pointerdown', function (e) { var t = e.target.closest('.edge'); if (t) { sx = e.clientX; edge = t; } });
  document.addEventListener('pointerup', function (e) { if (sx != null && edge && Math.abs(e.clientX - sx) > 30) { edge.setAttribute('data-drag-done', '1'); act('later'); } sx = null; edge = null; });
})();
setInterval(function () {
  S.tick++;
  var cs = document.querySelectorAll('.js-clock'); for (var i = 0; i < cs.length; i++) cs[i].textContent = clockStr();
  var rt = document.querySelector('.js-rt'); if (rt) rt.textContent = '[verify time] · ' + lagMin() + ' min not in the record';
}, 1000);

trailPush('NOW · Reality');
L('open', 'Opened Boston · NOW as an observer');
restoreHash();
render();
window.__CUT = { S: S, act: act };
})();
</script>
