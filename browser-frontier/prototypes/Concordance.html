<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concordance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./_shared/vendor/three/three.module.min.js", "three/addons/": "./_shared/vendor/three/addons/" } }</script>
<style>
:root{--paper:#ECE8DC;--paper2:#DFD9C7;--card:#F7F4EB;--ink:#15140F;--ink2:#48453B;--red:#B31E14;--brass:#C7A248;--brassink:#6B5214;--green:#1D6A44;--greenbg:#D3E3D7;--tone:#D9D3BF;--sans:'IBM Plex Sans Condensed','Liberation Sans Narrow','DejaVu Sans Condensed',sans-serif;--mono:'IBM Plex Mono','DejaVu Sans Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.35 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--brass)}
.mono{font-family:var(--mono)}
/* truth grammar: seven textures; words on request */
.mk[data-t=OBSERVED]{background:var(--ink);color:var(--paper)}
.mk[data-t=RECORDED]{background:var(--card);box-shadow:inset 0 0 0 1px var(--ink),inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--ink)}
.mk[data-t=AUTHORED]{background:transparent;outline:1.5px solid var(--ink);outline-offset:-1.5px}
.mk[data-t=COMPUTED]{background:var(--tone)}
.mk[data-t=MODELED]{background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(21,20,15,.4) 4px 5px)}
.mk[data-t=GENERATED]{background-image:radial-gradient(rgba(21,20,15,.5) 1px,transparent 1.4px);background-size:5px 5px}
.mk[data-t=UNKNOWN]{background:transparent;border:1.5px dashed var(--ink2)}
.mk[data-t=SEALED]{background:transparent;border:1.5px dashed var(--ink);color:var(--ink2)}
.mk{padding:1px 6px;display:inline-block;border-radius:0}
.sw{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px;border:1px solid var(--ink)}
.sw[data-t=OBSERVED]{background:var(--ink)}.sw[data-t=RECORDED]{background:var(--card);box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--ink)}.sw[data-t=AUTHORED]{background:transparent}.sw[data-t=COMPUTED]{background:var(--tone)}.sw[data-t=MODELED]{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--ink) 3px 4px)}.sw[data-t=GENERATED]{background-image:radial-gradient(var(--ink) 1px,transparent 1.4px);background-size:4px 4px}.sw[data-t=UNKNOWN]{border-style:dashed;background:transparent}.sw[data-t=SEALED]{border-style:dashed;background:transparent}
/* chrome */
#topstrip{display:flex;justify-content:space-between;align-items:center;padding:0 14px;height:28px;background:var(--ink);color:var(--paper);font:500 12px var(--mono);flex:none}
#topstrip button{color:var(--paper);text-decoration:underline;text-underline-offset:3px;min-height:26px;padding:0 2px}
#topstrip button[aria-pressed=true]{background:var(--brass);color:var(--ink);text-decoration:none;padding:0 8px;font-weight:600}
#topstrip button:focus-visible{outline-color:var(--paper)}
#hdr{display:flex;align-items:center;gap:14px;padding:6px 14px;border-bottom:2px solid var(--ink);flex:none;min-height:54px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.wm{font:700 15px var(--mono);letter-spacing:.14em}
.brand .sub{font:500 10.5px var(--mono);color:var(--ink2);margin-top:2px}
.addr{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;font:500 12.5px var(--mono);background:var(--card);border:2px solid var(--ink);padding:3px 8px;min-height:36px}
.addr .seg{padding:2px 3px}.addr .dot{color:var(--ink2)}
.addr button.seg{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600;min-height:28px}
.addr .fork{color:var(--green);font-weight:700}
.levers{display:flex;align-items:center;gap:8px}
.lever{background:var(--brass);border:2px solid var(--ink);padding:2px 10px;text-align:center;line-height:1.05;box-shadow:3px 3px 0 var(--ink)}
.lever b{display:block;font:700 22px var(--mono)}.lever i{font:500 11px var(--mono);font-style:normal}
.btn{border:2px solid var(--ink);background:var(--card);padding:6px 12px;min-height:38px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--paper2)}
.btn.sign{background:var(--red);color:#fff;border-color:var(--ink)}
.btn.sign:hover{background:#94180F}
.btn.sm{min-height:30px;padding:3px 9px;font-size:13px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn.brass{background:var(--brass)}
.btn:disabled{opacity:.5;cursor:default}
.plan{display:flex;align-items:center;gap:12px;padding:6px 14px;border-bottom:2px solid var(--ink);flex:none;min-height:50px;background:var(--paper2)}
.plan .tag{font:700 11px var(--mono);letter-spacing:.12em;background:var(--ink);color:var(--paper);padding:3px 7px}
.plan .chips{display:flex;gap:6px;flex:none;font:600 12px var(--mono)}
.plan .chips span{border:1.5px solid var(--ink);background:var(--card);padding:2px 7px}
.plan .why{flex:1;min-width:0;font-size:14px}
.plan .acts{display:flex;gap:6px;flex:none}
.reasons{padding:6px 14px 8px;background:var(--card);border-bottom:2px solid var(--ink);flex:none}
.reasons h3{margin:0 0 4px;font:700 13px var(--mono)}
.reasons .row{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:8px;align-items:center;padding:2px 0;border-top:1px dashed var(--ink2);font-size:13px}
.reasons .row b{font-family:var(--mono);white-space:nowrap}
.notice{display:flex;align-items:center;gap:10px;padding:4px 14px;border-bottom:1.5px solid var(--ink);font-size:13.5px;flex:none;background:var(--card);min-height:34px}
.notice.tkt{background:var(--brass)}
.notice.dn{background:var(--paper2)}
.notice .grow{flex:1;min-width:0}
.notice b{font-family:var(--mono);font-size:12px}
.notice .no{color:var(--red);font-weight:700}
#board{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 14px;position:relative}
#board.lead{flex-direction:row}
#board.fork{box-shadow:inset 0 0 0 3px var(--green)}
#panes{flex:1;min-height:0;display:grid;gap:8px;grid-auto-flow:column;min-width:0}



.lead #panes{flex:0 0 38%}
.pane{border:2px solid var(--ink);background:var(--card);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.fork .pane{border-color:var(--green)}
.ph{display:flex;align-items:center;gap:8px;padding:2px 6px 2px 8px;border-bottom:2px solid var(--ink);background:var(--paper2);font:600 11.5px var(--mono);min-height:28px;flex:none}
.fork .ph{background:var(--greenbg);border-bottom-color:var(--green)}
.ph .nm{letter-spacing:.1em;font-weight:700}
.ph .org{color:var(--ink2);font-weight:500}
.ph .fr{margin-left:auto;background:var(--card);border:1.5px solid var(--ink);padding:0 6px;white-space:nowrap}
.ph .x{font-size:15px;line-height:1;padding:0 6px;min-height:24px;font-weight:700}
.pb{flex:1;min-height:0;position:relative;overflow:hidden}
.pcov{flex:none;display:flex;flex-wrap:wrap;gap:4px 8px;padding:3px 8px;border-top:1.5px dashed var(--ink);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(21,20,15,.06) 6px 7px);font-size:12.5px;align-items:center}
.pcov button{text-decoration:underline;text-underline-offset:3px;min-height:26px;padding:0 2px;font-weight:500;text-align:left}
.pcov .lb{font:700 10.5px var(--mono);letter-spacing:.08em;color:var(--ink2)}
.failcover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:18px;border:2px dashed var(--red);margin:8px;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(179,30,20,.07) 8px 9px)}
.failcover h4{margin:0;font:700 17px var(--sans);color:var(--red)}
.failcover p{margin:0;font-size:14px}
/* table */
.tbl{padding:8px 10px;height:100%;overflow:auto}
.tbl h4{margin:0 0 4px;font:600 12.5px var(--mono);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11px var(--mono);text-align:left;letter-spacing:.06em;color:var(--ink2);border-bottom:2px solid var(--ink);padding:2px 4px}
td{border-bottom:1px solid var(--ink2);padding:2px 4px;vertical-align:middle}
td.nw,.actc{white-space:nowrap}
td.n,th.n{text-align:right}
tr.chg td{background:rgba(199,162,72,.28)}
tr.sec th{padding-top:5px;font-size:10.5px}
tr.file td{background:var(--paper2);border-bottom:2px solid var(--ink)}
.tbl .cellbtn{min-height:24px;padding:1px 6px;display:inline-block;font-family:var(--mono);font-size:12.5px;font-weight:500;line-height:1.3}
.tbl .cellbtn.f,.followed{box-shadow:0 0 0 3px var(--brass) !important;outline:2px solid var(--ink) !important}
.actno{font:700 11.5px var(--mono);background:var(--brass);border:1.5px solid var(--ink);padding:0 5px;display:inline-block}
.money{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px}
.money div{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--ink2);padding:2px 0}
/* timeline */
.tlwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px}
.tlsvg{position:absolute;inset:0;width:100%;height:100%}
.tlm{position:absolute;font:500 1em/1.25 var(--mono);white-space:nowrap;min-height:1.8em;padding:.1em .5em;background:var(--card);transform:translate(0,-50%);text-align:left}
.tlm.ac{transform:translate(-50%,-50%)}.tlm.ar{transform:translate(-100%,-50%)}
.tlm.wrap{white-space:normal;width:13em}
.tlm.tick{font:700 1.2em var(--mono);background:var(--brass);border:2px solid var(--ink);min-height:1.7em;padding:0 .5em;box-shadow:2px 2px 0 var(--ink)}
.tlm.tick.ghost{background:var(--card);border-style:dashed;color:var(--ink2);box-shadow:none}
.tlm.tick.ghost:hover{background:var(--brass);color:var(--ink)}
.tlgroup{position:absolute;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.tlgroup .tlm{position:static;transform:none}
.tlm.refuse{border:2px solid var(--red);color:var(--red);font-weight:600}
/* direct */
#direct{flex:none;border:2px solid var(--ink);background:var(--card);display:flex;flex-direction:column;min-height:0;min-width:0}
.fork #direct{border-color:var(--green)}
#dhead{display:flex;align-items:center;gap:10px;padding:2px 6px 2px 8px;min-height:34px;background:var(--paper2);border-bottom:2px solid var(--ink);flex:none}
.fork #dhead{background:var(--greenbg);border-bottom-color:var(--green)}
#dhead .nm{font:700 11.5px var(--mono);letter-spacing:.1em}
#dhead #mcount{font-weight:700}
#receipt{flex:1;min-width:0;margin:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#direct.open #receipt,#direct.lead #receipt,#direct.collapsed #receipt{white-space:normal}
#direct.collapsed #dbody{display:none}
#direct.collapsed #dhead{border-bottom:0}
#dbody{overflow:auto;padding:6px 10px;min-height:0;flex:1;font-size:13.5px}
#direct.open{height:184px}
#direct.lead,#direct.open.lead{flex:1;min-width:0;height:auto}
.dcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 16px}
.lead .dcols{grid-template-columns:repeat(2,minmax(0,1fr))}
.dtabs{display:flex;gap:4px;margin:0 0 4px}
.dtabs button{border:1.5px solid var(--ink);padding:1px 10px;min-height:28px;font:600 12px var(--mono)}
.dtabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#dbody h4{margin:6px 0 2px;font:700 11px var(--mono);letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
#dbody h4:first-child{margin-top:0}
#dbody ul,#dbody ol{margin:0;padding:0;list-style:none}
#dbody li{padding:2px 0;border-bottom:1px dotted var(--ink2);position:relative}
#dbody ol li{padding:3px 0}
#dbody li.fact{padding-right:0}
.lead-w{font:700 11.5px var(--mono);margin-right:4px}
#dbody .v{font-weight:700}
.fbtn{font:600 11px var(--mono);border:1.5px solid var(--ink);padding:0 5px;margin-left:6px;min-height:22px;background:var(--card)}
.tkt-l{font:500 12px var(--mono)}
li.followed{background:rgba(199,162,72,.4);box-shadow:none !important;outline:2px solid var(--ink) !important}
.dc{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.dnote{color:var(--ink2);font-size:12.5px}
/* rig */
#rig{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 14px;border-top:2px solid var(--ink);background:var(--paper2);flex:none;align-items:center}
#rig .g{display:flex;gap:4px;align-items:center}
#rig .gl{font:700 10.5px var(--mono);letter-spacing:.08em;color:var(--ink2);margin-right:2px}
#rig .btn{min-height:32px;padding:2px 9px;font-size:13px;font-weight:600}
#status{flex:none;font:500 11px var(--mono);padding:2px 14px;background:var(--ink);color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* layers */
[data-cap]{position:relative}
body.real [data-cap]::before{content:attr(data-cap) " · " attr(data-ai);position:absolute;right:4px;top:-1px;z-index:30;background:var(--brass);border:1.5px solid var(--ink);font:700 9.5px var(--mono);padding:0 5px;letter-spacing:.04em;pointer-events:none;max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.howsheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;overflow:auto;background:var(--paper);border-top:2px solid var(--ink);padding:6px 10px;z-index:20;font-size:12.5px}
.howsheet h5{margin:0 0 3px;font:700 11px var(--mono);letter-spacing:.06em}
.howsheet div{display:flex;gap:6px;align-items:baseline;padding:1px 0;border-bottom:1px dotted var(--ink2)}
.howsheet .k{font:700 10.5px var(--mono);min-width:76px}
@media (prefers-reduced-motion:no-preference){.pane{transition:box-shadow .15s}}
.in{padding:0 2px}
.in[data-t=OBSERVED]{background:var(--ink);color:var(--paper);padding:0 4px}
.in[data-t=RECORDED]{border-bottom:3px double var(--ink)}
.in[data-t=AUTHORED]{outline:1.5px solid var(--ink);outline-offset:0;padding:0 4px}
.in[data-t=COMPUTED]{background:var(--tone);padding:0 4px}
.in[data-t=MODELED]{background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(21,20,15,.4) 4px 5px)}
.in[data-t=UNKNOWN]{border-bottom:2px dashed var(--ink)}
.in[data-t=SEALED]{border:1.5px dashed var(--ink);padding:0 4px}
.dcols2{display:grid;grid-template-columns:1.1fr 1fr;gap:6px 18px}
.voice{padding:10px 14px;height:100%;overflow:auto}
.vl{margin:0 0 6px;font-size:15px}
.vl.past{color:var(--ink2);font-size:13px}
.vnow{border-left:5px solid var(--brass);padding-left:10px;margin:8px 0}
.vpast{border-left:2px dashed var(--ink2);padding-left:10px;margin:0 0 6px}
#board.phone{max-width:440px;width:100%;margin:6px auto;border:6px solid var(--ink);border-radius:24px;padding:8px;background:var(--card)}
#board.phone #direct{order:-1;height:auto;max-height:52%}
#board.phone #panes{overflow:auto}
#board.voicedev #direct.collapsed{order:2}
.dc{align-items:center}
.pane .pb .tbl{position:absolute;inset:0}


.roomwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.roomslot{flex:1;min-height:0;position:relative}
.roombar{flex:none;padding:3px 6px;border-top:2px solid var(--ink);background:var(--paper2)}
.rb1{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rb2{display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin-top:3px}
.rb2 .lb,.dc .lb{font:700 10.5px var(--mono);letter-spacing:.08em;color:var(--ink2)}
.pill{border:1.5px solid var(--ink);padding:0 7px;min-height:24px;font:600 11.5px var(--mono);background:var(--card)}
.pill:hover{background:var(--brass)}
.stip{position:absolute;z-index:5;pointer-events:none;background-image:radial-gradient(var(--ink) 1px,transparent 1.5px);background-size:5px 5px}
.stip.t{left:0;right:0;top:0;height:8px}.stip.b{left:0;right:0;bottom:0;height:8px}.stip.l{top:0;bottom:0;left:0;width:8px}.stip.r{top:0;bottom:0;right:0;width:8px}
.compiler{flex:none;padding:4px 10px;border-top:2px solid var(--ink);background:var(--card);font-size:12.5px;position:relative}
.compiler ul{margin:2px 0 3px;padding-left:16px}
.ledger{position:absolute;inset:0;display:flex;flex-direction:column}
.mbox{flex:1;min-height:0;position:relative}
.ctable{flex:none;padding:2px 8px 4px;border-top:2px solid var(--ink)}
.ctable table{font-size:12.5px}
#board.phone #dhead{flex-wrap:wrap;row-gap:2px;padding-bottom:3px}
#board.phone #receipt{flex:1 1 100%;order:5;white-space:normal}
#board.phone #dctl{margin-left:auto}
#board.phone .dcols2,#board.phone .dcols{grid-template-columns:1fr}
#board.phone #direct{max-height:56%}
tr.ref td{background:rgba(179,30,20,.08);border-bottom:2px solid var(--red);font-size:13px}
.refb{white-space:normal;text-align:left}
.fcols{column-count:3;column-gap:18px}
.fcols .grp{break-inside:avoid;margin-bottom:4px}
.tlm.wrap{white-space:normal;width:13em}
.tlm.refuse.wrap{width:23em}
.tlgroup .tlm.wrap{width:23em}
.ledger.wide{flex-direction:row}
.ledger.wide .mbox{flex:1.5 1 0}
.ledger.wide .ctable{flex:1 1 0;border-top:0;border-left:2px solid var(--ink);overflow:auto}
#tools{display:flex;gap:6px;align-items:center}
#tools .tg{border:1px solid var(--paper);color:var(--paper);padding:0 8px;min-height:24px;font:600 11.5px var(--mono);text-decoration:none}
#tools .tg[aria-pressed=true]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
#tools .sep{width:1px;height:16px;background:var(--paper);opacity:.5;margin:0 4px}
#tools .tg:focus-visible{outline-color:var(--paper)}
#topstrip{height:30px}
</style>
</head>
<body>
<div id="topstrip"><button type="button" id="declare" data-act="declare" aria-pressed="false">Use Direct for screen readers and keyboard — remember it</button><span id="tools" data-cap="PROPOSED" data-ai="NO AI REQUIRED"></span></div>
<header id="hdr">
  <div class="brand"><span class="wm">CONCORDANCE</span><span class="sub">one ledger · every view</span></div>
  <div id="addr" class="addr" role="group" aria-label="Address"></div>
  <div class="levers"><div id="lever" class="lever" role="group" aria-label="Ledger position"></div><button type="button" class="btn brass" id="agreeBtn" data-act="agree" data-cap="PROPOSED" data-ai="NO AI REQUIRED">Do these agree?</button><button type="button" class="btn" id="forkBtn" data-act="fork">What if…</button></div>
</header>
<section id="plan" class="plan" aria-label="Plan" data-cap="PROPOSED" data-ai="NO AI REQUIRED (rule table)"></section>
<section id="reasons" class="reasons" hidden aria-label="The Plan's reasons"></section>
<div id="notices"></div>
<main id="board"><div id="panes"></div><aside id="direct" aria-label="Direct"><div id="dhead"><span class="nm">DIRECT</span><span id="mcount"></span><p id="receipt" role="status" aria-live="polite"></p><span id="dctl"></span></div><div id="dbody"></div></aside></main>
<footer id="rig" aria-label="Prototype rig"></footer>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<div id="status">PROTOTYPE · signal box · one ledger, every view · data: shared fixture, dated, verify · illustrative values are marked</div>
<script src="_shared/boston-fixture.js"></script>
<script>
(function(){
'use strict';
const FX=window.BOW_FIXTURE, W=FX.world;
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=v=>'$'+(Math.abs(v)/1e6).toFixed(1)+'M';
const DAYS=d=>d<0?'day −'+(-d):'day '+d;
function sha256(s){

      else if(A.pin||A.override)A.offer=null;
      break}
    case 'arrive':A.who=p.v;A.sr=A.sr;applyPlan();say='Plan for a '+p.v+'.';break;
    case 'declare':A.sr=!A.sr;try{localStorage.setItem('conc.sr',A.sr?'1':'')}catch(_){}applyPlan();say=A.sr?'Remembered on this device: Direct leads.':'Declaration cleared.';break;
    case 'device':A.device=p.v;applyPlan();break;
    case 'why':A.reasons=(A.reasons&&A.reasons.about===p.v)?null:{about:p.v};break;
    case 'swap':swapTo(p.v);A.override=true;A.quiet=true;A.reasons=null;say='Swapped: '+VN[p.v]+' leads. The router is quiet until the next moment.';break;
    case 'pair':A.reasons=null;if(p.v==='direct'){if(A.direct==='collapsed')A.direct='open'}else pairWith(p.v);A.override=true;A.quiet=true;A.offer=null;say=VN[p.v]+' paired.';break;
    case 'close':A.open=A.open.filter(v=>v!==p.v);if(!A.open.length)A.open=[ST.sys==='harrow'?'ledger':'table'];A.override=true;break;
    case 'pin':A.reasons=null;A.pin=A.pin?null:A.open.slice();say=A.pin?'Pinned on this device: '+A.open.map(v=>VN[v]).join(' and ')+'.':'Unpinned.';break;
    case 'reset':A.pin=null;applyPlan();say='Back to the router’s Plan.';break;
    case 'dmode':A.direct=p.v;break;
    case 'tab':A.tab=p.v;break;
    case 'follow':{if(A.follow&&A.follow.path===p.path){A.follow=null}else{A.follow={path:p.path,from:p.view};A.whyOpen=false;A.room.station=stationFor(p.path,A.room.station);if(A.direct==='collapsed')A.direct='open';if(A.direct==='open')A.tab='facts'}break}
    case 'unfollow':A.follow=null;A.whyOpen=false;break;
    case 'whyfact':A.whyOpen=!A.whyOpen;break;
    case 'agree':A.agree={at:S0.n,sys:ST.sys,hist:ST.active};break;
    case 'closeagree':A.agree=null;break;
    case 'inject':A.inject=A.inject?null:'timeline';if(A.inject&&!A.open.includes('timeline'))pairWith('timeline');say=A.inject?'A stale binding is now injected into the Timeline.':'Binding restored.';break;
    case 'rebind':A.inject=null;say='Timeline rebound to the record.';break;
    case 'how':A.how=!A.how;break;
    case 'real':A.real=!A.real;break;
    case 'fork':if(ST.sys==='boston'){ST.hist.branch=[];ST.active='branch';A.follow=null;A.compare=false;A.agree=null;say='Branch cut at act 41. The record is untouched.'}break;
    case 'return':ST.active='record';A.compare=false;A.follow=null;A.agree=null;say='Back on the record.';break;

    case 'takeoffer':if(A.offer){if(A.offer.view==='direct'){if(A.direct==='collapsed')A.direct='open'}else{pairWith(A.offer.view);if(ST.sys==='harrow'&&A.offer.view==='room')A.compiled=true}A.offer=null;A.override=true}break;

    case 'sys':{if(ST.sys!==p.v){ST.sys=p.v;A.follow=null;A.agree=null;A.offer=null;A.compare=false;A.inject=null;applyPlan()}break}

    case 'voice':if(p.v==='ask'){A.pending=p.file}else if(p.v==='cancel'){A.pending=null}break;

  return '<section class="pane" style="grid-column:1/-1"><div class="ph"><span class="nm">COMPARE</span><span class="org">branch beside the record</span><span class="fr">record act '+Sr.n+' · '+Sr.h4+'  |  branch act '+Sb.n+' · '+Sb.h4+'</span></div><div class="pb"><div class="tbl"><table><caption class="sr">What differs between the record and your branch</caption><thead><tr><th>What differs</th><th style="border-bottom-color:var(--ink)">The record · act '+Sr.n+'</th><th style="border-bottom-color:var(--green);color:var(--green)">Your branch · act '+Sb.n+'</th></tr></thead><tbody>'+rows+'</tbody></table><p class="dnote">'+(diff.length?diff.length+' facts differ. The record was not changed by anything you did in the branch.':'Nothing differs yet: the branch is still identical to the record at act 41. Act in the branch, then compare.')+' Weeks 7 to 9 are sealed in both.</p><div class="dc"><button type="button" class="btn" data-act="return">Return to the record</button><button type="button" class="btn" data-act="compare">Back to the branch</button></div></div></div></section>';
}
function fkOf(el){const d=el.dataset;return el.id?'#'+el.id:['b',d.act,d.file,d.view,d.path,d.id,d.v].join('|')}
function howSheet(reg,sm){
  const seen={},rows=reg.filter(b=>!seen[b.path]&&(seen[b.path]=1)).map(b=>{const f=sm[b.path]||{};return '<div><span class="k"><span class="sw" data-t="'+b.token+'"></span>'+b.token+'</span><span>'+esc(b.text)+'</span><span class="dnote">'+esc(f.src||'')+(f.asOf?' · as of '+f.asOf:'')+(f.note?' · '+esc(f.note):'')+'</span></div>'}).join('');
  return '<div class="howsheet"><h5>HOW DO WE KNOW · '+Object.keys(seen).length+' marks in this view</h5>'+rows+'</div>';
}
const CAPS={room:['PROPOSED · seed REAL (unmerged Room)','NO AI REQUIRED'],timeline:['PROPOSED','NO AI REQUIRED'],table:['PROPOSED','NO AI REQUIRED'],voice:['PROPOSED','SMALL / CHEAP MODEL (on-device speech)'],ledger:['PROPOSED','NO AI REQUIRED']};
/* ---------------------------------------------------------------- the one render: every open view redraws from state in the same frame */
function render(){
  const S=cur(),A=ST.ui,sm=smap(S);FRAME++;
  const active=document.activeElement,fk=active&&active.closest&&active.closest('button[data-act]')?fkOf(active.closest('button[data-act]')):null;
  document.body.classList.toggle('real',A.real);
  const B=$('#board');
  B.className=(A.direct==='lead'?'lead ':'')+(S.sys==='boston'&&ST.active==='branch'?'fork ':'')+(A.device==='phone'?'phone ':'')+(A.device==='voice'?'voicedev ':'');
  $('#addr').innerHTML=addrHTML(S);
  const lv=$('#lever');lv.innerHTML='<b>ACT '+S.n+'</b><i>'+S.h4+' · '+(S.sys==='boston'?(ST.active==='branch'?'branch':'record'):'record')+'</i>';lv.setAttribute('data-cap','REAL CURRENT (lockstep fold, prototype-grade)');lv.setAttribute('data-ai','NO AI REQUIRED');
  $('#forkBtn').textContent=ST.active==='branch'?'Return to the record':'What if…';$('#forkBtn').dataset.act=ST.active==='branch'?'return':'fork';$('#forkBtn').hidden=S.sys!=='boston';
  $('#declare').setAttribute('aria-pressed',A.sr);
  $('#plan').innerHTML=planHTML(S);
  const rs=$('#reasons');rs.innerHTML=reasonsHTML(S);rs.hidden=!A.reasons;
  regs={};const panes=$('#panes');panes.innerHTML='';panes.className='n'+(A.compare?1:A.open.length);const PW={room:1.05,table:.95,timeline:1.35,voice:.9,ledger:1.3};panes.style.gridTemplateColumns=(A.compare?'minmax(0,1fr)':A.open.map(id=>'minmax(0,'+(A.open.length===1?1:PW[id]||1)+'fr)').join(' '));
  const mounts=[];
  if(A.compare&&ST.active==='branch'){panes.innerHTML=compareHTML()}
  else A.open.forEach(id=>{
    const src=(A.inject===id)?staleOf(S):S;
    const out=VD[id].render(src,S);regs[id]=out.reg;
    const mism=mismatches(out.reg,src,S,sm);
    if(mism.length)failed[id]={at:S.n,mism:mism,reg:out.reg};else delete failed[id];
    const cv=coversFor(id,src,out.reg),cp=CAPS[id]||CAPS.timeline;
    const html='<section class="pane" data-view="'+id+'" data-cap="'+cp[0]+'" data-ai="'+cp[1]+'" aria-label="'+VN[id]+'"><div class="ph"><span class="nm">'+VN[id].toUpperCase()+'</span><span class="org">'+ORIGIN[id]+(id==='room'&&out.tier?' · '+out.tier:'')+(id==='ledger'?'':'')+'</span><span class="fr" title="'+esc(SYS[S.sys].name+' · '+(S.sys==='boston'?'Week 6':'day 0')+' · act '+src.n+' · '+src.h4)+'">'+(S.sys==='boston'?'Week 6':'day 0')+' · act '+src.n+' · '+src.h4+'</span><button type="button" class="x" data-act="close" data-v="'+id+'" aria-label="Close '+VN[id]+'">×</button></div><div class="pb" id="pb-'+id+'">'+(mism.length?failCover(id,src,S,mism):out.html)+(A.how&&!mism.length?howSheet(out.reg,sm):'')+'</div>'+(cv.length?'<div class="pcov" data-cap="PROPOSED (arena cover: REAL, unmerged)" data-ai="NO AI REQUIRED"><span class="lb">CANNOT SHOW</span>'+cv.map(c=>'<span>'+esc(c.words)+' <button type="button" data-act="cover" data-view="'+id+'" data-id="'+c.id+'">'+esc(c.hand)+'</button></span>').join('')+'</div>':'')+'</section>';
    panes.insertAdjacentHTML('beforeend',html);
    if(!mism.length&&out.mount)mounts.push([id,out.mount]);
  });
  /* Direct: the oracle. Always compiled, even when collapsed. */
  const dd=vDirect(S);regs.direct=dd.reg;
  const D=$('#direct');D.className=A.direct==='collapsed'?'collapsed':A.direct==='lead'?'open lead':'open';
  D.setAttribute('data-cap','PROPOSED (compiled from the Surface)');D.setAttribute('data-ai','NO AI REQUIRED');
  $('#mcount').textContent=sm['matters.open']?sm['matters.open'].text:'';
  const rc=receiptText(S);if($('#receipt').textContent!==rc)$('#receipt').textContent=rc;
  $('#dctl').innerHTML='<span class="fr" style="border:1.5px solid var(--ink);padding:0 6px;font:600 11.5px var(--mono);margin-right:6px;background:var(--card)">'+(S.sys==='boston'?'Week 6':'day 0')+' · act '+S.n+' · '+S.h4+' · compiled</span>'+(A.direct==='collapsed'?'<button type="button" class="btn sm" data-act="dmode" data-v="open">Open Direct</button>':(A.direct==='lead'?'<button type="button" class="btn sm" data-act="dmode" data-v="open">Dock</button>':'<button type="button" class="btn sm" data-act="dmode" data-v="collapsed">Collapse</button><button type="button" class="btn sm" data-act="dmode" data-v="lead">Lead</button>'));
  $('#dbody').innerHTML=A.direct==='collapsed'?'':dd.html;
  /* DOM order: Direct first when it leads (screen-reader order), else after the panes */
  if(A.direct==='lead')B.insertBefore(D,panes);else if(D.previousElementSibling!==panes)B.appendChild(D);
  $('#notices').innerHTML=noticesHTML(S);$('#notices').setAttribute('aria-live','polite');
  $('#rig').innerHTML=rigHTML();$('#tools').innerHTML=toolsHTML();
  mounts.forEach(m=>{const el=$('#pb-'+m[0]);if(el)m[1](el)});
  /* focus: keep the user's place; a followed fact takes Direct's focus */
  if(ST._focusFollow){ST._focusFollow=false;const li=$('#dbody li[data-p="'+(A.follow&&A.follow.path)+'"]');if(li){li.focus();try{li.scrollIntoView({block:'nearest'})}catch(_){}}}
  else if(fk){const el=$$('button[data-act]').concat($$('#declare')).find(e=>fkOf(e)===fk);if(el)el.focus()}
  document.body.setAttribute('data-frame',FRAME);
  if(ST._again&&!ST._re){ST._again=false;ST._re=true;try{render()}finally{ST._re=false}}
}
/* ---------------------------------------------------------------- events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.act==='follow'){const was=ST.ui.follow&&ST.ui.follow.path===d.path;act('follow',{path:d.path,view:d.view});if(!was){ST._focusFollow=true;render()}return}
  act(d.act,{file:d.file,view:d.view,path:d.path,id:d.id,v:d.v,via:d.via});
});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  if((e.key==='r'||e.key==='R')&&ST.sys==='boston'){act('pair',{v:'room'})}
  else if(e.key==='Escape'&&ST.ui.reasons){act('why',{v:ST.ui.reasons.about})}
});
let _rt;window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(render,120)});
try{if(localStorage.getItem('conc.sr')==='1')ST.ui.sr=true}catch(_){}
applyPlan();
window.CONCORDANCE={ST:ST,act:act,cur:cur,agreeCheck:agreeCheck};
render();
})();
</script>
