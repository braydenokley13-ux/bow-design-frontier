<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="_shared/boston-fixture.js"></script>
<style>
:root{
  --paper:#ebe8dd; --paper2:#e2dfd2; --tone:#cdc9b9;
  --ink:#161615; --ink2:#3b3a36; --ink3:#5a5852;
  --red:#b3271c; --red2:#7a1a13;
  --br:#0b5a4f; --brpaper:#dde9e2; --brtone:#bcd5c9; --br2:#1f6d61;
  --serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --kc:var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.38 var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--paper)}
.branch button:focus-visible,.branch input:focus-visible{outline-color:var(--br)}
h1,h2,h3,p{margin:0}
.mono,.lbl{font-family:var(--mono)}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:auto 1fr auto auto;height:100vh;min-height:0}
.mast{background:var(--paper);border-bottom:3px double var(--ink);padding:6px 20px 5px}
.r1{display:flex;align-items:center;gap:12px;min-height:44px}
.brand{font:700 25px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font:500 10px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.tools{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.tb{border:1.5px solid var(--ink);min-height:38px;padding:5px 10px;font:500 12px/1.2 var(--mono);letter-spacing:.02em;background:var(--paper);white-space:nowrap}
.tb:hover{background:var(--tone)}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip{border:1.5px solid var(--ink);padding:5px 9px;font:500 11.5px/1.2 var(--mono);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.led{background:var(--paper);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
.addr{display:flex;gap:10px;align-items:baseline;padding-top:3px;font:500 12.5px/1.35 var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden}
.addr .lbl{flex:none}
.addr .seg{overflow:hidden;text-overflow:ellipsis}
.addr .seg i{font-style:normal;color:var(--ink3);padding:0 5px}
.addr b{font-weight:600}
.addr.b b.br{color:var(--br)}

#stage{position:relative;overflow:auto;padding:12px 20px 12px;min-height:0}
.legend{display:none;gap:16px;align-items:center;padding:4px 20px;border-top:1px solid var(--ink);background:var(--paper2);font:500 11px/1.2 var(--mono);flex-wrap:wrap}
body.how .legend{display:flex}
.legend span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.status{border-top:1.5px solid var(--ink);padding:5px 20px;font:500 11px/1.3 var(--mono);color:var(--ink2);background:var(--paper);display:flex;gap:16px;white-space:nowrap;overflow:hidden}
.status b{color:var(--ink);font-weight:600}

/* ---------- truth grammar swatches ---------- */
.sw{display:inline-block;width:14px;height:14px;flex:none;border:1.5px solid var(--kc);box-sizing:border-box;vertical-align:-2px}
.k-OBSERVED{background:var(--kc)}
.k-RECORDED{background:var(--kc);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--kc)}
.k-AUTHORED{background:transparent}
.k-COMPUTED{background:var(--tone)}
.branch .k-COMPUTED{background:var(--brtone)}
.k-MODELED{background:repeating-linear-gradient(135deg,var(--kc) 0 1.3px,transparent 1.3px 4px)}
.k-GENERATED{background:radial-gradient(circle,var(--kc) 0.9px,transparent 1.2px) 0 0/4px 4px}
.k-UNKNOWN{border-style:dashed;background:transparent}
.fact{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:5px 0;border-bottom:1px solid rgba(22,22,21,.18);align-items:start}
.fact .sw{margin-top:3px}
.fl{font:500 10.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-right:6px}
.fv{font-size:14.5px}
.fv.tone{background:var(--tone);padding:0 4px}
.branch .fv.tone{background:var(--brtone)}
.how{display:none;font:400 10.5px/1.3 var(--mono);color:var(--ink3);margin-top:2px}
body.how .how{display:block}
.hole{display:inline-block;border:1.5px dashed var(--ink);padding:0 6px;font:400 12px/1.5 var(--mono);color:var(--ink2)}
.branch .hole{border-color:var(--br)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--paper);min-height:44px;padding:8px 14px;font:500 12.5px/1.25 var(--mono);letter-spacing:.02em}
.btn:hover{background:var(--tone)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--ink2)}
.btn[aria-disabled="true"]{border-style:dashed;color:var(--ink2);background:transparent}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.branch .btn{border-color:var(--br);background:var(--brpaper)}
.branch .btn:hover{background:var(--brtone)}
.branch .btn.pri{background:var(--br);color:var(--brpaper)}
.branch .btn[aria-pressed="true"]{background:var(--br);color:var(--brpaper)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:11.5px}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;transform:rotate(-2deg);background:var(--paper)}
.hr2{border:0;border-top:3px double var(--ink);margin:8px 0}

/* ---------- capability overlay ---------- */
[data-cap]{position:relative}
.captag{position:absolute;top:2px;right:2px;z-index:30;max-width:min(300px,94%);background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:2px 6px;font:500 9.5px/1.3 var(--mono);letter-spacing:.03em;text-transform:uppercase;pointer-events:none;box-shadow:2px 2px 0 var(--ink)}
.captag.prop{border-style:dotted;border-width:2px}
.captag.spec{border-style:dashed}
.captag.real{border-width:2.5px}
.captag em{font-style:normal;display:block;color:var(--ink2)}

/* ---------- rail ---------- */
.rail{display:grid;grid-template-columns:288px 1fr 322px;height:126px;background:var(--paper2);border-top:3px double var(--ink);position:relative}
.rail>div{position:relative;padding:7px 14px 6px;min-width:0}
.zA{border-right:1.5px solid var(--ink)}
.zC{border-left:1.5px solid var(--ink);padding:6px 10px 6px !important}
.zA .who{font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.slab{display:inline-block;background:var(--ink);color:var(--paper);font:600 25px/1 var(--mono);padding:5px 10px;letter-spacing:.03em;margin:3px 0 2px}
.slab.br{background:var(--br);color:var(--brpaper);font-size:21px}
.slab.dash{background:transparent;color:var(--ink);border:1.5px dashed var(--ink);font-size:17px}
.slab.frozen{background:transparent;color:var(--ink);border:2px solid var(--ink);font-size:20px}
.recbar{display:flex;align-items:center;height:12px;margin:3px 0 2px;width:100%}
.recbar i{display:block;height:8px}
.recbar .a{flex:1;background:var(--ink);box-shadow:0 3px 0 -2px var(--paper2), 0 4px 0 -1px var(--ink)}
.recbar .g{flex:0 0 26%;border-top:2px dashed var(--ink);border-bottom:2px dashed var(--ink);height:8px;border-left:0;border-right:0}
.rt{font:400 10.5px/1.3 var(--mono);color:var(--ink2)}
.zB{overflow:hidden}
.ruler{position:absolute;left:16px;right:16px;top:8px;bottom:6px}
.rline{position:absolute;left:0;height:0;border-top:2px solid var(--ink);top:54px}
.rline.dbl{border-top:3px double var(--ink)}
.rline.dsh{border-top:2px dashed var(--ink)}
.rline.brl{border-top:4px solid var(--br)}
.rtick{position:absolute;top:47px;width:0;height:15px;border-left:2px solid var(--ink)}
.rtick.br{border-color:var(--br)}
.rtl{position:absolute;font:500 10px/1.2 var(--mono);color:var(--ink2);white-space:nowrap;transform:translateX(-4px)}
.rnow{position:absolute;top:40px;width:0;height:30px;border-left:5px solid var(--ink)}
.door{position:absolute;top:0;min-height:44px;border:1.5px solid var(--ink);background:var(--paper);padding:3px 6px;font:500 10.5px/1.25 var(--mono);text-align:left}
.door:hover{background:var(--tone)}
.door small{display:block;font-weight:400;color:var(--ink2)}
.door.here{background:var(--ink);color:var(--paper)}
.door.here small{color:var(--paper)}
.doorstatic{position:absolute;border:1.5px solid var(--ink);background:var(--paper);padding:3px 6px;font:500 10.5px/1.25 var(--mono)}
.outc{position:absolute;height:15px;border:1.5px dashed var(--ink);font:400 9.5px/12px var(--mono);color:var(--ink2);padding:0 4px;white-space:nowrap;overflow:hidden}
.zA .actline,.ruler .note{font:400 10.5px/1.3 var(--mono);color:var(--ink2)}
.win{display:block;width:100%;height:100%;border:2px solid var(--ink);background:var(--paper);position:relative;overflow:hidden;padding:0}
.win .top{display:flex;justify-content:space-between;align-items:center;height:29px;padding:0 8px;font:500 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.win .top b{background:var(--ink);color:var(--paper);font:600 15px/1 var(--mono);padding:4px 7px;letter-spacing:.03em;text-transform:none}
.win .slats{height:44px;background:repeating-linear-gradient(180deg,var(--red) 0 8px,var(--red2) 8px 10px);display:flex;align-items:center;justify-content:center}
.win .slats span{background:var(--paper);color:var(--red);border:1.5px solid var(--red);padding:1px 8px;font:600 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.win .bot{padding:0 8px;font:500 10.5px/1.25 var(--mono);height:20px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.win:hover .top{background:var(--tone)}
.open-win{border:2px solid var(--ink);height:100%;padding:8px 10px;background:var(--paper);display:flex;flex-direction:column;justify-content:space-between}

/* ---------- NOW ---------- */
.now{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px;height:100%}
.now h1{font:700 30px/1.05 var(--serif)}
.now .sub{color:var(--ink2);margin:6px 0 8px;max-width:60ch}
.now h2,.h2{font:600 11.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--ink);padding-bottom:3px;margin:12px 0 5px}
.taxwrap{border:1.5px solid var(--ink);padding:8px 12px 7px;margin:10px 0}
.taxrow{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.taxrow div{min-width:150px}
.taxrow .n{font:600 20px/1.1 var(--mono)}
.tscale{position:relative;height:56px;margin:8px 4px 0}
.tscale .ln{position:absolute;left:0;right:0;top:14px;border-top:2px solid var(--ink)}
.tscale .mk{position:absolute;top:8px;width:0;height:14px;border-left:2px solid var(--ink)}
.tscale .mk.big{border-left-width:5px;top:5px;height:20px}
.tscale .ml{position:absolute;font:500 10px/1.2 var(--mono);white-space:nowrap;transform:translateX(-4px)}
.doorbox{border:1.5px solid var(--ink);padding:8px 12px;margin-bottom:8px;background:var(--paper)}
.doorbox.big{border-width:2px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:12px 16px}
.doorbox .q{font:italic 400 16.5px/1.3 var(--serif);margin:3px 0 8px}
.refuse{border:2px solid var(--red);background:var(--paper);padding:7px 10px;margin:6px 0;color:var(--ink)}
.refuse .stamp{margin-right:8px}
.refuse b{font-weight:600}
.slip{position:absolute;z-index:40;right:22px;bottom:70px;width:min(540px,calc(100% - 44px));background:var(--paper);border:2px solid var(--red);box-shadow:5px 5px 0 var(--red);padding:9px 12px}
.slip p{margin-top:5px}
.slip .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.wallitem{border:2px solid var(--br);border-left-width:10px;background:var(--brpaper);padding:6px 10px;margin-bottom:6px;color:var(--ink)}
.wallitem.ret{border-style:dashed;background:transparent;color:var(--ink2)}
.wallitem .t{font:600 11.5px/1.3 var(--mono);color:var(--br)}
.wallitem.ret .t{color:var(--ink2)}

/* ---------- ARRIVE ---------- */
.arrive{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
.arrive h1{font:700 32px/1.05 var(--serif)}
.arrive .q{font:italic 400 20px/1.3 var(--serif);margin:6px 0 12px}
.cutopt{display:block;width:100%;border:1.5px solid var(--ink);padding:10px 14px;margin:0 0 8px;min-height:60px;background:var(--paper)}
.cutopt b{font:600 14px/1.3 var(--mono);display:block}
.cutopt small{display:block;font:400 13.5px/1.35 var(--serif);color:var(--ink2);margin-top:2px}
.cutopt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cutopt[aria-pressed="true"] small{color:var(--paper)}
.cutopt:hover{background:var(--tone)}.cutopt[aria-pressed="true"]:hover{background:var(--ink2)}

/* ---------- CUT ---------- */
.cutview{position:relative}
.cuthead{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.cuthead h1{font:700 27px/1.05 var(--serif)}
.cuthead h1 small{font:italic 400 17px/1 var(--serif);color:var(--ink2);margin-left:8px}
.floor{font:400 11.5px/1.35 var(--mono);color:var(--ink2);max-width:46ch;text-align:right}
.planes{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.95fr);gap:12px}
.plane{border:2px solid var(--ink);padding:8px 12px 10px;min-height:0;background:var(--paper)}
.plane h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.plane h2 small{display:block;font:italic 400 13px/1.3 var(--serif);text-transform:none;letter-spacing:0;color:var(--ink2)}
.plane.books{box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:12px 16px 12px}
.plane.notyet{border-style:dashed;background:transparent;position:relative}
.plane.notyet .slot{border:1.5px dashed var(--ink);padding:5px 8px;margin:6px 0;font-size:13.5px}
.plane.notyet .slot .fl{display:block;margin:0 0 1px}
.plane.notyet .noline{font:500 12px/1.35 var(--mono);margin-top:8px;padding-top:6px;border-top:1.5px dashed var(--ink)}
.since{margin-top:10px;border:2px solid var(--ink);background:var(--paper2);padding:6px 12px;display:flex;gap:14px;align-items:center}
.since h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.since p{font-size:13.5px;color:var(--ink2);flex:1}
.since.open{background:var(--paper)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.edge{position:absolute;top:-2px;bottom:-2px;right:-15px;width:26px;border:0;cursor:ew-resize;background:transparent;z-index:5}
.edge span{position:absolute;left:11px;top:0;bottom:0;border-left:2px dashed var(--ink)}
.edge:hover span,.edge:focus-visible span{border-left:4px dashed var(--red)}
.edge b{position:absolute;top:50%;left:0;transform:translateY(-50%);width:26px;height:44px;background:var(--paper);border:1.5px solid var(--ink);font:600 12px/44px var(--mono);text-align:center}
.tagline{font:italic 400 14px/1.3 var(--serif);color:var(--ink2)}

/* ---------- SEAT ---------- */
.seat h1{font:700 26px/1.1 var(--serif)}
.seat .sub{color:var(--ink2);margin:3px 0 8px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px}
.actbtn{display:block;width:100%;border:1.5px solid var(--ink);padding:9px 12px;margin:0 0 8px;background:var(--paper);min-height:64px}
.actbtn b{display:block;font:500 14.5px/1.3 var(--serif);font-weight:700}
.actbtn small{display:block;font:400 11.5px/1.35 var(--mono);color:var(--ink2);margin-top:2px}
.actbtn:hover{background:var(--tone)}
.actbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.actbtn[aria-pressed="true"] small{color:var(--paper)}
.seatblk{border:2px solid var(--ink);padding:8px 12px;margin-bottom:8px}
.seatblk.set{border-style:solid;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink)}
.seatblk.unset{border-style:dashed}
.seatblk h3{font:600 12px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.seatblk .why{font-size:13px;color:var(--ink2);margin:2px 0 6px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .btn{min-height:40px;padding:5px 10px}
.decl{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.assump{border:1.5px solid var(--ink);padding:6px 10px;margin:8px 0;font-size:13.5px}
.assump li{margin:2px 0}
ul.plain{margin:0;padding-left:18px}

/* ---------- BRANCH ---------- */
.bview{display:grid;grid-template-rows:auto auto;gap:10px}
.frames{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px}
.frame{padding:8px 14px 10px;position:relative}
.frame.rec{border:2px solid var(--ink);background:var(--paper);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:12px 18px 10px}
.frame.branch{--kc:var(--br);border:2px solid var(--br);border-left:12px solid var(--br);background:var(--brpaper);color:var(--ink);box-shadow:5px 5px 0 rgba(11,90,79,.25)}
.frame h2{font:600 12px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.frame.branch h2{color:var(--br)}
.clk{display:flex;align-items:baseline;gap:10px;margin:3px 0 4px;flex-wrap:wrap}
.clk .d{font:600 20px/1.1 var(--mono)}
.frame.branch .clk .d{color:var(--br)}
.bstamp{border:2px solid var(--br);background:var(--brpaper);padding:5px 9px;margin:4px 0 6px;font:500 11.5px/1.4 var(--mono);color:var(--ink)}
.bstamp b{color:var(--br);font-weight:600}
.pin{display:inline-block;border:1.5px solid var(--br);padding:0 6px;font-weight:600;background:var(--paper)}
.shut{margin-top:6px;height:22px;background:repeating-linear-gradient(180deg,var(--red) 0 6px,var(--red2) 6px 8px);display:flex;align-items:center;justify-content:center}
.shut span{background:var(--paper);color:var(--red);border:1.5px solid var(--red);padding:0 8px;font:600 10px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.paceb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.seambar{border-top:3px double var(--ink);padding-top:6px;position:relative}
.seambar>.stitch{position:absolute;left:0;right:0;top:-6px;border-top:2px dashed var(--ink)}
.seambar h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;display:flex;gap:12px;align-items:baseline}
.seambar h2 small{font:italic 400 13px var(--serif);text-transform:none;letter-spacing:0;color:var(--ink2)}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark{display:grid;grid-template-columns:1fr 92px 1fr;border:1.5px solid var(--ink);background:var(--paper);min-height:78px}
.mark .side{padding:5px 9px;font-size:12.5px;line-height:1.3}
.mark .side.r{border-right:1.5px solid var(--ink)}
.mark .side.b{background:var(--brpaper);border-left:1.5px solid var(--br);color:var(--ink)}
.mark .side .lbl{display:block;margin-bottom:1px}
.mark .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center;background:var(--paper2)}
.verd{font:600 11px/1.15 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 4px;border:2px solid var(--ink);background:var(--paper);width:100%;text-align:center}
.verd.stitched{border-style:solid;border-width:2px;background:repeating-linear-gradient(90deg,var(--paper) 0 5px,var(--tone) 5px 8px)}
.verd.pulled{border-style:solid;background:repeating-linear-gradient(135deg,var(--paper) 0 4px,var(--tone) 4px 6px)}
.verd.torn{border-style:dashed;border-width:2px;clip-path:polygon(0 8%,8% 0,16% 10%,26% 0,36% 8%,46% 0,58% 10%,70% 0,82% 8%,92% 0,100% 10%,100% 100%,92% 92%,82% 100%,70% 90%,58% 100%,46% 92%,36% 100%,26% 90%,16% 100%,8% 92%,0 100%);padding-top:6px;padding-bottom:6px}
.verd.open{border-style:dashed;background:transparent}
.mid .mini{font:400 9.5px/1.2 var(--mono);color:var(--ink2)}
.marks.empty{display:block;font:italic 400 14px var(--serif);color:var(--ink2);border:1.5px dashed var(--ink);padding:14px 16px}

/* ---------- SHEETS ---------- */
.scrim{position:absolute;inset:0;background:rgba(235,232,221,.55);z-index:50}
.sheet{position:absolute;top:0;right:0;bottom:0;z-index:60;width:min(560px,96%);background:var(--paper);border-left:4px double var(--ink);box-shadow:-8px 0 0 rgba(22,22,21,.14);padding:12px 18px 14px;overflow:auto}
.sheet.wide{width:min(1000px,98%)}
.sheet h1{font:700 22px/1.1 var(--serif)}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.since-i{padding:6px 0;border-bottom:1px solid rgba(22,22,21,.25);display:grid;grid-template-columns:88px 1fr;gap:10px}
.since-i .dt{font:500 11.5px/1.35 var(--mono);color:var(--ink2)}
.since-i .hand{font:600 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;margin-bottom:1px}
.since-i.fact .tx{font:400 13px/1.4 var(--mono)}
.since-i.corr .tx{font:italic 400 14px/1.35 var(--serif);border-left:3px double var(--ink);padding-left:8px}
.since-i.arg .tx{font:italic 400 14.5px/1.4 var(--serif);border-left:5px solid var(--ink);padding-left:8px;background:linear-gradient(90deg,var(--paper2),transparent)}
.since-i .src{font:400 10.5px/1.3 var(--mono);color:var(--ink3);margin-top:2px}
.backs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.backcol{padding:8px 12px 10px;min-height:280px}
.backcol h2{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.backcol .k{font:italic 400 13px/1.3 var(--serif);color:var(--ink2);margin:1px 0 6px}
.bc-trail{border:1.5px dashed var(--ink3);background:transparent}
.bc-trail li{font-family:var(--mono);font-size:11.5px;padding:2px 0;border-bottom:1px dashed var(--ink3);list-style:none}
.bc-trail ul,.bc-rec ul,.bc-acts ul{margin:4px 0 8px;padding:0}
.bc-trail li.cur{font-weight:600;background:var(--tone)}
.bc-rec{border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink)}
.bc-rec li{font:400 12px/1.35 var(--serif);padding:2px 0;list-style:none;border-bottom:1px solid rgba(22,22,21,.25)}
.bc-rec li.cur{font-weight:700;background:var(--tone)}
.bc-rec li.hid{color:var(--ink3);font-family:var(--mono);font-size:11px}
.bc-acts{border:2px solid var(--br);background:var(--brpaper)}
.bc-acts li{list-style:none;padding:3px 0;border-bottom:1px solid var(--br);font-size:13px}
.bc-acts li em{font:italic 400 15px/1.2 var(--serif);color:var(--br)}
.sig{font:italic 400 15px var(--serif);border-bottom:1.5px solid var(--ink);display:inline-block;padding:0 6px}
.whyl{position:relative;padding:5px 0 5px 22px;border-left:2px solid var(--ink);margin-left:8px}
.whyl::before{content:"";position:absolute;left:-2px;top:14px;width:16px;border-top:2px solid var(--ink)}
.whyl.dash{border-left-style:dashed}
.whyl.dash::before{border-top-style:dashed}
.whyl .t{font-size:14px}
.whyl .m{font:400 11px/1.3 var(--mono);color:var(--ink2)}
.whyl .id{font:600 10.5px/1 var(--mono);border:1.5px solid var(--ink);padding:1px 5px;margin-right:6px;display:inline-block}

/* ---------- scrubber baseline ---------- */
.scrub{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px}
.scrub h1{font:700 26px/1.1 var(--serif)}
.scrub input[type=range]{width:100%;height:44px;margin:10px 0 0;accent-color:var(--ink)}
.strack{position:relative;height:70px;border-top:2px solid var(--ink);margin-top:2px}
.strack .n{position:absolute;top:2px;font:500 10px/1.25 var(--mono);width:120px;transform:translateX(-4px);border-left:2px solid var(--ink);padding-left:4px}
.strack .n.r2{top:32px}
.leak{border:3px solid var(--red);padding:8px 12px;margin-top:10px;background:var(--paper)}
.leak .num{font:700 34px/1 var(--mono);color:var(--red)}
.leak.ok{border-color:var(--ink)}
.leak.ok .num{color:var(--ink)}
.cmp{border:2px solid var(--ink);padding:8px 12px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--ink);padding:12px 16px}

/* ---------- HIST ---------- */
.hist h1{font:700 32px/1.05 var(--serif)}
.hist .frozen{border:2px solid var(--ink);padding:10px 14px;margin-top:10px;max-width:760px}

@media (prefers-reduced-motion:no-preference){
  .flash{animation:fl 1.1s ease-out 1}
  @keyframes fl{0%{background:var(--ink);color:var(--paper)}100%{background:var(--brtone);color:var(--ink)}}
}
@media (max-width:1300px){
  .rail{grid-template-columns:270px 1fr 300px}
  .now h1{font-size:27px}
  #stage{padding:10px 16px}
  .mast{padding:5px 16px 4px}
  .tb{padding:5px 8px;font-size:11.5px}
  .tools{gap:5px}
  .brand small{display:none}
}
</style>

<body>
<div id="app">
  <header class="mast" id="mast"></header>
  <main id="stage" tabindex="-1" aria-label="Stage"></main>
  <div class="legend" id="legend" aria-label="Texture legend"></div>
  <footer>
    <div class="rail" id="rail" aria-label="Horizon rail"></div>
    <div class="status" id="status"></div>
  </footer>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(function () {
'use strict';
var FX = window.BOW_FIXTURE, DL = FX.cuts.deadline2026, NOW = FX.meta.now;

/* ================= helpers ================= */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOWN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function p2(n){ return (n < 10 ? '0' : '') + n; }
function pd(s){ var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function fd(s){ if (!s) return '[verify: date]'; var p = s.split('-'); return (+p[2]) + ' ' + MON[+p[1] - 1] + ' ' + p[0]; }
function fs(s){ var p = s.split('-'); return (+p[2]) + ' ' + MON[+p[1] - 1]; }
function dd(a, b){ return Math.round((pd(b) - pd(a)) / 864e5); }
function addd(s, n){ var d = new Date(pd(s) + n * 864e5); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
function dow(s){ return DOWN[new Date(pd(s)).getUTCDay()]; }
function M(n, dp){ return '$' + (n / 1e6).toFixed(dp == null ? 1 : dp) + 'M'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function AF(v, k, src, note){ return { v: v, k: k || 'AUTHORED', src: src || 'this prototype · illustrative', asOf: null, verify: false, note: note || null }; }
function howOf(f){ return f.k + ' · ' + (f.src || 'no source') + ' · as of ' + (f.asOf ? fd(f.asOf) : 'undated') + (f.verify ? ' · verify' : '') + (f.note ? ' — ' + f.note : ''); }
function fact(f, label, val, cls){
  var hole = (f.v == null && val == null);
  var v = hole ? '<span class="hole">' + esc(f.note || '[verify]') + '</span>' : (val != null ? val : esc(f.v));
  return '<div class="fact"><span class="sw k-' + f.k + '" aria-hidden="true"></span><div class="fb"><span class="fl">' + label + '</span><span class="fv ' + (f.k === 'COMPUTED' ? 'tone' : '') + ' ' + (cls || '') + '">' + v + '</span><span class="how">' + esc(howOf(f)) + '</span></div></div>';
}
function findState(rx){ for (var i = 0; i < DL.state.length; i++) if (rx.test(DL.state[i].what)) return DL.state[i]; return null; }
function findKnown(rx){ for (var i = 0; i < DL.known.length; i++) if (rx.test(DL.known[i].what)) return DL.known[i]; return null; }
function cap(k, c, cost){ return ' data-cap="' + k + '" data-cost="' + esc(cost || 'NO AI REQUIRED') + '" data-capc="' + esc(c || '') + '"'; }

/* ================= fixture bindings ================= */
var TAXROW = findState(/Projected luxury tax/);
var TAX0 = TAXROW.value.v;
var TRADE_TXT = DL.sealed[0].value.v.split(';')[0];              // "Simons to Chicago for Vučević"
var taxAfterM = (DL.sealed[0].value.v.match(/→\s*(≈\s*\$[\d.]+M)/) || [0, ''])[1];
var CUTS = {
  '0202': { id: '0202', date: DL.beforeFirstReport.date, label: DL.beforeFirstReport.label, short: '2 Feb · before the first report', knows: false },
  '0205': { id: '0205', date: DL.date, label: DL.label, short: '5 Feb · deadline day (the move was already reported)', knows: true }
};
var DOORQ = 'What does Boston do about a ≈' + M(TAX0) + ' tax bill?';
var DOORT = 'Deadline week, Feb 2026';
var EVENTS = [
  { id: 'report', date: DL.firstReport.v, fact: DL.firstReport, text: 'Reported: ' + TRADE_TXT },
  { id: 'simons', date: DL.sealed[0].date, fact: DL.sealed[0].value, text: DL.sealed[0].value.v, grade: 'simons' },
  { id: 'tatum', date: DL.sealed[1].date, fact: DL.sealed[1].value, text: 'Tatum ' + DL.sealed[1].value.v.replace(/^Returns/, 'returns'), grade: 'tatum' },
  { id: 'season', date: null, fact: DL.sealed[2].value, text: DL.sealed[2].value.v },
  { id: 'playoffs', date: null, fact: DL.sealed[3].value, text: DL.sealed[3].value.v },
  { id: 'brown', date: DL.sealed[4].date, fact: DL.sealed[4].value, text: DL.sealed[4].what + ' — ' + DL.sealed[4].value.v }
];
function EV(id){ for (var i = 0; i < EVENTS.length; i++) if (EVENTS[i].id === id) return EVENTS[i]; }
var DEADLINE_TIME = (findKnown(/deadline closes/) || { value: { v: '3 p.m. ET [verify: time]' } }).value.v;
var L2526 = FX.league.season2526;

/* the record the Backs sheet steps through (dated changes, observer's view) */
var RECORD = FX.moments.map(function (m) { return { date: m.date, text: m.sealed.v.split('.')[0] + '.', f: m.sealed }; });
RECORD.push({ date: DL.sealed[4].date, text: DL.sealed[4].what + ': ' + DL.sealed[4].value.v, f: DL.sealed[4].value });
RECORD.sort(function (a, b) { return a.date < b.date ? -1 : 1; });

/* ================= simplified tax model (AUTHORED, illustrative) ================= */
var RATES = [1.5, 1.75, 2.5, 3.25, 3.75, 4.25, 4.75, 5.25];
function taxFor(over){ if (over <= 0) return 0; var t = 0, rem = over, i = 0; while (rem > 0 && i < RATES.length) { var w = Math.min(rem, 5e6); t += w * RATES[i]; rem -= w; i++; } return t; }
function overFor(tax){ var lo = 0, hi = 60e6; for (var i = 0; i < 60; i++) { var m = (lo + hi) / 2; if (taxFor(m) < tax) lo = m; else hi = m; } return (lo + hi) / 2; }
var OVER0 = overFor(TAX0);
var TAXNOTE = 'first-time payer rates, simplified, illustrative — payroll at the deadline is [verify]';

/* ================= the legal action space (AUTHORED, illustrative) ================= */
var ACTS = {
  keep: { label: 'Keep the roster. Pay the tax.', small: 'Nothing is traded. No other club is asked.', dSal: 0, simons: 'kept', touches: ['tatum'], short: 'kept the roster and paid' },
  shed: { label: 'Shed a bench salary with a second-round pick.', small: 'Another club has to take the salary. Your pick is the sweetener. Simons stays.', dSal: -4.0e6, simons: 'kept', touches: ['club', 'tatum'], short: 'shed a bench salary with a second-round pick' },
  swap: { label: 'Look for a cheaper big in exchange for Simons.', small: 'Another club has to want Simons. A cheaper big comes back.', dSal: -6.0e6, simons: 'gone', touches: ['club', 'tatum'], short: 'looked for a cheaper big in exchange for Simons' }
};
var SEATS = {
  club: { name: 'Another club', why: 'The act needs a partner. Which club is yours to name later; its answer is not on any record before the cut.' },
  tatum: { name: 'Tatum and his medical timeline', why: 'The plan only makes sense against a date he is back. Nobody at this desk has one.' }
};
var DECL = {
  club: [{ v: 'accepts', t: 'Accepts the deal' }, { v: 'declines', t: 'Declines the deal' }],
  tatum: [{ v: 'back', t: 'Back before the regular season ends' }, { v: 'out', t: 'Out for the season' }]
};

/* ================= canonical state ================= */
var S = {
  view: 'now', tick: 0, leftAt: null,
  doorOpen: null, following: false,
  cutId: '0202',
  refusal: null,
  observer: { asked: false, through: null },
  hindsight: { declared: false },
  seat: { act: null, council: { club: null, tatum: null } },
  branches: [], activeId: null, nextN: 1,
  overlay: null,
  tog: { how: false, real: false, scrub: false },
  scrub: { pos: '2026-02-02' },
  trail: [], fwd: [], log: [], sig: 0,
  recPtr: RECORD.length - 1,
  histId: null, flash: false
};
var T0 = 14 * 3600 + 3 * 60;
function clockStr(extra){ var t = T0 + S.tick + (extra || 0); return p2(Math.floor(t / 3600) % 24) + ':' + p2(Math.floor(t / 60) % 60) + ':' + p2(t % 60); }
var REC_THRU = '13:41';  // AUTHORED, illustrative: recorded through
function lagMin(){ return Math.floor((T0 + S.tick - (13 * 3600 + 41 * 60)) / 60); }

function cut(){ return CUTS[S.cutId]; }
function actBranch(){ for (var i = 0; i < S.branches.length; i++) if (S.branches[i].id === S.activeId) return S.branches[i]; return null; }

/* ================= the log + trail ================= */
function ctx(){
  var b = actBranch();
  if (S.view === 'branch' && b) return { clock: b.n + ' · ' + fd(b.date), hist: 'branch ' + b.n, who: 'you · seat Boston' };
  if (S.view === 'cut') return { clock: 'cut ' + fd(cut().date) + ' (stopped)', hist: 'record', who: 'you · observer' };
  if (S.view === 'seat') return { clock: 'cut ' + fd(cut().date) + ' (stopped)', hist: 'record', who: 'you · seat Boston' };
  if (S.view === 'arrive') return { clock: 'door (not a moment)', hist: 'record', who: 'you · observer' };
  if (S.view === 'hist') return { clock: 'frozen · no NOW', hist: 'record 1985–86', who: 'you · observer' };
  return { clock: 'Reality NOW', hist: 'record', who: 'you · observer' };
}
function L(kind, text, signed){
  var c = ctx();
  S.log.push({ n: S.log.length + 1, kind: kind, text: text, clock: c.clock, hist: c.hist, who: c.who, signed: !!signed });
  if (signed) S.sig++;
}
function trailPush(label, extra){
  var last = S.trail[S.trail.length - 1];
  var e = { view: S.view, label: label, sig: S.sig, cutId: S.cutId, branchId: S.activeId, hist: S.histId };
  if (last && last.label === label && last.branchId === e.branchId) return;
  S.trail.push(e); S.fwd = [];
}
function go(view, label, quiet){
  if (S.view === 'now' && view !== 'now') S.leftAt = S.tick;
  S.view = view; S.overlay = null; S.doorOpen = view === 'now' ? S.doorOpen : null;
  trailPush(label);
}
function announce(msg){ var el = document.getElementById('live'); el.textContent = ''; setTimeout(function () { el.textContent = msg; }, 40); }
function refuse(rule, text, extra){ S.refusal = { rule: rule, text: text, extra: extra || null, view: S.view }; L('refusal', 'Refused — ' + rule); announce('Refused. ' + rule); }

/* ================= branch model ================= */
function clubAns(b){
  if (ACTS[b.act].touches.indexOf('club') < 0) return 'na';
  var c = b.council.club; if (!c) return 'unknown';
  if (c.mode === 'declare') return c.v;            // accepts | declines
  return 'unknown';
}
function simonsStatus(b){
  var a = ACTS[b.act]; if (a.simons === 'kept') return 'kept';
  var c = clubAns(b); return c === 'accepts' ? 'gone' : c === 'declines' ? 'kept' : 'unknown';
}
function bnums(b){
  var a = ACTS[b.act], c = clubAns(b), delta = 0, tax = null, known = true;
  if (c === 'accepts') delta = a.dSal;
  if (c === 'unknown') known = false;
  var over = OVER0 + delta;
  tax = known ? taxFor(over) : null;
  var dl = dd(b.date, DL.date);
  return { delta: delta, over: known ? over : null, tax: tax, known: known, daysLeft: dl, locked: b.date > DL.date, simons: simonsStatus(b), club: c };
}
function tatumText(b){
  var t = b.council.tatum; if (!t) return null;
  if (t.mode === 'recorded') return { v: 'Out — right Achilles rupture; no return date on the record', k: 'RECORDED' };
  if (t.mode === 'declare') return { v: t.v === 'back' ? 'Assumed back before the regular season ends' : 'Assumed out for the season', k: 'AUTHORED' };
  return { v: null, k: 'UNKNOWN' };
}
function assumptions(b){
  var a = ACTS[b.act], out = [];
  var ss = simonsStatus(b);
  out.push({ t: ss === 'kept' ? 'Boston keeps Simons.' : ss === 'gone' ? 'Simons leaves Boston at the cut.' : 'Where Simons is depends on an answer nobody has.', k: ss === 'unknown' ? 'UNKNOWN' : 'AUTHORED', key: 'simons' });
  if (a.touches.indexOf('club') >= 0) {
    var c = b.council.club;
    out.push({ t: c && c.mode === 'declare' ? 'Another club ' + (c.v === 'accepts' ? 'accepts' : 'declines') + ' the deal (declared).' : 'Another club’s answer stays unknown.', k: c && c.mode === 'declare' ? 'AUTHORED' : 'UNKNOWN', key: 'club' });
  }
  var t = tatumText(b);
  out.push({ t: 'Tatum: ' + (t.v || 'no answer — left unknown') + '.', k: t.k, key: 'tatum' });
  out.push({ t: 'Rules: the 2025–26 lines; tax at ' + TAXNOTE.split(' —')[0] + '.', k: 'AUTHORED', key: 'rules' });
  return out;
}
function hindStamp(){ return S.observer.asked ? 'through ' + fd(S.observer.through) : S.hindsight.declared ? 'self-declared' : 'none'; }

function seen(ev, b){ var c = CUTS[b.cutId]; return ev.date && (ev.date < c.date || (b.date > c.date && ev.date <= b.date)); }
function arrived(ev, b){ var c = CUTS[b.cutId]; return ev.date && b.date > c.date && ev.date >= c.date && ev.date <= b.date; }
function grade(ev, b){
  var m = { ev: ev, real: ev.text, rf: ev.fact };
  if (ev.grade === 'simons') {
    var ss = simonsStatus(b);
    m.rlabel = 'Reality · ' + fs(ev.date);
    if (ss === 'kept') { m.v = 'PULLED'; m.sub = 'diverged'; m.bt = 'Assumed: Boston keeps Simons (your act: ' + ACTS[b.act].short + ').'; m.plain = 'Reality did something your branch held fixed. You did not cause it.'; m.bk = 'AUTHORED'; }
    else if (ss === 'gone') { m.v = 'TORN'; m.sub = 'impossible'; m.bt = 'Simons had already left in your branch, at the cut. That trade has nobody to trade.'; m.plain = 'Reality did something your branch has no room for. You did not cause it.'; m.bk = 'AUTHORED'; }
    else { m.v = 'OPEN'; m.sub = 're-declare'; m.bt = 'Your branch never said where Simons was. Reality did.'; m.plain = 'Your branch left this unknown, so nothing here is held or broken.'; m.bk = 'UNKNOWN'; }
  } else {
    var t = b.council.tatum; m.rlabel = 'Reality · ' + fs(ev.date);
    if (t && t.mode === 'declare' && t.v === 'back') { m.v = 'STITCHED'; m.sub = 'held'; m.bt = 'Assumed: Tatum back before the regular season ends.'; m.plain = 'Reality did what your branch assumed.'; m.bk = 'AUTHORED'; }
    else if (t && t.mode === 'declare') { m.v = 'PULLED'; m.sub = 'diverged'; m.bt = 'Assumed: Tatum out for the season.'; m.plain = 'Reality moved off your assumption. You did not cause it.'; m.bk = 'AUTHORED'; }
    else if (t && t.mode === 'recorded') { m.v = 'OPEN'; m.sub = 're-declare'; m.bt = 'Assumed: what the record said at the cut, out and no date.'; m.plain = 'The record now has a date your branch never had.'; m.bk = 'RECORDED'; }
    else { m.v = 'OPEN'; m.sub = 're-declare'; m.bt = 'Your branch left Tatum’s timeline unknown.'; m.plain = 'Nothing held, nothing broken. Reality now has an answer.'; m.bk = 'UNKNOWN'; }
  }
  return m;
}
function seam(b){ var out = []; EVENTS.forEach(function (ev) { if (ev.grade && arrived(ev, b)) out.push(grade(ev, b)); }); return out; }
function branchLimit(b){ return addd(CUTS[b.cutId].date, 42); }

/* the record at a date: what Reality's record says (observer floor) */
function recordRows(D, c){
  var fake = { cutId: c.id, date: D };
  var rows = [];
  var sim = EV('simons'), rep = EV('report'), tat = EV('tatum');
  var s0 = findState(/Simons/), t0 = findState(/Tatum/);
  var simTxt = s0.value.v, simF = s0.value;
  if (seen(sim, fake)) { simTxt = sim.text; simF = sim.fact; }
  else if (seen(rep, fake)) { simTxt = s0.value.v + ' — reported ' + fs(rep.date) + ' (trade to Chicago, not yet signed)'; simF = rep.fact; }
  rows.push({ f: simF, l: 'Simons', v: simTxt });
  var tatTxt = t0.value.v, tatF = t0.value;
  if (seen(tat, fake)) { tatTxt = tat.text + ' (' + fs(tat.date) + ')'; tatF = tat.fact; }
  rows.push({ f: tatF, l: 'Tatum', v: tatTxt });
  var taxTxt = '≈' + M(TAX0), taxF = TAXROW.value;
