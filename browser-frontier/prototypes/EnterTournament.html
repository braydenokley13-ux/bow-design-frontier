<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enter Tournament — seven ways across one threshold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--table:#E6E1D3;--paper:#FCFAF4;--paper2:#F3EFE3;--ink:#1E1C19;--ink2:#46423B;--mute:#62594D;--rule:#C9C1AD;--dot:#8D8574;--fork:#0D5B62;--forkbg:#E3EFED;--stamp:#9A2A1C;--brass:#7C5E14;--kraft:#D9C6A0;--focus:#B4470C;
--serif:Fraunces,Georgia,'Times New Roman',serif;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--table);color:var(--ink);font:15px/1.42 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1.5px solid var(--ink);background:var(--paper);min-height:54px;flex:none}
.brand{font:600 21px/1 var(--serif);letter-spacing:.005em;margin:0}
.brand small{display:block;font:500 11.5px var(--sans);color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin-top:4px}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
main{flex:1;min-height:0;display:flex;gap:14px;padding:12px 16px}
main.board,main.compare{display:block;overflow:auto;padding:14px 16px}
.status{flex:none;display:flex;gap:14px;align-items:center;padding:3px 16px;font:12px var(--mono);border-top:1.5px solid var(--ink);background:var(--paper);color:var(--ink2);min-height:27px;flex-wrap:wrap}
.status .clk{margin-left:auto}
.status .legend{display:none;gap:10px;align-items:center;font:11px var(--sans)}
.how .status .legend{display:flex}
/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 16px;border:1.5px solid var(--ink);background:var(--paper);font:600 14px/1.25 var(--sans);cursor:pointer;text-align:center;border-radius:2px}
.b:hover{background:var(--paper2)}
.b.sm{min-height:36px;padding:4px 12px;font-size:13px}
.b.pri{background:var(--ink);color:var(--paper)}
.b.pri:hover{background:#3a3631}
.b.fk{background:var(--fork);border-color:var(--fork);color:#fff}
.b.fk:hover{background:#0a4a50}
.b.on{background:var(--ink);color:var(--paper)}
.b[aria-pressed=true]:not(.fk):not(.pri){background:var(--ink);color:var(--paper)}
.b[aria-disabled=true]{border-style:dashed;color:var(--mute);background:transparent}
.b.stampb{border-color:var(--stamp);color:var(--stamp)}
/* truth textures */
.tx{display:inline-block;width:13px;height:13px;vertical-align:-1px;margin-right:6px;flex:none;background:transparent}
.tx-OBSERVED{background:var(--ink)}
.tx-RECORDED{background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3.5px var(--ink)}
.tx-AUTHORED{border:1.6px solid var(--ink)}
.tx-COMPUTED{background:#A79F8B}
.tx-MODELED{background:repeating-linear-gradient(135deg,var(--ink) 0 1.2px,transparent 1.2px 3.5px);border:1px solid var(--ink)}
.tx-GENERATED{background:radial-gradient(var(--ink) 1.1px,transparent 1.4px) 0 0/4px 4px;border:1px solid var(--ink)}
.tx-UNKNOWN{border:1.6px dashed var(--ink)}
.fact{display:inline}
.fw{display:none!important}
.how .fw{display:block!important;font:11.5px/1.3 var(--sans);color:var(--mute);margin:1px 0 3px 19px}
.how .fact{display:inline-block;vertical-align:top}
.how .fw::before{content:"How we know: "}
.cap{display:none;position:absolute;top:0;right:0;z-index:6;font:600 10.5px/1.2 var(--sans);letter-spacing:.03em;padding:2px 6px;background:var(--brass);color:#fff;max-width:70%;text-align:right}
.real .cap{display:block}
.real .reg{outline:1.5px dashed var(--brass);outline-offset:1px}
.reg{position:relative}
.cap.cP{background:var(--brass)}.cap.cR{background:var(--fork)}.cap.cS{background:var(--stamp)}
/* marks */
.mk{display:inline-block;width:22px;height:22px;flex:none;vertical-align:middle;position:relative}
.mk2{background:var(--ink)}
.mk1{border:2.5px solid var(--ink)}
.mk0::after{content:"";position:absolute;left:8px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--dot)}
.mkU{border:1.5px dashed var(--dot)}
.mk.sm{width:18px;height:18px}.mk.sm.mk0::after{left:6px;top:6px}
.strip{display:inline-flex;gap:4px;align-items:center}
/* steps rail */
.steps{display:flex;gap:0;margin:0;padding:0;list-style:none;font:12px var(--sans);color:var(--mute);flex:none;flex-wrap:wrap}
.steps li{padding:4px 12px 4px 0;margin-right:10px;border-bottom:2px solid var(--rule);display:flex;align-items:center;gap:6px}
.steps b{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--mute);font:600 11px var(--mono)}
.steps li.done{color:var(--ink2);border-color:var(--ink2)}.steps li.done b{background:var(--ink2);color:var(--paper);border-color:var(--ink2)}
.steps li.cur{color:var(--ink);font-weight:600;border-color:var(--ink)}.steps li.cur b{border-color:var(--ink);background:var(--paper)}
/* stage */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0;position:relative}
.obs{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap;padding:5px 10px;background:var(--paper);border:1.5px solid var(--ink);border-style:solid}
.obs .badge{font:600 11px var(--sans);letter-spacing:.09em;padding:3px 8px;border:1.5px solid var(--ink)}
.obs.seat{border-color:var(--fork);background:var(--forkbg)}
.obs.seat .badge{background:var(--fork);color:#fff;border-color:var(--fork)}
.obs .cutl{flex:1;min-width:200px;font-size:13.5px}
.exh{flex:1;min-height:0;position:relative;background:var(--paper);border:3px double var(--ink);padding:10px 14px 12px;display:flex;flex-direction:column;overflow:auto}
.exh.inFork{border:2.5px solid var(--fork);background:#FDFCF8;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--forkbg)}
.ftab{flex:none;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font:12px var(--sans);color:var(--mute);margin:-2px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.ftab b{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.inFork .ftab b{color:var(--fork)}
.hs{font:600 12px var(--sans);color:var(--stamp);border:1.5px solid var(--stamp);padding:0 6px;transform:rotate(-1.2deg);display:inline-block}
.ex-body{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{flex:none;background:var(--paper);border:1.5px solid var(--ink);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.bar .say{margin:0;font-size:14px;color:var(--ink2)}
.bar .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label{font-size:13px;display:inline-flex;gap:6px;align-items:center}
.bar input[type=text]{min-height:44px;padding:4px 10px;border:1.5px solid var(--ink);background:#fff;font:15px var(--sans);min-width:0}
.refuse{margin:0;padding:5px 10px;border:1.5px dashed var(--stamp);color:var(--stamp);font-size:13.5px;font-weight:500}
.refuse b{letter-spacing:.08em;margin-right:6px}
h2,h3{font-family:var(--serif);margin:0;font-weight:600}
h2{font-size:22px}h3{font-size:16px}
.k{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--mono)}
/* receipt */
.receipt{flex:none;display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--forkbg);border:1.5px solid var(--fork);padding:6px 12px;font-size:12.5px;color:var(--ink)}
.receipt b{color:var(--fork);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.receipt span{display:inline-block}
/* since popover */
.since{position:absolute;right:0;top:108px;width:min(470px,96%);max-height:70%;overflow:auto;z-index:8;background:var(--paper);border:2px solid var(--ink);padding:10px 12px;box-shadow:6px 6px 0 var(--ink)}
.since ul{list-style:none;margin:6px 0;padding:0}
.since li{padding:5px 0;border-top:1px solid var(--rule);font-size:13.5px}
.since .d{font:12px var(--mono);color:var(--mute)}
/* aside */
.aside{width:392px;flex:none;min-height:0;display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--ink)}
.tabs{display:flex;flex:none;border-bottom:1.5px solid var(--ink)}
.tabs .b{flex:1;border:0;border-right:1.5px solid var(--ink);min-height:42px;padding:4px 6px;font-size:12.5px;border-radius:0}
.tabs .b:last-child{border-right:0}
.pane{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.pane h3{margin-bottom:6px}
.dl{list-style:none;margin:8px 0 0;padding:0}
.dr{display:grid;grid-template-columns:26px 112px 1fr;gap:2px 8px;align-items:start;padding:6px 0;border-top:1px solid var(--rule)}
.dr .dn{font:600 11.5px var(--sans);letter-spacing:.06em;padding-top:3px}
.dr .dt{font-size:13px;color:var(--ink2)}
.dr.z .dt{color:var(--mute)}
.key{display:flex;gap:12px;font-size:12px;color:var(--mute);align-items:center;flex-wrap:wrap}
.key span{display:inline-flex;gap:5px;align-items:center}
.abt dt{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:9px}
.abt dd{margin:2px 0 0;font-size:13.5px}
.hold{border:1.5px dashed var(--dot);padding:12px;color:var(--mute);font-size:13.5px;margin-top:8px}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{border-top:1px solid var(--rule);padding:6px 0 6px 6px;font-size:12.5px;line-height:1.35}
.log li .m{font:11px var(--mono);color:var(--mute);display:block}
.log li.ref{border-left:3px dashed var(--stamp);color:var(--stamp)}
.log li.rd{color:var(--ink2)}
.log li.ab .w{border:1.5px dashed var(--stamp);color:var(--stamp);padding:0 5px;font:600 11px var(--sans);letter-spacing:.06em}
.log li.rc{border-left:4px double var(--ink)}
.log li.fk{border-left:4px double var(--fork)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pair>div{padding:8px;font-size:13px}
.pair .rec{border:3px double var(--ink)}.pair .frk{border:2.5px solid var(--fork);background:var(--forkbg)}
.pair .sealed{border:1.5px dashed var(--ink);margin-top:6px;padding:6px;color:var(--mute)}
.why{list-style:none;margin:6px 0 0;padding:0}
.why li{padding:5px 0 5px 12px;border-left:2px solid var(--ink);margin-left:6px;font-size:13px;position:relative}
.why li::before{content:"";position:absolute;left:-6px;top:11px;width:9px;height:9px;background:var(--paper);border:2px solid var(--ink)}
.why .r{font:11px var(--mono);color:var(--mute);display:block}
/* board */
.bd{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:18px;align-items:start;max-width:1400px;margin:0 auto}
.seatsheet{background:var(--paper);border:3px double var(--ink);padding:14px 16px}
.seatsheet h2{margin:2px 0 6px}
.seatsheet p{margin:4px 0}
.seatsheet ol{margin:6px 0 8px 18px;padding:0;font-size:14px}
.seatsheet li{margin:3px 0}
.actline{border:1.5px dashed var(--ink);padding:6px 8px;margin:8px 0;font-size:14px}
.exidx{background:var(--paper);border:1.5px solid var(--ink)}
.exhead{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-bottom:1.5px solid var(--ink)}
.ex{display:grid;grid-template-columns:44px 74px minmax(0,1fr) 150px 210px;gap:12px;align-items:center;width:100%;text-align:left;padding:7px 12px;border:0;border-bottom:1px solid var(--rule);background:transparent;cursor:pointer;min-height:66px;border-radius:0}
.ex:hover{background:var(--paper2)}
.ex .tg{font:600 15px var(--mono);border:1.5px solid var(--ink);padding:5px 0;text-align:center}
.ex .nm{font:600 15px var(--serif)}
.ex .nm small{display:block;font:400 13px var(--sans);color:var(--ink2);margin-top:1px}
.ex .st{font-size:12.5px;color:var(--mute)}
.ex svg{width:74px;height:48px}
.exfoot{display:flex;gap:10px;padding:10px 12px;flex-wrap:wrap;align-items:center}
/* compare */
.cmp{max-width:1400px;margin:0 auto;background:var(--paper);border:1.5px solid var(--ink)}
.cmp table{border-collapse:collapse;width:100%}
.cmp th,.cmp td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:middle;text-align:left}
.cmp thead th{border-top:0;font:600 10.5px var(--sans);letter-spacing:.07em;color:var(--ink2);vertical-align:bottom}
.cmp th.v{width:38px;padding:6px 3px;text-align:center}
.cmp th.v span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;height:98px;text-align:left}
.cmp td.m{text-align:center;padding:6px 3px}
.cmp .ln{font:600 15px var(--serif)}
.cmp .ln small{display:block;font:11.5px var(--sans);color:var(--mute)}
.cmp td.tx2{font-size:13px;color:var(--ink2);min-width:260px}
.cmp .np{border:1.5px dashed var(--dot);padding:5px 8px;color:var(--mute);font-size:12.5px}
.cmptop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1.5px solid var(--ink)}
.cmptop .grp{display:flex;gap:6px;flex-wrap:wrap}
/* lane materials */
.sheet{background:#fff;border:1px solid var(--ink);box-shadow:3px 3px 0 var(--rule);padding:14px 20px;max-width:760px;margin:0 auto;width:100%}
.sheet h3{font-size:17px}
.lines{list-style:none;margin:8px 0;padding:0}
.line{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.line .n{font:600 14px var(--mono);color:var(--mute)}
.line .due{display:block;font:12px var(--mono);color:var(--mute);margin-top:2px}
.line .tk{display:flex;gap:6px}
.inkw{font:italic 600 19px var(--serif);color:var(--fork)}
.noact{display:inline-block;border:2px dashed var(--stamp);color:var(--stamp);font:600 12px var(--sans);letter-spacing:.1em;padding:1px 8px;transform:rotate(-2deg)}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ledger>div{padding:7px 9px;font-size:13px;border:1.5px dashed var(--ink)}
.ledger.set>div{border:3px double var(--ink)}
.clocks{display:flex;gap:12px;margin:6px 0}
.clk2{border:1.5px solid var(--ink);padding:3px 10px;font:500 14px var(--mono)}
.clk2.mine{border-color:var(--fork);color:var(--fork);background:var(--forkbg)}
.struck{text-decoration:line-through;color:var(--mute)}
.rules>li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1180px){.aside{width:340px}.ex{grid-template-columns:40px 60px minmax(0,1fr) 120px 190px;gap:8px}.ex svg{width:60px;height:40px}}
.spot{position:absolute;z-index:3;background:var(--paper)}
/*@@CSS*/
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<script src="_shared/boston-fixture.js"></script>
<script>
(function(){
'use strict';
var FX=window.BOW_FIXTURE, CUT=FX.cuts.deadline2026, S26=FX.league.season2526;
var CUTL=CUT.beforeFirstReport.label;
var CUTD=CUT.beforeFirstReport.date;
var TAX=CUT.state.find(function(s){return /Projected/.test(s.what)}).value;
var LINE=S26.tax;
var NOW=FX.meta.now;
var DEAD=CUT.known.find(function(k){return /deadline/i.test(k.what)}).value;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(s){var p=s.split('-');return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0]}
var HS='entered with hindsight through '+fdate(NOW);
var D0=fdate(CUTD);
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function M(v){return '$'+(+(v/1e6).toFixed(3))+'M'}
function au(t,n){return {v:t,k:'AUTHORED',src:'this prototype — illustrative',asOf:null,verify:false,note:n||null}}
function fact(f,text){
  var t=text!=null?text:(f.v==null?(f.note||'unknown'):f.v);
  var w=f.k+' · '+(f.src||'this prototype')+(f.asOf?' · as of '+f.asOf:'')+(f.verify?' · verify':'')+(f.note&&f.v!=null?' · '+f.note:'');
  return '<span class="fact"><i class="tx tx-'+f.k+'" aria-hidden="true"></i><span class="sr">'+f.k.toLowerCase()+': </span><span class="fv">'+esc(t)+'</span><span class="fw">'+esc(w)+'</span></span>';
}
var TAXC=function(){return fact(TAX,'≈ '+M(TAX.v))};
var CAPL={R:'REAL CURRENT PRODUCT CAPABILITY',P:'PROPOSED PLATFORM CAPABILITY',S:'SPECULATIVE FRONTIER'};
function cp(l,ai){return '<span class="cap c'+l+'">'+CAPL[l]+(ai?' · '+ai:'')+'</span>'}
function attr(o){return esc(JSON.stringify(o))}
function B(label,kind,p,cls,x){return '<button type="button" class="b '+(cls||'')+'" data-act="'+kind+'"'+(p?' data-p="'+attr(p)+'"':'')+' data-fk="'+kind+(p&&(p.m||p.mode||p.name)?'-'+(p.m||p.mode||p.name):'')+'" '+(x||'')+'>'+label+'</button>'}
function U(label,ui,p,cls,x){return '<button type="button" class="b '+(cls||'')+'" data-ui="'+ui+'"'+(p?' data-p="'+attr(p)+'"':'')+' data-fk="u-'+ui+(p?'-'+Object.keys(p).map(function(k){return p[k]}).join('-'):'')+'" '+(x||'')+'>'+label+'</button>'}

/* ---------------------------------------------------------------- the shared seat (identical in every lane) */
var MT=[
  {id:'m1',who:'The owner',ask:'What is the plan for the tax bill?',line:function(){return 'The owner wants a plan for the '+TAXC()+' projected tax by Thursday.'},plain:function(){return 'the owner wants a plan for the ≈ '+M(TAX.v)+' projected tax by Thursday'},short:'the owner’s plan',due:'by Thursday'},
  {id:'m2',who:'A bench player’s agent',ask:'What is his role?',line:function(){return 'A bench player’s agent asks about his role.'},plain:function(){return 'a bench player’s agent asks about his role'},short:'the agent’s question',due:'this week'},
  {id:'m3',who:'A club',ask:'A club has called: about whom?',line:function(){return 'A club has called about a trade. Who it is: withheld until you answer.'},plain:function(){return 'a club has called about a trade; who it is is withheld until you answer'},short:'the club’s call',due:'Thursday'}
];
var ACT_TXT='Offer a bench salary plus a second-round pick to shed tax';
var PANES=[
  {id:'outside',name:'The outside view',sub:'what has happened since (SINCE)'},
  {id:'clubs',name:'Other clubs’ desks',sub:'who is calling whom'},
  {id:'league',name:'The League office’s desk',sub:'the vote record'},
  {id:'owner',name:'The owner’s private notes',sub:'what the owner has not told you'}
];
var DIMS=[['IDENTITY','Who you are in the record'],['ROLE','Which seat you hold'],['INFORMATION','What you can read'],['AUTHORITY','What you may do, and who says so'],['RESPONSIBILITY','What is now yours to answer for'],['TIME','Whose clock you are on'],['PLACE','Where you are'],['ACTIONS','What you can do here']];
var LANES=[],LANE={};
function base(){return {entered:false,asked:false,sinceOpen:false,acted:false,left:false,t:0,t0:0,who:'observer',stamp:null}}
function wclock(L){var m=540+L.t;return 'Mon 2 Feb 2026 · '+('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)}
function mclock(L){return '+'+(L.t-L.t0)+' min in the seat'}
function enter(L,who){L.entered=true;L.who=who||'Maya K. (fictional)';L.t0=L.t;L.stamp=L.asked?HS:null;L.sinceOpen=false}

/* ---------------------------------------------------------------- state */
var S={ui:{view:'board',lane:null,tab:'changes',how:false,real:false,cmp:'gave'},lanes:{},log:[],n:0,refusal:null};
function reset(){S.lanes={};S.log=[];S.n=0;S.refusal=null;LANES.forEach(function(l){S.lanes[l.id]=l.init()})}
function say(t){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=t},30)}

function push(id,L,kind,what,x){
  S.n++;
  var e={n:S.n,lane:id,kind:kind,who:L.entered?L.who:'observer',what:what,world:wclock(L),mine:L.entered?mclock(L):null,
    hist:L.entered?'Fork '+id+' · diverged '+D0:'Reality · read only',stamp:L.entered?L.stamp:null,k:L.entered?'RECORDED':'read'};
  for(var k in (x||{}))e[k]=x[k];
  S.log.push(e);return e;
}
function act(kind,p){
  p=p||{};
  var id=/^e\d\./.test(kind)?kind.slice(0,2).toUpperCase():(p.lane||S.ui.lane);
  var L=S.lanes[id],LN=LANE[id];if(!L)return;
  var res=kind==='since'?sinceR(L):LN.reduce(kind,p,L,id);
  var arr=[].concat(res||[]),refused=false,announce=[];
  arr.forEach(function(r){
    if(r.refuse){refused=true;S.refusal={lane:id,text:r.refuse};push(id,L,'refusal','Refused: '+r.refuse,{k:'refusal'});announce.push('Refused. '+r.refuse);return}
    if(r.say)announce.push(r.say);
    if(r.draft||!r.log)return;
    if(r.replace){var last=S.log[S.log.length-1];if(last&&last.lane===id&&last.kind===kind){S.log.pop();S.n--}}
    push(id,L,kind,r.log,{k:r.absence?'absence':(r.tag||(L.entered?'RECORDED':'read')),absence:!!r.absence,who:r.who||(L.entered?L.who:'observer')});
  });
  if(!refused)S.refusal=null;
  render();
  if(announce.length)say(announce.join(' '));
}
function sinceR(L){
  if(L.entered)return {refuse:'SINCE is sealed for a seat. Rule: the desk knows only what was knowable at the cut ('+D0+'). Leave the seat to read it as an observer.'};
  L.sinceOpen=!L.sinceOpen;
  if(L.sinceOpen){L.asked=true;return {log:'Opened SINCE as an observer: read what happened after this moment. This will mark any seat you take.',say:'SINCE is open. Reading it marks a seat you take with hindsight.'}}
  return {log:'Closed SINCE (what was read stays read).',say:'SINCE closed.'};
}
function stampTxt(L){return L.stamp?'<span class="hs">'+esc(L.stamp)+'</span>':''}
function marksOf(id){var L=S.lanes[id];return LANE[id].marks(L)}
function done(id){return !!S.lanes[id].acted}
function status(id){var L=S.lanes[id];return L.left?'left · branch kept':L.acted?'first act made':L.entered?'in the seat':L.asked?'observing · read SINCE':'not entered'}

  return '<div class="receipt reg" aria-label="What the act changed, in five places"><b>Changed in five places</b>'+
    '<span>Record: entry #'+lastN+', in the fork</span><span>Gauge: '+TAXC()+' · offer out · outcome sealed</span>'+
    '<span>Matters: 2 answered by the offer, '+(1)+' open'+(lapsed?', '+lapsed+' NO ACT':'')+'</span>'+

   '<li>Charged above the 2025–26 tax line '+fact(LINE,M(LINE.v))+'<span class="r">payroll at the cut: '+fact(CUT.state.find(function(s){return /payroll/.test(s.what)}).value)+'</span></li>'+
   (enterE?'<li>You cannot see later events because entry #'+enterE.n+' put you in the seat at the cut'+(L.stamp?' — with the mark “'+esc(L.stamp)+'”, because you opened SINCE first (#'+S.log.filter(function(e){return e.lane===id&&/SINCE/.test(e.what)})[0].n+')':'')+'.<span class="r">RECORDED</span></li>':'')+'</ul>';
  h+='<h3 style="margin-top:14px">What if nobody acts?</h3><p style="font-size:13px;margin:4px 0">Default (a rule, no model): '+fact({v:'the ≈ '+M(TAX.v)+' bill stands',k:'COMPUTED',src:'rule: tax is charged on tax salary above the line',asOf:null,verify:true,note:'counted after the last game'})+'. Beyond that the future is sealed: you find out by living it.</p>';
  h+='<div class="pair"><div class="rec"><span class="k">The record · Reality</span><br>'+esc(D0)+'. Nothing of yours in it.'+
     (L.asked&&!L.entered?'':(L.asked?'<div class="sealed" style="border-style:solid;color:var(--ink)">You read SINCE before entry: '+fact(CUT.sealed[0].value)+'</div>':'<div class="sealed">What Reality did next: SEALED to this seat. An observer who asks SINCE can read it.</div>'))+

  return h;
}

  var tray=L.signed?'<ul style="list-style:none;margin:0;padding:0">'+MT.map(function(m){return '<li style="border:1.5px solid var(--ink);background:var(--kraft);padding:4px 8px;margin:0 0 4px;font-size:13px"><b>'+esc(m.who)+'</b> · '+esc(m.ask)+'</li>'}).join('')+'</ul>':'<div class="hold" style="margin:0"><b>In-tray.</b> Empty. Folders named by question arrive when you sign.</div>';
  return '<div style="display:grid;grid-template-columns:1.25fr 1fr;gap:10px;flex:none;margin-top:8px"><section aria-label="Blotter">'+blot+'</section><section aria-label="In-tray">'+tray+'</section></div>';
}
var LN={id:id,name:'SIT, THEN SIGN',mat:'Room section',blurb:'Stand at the rail, sit to rehearse, sign with the pen. Panes frost; the ledger equals the frost.',
 steps:['Stand at the rail','Sit: rehearsal','Sign with the pen','First act'],
 icon:'<svg viewBox="0 0 74 48" aria-hidden="true"><rect x="27" y="4" width="43" height="36" fill="#F6F2E7" stroke="#1E1C19" stroke-width="1.5"/><rect x="31" y="9" width="10" height="17" fill="#fff" stroke="#1E1C19"/><rect x="44" y="9" width="10" height="17" fill="url(#et-stip)" stroke="#1E1C19"/><rect x="57" y="9" width="9" height="17" fill="url(#et-stip)" stroke="#1E1C19"/><rect x="3" y="26" width="22" height="3" fill="#D9CDB3" stroke="#1E1C19"/><path d="M5 20h20M8 20v6M14 20v6M20 20v6" stroke="#1E1C19"/><rect x="44" y="34" width="24" height="3" fill="#C9B48F" stroke="#1E1C19"/></svg>',
 init:function(){var L=base();L.posture='stand';L.sat=false;L.signed=false;L.plate='Maya K.';L.frost={};return L},
 step:function(L){return L.acted?3:L.signed?2:L.sat?1:0},
 stage:function(L){
  var sp='<button type="button" class="b sm spot" style="left:2%;top:9%" data-act="e1.stand" data-fk="e1.stand-s" aria-pressed="'+(L.posture==='stand')+'">Stand at the rail</button><button type="button" class="b sm spot" style="right:2%;bottom:4%" data-act="e1.sit" data-fk="e1.sit-s" aria-pressed="'+(L.posture==='sit')+'">Sit at the desk</button>';
  return '<div class="room" style="position:relative;flex:1;min-height:0">'+roomSVG(L)+sp+'</div>'+low(L);
 },
 bar:function(L){
  if(L.left)return {say:'You left the seat. Standing up restored nothing; the panes stay frosted in your branch.',btns:U('Compare all seven','go',{view:'compare'},'pri','data-primary')+U('Back to the board','go',{view:'board'})};
  if(L.acted)return {say:'Recorded in your fork, not in Reality. Standing up restores nothing. Leaving is an act: hand over, or vacate.',btns:'<label>Hand over <input type="text" id="ho" size="34" value="The tax plan is out as an offer; the tray still holds two folders." aria-label="Your handover, in your own words"></label>'+B('Hand over','e1.leave',{mode:'handover'},'','data-read="#ho"')+B('Vacate','e1.leave',{mode:'vacate'},'stampb')+U('Compare all seven','go',{view:'compare'},'pri','data-primary')};
  if(L.signed&&L.posture==='sit')return {say:'The panes have frosted, the outside view is covered, the tray has three folders. One act is on the desk.',btns:B(ACT_TXT,'e1.offer',null,'pri fk','data-primary')+B('Stand up (restores nothing)','e1.stand')};
  if(L.signed)return {say:'You stood up. The panes stay frosted: standing restores nothing. The act is on the desk.',btns:B('Sit at the desk','e1.sit',null,'pri','data-primary')+B(ACT_TXT,'e1.offer',null,'','aria-disabled="true"')};
  if(L.posture==='sit')return {say:'Sitting is a free rehearsal, not an act. The blotter shows what you would give up and get. The pen makes it real.',btns:B('Sign with the pen','e1.sign',null,'pri fk','data-primary')+B('Stand up','e1.stand')};
  return {say:'You are standing at the rail. Every pane is clear and nothing here is yours. The pen is on the desk.',btns:B('Sit at the desk','e1.sit',null,'pri','data-primary')+B('Sign with the pen','e1.sign',null,'','aria-disabled="true"')};
 },
 reduce:function(k,p,L){
  if(k==='e1.stand'){if(L.posture==='stand')return {say:'Already at the rail.'};L.posture='stand';return L.signed?{log:'Stood up from the desk. Nothing restored: the panes stay frosted and the ledger stands.',say:'Stood up. The panes stay frosted.'}:{log:'Walked back to the rail (rehearsal ends; nothing was signed).',say:'At the rail.'}}
  if(k==='e1.sit'){if(L.posture==='sit')return {say:'Already at the desk.'};L.posture='sit';L.sat=true;return L.signed?{log:'Sat at the desk again.',say:'At the desk.'}:{log:'Sat at the desk: a free rehearsal. The blotter previews what would be given up and got. Nothing signed.',say:'At the desk. The blotter previews the ledger. Nothing is signed.'}}
  if(k==='e1.plate'){L.plate=p.name;return {draft:true,say:'Plate name: '+p.name+'.'}}
  if(k==='e1.sign'){
    if(L.posture!=='sit')return {refuse:'the pen lives on the desk. Rule: you sign where the seat is — sit first.'};
    if(L.signed)return {refuse:'already signed. Signing again would change nothing.'};
    L.signed=true;L.t+=5;PANES.forEach(function(x){L.frost[x.id]=true});enter(L,L.plate+' (fictional)');
    return {log:'Signed with the pen at the desk. '+PANES.length+' panes frosted, the outside view covered, the tray filled with 3 folders, the plate reads “'+L.plate+'”. Your clock started beside the World’s.',say:'Signed. Four panes frosted, the outside view covered, three folders in the tray.'};
  }
  if(k==='e1.offer'){
    if(!L.signed)return {refuse:'nothing is signed. Rule: an act belongs to the seat, and the seat starts at the pen.'};
    if(L.posture!=='sit')return {refuse:'the act is made at the desk. Sit first; standing up restored nothing, so you are still the seat holder.'};
    if(L.acted)return {refuse:'one act is available in this lane and it is already out.'};
    L.acted=true;L.t+=10;return {log:ACT_TXT+'. From the tray: the owner’s plan and the club’s call. Fork only; the outcome is sealed.',say:'Offer made in your fork. Reality is unchanged. The outcome is sealed.'};
  }
  if(k==='e1.leave'){
    L.left=true;L.t+=5;L.posture='stand';
    if(p.mode==='handover'){L.handover=(p.text||'').trim()||'(no words)';return {log:'Handed over in own words: “'+L.handover+'”. The panes stayed frosted; nothing restored.',say:'Handed over.'}}
    return [{log:'NO ACT: the agent’s question — the seat was vacated with this folder open. An absence, not a choice.',absence:true},{log:'Vacated the seat. One folder lapsed.',say:'Vacated. The open folder was recorded as NO ACT.'}];
  }
  return {refuse:'unknown act '+k};
 },
 marks:function(L){
  var s=L.signed,pl=L.sat||L.signed;
  return [
   s?[2,'The door plate takes your name: '+esc(L.plate)+' (fictional).']:[0,'The plate still says vacant.'],
   s?[2,'You hold the desk, and the plate says so.']:L.sat?[1,'Sitting is a rehearsal: a role you can try but not yet hold.']:[0,'—'],
   s?[2,PANES.length+' panes frost and the outside view is covered. The ledger’s gave-up list equals them.']:L.sat?[1,'The blotter previews what would be given up. Nothing is withheld yet.']:[0,'—'],
   s?[1,'The pen makes it yours. Nobody offered it.']:[0,'—'],
   s?[1,'Three folders are in the tray. Nothing is signed for line by line.']:[0,'—'],
   s?[2,'Two clocks on the wall: the World’s and yours.']:[0,'—'],
   pl?[2,'You crossed the room: from the rail to the desk changes what you can see.']:[0,'You stand where observers stand.'],
   s?[1,'The desk holds the tray and one act. The rail had none.']:[0,'—']];
 },
 about:{gave:'What the frosted panes showed — the outside view, other clubs’ desks, the League’s desk, the owner’s private notes. The ledger list and the frosted list are the same four.',
  leave:'Standing up restores nothing. Leaving is an act: hand over in your own words, or vacate (open folders stamp NO ACT).',

  survive:'Voice: the blotter is read aloud, then “sign”. Spatial: the native case. Screen reader: the ledger list carries it; the room adds nothing the list lacks.',
  chem:'The bench: sitting at the fume-hood console frosts the other labs’ instruments.',
  supply:'A dispatcher’s desk over the tower cutaway: sitting there frosts other yards’ schedules.'}};
LANES.push(LN);LANE[id]=LN;
})();
