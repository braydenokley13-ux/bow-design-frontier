<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take It Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EBD8; --paper2:#E8DEC2; --paper3:#D9CBA6; --face:#FBF7EA;
  --ink:#17120D; --muted:#5A4F41; --warm:#A63A0E; --warm2:#7E2A08; --warmsoft:#EBCDB8;
  --tone:rgba(23,18,13,.24);
  --serif:'Old Standard TT','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:14px;line-height:1.35;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--face)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.sc{font-variant:small-caps;letter-spacing:.06em}
i.sw{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink);vertical-align:-2px;flex:none}
i.sw.k-OBSERVED{background:var(--ink)}
i.sw.k-RECORDED{background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}
i.sw.k-AUTHORED{background:transparent}
i.sw.k-COMPUTED{background:var(--tone)}
i.sw.k-MODELED{background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px)}
i.sw.k-GENERATED{background-image:radial-gradient(var(--ink) 1px,transparent 1.3px);background-size:4px 4px}
i.sw.k-UNKNOWN{border-style:dashed;background:transparent}

/* ---------- masthead */
header#top{display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;border-bottom:3px double var(--ink);flex:none}
header h1{margin:0;font-size:22px;letter-spacing:.14em;font-weight:700;white-space:nowrap}
header .ttl{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:0 1 auto}
.addr{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;max-width:430px}
header .sub{font-style:italic;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.sys{display:flex;gap:4px;margin-left:8px}
.sys button{min-height:44px;padding:0 12px;border-bottom:3px solid transparent;font-size:14px;display:flex;align-items:center;white-space:nowrap}
.sys button[aria-pressed=true]{border-bottom-color:var(--ink);font-weight:700}
.sys button[data-sys=reality][aria-pressed=true]{border-bottom-color:var(--ink)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.tog{min-height:44px;padding:0 10px;display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.tog::before{content:"";width:12px;height:12px;border:1.5px solid var(--ink);background:transparent;flex:none}
.tog[aria-pressed=true]{font-weight:700}
.tog[aria-pressed=true]::before{background:var(--ink);box-shadow:inset 0 0 0 2px var(--paper)}

/* ---------- layout */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(200px,1fr);gap:8px 18px;padding:8px 20px 6px;min-height:0}
#stick{grid-column:1;grid-row:1;min-width:0;position:relative}
#bench{grid-column:1;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column}
#present{grid-column:2;grid-row:1/3;min-width:0;border-left:1px solid var(--ink);padding-left:16px;position:relative}
footer#status{flex:none;border-top:1px solid var(--ink);padding:5px 20px;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:14px;justify-content:space-between}
footer#status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- the stick */
.stickHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;color:var(--muted);min-height:22px}
.stickHead b{color:var(--ink)}
.grid{display:grid;column-gap:4px;align-items:stretch}
.tray{grid-row:1;min-height:64px;display:flex;align-items:center;padding:0 4px 4px}
.tray .prompt{font-style:italic;font-size:19px;line-height:1.15}
.tray .prompt small{display:block;font-size:12px;font-style:normal;color:var(--muted);margin-top:2px}
.wk{grid-row:2;font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--muted);padding:2px 2px 3px;border-bottom:1px solid var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk.now{color:var(--ink);font-weight:500}
.knee{grid-row:2/5;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;border-radius:0}
.knee span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;white-space:nowrap}
.slot{grid-row:3;display:flex;flex-direction:column;gap:4px;padding-top:4px;min-height:140px;min-width:0}
.slug{position:relative;display:flex;flex-direction:column;flex:1 1 auto;min-width:0;padding:9px 8px 8px;background:var(--face);border:1.5px solid var(--ink);color:var(--ink);font-family:var(--serif);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.slug::before{content:"";position:absolute;top:0;left:50%;width:14px;height:5px;margin-left:-7px;background:var(--paper);border:1.5px solid var(--ink);border-top:0;border-radius:0 0 6px 6px}
.slug .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-top:3px}
.slug .what{font-size:13px;line-height:1.22;margin-top:4px;font-weight:400;overflow-wrap:anywhere;hyphens:auto}
.slug .foot{margin-top:auto;padding-top:5px;display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.slug.k-RECORDED,.slug.k-OBSERVED{background:var(--ink);color:var(--paper)}
.slug.k-RECORDED{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4px var(--paper),inset 0 0 0 6px var(--ink),inset 0 0 0 7px var(--paper)}
.slug.k-RECORDED::before,.slug.k-OBSERVED::before{background:var(--paper)}
.slug.k-RECORDED .what,.slug.k-RECORDED .when,.slug.k-RECORDED .foot{padding-left:4px;padding-right:2px}
.slug.k-RECORDED .foot i.sw,.slug.k-OBSERVED .foot i.sw{border-color:var(--paper)}
.slug.k-RECORDED .foot i.sw{background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3px var(--paper)}
.slug.k-OBSERVED .foot i.sw{background:var(--paper)}
.slug.k-AUTHORED .foot i.sw{background:transparent}
.slug.br{background:var(--warm);border-color:var(--warm2);color:var(--paper);box-shadow:inset 0 0 0 3px var(--warm),inset 0 0 0 4px var(--paper),inset 0 0 0 6px var(--warm),inset 0 0 0 7px var(--paper)}
.slug.br::before{background:var(--paper);border-color:var(--warm2)}
.slug.br .foot i.sw{border-color:var(--paper);background:var(--paper);box-shadow:inset 0 0 0 2px var(--warm),inset 0 0 0 3px var(--paper)}
.slug.br .what,.slug.br .when,.slug.br .foot{padding-left:4px}
.slug.sel{outline:3px solid var(--ink);outline-offset:3px}
.slug.br.sel{outline-color:var(--warm)}
.slug.dashed{background:transparent;border:1.5px dashed var(--muted);color:var(--muted);box-shadow:none}
.slug.dashed::before{background:transparent;border-color:var(--muted)}
.slug.dashed .what{opacity:.85}
.slug.dashed .why{font-family:var(--mono);font-size:10px;line-height:1.25;margin-top:5px;color:var(--ink);text-transform:none}
.slug.lg{flex:none;min-height:44px;padding:4px 6px;background:var(--paper2);border:1.5px solid var(--muted);color:var(--ink)}
.slug.lg::before{display:none}
.slug.lg .what{font-size:11.5px;margin-top:0;line-height:1.18}
.slug.lg .when{margin:0 0 1px;font-size:9.5px}
.slug.lg .lock{position:absolute;right:4px;top:4px;width:12px;height:13px}
.slug.lg.dashed{border-style:dashed}
.slug.lg.k-OBSERVED{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.slug.lg.k-OBSERVED .lock{color:var(--paper)}
.slug.zero{background:var(--paper2);color:var(--muted);border-color:var(--muted)}
.slug.zero::before{border-color:var(--muted)}
.slug.holding::after{content:"";position:absolute;left:0;bottom:0;height:5px;background:var(--warm);animation:fill .65s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.gap{flex:1 1 auto;border:1.5px dashed var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:0}
.gap b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
.gap.br{border-color:var(--warm);color:var(--warm2)}
.held{align-self:stretch;position:relative;display:flex;flex-direction:column;justify-content:flex-start;min-width:0;padding:7px 8px 6px;border:1.5px solid var(--ink);background:var(--face);box-shadow:0 5px 0 -1px var(--paper3),0 6px 0 -1px var(--ink);transform:rotate(-1.4deg);animation:rise .5s cubic-bezier(.2,.9,.25,1) both;font-size:12px;line-height:1.2;overflow:hidden}
.held.k-RECORDED,.held.k-OBSERVED{background:var(--ink);color:var(--paper)}
.held.br{background:var(--warm);color:var(--paper);border-color:var(--warm2)}
.held .when{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.held .what{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.held.sel{outline:3px solid var(--warm);outline-offset:2px}
@keyframes rise{from{transform:translateY(64px) rotate(0);opacity:.15}to{transform:translateY(0) rotate(-1.4deg);opacity:1}}
.gm{grid-row:4;min-width:0}
.game{grid-row:4;min-width:0;white-space:nowrap;margin-top:5px;padding:5px 5px 4px;border:1.5px solid var(--ink);background:var(--face);font-family:var(--mono);font-size:11.5px;line-height:1.25;display:flex;flex-direction:column;justify-content:center;min-height:50px;overflow:hidden}
.game .opp{font-size:10px;color:var(--muted);letter-spacing:.05em}
.game .res{font-weight:500}
.game .was{font-size:10px;color:var(--muted);text-decoration:none}
.game.k-RECORDED{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink),inset 0 0 0 5.5px var(--paper);padding:5px 7px}
.game.k-RECORDED .opp,.game.k-RECORDED .was,.game.k-RECORDED .kn{color:var(--paper);opacity:.9}
.game.chg{border-color:var(--warm);border-width:2px;color:var(--warm2)}
.game.chg .opp,.game.chg .was{color:var(--warm2)}
.game.k-OBSERVED{background:var(--ink);color:var(--paper)}
.game.k-OBSERVED .opp{color:var(--paper)}
.game.k-UNKNOWN{border-style:dashed;background:transparent;color:var(--muted)}
.game.sel{outline:3px solid var(--ink);outline-offset:2px}
.game.newg{border-color:var(--warm);background:var(--warmsoft)}
.gl{grid-row:4;align-self:center;font-family:var(--mono);font-size:10px;color:var(--paper);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.ghost{grid-row:5;grid-column:2/-1;margin-top:6px;padding:4px 2px 0;border-top:1px dotted var(--muted);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;line-height:1.3}
.ghost .g{display:inline-flex;align-items:baseline;gap:5px}
.ghost .gs{display:inline-block;padding:0 6px;border:1px dashed var(--muted);font-size:11.5px}
.ghost .gs.off{border-style:dotted;text-decoration:line-through}
.frameBr{border:2px solid var(--warm);outline:1px solid var(--warm);outline-offset:3px;padding:4px 8px 6px;margin:4px 3px 0}
.stamp{color:var(--warm2);font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline}
.stamp .as{font-weight:400;font-size:11.5px;color:var(--warm2);font-family:var(--serif)}
.stampTray{display:block;width:100%}
.stampTray .assume{font-size:11.5px;color:var(--warm2);margin-top:2px;line-height:1.25}
.stampTray .assume b{font-weight:700}
.wt{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-family:var(--mono);font-size:10px;line-height:1.2}
.wt .pips{display:flex;gap:2px}
.wt .pips i{display:block;width:9px;height:9px;border:1px solid currentColor}
.wt .pips i.on{background:currentColor}
.wt .pips i.foc{outline:2px solid var(--warm);outline-offset:1px}
.wt .bar{height:9px;background:var(--tone);width:var(--w,0%);min-width:2px;outline:1px solid currentColor}
.wt .bar.zero{background:none;outline:none;width:0}
.wt .zeroT{font-style:italic}
.slug.k-RECORDED .wt .bar,.slug.k-OBSERVED .wt .bar{background:var(--paper);opacity:.55}
.wt .thn{color:inherit;opacity:.95;white-space:nowrap;font-size:9.5px;letter-spacing:-.01em}
.slug.k-RECORDED .wt .pips i.on,.slug.k-OBSERVED .wt .pips i.on{background:var(--paper)}

/* ---------- present (dials) */
#present h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.02em}
#present h2 small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.seal{display:flex;align-items:center;gap:8px;padding:5px 0 6px;border-bottom:1px solid var(--ink);font-family:var(--mono);font-size:11px;flex-wrap:wrap;line-height:1.25}
.seal .hx{font-size:15px;font-weight:500;padding:1px 6px;border:1.5px solid var(--ink);background:var(--face)}
.seal .hx.br{border-color:var(--warm);color:var(--warm2)}
.seal .ok{font-weight:500}
.seal .no{color:var(--warm2)}
.dials{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.dial{display:block;width:100%;padding:6px 2px 5px;border-bottom:1px solid var(--paper3);min-height:0;position:relative}
.dial:hover{background:var(--paper2)}
.dial.foc{background:var(--paper2);box-shadow:inset 3px 0 0 var(--ink)}
.dial .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-variant:small-caps;letter-spacing:.06em;font-weight:700;gap:4px}
.dial .lab em{font-style:normal;font-family:var(--mono);font-size:10px;font-variant:normal;letter-spacing:0;font-weight:400;color:var(--muted)}
.dial svg{display:block;width:100%;height:auto;overflow:visible}
.dial .val,.dial .sub{display:block}
.dial .val{font-family:var(--mono);font-size:17px;font-weight:500;text-align:center;line-height:1.05;margin-top:-1px}
.dial .sub{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;min-height:13px;line-height:1.25;margin-top:2px}
.dial .sub span{white-space:nowrap}
.dial .sub.chg{color:var(--warm2)}
.band-fill{fill:none;stroke-width:8}
.band-edge{fill:none;stroke:var(--ink);stroke-width:1.2}
.band-rule{fill:none;stroke:var(--paper);stroke-width:1;display:none}
.k-RECORDED .band-fill,.k-OBSERVED .band-fill{stroke:var(--ink)}
.k-RECORDED .band-rule{display:block}
.k-COMPUTED .band-fill{stroke:var(--tone)}
.k-AUTHORED .band-fill{stroke:transparent}
.k-UNKNOWN .band-fill{stroke:transparent}
.k-UNKNOWN .band-edge{stroke-dasharray:4 3}
.tick{stroke:var(--ink);stroke-width:1}
.mark{stroke:var(--ink);stroke-width:3}
.nd-rec{fill:#fff;stroke:var(--ink);stroke-width:1.3}
.nd-world{fill:var(--warm);stroke:var(--warm2);stroke-width:1}
.nd-pred{stroke:var(--warm);stroke-width:1.8;stroke-dasharray:3 2.5;fill:none}
.hub{fill:var(--ink)}
.hubIn{fill:var(--paper)}
.dial.unk .nd,.dial.unk .hub,.dial.unk .hubIn{display:none}
.dial.unk .val{color:var(--muted);font-size:13px}
.dial .clampMark{position:absolute;right:2px;top:20px;width:26px;height:26px;display:none}
.dial.clamped .clampMark{display:block}
.plate{padding:7px 4px 6px;border-bottom:1px solid var(--paper3);font-size:12px;line-height:1.3}
.plate.unk{border:1.5px dashed var(--muted);margin:6px 0 2px;color:var(--muted)}
.plate b{display:block;font-variant:small-caps;letter-spacing:.06em;font-size:12px;color:var(--ink)}
.plate ul{margin:2px 0 0;padding-left:15px}
.plate .kk{font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);align-items:center}
.legend svg{width:16px;height:16px;vertical-align:-4px;overflow:visible}
.legend .lg{display:inline-flex;gap:4px;align-items:center}

/* ---------- bench */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);flex:none;flex-wrap:nowrap}
.tabs button{min-height:38px;padding:0 13px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid transparent;border-bottom:0;margin-bottom:-2px}
.tabs button[aria-pressed=true]{background:var(--face);border-color:var(--ink);font-weight:700}
.tabs .sp{margin-left:auto;display:flex;align-items:center}
.panel{flex:1;min-height:0;overflow:auto;background:var(--face);border:1.5px solid var(--ink);border-top:0;padding:10px 14px 10px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px 22px;align-content:start}
.panel.one{grid-template-columns:minmax(0,1fr)}
.panel h3{margin:0 0 3px;font-size:17px;line-height:1.2;font-weight:700}
.panel h4{margin:8px 0 3px;font-size:12px;font-variant:small-caps;letter-spacing:.07em;color:var(--muted);font-weight:700}
.panel p{margin:0 0 6px;max-width:62ch}
.panel .small{font-size:12px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.btn{min-height:44px;padding:0 14px;border:1.5px solid var(--ink);background:var(--face);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.01em}
.btn:hover{background:var(--paper2)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:#000}
.btn.br{border-color:var(--warm);color:var(--warm2)}
.btn.brf{background:var(--warm);color:var(--paper);border-color:var(--warm2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.chip{min-height:34px;padding:0 10px;border:1.5px solid var(--ink);font-size:12.5px;display:inline-flex;align-items:center;background:transparent}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip.foc{background:var(--ink);color:var(--paper)}
.rng{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.rng input{flex:1;min-width:0;accent-color:var(--warm);height:32px}
.rng output{font-family:var(--mono);font-size:14px;min-width:78px;text-align:right}
.big{width:100%;max-width:250px;margin:0 auto;display:block}
.big svg{display:block;width:100%;height:auto;overflow:visible}
.dialbox{position:relative}
.dialbox .cap2{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:-2px}
.said{font-family:var(--mono);font-size:12.5px;line-height:1.4;text-align:center;margin-top:3px}
.said b{color:var(--warm2);font-weight:500}
.refuse{border:2px solid var(--ink);padding:8px 12px;margin:2px 0 6px;background:var(--paper2)}
.refuse .rule{font-family:var(--mono);font-size:11.5px;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-variant:small-caps;letter-spacing:.05em;text-align:left;font-weight:700;border-bottom:1.5px solid var(--ink);padding:2px 6px 2px 0;font-size:12px}
.tbl td{padding:3px 6px 3px 0;border-bottom:1px solid var(--paper3);font-family:var(--mono);font-size:12px;vertical-align:top}
.tbl td:first-child{font-family:var(--serif);font-size:13px}
.tbl .r{text-align:right}
.tbl .chg{color:var(--warm2);font-weight:500}
.tbl tr.zero td{color:var(--muted)}
.verdict{border:2px solid var(--ink);padding:6px 10px;margin:4px 0;font-size:15px;font-weight:700}

<script src="_shared/boston-fixture.js"></script>
<script>
(function () {
'use strict';
/* ================= ENGINE · illustrative engine, authored (toy-0.1) =================
   One small deterministic reducer. It folds the World's act record into the present.
   Luck is keyed per game (common random numbers): game g always gets the same two draws,
   in every world, however many acts are lifted. Nothing here is a model of the NBA. */
var FX = window.BOW_FIXTURE, WD = FX.world;
var ENGINE = 'toy-0.1';
var SEED = 'yr2-32';
var TAX_LINE = WD.taxLine.v;
var TAX_RATE = parseFloat(WD.taxRule.v.match(/([\d.]+)\s*×/)[1]);      // "Flat 1.5× over the line"
var START = WD.payrollStartYearTwo.v;
var MIN_SIGN = FX.league.season2627.exceptions.minimum.v;
var W9REC = WD.acts.filter(function (a) { return /Denver/.test(a.what); })[0].what.match(/Denver (\d+)\u2013(\d+)/);   // the World's recorded Week 9: read, not pasted
var W9B = +W9REC[1], W9O = +W9REC[2];
var ANALYTICS = WD.departments.filter(function (d) { return d.id === 'analytics'; })[0];
var BASE_SEATS = 1780, CAP_SEATS = 1800, FORM = 0.012, DARK_PENALTY = 1.0;   // authored, illustrative
var STRENGTH = { 'w1-minimum': 0.8, 'w6-trade': 2.0, 'w7-rotation': 1.2 };  // points of margin, authored
var SCHED = [null,
  { o: 'CHA', h: 1 }, { o: 'NYK', h: 0 }, { o: 'ATL', h: 1 }, { o: 'TOR', h: 1 }, { o: 'MIA', h: 0 },
  { o: 'PHI', h: 1 }, { o: 'CLE', h: 0 }, { o: 'MIL', h: 1 }, { o: 'DEN', h: 1 }, { o: 'PHX', h: 0 }];

function h32(s) {
  var h = 0x811c9dc5;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}
function hex6(n) { return ('000000' + ((n >>> 8) & 0xffffff).toString(16)).slice(-6); }
function keyDraw(g, p) { return h32(SEED + '|game' + g + '|' + p) / 4294967296; }   // the same draw for the same purpose, always

function weekOf(a) { return a.when === 'Year One' ? 0 : +a.when.match(/Week (\d+)/)[1]; }
var LEAGUE_ACT = { id: 'w6-league', when: 'Year Two · Week 6', what: 'Approved the Week 6 trade', who: 'League', seat: 'league', k: 'AUTHORED', effects: {}, week: 6 };
var ACTS = [];
WD.record.forEach(function (a) {
  var c = Object.assign({}, a, { week: weekOf(a), seat: 'gm' });
  c.needs = a.needs ? [a.needs] : [];
  if (a.id === 'w6-trade') { ACTS.push(LEAGUE_ACT); c.needs = ['w6-league']; }
  ACTS.push(c);
});
var OPTIONS = [
  { id: 'reopen-analytics', what: 'Reopened Analytics', price: ANALYTICS.opensFor, effects: { cash: -ANALYTICS.opensFor, analytics: 'lit' }, needsDark: true },
  { id: 'sign-vet', what: 'Signed a veteran to a minimum deal', price: MIN_SIGN, effects: { payroll: MIN_SIGN }, strength: 0.8 },
  { id: 'partner-2', what: 'Booked another partner night', price: 0, effects: { cash: WD.record.filter(function (a) { return a.id === 'w2-partner'; })[0].effects.cash } }
];

function strengthAt(on, g) {
  var m = 0, dark = false;
  on.forEach(function (a) {
    if (a.week > g) return;
    var e = a.effects || {};
    m += (STRENGTH[a.id] || a.strength || 0);
    if (e.analytics === 'dark') dark = true;
    if (e.analytics === 'lit') dark = false;
  });
  return m - (dark ? DARK_PENALTY : 0);
}
var CAL9 = null;   // Week 9 is RECORDED (read from the World record): its luck is fitted once so the full record reproduces it
(function () {
  var st = {}, on = [];
  ACTS.forEach(function (a) { on.push(a); });
  var m = strengthAt(on, 9);
  CAL9 = { b: (W9B + 0.05) - 108 - m / 2, o: (W9O - 0.05) - 108 + m / 2 };
})();

function status(env) {
  var st = {}, why = {}, acts = ACTS.concat(env.appended || []);
  acts.forEach(function (a) {
    if (env.lifted.has(a.id)) { st[a.id] = 'lifted'; return; }
    if (a.seat === 'league' && env.assume && env.assume.league === 'declined') { st[a.id] = 'declined'; why[a.id] = 'assume'; return; }
    var bad = (a.needs || []).filter(function (n) { return st[n] !== 'in'; })[0];
    if (bad) { st[a.id] = 'dashed'; why[a.id] = bad; return; }
    st[a.id] = 'in';
  });
  return { st: st, why: why, acts: acts };
}

function fold(env) {
  var S = status(env), on = S.acts.filter(function (a) { return S.st[a.id] === 'in'; });
  var weeks = env.weeks || 9;
  var payroll = START, cash = 0, pc = [{ id: 'start', v: START }], cc = [];
  on.forEach(function (a) {
    var e = a.effects || {};
    if (e.payroll) { payroll += e.payroll; pc.push({ id: a.id, v: e.payroll }); }
    if (e.cash) { cash += e.cash; cc.push({ id: a.id, v: e.cash }); }
  });
  var games = [], wins = 0, losses = 0, nights = {};
  for (var g = 1; g <= weeks; g++) {
    var m = strengthAt(on, g), dB, dO;
    if (g === 9) { dB = CAL9.b; dO = CAL9.o; }
    else { dB = (keyDraw(g, 'bos') - 0.5) * 20; dO = (keyDraw(g, 'opp') - 0.5) * 20; }
    var b = Math.round(108 + m / 2 + dB), o = Math.round(108 - m / 2 + dO);
    if (b === o) { if (m >= 0) b++; else o++; }
    if (SCHED[g].h) {
      on.forEach(function (a) {
        var e = a.effects || {};
        if (e.cashPerNight && a.week <= g) { cash += e.cashPerNight; nights[a.id] = (nights[a.id] || 0) + 1; }
      });
    }
    games.push({ g: g, opp: SCHED[g].o, home: SCHED[g].h, b: b, o: o, win: b > o, m: m, uB: keyDraw(g, 'bos'), uO: keyDraw(g, 'opp') });
  }
  Object.keys(nights).forEach(function (id) {
    var a = S.acts.filter(function (x) { return x.id === id; })[0];
    cc.push({ id: id, v: a.effects.cashPerNight * nights[id], n: nights[id] });
  });
  var before = games.slice(0, 8);
  before.forEach(function (x) { if (x.win) wins++; else losses++; });
  games.slice(8).forEach(function (x) { if (x.win) wins++; else losses++; });
  var w8 = before.filter(function (x) { return x.win; }).length, net = w8 - (before.length - w8);
  var shift = 0;
  on.forEach(function (a) { if (a.week <= 9 && a.effects && a.effects.premiumDemand) shift += a.effects.premiumDemand; });
  var demand = BASE_SEATS * (1 + shift) * (1 + FORM * net);
  var seats = Math.min(CAP_SEATS, Math.round(demand));
  var over = Math.max(0, payroll - TAX_LINE), tax = Math.round(TAX_RATE * over);
  var last = games[games.length - 1];
  var f = { payroll: payroll, tax: tax, cash: cash, seats: seats, wins: wins, losses: losses, games: games, last: last,
    status: S.st, why: S.why, acts: S.acts, pc: pc, cc: cc, over: over, net: net, shift: shift, demand: demand, capped: demand > CAP_SEATS, weeks: weeks };
  f.hash = hex6(h32(ENGINE + '|' + [payroll, tax, Math.round(cash), seats, wins].join(',') + '|' + games.map(function (x) { return x.b + '-' + x.o; }).join(',') +
    '|' + Object.keys(S.st).map(function (k) { return k + ':' + S.st[k]; }).join(',')));
  return f;
}
function newEnv() { return { lifted: new Set(), assume: {}, appended: [], weeks: 9 }; }
function withLift(env, ids) { var e = Object.assign({}, env, { lifted: new Set(env.lifted) }); ids.forEach(function (i) { e.lifted.add(i); }); return e; }
var RECORD_ENV = newEnv(), RECORD = fold(RECORD_ENV);

/* the six present facts, in one place: value, the "changed at shown precision" test, and the size of the change */
var FACTS = ['payroll', 'tax', 'cash', 'seats', 'wins', 'score'];
function diff(a, b, k) {   // b relative to a
  if (k === 'score') { var x = a.last, y = b.last; return { d: (y.b - y.o) - (x.b - x.o), ch: x.b !== y.b || x.o !== y.o || a.weeks !== b.weeks, mag: Math.abs(y.b - x.b) + Math.abs(y.o - x.o) }; }
  var d = b[k] - a[k], eps = (k === 'seats' || k === 'wins') ? 0.5 : 5000;
  return { d: d, ch: Math.abs(d) >= eps, mag: Math.abs(d) };
}
function gamesChanged(a, b) { var n = 0; for (var i = 0; i < Math.min(a.games.length, b.games.length); i++) if (a.games[i].b !== b.games[i].b || a.games[i].o !== b.games[i].o) n++; return n; }
/* weigh: lift each live act from the current world, relative to it (luck fixed: same draws) */
function weigh(env) {
  var base = fold(env), out = {};
  base.acts.forEach(function (a) {
    if (base.status[a.id] !== 'in' || a.seat === 'league') return;
    var alt = fold(withLift(env, [a.id])), r = { f: {}, reach: 0, games: gamesChanged(base, alt), dashes: [] };
    FACTS.forEach(function (k) { r.f[k] = diff(base, alt, k); if (r.f[k].ch) r.reach++; });
    Object.keys(alt.status).forEach(function (id) { if (alt.status[id] === 'dashed' && base.status[id] === 'in') r.dashes.push(id); });
    out[a.id] = r;
  });
  return out;
}

/* ================= UI ================= */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MINUS = '−', EN = '–', DOT = ' · ';
const money = (v, d) => { d = d == null ? 1 : d; return (v < -1e-9 && Math.abs(v) >= Math.pow(10, 6 - d) / 2 ? MINUS : '') + '$' + (Math.abs(v) / 1e6).toFixed(d) + 'M'; };
const smoney = (v, d) => (v > 0 ? '+' : '') + money(v, d);
const num = v => Math.round(v).toLocaleString('en-US');
const snum = v => (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(Math.round(v)).toLocaleString('en-US');

/* ---- kinds: what each texture means, in words (shown on request) */
const KW = { OBSERVED: 'measured or reported from outside BOW', RECORDED: 'written into BOW’s own record', AUTHORED: 'a rule or number someone chose on purpose', COMPUTED: 'follows exactly from rules and state', MODELED: 'a named, versioned model’s range', GENERATED: 'made by AI or a generator', UNKNOWN: 'nobody knows — a marked hole' };
const OPPN = { CHA: 'Charlotte', NYK: 'New York', ATL: 'Atlanta', TOR: 'Toronto', MIA: 'Miami', PHI: 'Philadelphia', CLE: 'Cleveland', MIL: 'Milwaukee', DEN: 'Denver', PHX: 'Phoenix' };
const LBL = { 'y1-business': 'Year One funding', 'w1-minimum': 'Week 1 signing', 'w2-partner': 'Week 2 partner night', 'w3-denver': 'Week 3 Denver call', 'w4-prices': 'Week 4 prices', 'w6-league': 'the League’s approval', 'w6-trade': 'Week 6 trade', 'w7-rotation': 'Week 7 rotation', 'w8-extension': 'Week 8 extension meeting',
  'r-holiday': 'the Jun 2025 Holiday trade', 'r-simons': 'the Feb 2026 Simons trade', 'r-sale': 'the sale approval' };
const REC_W = parseInt(FX.reality.realRecord2526.v, 10);   // read from the store: '56–26'
const REALITY_NAME = FX.reality.name, WORLD_NAME = WD.name;

/* ---- the six facts (dials) */
const mkTax = { v: TAX_LINE, t: 'tax line ' + money(TAX_LINE) };
const FM = {
  payroll: { name: 'Payroll', lo: 185e6, hi: 235e6, step: 0.1e6, mk: [mkTax], f: v => money(v, 1), ax: v => money(v, 0), phrase: 'the payroll' },
  tax: { name: 'Projected tax', lo: 0, hi: 45e6, step: 0.5e6, mk: [], f: v => money(v, 1), ax: v => money(v, 0), phrase: 'the projected tax' },
  cash: { name: 'Cash', lo: 0, hi: 8e6, step: 0.05e6, mk: [], f: v => money(v, 2), ax: v => money(v, 0), phrase: 'the cash' },
  seats: { name: 'Premium seats', sub: 'the Week 9 night', lo: 1600, hi: 1850, step: 5, mk: [{ v: CAP_SEATS, t: 'sellout ' + num(CAP_SEATS) }], f: v => num(v), ax: v => num(v), phrase: 'the premium seats sold' },
  wins: { name: 'Record', sub: 'wins', lo: 0, hi: 10, step: 1, mk: [], f: v => Math.round(v) + ' wins', ax: v => String(v), phrase: 'the number of wins' },
  score: { name: 'Latest score', lo: -20, hi: 20, step: 1, mk: [{ v: 0, t: 'level' }], f: v => (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(Math.round(v)) + ' pts', ax: v => String(v), phrase: 'the latest score' },
  rtax: { name: 'Tax salary', lo: 190e6, hi: 212e6, step: 0.1e6, mk: [{ v: FX.league.season2627.tax.v, t: 'tax line ' + money(FX.league.season2627.tax.v, 3) }], f: v => money(v, 1), ax: v => money(v, 0), phrase: 'the tax salary' },
  rcap: { name: 'Cap payroll', lo: 195e6, hi: 230e6, step: 0.1e6, mk: [{ v: FX.league.season2627.apron1.v, t: 'first apron ' + money(FX.league.season2627.apron1.v, 1) }, { v: FX.league.season2627.apron2.v, t: 'second apron ' + money(FX.league.season2627.apron2.v, 1) }], f: v => money(v, 1), ax: v => money(v, 0), phrase: 'the cap payroll' },
  rrec: { name: 'Record 2025–26', lo: 0, hi: 82, step: 1, mk: [], f: v => Math.round(v) + ' wins', ax: v => String(v), phrase: 'the 2025–26 record' }
};
const WORLD_DIALS = ['payroll', 'tax', 'cash', 'seats', 'wins', 'score'];
const REAL_DIALS = ['rtax', 'rcap', 'rrec'];
const rawOf = (k, f) => k === 'score' ? f.last.b - f.last.o : k === 'rtax' ? f.ts : k === 'rcap' ? f.cp : k === 'rrec' ? REC_W : f[k];

const toDisp = (k, raw) => (k === 'payroll' || k === 'tax' || k === 'cash' || k === 'rtax' || k === 'rcap') ? raw / 1e6 : raw;
function valText(k, f) {
  if (k === 'wins') return f.wins + EN + f.losses;

/* ---- state: one object, one act() */
const S = {
  sys: 'world', at: 'record', tab: 'act', sel: null, fact: null, pfact: 'tax', weigh: false,
  rec: newEnv(), branch: null, liftInfo: {}, ledger: {}, clamps: [], log: [], seq: 0, lastRerun: null, pair: null,
  reality: { lifted: new Set(), standIn: { 'r-holiday': -3.0, 'r-simons': -2.0 }, sel: null, liftInfo: {} },
  words: false, real: false, notice: null
};
const env = () => S.at === 'branch' ? S.branch.env : S.rec;
const clockNow = () => S.sys === 'reality' ? 'Reality · ' + FX.meta.now : 'Year Two · Week ' + env().weeks;
const histNow = () => S.sys === 'reality' ? 'Reality (derived view)' : S.at === 'branch' ? 'branch: ' + S.branch.short : 'record';
const findAct = id => ACTS.concat(env().appended || []).filter(a => a.id === id)[0];
const labelOf = id => LBL[id] || (findAct(id) ? whenShort(findAct(id)) + ' · ' + findAct(id).what.replace(/^\w/, c => c.toLowerCase()) : id);
const whenShort = a => a.when === 'Year One' ? 'Year One' : a.when.replace('Year Two · ', '');
const say = m => { $('#live').textContent = ''; setTimeout(() => { $('#live').textContent = m; }, 30); };
let CUR = null;

/* ---- reality engine (rules-derived only) */
const R_FIX = id => FX.moments.filter(m => m.id === id)[0];
const MQ = id => R_FIX(id).question.split(' · ')[0];
const RACTS = [
  { id: 'r-injury', when: MQ('m2025-05-12'), what: 'Tatum ruptures his right Achilles in Game 4 against New York', type: 'outcome', k: 'OBSERVED', fx: 'm2025-05-12' },
  { id: 'r-holiday', when: MQ('m2025-06'), what: 'Boston trades Jrue Holiday to Portland for Anfernee Simons and two second-round picks', type: 'act', seat: 'boston', k: 'OBSERVED', needs: [], fx: 'm2025-06' },
  { id: 'r-sale', when: (FX.reality.owner.v.match(/sale approved (\d+ \w+ \d+)/) || [0, '[verify: date]'])[1], what: 'The NBA approves the sale to Bill Chisholm’s group', type: 'act', seat: 'league', k: 'OBSERVED', needs: [] },
  { id: 'r-simons', when: MQ('m2026-02-05'), what: 'Boston trades Anfernee Simons to Chicago for Nikola Vučević', type: 'act', seat: 'boston', k: 'OBSERVED', needs: ['r-holiday'], fx: 'm2026-02-05' },
  { id: 'r-return', when: MQ('m2026-03-06'), what: 'Tatum returns against Dallas', type: 'outcome', k: 'OBSERVED', fx: 'm2026-03-06' }
];
const rAct = id => RACTS.filter(a => a.id === id)[0];
function foldR(re) {

  const clampBtn = sel && fk ? '<button type="button" class="btn br" data-do="clamp" data-id="' + sel + '" data-fact="' + fk + '" data-fk="clamp">Clamp: tell me when ' + esc(labelOf(sel)) + ' stops reaching ' + esc(FM[fk].phrase) + '</button>' : '<button type="button" class="btn" disabled>Tap an act and a fact, then clamp</button>';
  const thenNow = S.branch && S.at === 'branch' ? '<p class="small">Marks on the slugs: <b>then</b> is what each act reached when you kept this world; <b>now</b> is what it reaches after your new acts.</p>' : '';
  return '<div><h3>What counted</h3><p>Acts are set in the order of how many facts each one reached. Tap a fact to order them by how much they did to it. An act that changed nothing stays, grey: a zero is a finding.</p>' + chipRow(fk, 'fact', true) + '<h4>' + (fk ? 'Why the ' + esc(FM[fk].phrase.replace(/^the /, '')) + ' is what it is' : 'How to read the bars') + '</h4>' + (fk ? traceHTML(fk) : '<p class="small">Six squares under each act, one per fact: payroll, tax, cash, seats, record, latest score. Filled means the act reached it. Bars are COMPUTED by lifting each act in turn and replaying with the same draws. Never good or bad: counted.</p>') + thenNow + '</div>' +
    '<div><h4>Follow</h4><p class="small">A clamp watches a weight. It tells you when an act stops reaching a fact.</p><div class="btns">' + clampBtn + '</div>' + (cl ? '<ul class="ledger wide">' + cl + '</ul>' : '<p class="small">No clamps yet. Tap Year One on the strip, tap Score above, then clamp.</p>') + '' + '</div>';
}
function pairAnalysis() {
  const E = CUR.E, ids = Array.from(E.lifted).filter(i => findAct(i).seat !== 'league');
  if (ids.length < 2) return null;
  const P = ids.slice(-2), Eb = Object.assign({}, E, { lifted: new Set(Array.from(E.lifted).filter(i => P.indexOf(i) < 0)) });
  const base = fold(Eb), a = fold(withLift(Eb, [P[0]])), b = fold(withLift(Eb, [P[1]])), both = fold(withLift(Eb, P));
  const rows = [];
  ['payroll', 'tax', 'cash', 'seats', 'wins'].forEach(k => {
    const da = both[k] - base[k], sa = a[k] - base[k], sb = b[k] - base[k];
    if (Math.abs(sa) < 1e-6 && Math.abs(sb) < 1e-6 && Math.abs(da) < 1e-6) return;
    const eps = (k === 'seats' || k === 'wins') ? 0.5 : 5000, sum = sa + sb;
    rows.push({ k: k, sa: sa, sb: sb, sum: sum, pair: da, inter: Math.abs(da - sum) >= eps });
  });
  const inter = rows.filter(r => r.inter);
  let why = [];
  inter.forEach(r => {
    if (r.k === 'tax') why.push('the tax cannot fall below $0: once one lift takes payroll under ' + money(TAX_LINE) + ', the other has nothing left to remove');
    if (r.k === 'seats') why.push('premium seats cannot outrun the ' + num(CAP_SEATS) + ' sellout: one lift alone is cut off by it, the pair is not');
  });
  return { P: P, base: base, rows: rows, inter: inter, together: inter.length > 0, why: why, both: both, a: a, b: b };
}

  return '<div><h3>Two at once: ' + esc(nm[0]) + ' + ' + esc(nm[1]) + '</h3>' + verdict + '<div class="btns"><button type="button" class="btn pri" data-do="putbackAll" data-fk="pb-all">Put both back</button><button type="button" class="btn" data-do="pair" data-ids="w1-minimum,w6-trade" data-fk="pair16">Try Week 1 + Week 6</button></div></div><div><h4>Singles, sum, and the pair</h4>' + tbl + '<p class="small" style="margin-top:4px">All four runs use the same draws. Computed, not narrated.</p></div>';
